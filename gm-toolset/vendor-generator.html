/* ---------- Tiendas guardadas ----------
   campanas/<partida>/tiendas/<id> = {nombre, json, actualizado}, solo el
   GM. Una por lugar o vendedor al que se vuelve (ej. el pueblito Zapallo):
   se abre tal cual quedó, se le hacen cambios y se vuelve a guardar.
   La tienda abierta recuerda de cuál salió en tiendaActual.guardadaId.
   Guardar es a mano: lo que se toque sin guardar queda en el borrador,
   pero la guardada no cambia. */

let tiendasGuardadas = [];  // [{id, nombre, json, actualizado, tamanoLabel, categoriaLabel, cantidad}]

function normalizarNombre(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
}

function tiendaGuardadaAbierta(){
  return tiendaActual && tiendaActual.guardadaId
    ? tiendasGuardadas.find(t => t.id === tiendaActual.guardadaId) || null
    : null;
}

function hayCambiosSinGuardar(){
  const g = tiendaGuardadaAbierta();
  return !!g && JSON.stringify(tiendaParaGuardar()) !== g.json;
}

// Antes de reemplazar la tienda abierta por otra.
function confirmarDejarTienda(){
  if(!hayCambiosSinGuardar()) return true;
  return confirm(`"${tiendaGuardadaAbierta().nombre}" tiene cambios sin guardar. Si seguís, la tienda guardada queda como estaba. ¿Seguir?`);
}

async function guardarTiendaEnLista(){
  if(!tiendaActual || !puedeGuardar()) return;
  let id = tiendaGuardadaAbierta() ? tiendaActual.guardadaId : null;
  let nombre = String(tiendaActual.nombre || '').trim();
  if(!id){
    const r = prompt('¿Con qué nombre guardás esta tienda? (por ejemplo, el del lugar)', nombre);
    if(r === null) return;
    nombre = r.trim().slice(0, 60);
  }
  if(!nombre){ toast('Poné un nombre para guardar la tienda'); return; }
  const mismoNombre = tiendasGuardadas.find(t => t.id !== id && normalizarNombre(t.nombre) === normalizarNombre(nombre));
  if(mismoNombre){
    if(!confirm(`Ya hay una tienda guardada que se llama "${mismoNombre.nombre}". ¿Reemplazarla por esta?`)) return;
    id = mismoNombre.id;
  }
  const col = fbDb.collection(fbRutaCampana('tiendas'));
  const ref = id ? col.doc(id) : col.doc();
  tiendaActual.nombre = nombre;
  tiendaActual.nombrePersonalizado = true;
  tiendaActual.guardadaId = ref.id;
  const btn = $('#btn-guardar-tienda');
  btn.disabled = true;
  try{
    await ref.set({nombre, json: JSON.stringify(tiendaParaGuardar()), actualizado: firebase.firestore.FieldValue.serverTimestamp()});
    toast(`"${nombre}" guardada ✓`);
  }catch(err){
    console.error('Error guardando la tienda:', err);
    toast('No se pudo guardar la tienda — revisá la consola');
  }finally{
    btn.disabled = false;
    tiendaCambio();
  }
}

function abrirTiendaGuardada(id){
  const g = tiendasGuardadas.find(t => t.id === id);
  if(!g || !confirmarDejarTienda()) return;
  const t = tiendaDesdeJson(g.json);
  if(!t){ toast('Esa tienda guardada está dañada y no se puede abrir'); return; }
  t.guardadaId = id;
  t.nombre = g.nombre;
  t.nombrePersonalizado = true;
  tiendaActual = t;
  $('#preview-buscar').value = '';
  sincronizarControles();
  tiendaCambio();
  toast(`${g.nombre} · ${fmt(t.items.length)} ítems`);
}

async function borrarTiendaGuardada(id){
  const g = tiendasGuardadas.find(t => t.id === id);
  if(!g) return;
  if(!confirm(`¿Borrar "${g.nombre}" de las tiendas guardadas? No se puede deshacer. Si los jugadores la tienen abierta, la siguen viendo hasta que cierres o cambies la tienda publicada.`)) return;
  try{
    await fbDb.doc(fbRutaCampana(`tiendas/${id}`)).delete();
    if(tiendaActual && tiendaActual.guardadaId === id) delete tiendaActual.guardadaId;
    tiendaCambio();
    toast(`"${g.nombre}" borrada`);
  }catch(err){
    console.error('Error borrando la tienda guardada:', err);
    toast('No se pudo borrar — revisá la consola');
  }
}

function renderGuardadas(){
  const panel = $('#panel-guardadas');
  const btn = $('#btn-guardar-tienda');
  const estado = $('#guardar-estado');
  if(!puedeGuardar()){ panel.style.display = 'none'; btn.style.display = 'none'; estado.textContent = ''; return; }

  // Estado de la tienda abierta, al lado del nombre.
  const abierta = tiendaGuardadaAbierta();
  btn.style.display = tiendaActual ? '' : 'none';
  btn.textContent = abierta ? '💾 Guardar cambios' : '💾 Guardar tienda';
  const cambios = hayCambiosSinGuardar();
  estado.className = 'hint' + (abierta ? (cambios ? ' pendiente' : ' al-dia') : '');
  estado.textContent = !tiendaActual ? '' : !abierta ? 'Sin guardar en la lista' : cambios ? 'Cambios sin guardar' : '✓ Guardada';

  panel.style.display = '';
  let publicadaId = null;
  try{ publicadaId = (JSON.parse(tiendaFb.publicadaJson || 'null') || {}).guardadaId || null; }catch(e){}
  const lista = tiendasGuardadas.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  $('#guardadas-lista').innerHTML = lista.length ? lista.map(g => {
    const esAbierta = abierta && abierta.id === g.id;
    const cuando = g.actualizado ? ` · guardada ${g.actualizado.toLocaleDateString('es-AR')}` : '';
    return `<div class="guardada-fila${esAbierta ? ' abierta' : ''}">
      <div class="guardada-info">
        <b>${esc(g.nombre)}</b>
        <span class="hint">${esc([g.tamanoLabel, g.categoriaLabel].filter(Boolean).join(' · '))} · ${fmt(g.cantidad)} ítems${esc(cuando)}</span>
      </div>
      ${publicadaId === g.id ? '<span class="resumen-chip" style="border-color:var(--absenta)">La ven los jugadores</span>' : ''}
      ${esAbierta
        ? '<span class="resumen-chip" style="border-color:var(--copper)">Abierta</span>'
        : `<button type="button" class="iconbtn" data-abrir-guardada="${esc(g.id)}">Abrir</button>`}
      <button type="button" class="iconbtn" data-borrar-guardada="${esc(g.id)}">Borrar</button>
    </div>`;
  }).join('') : '<div class="hint">Todavía no hay tiendas guardadas. Armá la tienda de un lugar (por ejemplo, un pueblito al que los jugadores van a volver), ponele nombre y tocá 💾 Guardar tienda.</div>';
}

function escucharGuardadas(){
  fbDb.collection(fbRutaCampana('tiendas')).onSnapshot(snap => {
    tiendasGuardadas = snap.docs.map(d => {
      const data = d.data();
      let t = {};
      try{ t = JSON.parse(data.json || '{}') || {}; }catch(e){}
      return {
        id: d.id,
        nombre: data.nombre || t.nombre || 'Sin nombre',
        json: data.json || '',
        actualizado: data.actualizado ? data.actualizado.toDate() : null,
        tamanoLabel: t.tamanoLabel || '',
        categoriaLabel: t.categoriaLabel || '',
        cantidad: Array.isArray(t.items) ? t.items.length : 0,
      };
    });
    renderGuardadas();
  }, err => console.error('No se pudieron leer las tiendas guardadas:', err));
}

// Controles de arriba al tamaño y rubro de la tienda cargada.
function sincronizarControles(){
  if(!tiendaActual) return;
  if(TAMANOS[tiendaActual.tamano]) $('#f-tamano').value = tiendaActual.tamano;
  if(REPARTO_POR_CATEGORIA[tiendaActual.categoria]) $('#f-categoria').value = tiendaActual.categoria;
  aplicarTamanoFijo();
  marcarAjuste();
  actualizarHint();
}

async function iniciarTiendaEnVivo(){
  const entrada = await fbEntrarAPartida();
  if(entrada === 'redirigiendo') return;
  if(entrada !== 'ok'){
    fbEstado('⚠ Sin conexión: se puede armar una tienda, pero no guardarla ni publicarla');
    return;
  }
  const partida = encodeURIComponent(FB_CAMPANA);
  cargarItemsSubidosTienda();   // ítems que subió el grupo (catálogo compartido, paso 5)
  $('#link-gmtools').href = `gm-tools.html?partida=${partida}`;
  $('#link-mapa').href = `../vtt-hexgrid/mapa.html?partida=${partida}`;
  if(!fbMiembro.gm){
    const bloqueo = document.createElement('div');
    bloqueo.className = 'bloqueo';
    bloqueo.innerHTML = `<div><b>El generador de tiendas es del GM.</b><br>Cuando el GM publique una tienda, la vas a ver con el botón 🏪 Vendedor de tu ficha.<br><br><a class="btn ghost" href="${esc(fbUrlInicio(FB_CAMPANA))}">⌂ Volver a la partida</a></div>`;
    document.body.appendChild(bloqueo);
    return;
  }

  try{
    const doc = await refTienda('borrador').get();
    const guardada = doc.exists ? tiendaDesdeJson(doc.data().json) : null;
    // Si ya se empezó a armar algo antes de que cargue, no se pisa.
    if(guardada && !tiendaActual) tiendaActual = guardada;
  }catch(err){
    console.error('No se pudo leer el borrador de la tienda:', err);
    fbEstado('⚠ No se pudo leer la tienda guardada');
    return;
  }
  tiendaFb.listo = true;
  $('#tienda-identidad').textContent = '🏪 Generador de tiendas · ' + barraTexto();
  sincronizarControles();
  renderPreview();
  renderBotones();
  renderPublicacion();
  programarBorrador();
  escucharGuardadas();

  refTienda('publicada').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    if(d) tiendaDesdeJson(d.json);  // por si tiene ítems propios que este catálogo no
    tiendaFb.publicadaJson = d ? d.json : null;
    tiendaFb.abierta = !!(d && d.abierta === true);
    tiendaFb.publicadaCuando = d && d.actualizado ? d.actualizado.toDate() : null;
    renderPublicacion();
  }, err => console.error('No se pudo escuchar la tienda publicada:', err));
}

/* ---------- Eventos ---------- */

$('#f-tamano').addEventListener('change', actualizarHint);
$('#f-categoria').addEventListener('change', () => { aplicarTamanoFijo(); actualizarHint(); });
$('#btn-generar').addEventListener('click', () => generar(true));
$('#btn-regenerar').addEventListener('click', () => generar(false));
$('#btn-guardar-tienda').addEventListener('click', guardarTiendaEnLista);
$('#guardadas-lista').addEventListener('click', e => {
  const abrir = e.target.closest('[data-abrir-guardada]');
  if(abrir) return abrirTiendaGuardada(abrir.dataset.abrirGuardada);
  const borrar = e.target.closest('[data-borrar-guardada]');
  if(borrar) return borrarTiendaGuardada(borrar.dataset.borrarGuardada);
});
$('#btn-publicar').addEventListener('click', publicarShop);
$('#btn-personalizada').addEventListener('click', crearTiendaPersonalizada);
$('#btn-cerrar-tienda').addEventListener('click', cerrarTienda);
$('#btn-abrir-tienda').addEventListener('click', alternarTienda);
$('#btn-agregar-items').addEventListener('click', abrirAgregar);
$('#btn-item-nuevo').addEventListener('click', () => abrirItemNuevo());
$('#itemnuevo-x').addEventListener('click', () => $('#scrim-item-nuevo').classList.remove('open'));
$('#itemnuevo-cancelar').addEventListener('click', () => $('#scrim-item-nuevo').classList.remove('open'));
$('#scrim-item-nuevo').addEventListener('mousedown', e => { if(e.target.id === 'scrim-item-nuevo') $('#scrim-item-nuevo').classList.remove('open'); });
$('#itemnuevo-crear').addEventListener('click', crearItemNuevo);
$('#itemnuevo-body').addEventListener('change', e => {
  if(e.target.id === 'itemnuevo-tipo'){
    leerCamposItemNuevo();
    if(itemNuevoDraft.tipoItem !== 'consumibles'){
      const d = itemNuevoDraft;
      $('#scrim-item-nuevo').classList.remove('open');
      abrirItemNuevo({nombre: d.nombre, tier: d.tier, tipoItem: d.tipoItem, peso: d.peso, ranuras: d.ranuras,
        precioCompra: d.precioCompra, detalle: d.detalle, descripcionNarrativa: d.descripcionNarrativa, mods: d.mods});
      return;
    }
    drawItemNuevo();
  }
});
$('#itemnuevo-body').addEventListener('click', e => {
  if(!itemNuevoDraft) return;
  if(e.target.id === 'itemnuevo-mod-add'){ leerCamposItemNuevo(); itemNuevoDraft.mods.push({stat:'', val:0}); drawItemNuevo(); return; }
  const rm = e.target.closest('[data-modrm]');
  if(rm){ leerCamposItemNuevo(); itemNuevoDraft.mods.splice(+rm.dataset.modrm, 1); drawItemNuevo(); }
});
$('#itemnuevo-body').addEventListener('input', e => {
  if(!itemNuevoDraft) return;
  const iStat = e.target.dataset.modstat;
  const iVal = e.target.dataset.modval;
  if(iStat !== undefined){ itemNuevoDraft.mods[+iStat] = itemNuevoDraft.mods[+iStat] || {stat:'', val:0}; itemNuevoDraft.mods[+iStat].stat = e.target.value; }
  if(iVal !== undefined){ itemNuevoDraft.mods[+iVal] = itemNuevoDraft.mods[+iVal] || {stat:'', val:0}; itemNuevoDraft.mods[+iVal].val = num(e.target.value); }
});
$('#tienda-nombre').addEventListener('input', e => {
  if(!tiendaActual) return;
  tiendaActual.nombre = e.target.value;
  tiendaActual.nombrePersonalizado = true;
  programarBorrador();
  renderPublicacion();
});
$('#agregar-x').addEventListener('click', () => $('#scrim-agregar').classList.remove('open'));
$('#scrim-agregar').addEventListener('mousedown', e => { if(e.target.id === 'scrim-agregar') $('#scrim-agregar').classList.remove('open'); });
$('#agregar-buscar').addEventListener('input', renderAgregarLista);
$('#preview-buscar').addEventListener('input', renderPreview);
$('#agregar-rubro').addEventListener('change', renderAgregarLista);
$('#agregar-tier').addEventListener('change', renderAgregarLista);
$('#f-ajuste').addEventListener('change', e => aplicarAjuste(e.target.value));
$('#f-ajuste-venta').addEventListener('change', e => aplicarAjusteVenta(e.target.value));
$('#f-gratis').addEventListener('change', e => { if(!tiendaActual) return; tiendaActual.agregarGratis = e.target.checked; tiendaCambio(); });
$('#f-herrero').addEventListener('change', e => { if(!tiendaActual) return; tiendaActual.herrero = e.target.checked; tiendaCambio(); });
$('#f-precio-rep').addEventListener('change', e => {
  if(!tiendaActual) return;
  const n = Math.max(0, Number(e.target.value) || 0);
  tiendaActual.precioReparacion = n; e.target.value = n; tiendaCambio();
});
$('#f-orden').addEventListener('change', e => { ordenActual = e.target.value; renderPreview(); renderAgregarLista(); });
$('#btn-orden-dir').addEventListener('click', () => { ordenDesc = !ordenDesc; renderOrdenControles(); renderPreview(); renderAgregarLista(); });
$('#ver-x').addEventListener('click', () => $('#scrim-ver').classList.remove('open'));
// ✎ Editar y subir (comun/editar-item.js): una copia del ítem, editada y subida al catálogo compartido. La tienda no cambia
// hasta que se relee lo subido (si es una corrección, el ítem del catálogo se reemplaza para todos).
$('#ver-editar').addEventListener('click', () => {
  const item = CATALOGO.find(it => it.id === $('#ver-toggle').dataset.item);
  if(!item) return;
  $('#scrim-ver').classList.remove('open');
  EditarItem.abrir({item, catalogo: CATALOGO, contexto: 'tienda', stats: MOD_TARGETS.map(s => ({id: s.id, label: s.label})),
    tiers: TIERS, alSubir: () => cargarItemsSubidosTienda()});
});
$('#ver-baja').addEventListener('click', async () => {
  const item = CATALOGO.find(it => it.id === $('#ver-toggle').dataset.item);
  if(!item) return;
  const ok = await ItemsSubidos.solicitarBaja(item);
  if(ok){ $('#scrim-ver').classList.remove('open'); cargarItemsSubidosTienda(); }
});
$('#scrim-ver').addEventListener('mousedown', e => { if(e.target.id === 'scrim-ver') $('#scrim-ver').classList.remove('open'); });
$('#ver-toggle').addEventListener('click', e => {
  const id = e.currentTarget.dataset.item;
  if(!id || !tiendaActual) return;
  if(tiendaActual.items.includes(id)) quitarItem(id); else agregarItem(id);
  verItem(id);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    $('#scrim-agregar').classList.remove('open');
    $('#scrim-ver').classList.remove('open');
    $('#scrim-item-nuevo').classList.remove('open');
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-quitar],[data-agregar],[data-ajuste],[data-ver],[data-reroll]');
  if(!b) return;
  if(b.dataset.reroll !== undefined) return rerollItem(b.dataset.reroll);
  if(b.dataset.ver !== undefined) return verItem(b.dataset.ver);
  if(b.dataset.quitar !== undefined) return quitarItem(b.dataset.quitar);
  if(b.dataset.agregar !== undefined) return agregarItem(b.dataset.agregar);
  if(b.dataset.ajuste !== undefined) return aplicarAjuste(b.dataset.ajuste);
});

aplicarTamanoFijo();
actualizarHint();
renderOrdenControles();
iniciarTiendaEnVivo();
</script>
</body>
</html>
