<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Rol Pintoísta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink);color:var(--paper);font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden
}
input,select,button{font-family:inherit;color:inherit}
input,select{
  min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:var(--r);
  color:var(--paper);padding:6px 8px;width:100%
}
select option{background:var(--panel)}
input:focus,select:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
button{cursor:pointer;background:none;border:none;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}

.btn{
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);white-space:nowrap
}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08;font-weight:700}
.btn.primary:hover{background:var(--brass)}
.btn.peligro{border-color:var(--wine);color:var(--danger)}
.btn.peligro:hover{border-color:var(--danger)}
#btn-dados.activo{border-color:var(--brass);color:var(--brass)}

header{
  display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap
}
header h1{margin:0;font-size:16px;color:var(--brass);font-weight:700}
#estado{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);flex:1;min-width:120px}
.zoom{display:flex;gap:4px}
/* Switch Narrativo / Combate (lo cambia el GM; todos ven en qué modo está) */
#modo-switch{
  display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border-radius:999px;border:1px solid;
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;color:var(--paper)
}
#modo-switch .perilla{width:34px;height:18px;border-radius:999px;position:relative;transition:background .2s}
#modo-switch .perilla::after{
  content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s
}
#modo-switch[data-modo="narrativo"]{border-color:#3E9B5B;color:#8FD6A5}
#modo-switch[data-modo="narrativo"] .perilla{background:#3E9B5B}
#modo-switch[data-modo="combate"]{border-color:#D64545;color:#F0A39C}
#modo-switch[data-modo="combate"] .perilla{background:#D64545}
#modo-switch[data-modo="combate"] .perilla::after{left:18px}
#modo-switch:disabled{opacity:1;cursor:default}
.zoom .btn{padding:7px 10px}
/* Mantenimiento (GM), arriba de todo en la barra lateral: verde para que se note. */
.btn-mant{width:100%;background:rgba(46,107,87,.25);border-color:#3E9B5B;color:#CFE6D8;font-weight:700;padding:9px 12px}
.btn-mant:hover{background:#2E6B57;border-color:#3E9B5B;color:#EAF3E6}
/* Personajes: lista desplegable de las fichas de la partida. */
.btn-personajes{background:rgba(63,111,176,.2);border-color:#3F6FB0;color:#B9D2EA}
.btn-personajes:hover,.btn-personajes[aria-expanded="true"]{background:#3F6FB0;border-color:#5B8DBE;color:#F2F6FB}
.desplegable{position:relative}
.desplegable-lista{
  position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:240px;max-width:min(320px,calc(100vw - 24px));max-height:60vh;overflow-y:auto;
  background:var(--panel);border:1px solid #3F6FB0;border-radius:var(--r);box-shadow:0 12px 28px rgba(0,0,0,.6);padding:5px
}
.desplegable-lista a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r);color:var(--paper);text-decoration:none}
.desplegable-lista a:hover{background:rgba(63,111,176,.25)}
.desplegable-lista .pj-mini{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:#17121A;border:1px solid var(--line)}
.desplegable-lista .pj-nombre{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desplegable-lista .pj-dueno{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);white-space:nowrap}
.desplegable-vacio{padding:8px 10px;color:var(--muted);font-size:12px}

main{flex:1;display:flex;min-height:0}
#lienzo-caja{flex:1;position:relative;min-width:0;min-height:0}
#lienzo{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:default}
#aviso-mapa{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:var(--muted)
}
#aviso-mapa .btn{margin-top:10px}
/* Confirmar un movimiento que gasta Nitros. */
#ruta-confirmar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--brass);border-radius:var(--r);padding:8px 12px;
  font-family:"Space Mono",monospace;font-size:12px;box-shadow:0 10px 24px -8px rgba(0,0,0,.7)
}
#ruta-confirmar.excede{border-color:var(--danger)}
/* Si tocás otra cosa con un movimiento sin confirmar, el cartel parpadea
   en vez de tapar los botones con un aviso. */
#ruta-confirmar.atencion{animation:ruta-atencion .45s ease-in-out 2}
@keyframes ruta-atencion{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.06);box-shadow:0 0 0 3px rgba(224,164,88,.35),0 10px 24px -8px rgba(0,0,0,.7)}
}
#ruta-confirmar.excede #ruta-texto{color:#F0A39C}

aside{
  width:330px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0
}
.seccion{padding:12px 14px;border-bottom:1px solid var(--line)}
.seccion h2{
  margin:0 0 8px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400
}
.ayuda{color:var(--muted);font-size:12.5px;margin:0}
.con-ayuda{display:flex;align-items:center;gap:8px;margin-bottom:0!important}
.barra-token{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px}
.barra-token .chico-barra{justify-self:end;padding:5px 10px;font-size:10.5px}
.ayuda-icono{
  position:relative;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--line);color:var(--muted);font-size:10.5px;cursor:help;letter-spacing:0;outline:none
}
.ayuda-icono:hover,.ayuda-icono:focus{border-color:var(--copper);color:var(--brass)}
.ayuda-globo{
  display:none;position:absolute;top:calc(100% + 8px);left:-58px;z-index:30;width:280px;max-width:calc(100vw - 40px);
  background:var(--panel2,#221A1E);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  box-shadow:0 10px 24px rgba(0,0,0,.55);font-family:"Space Grotesk",system-ui,sans-serif;font-size:12.5px;line-height:1.45;
  letter-spacing:0;text-transform:none;color:var(--paper);font-weight:400;cursor:default
}
.ayuda-icono:hover .ayuda-globo,.ayuda-icono:focus .ayuda-globo{display:block}
.ayuda-globo .leyenda{margin-top:8px}
/* Controles flotantes sobre el token seleccionado (estilo Roll20) */
#hud{position:absolute;left:0;top:0;pointer-events:none;z-index:20;transform:translate(-50%,0)}
#hud .hud-fila{display:flex;gap:7px;justify-content:center;pointer-events:auto}
#hud .hud-circulo{
  width:36px;height:36px;border-radius:50%;border:2.5px solid;background:rgba(15,12,14,.92);color:var(--paper);
  font-family:"Space Mono",monospace;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.5)
}
#hud .hud-circulo:hover{filter:brightness(1.25)}
#hud .hud-circulo.icono{font-size:15px;border-color:var(--line);color:var(--paper)}
#hud .hud-circulo.icono.abierto{border-color:var(--brass);color:var(--brass)}
#hud .hud-circulo:disabled{cursor:default;opacity:.85}
#hud input.hud-in{
  width:56px;height:36px;border-radius:18px;border:2.5px solid;background:rgba(15,12,14,.96);color:var(--paper);
  font-family:"Space Mono",monospace;font-size:13px;text-align:center;padding:0 6px
}
#hud .hud-globo{
  pointer-events:auto;margin-top:8px;width:260px;max-width:70vw;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.6);text-align:left;font-size:12.5px
}
#hud .hud-globo h3{margin:0 0 8px;font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
#hud .hud-estado{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line-soft)}
#hud .hud-estado:first-of-type{border-top:none}
#hud .hud-estado .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud .hud-estado .turnos{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);min-width:26px;text-align:right}
#hud .hud-mini{background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);font-size:11px;padding:1px 6px;cursor:pointer}
#hud .hud-mini:hover{border-color:var(--copper)}
#hud .hud-mini.peligro:hover{border-color:var(--danger);color:var(--danger)}
#hud .hud-campo{display:flex;align-items:center;gap:6px;margin-top:6px}
#hud .hud-campo label{flex:1;color:var(--muted)}
#hud .hud-campo input[type=number]{width:62px;padding:4px 6px}
#hud .hud-campo input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);background:none;border-radius:var(--r)}
.fila{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
/* Los botones del panel del token entran aunque sean tres: más compactos
   y, si no entran, pasan al renglón de abajo. */
#panel-token .fila .btn{padding:6px 9px;font-size:10.5px;letter-spacing:.06em}
.etiqueta{font-size:11.5px;color:var(--muted);margin:8px 0 3px;display:block}
.colores{display:flex;flex-wrap:wrap;gap:5px}
.color{width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.color.elegido{border-color:var(--paper)}
.dato{font-size:12.5px;margin-top:4px}
.dato b{color:var(--brass);font-weight:500}
.estado-token{margin:8px 0 4px}
.vital{margin-top:8px}
.vital-cab{display:flex;align-items:baseline;gap:6px;font-size:12.5px}
.vital-titulo{color:var(--muted);min-width:34px}
.vital-num,.vital-max{font-family:"Space Mono",monospace;font-size:12px}
.vital-in{width:64px;padding:3px 6px;font-family:"Space Mono",monospace;font-size:13px;text-align:right}
.vital .barra{margin-top:4px}
.barra{height:9px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;transition:width .3s}
.barra-txt{font-family:"Space Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.leyenda span{display:flex;align-items:center;gap:5px}
.leyenda i{width:13px;height:13px;border-radius:50%;border:3px solid;background:#17121A}
.chip{font-size:11px;padding:1px 7px;border:1px solid;border-left-width:4px;border-radius:var(--r);background:rgba(0,0,0,.25)}

#mesa{flex:1;display:flex;flex-direction:column;min-height:0;font-family:"Space Mono",monospace;font-size:12px}
#mesa h2{padding:12px 14px 0;margin:0;display:flex;align-items:center;gap:8px}
.dados3d-boton{background:none;border:none;padding:0 2px;font-size:14px;cursor:pointer;line-height:1}
.dados3d-config{color:var(--muted);text-decoration:none;font-size:12px}
.dados3d-config:hover{color:var(--brass)}
.mesa-borrar{background:none;border:0;padding:0 2px;cursor:pointer;font-size:12px;opacity:.6}
.mesa-borrar:hover{opacity:1}
.mesa-borrar:disabled{cursor:wait;opacity:.3}

#mesa-cuerpo{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:5px}
.mesa-tirada{padding:5px 7px;border-radius:var(--r);background:var(--line-soft);transition:background 1.2s}
.mesa-tirada.mesa-sistema{border-left:3px solid var(--copper)}
.mesa-tirada.ultima{background:#2E6B57}
.mesa-tirada.nueva{background:var(--wine);transition:none}
.mesa-quien{color:var(--brass);font-weight:700}
/* Color del nombre según quién tira (ver mesaClaseQuien). */
.mesa-quien.mesa-q-propia{color:var(--brass)}
.mesa-quien.mesa-q-aliado{color:#8EE6A8}
.mesa-quien.mesa-q-creep{color:#FF7E7E}
.mesa-quien.mesa-q-neutra{color:#F4EFE8}
.mesa-quien.mesa-q-turno{color:#C9A8F5}
.mesa-tirada.mesa-sistema.mesa-turno{border-left-color:#C9A8F5}
.mesa-usuario{color:var(--muted)}
.mesa-total{float:right;margin-left:8px;font-weight:700;font-size:15px}
.mesa-detalle{color:var(--muted);font-size:10.5px}
.mesa-vacia{color:var(--muted);font-size:11px}
#mesa-tirar{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);
  transition:.25s, bottom 0s;
  background:var(--bottle);color:#EAF3E6;padding:9px 16px;border-radius:var(--r);
  font-family:"Space Mono",monospace;font-size:11.5px;opacity:0;pointer-events:none;transition:.25s;z-index:95
}
/* Con el cartel de movimiento a la vista, los avisos suben para no taparlo. */
body.con-ruta .toast{bottom:84px}
#botonera-capa{position:fixed;inset:0;z-index:90}
#botonera-marco{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color-scheme:normal}
#botonera-cargando{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  main{flex-direction:column}
  aside{width:auto;height:45vh;border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <a id="link-inicio" class="btn" href="../index.html" title="Volver al inicio de la partida">⌂</a>
  <h1>⬡ Mapa</h1>
  <span id="estado">conectando…</span>
  <button type="button" id="modo-switch" role="switch" aria-checked="false" data-modo="narrativo" disabled title="Modo del mapa (lo cambia el GM)">
    <span class="perilla"></span><span id="modo-texto">Narrativo</span>
  </button>
  <button type="button" class="btn primary" id="btn-nuevo" disabled>+ Token</button>
  <a class="btn" id="link-herramienta" href="#" target="_blank" rel="noopener" style="text-decoration:none" hidden></a>
  <div class="desplegable" id="personajes-caja" hidden>
    <button type="button" class="btn btn-personajes" id="btn-personajes" aria-expanded="false" title="Fichas de los personajes de la partida">👥 Personajes</button>
    <div class="desplegable-lista" id="personajes-lista" hidden></div>
  </div>
  <button type="button" class="btn" id="btn-fondo" title="Imagen de fondo del mapa (solo GM)" hidden>🖼 Fondo</button>
  <input type="file" id="fondo-archivo" accept="image/*" hidden>
  <button type="button" class="btn" id="btn-dados" title="Grilla de dados: elegí dado y cantidad">🎲 Dados</button>
  <button type="button" class="btn" id="btn-centrar" title="Llevar la vista a tus tokens">Centrar</button>
  <div class="zoom">
    <button type="button" class="btn" id="btn-alejar" title="Alejar">−</button>
    <button type="button" class="btn" id="btn-acercar" title="Acercar">+</button>
  </div>
</header>

<main>
  <div id="lienzo-caja">
    <canvas id="lienzo"></canvas>
    <div id="aviso-mapa" hidden></div>
    <div id="hud" hidden></div>
    <div id="ruta-confirmar" hidden>
      <span id="ruta-texto"></span>
      <button type="button" class="btn primary" id="ruta-si">Confirmar</button>
      <button type="button" class="btn" id="ruta-no">Cancelar</button>
    </div>
  </div>
  <aside>
    <div class="seccion" id="caja-mantenimiento" hidden>
      <button type="button" class="btn btn-mant" id="btn-mantenimiento" title="Pasar el turno para toda la mesa: fichas de los jugadores y creeps (solo GM)">⟳ Mantenimiento</button>
    </div>
    <div class="seccion" id="panel-token"></div>
    <div id="mesa">
      <h2><span>Mesa</span><span id="mesa-dados"></span><span id="mesa-historial"></span></h2>
      <div id="mesa-cuerpo"><div class="mesa-vacia">Conectando…</div></div>
      <form id="mesa-tirar">
        <input id="mesa-formula" placeholder="Tirada libre, ej: 2d6+3" autocomplete="off">
        <button type="submit" class="btn">Tirar</button>
      </form>
    </div>
  </aside>
</main>

<div id="botonera-capa" hidden>
  <iframe id="botonera-marco" title="Botonera" src="about:blank"></iframe>
  <div id="botonera-cargando" hidden><span id="botonera-cargando-texto">Abriendo la Botonera…</span> <button type="button" class="btn" id="botonera-cargando-x">Cancelar</button></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>
<script src="../comun/sesion.js"></script>
<script src="../comun/dados3d.js"></script>
<script src="../comun/mesa-historial.js"></script>
<script src="../comun/grilla-dados.js"></script>
<script>
/* =========================================================
   MAPA DE HEXÁGONOS — Paso 2 del sistema nuevo
   Mapa compartido en vivo: tokens en campanas/<campaña>/tokens, que
   cada uno mueve arrastrando (los PJ su dueño, los creeps el GM) y
   todos ven al instante. Al costado, la Mesa de tiradas.
   Ver docs/plan-sistema-nuevo.md y docs/workflow-firebase.md.
   ========================================================= */

const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmt = n => Number.isInteger(n) ? n : Math.round(n*100)/100;
const esc = s => String(s??'').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

function horaTxt(fecha){
  const p = n => String(n).padStart(2, '0');
  return `${p(fecha.getHours())}:${p(fecha.getMinutes())}:${p(fecha.getSeconds())}`;
}

/* ---------- Firebase (mismo bloque fb* que ficha y gm-tools) ---------- */



function estado(texto){ $('#estado').textContent = texto; }

/* ---------- Geometría de hexágonos ----------
   Hexágonos "de punta arriba" en filas; las filas impares corridas medio
   hexágono a la derecha. Cada token guarda su casilla como {col, fila}. */

const HEX = 40;                 // radio del hexágono, en unidades del mapa
const SQ3 = Math.sqrt(3);
const ZOOM_MIN = 0.25, ZOOM_MAX = 3;
const ESQUINAS = Array.from({length: 6}, (_, i) => {
  const a = Math.PI / 180 * (60 * i - 30);
  return [HEX * Math.cos(a), HEX * Math.sin(a)];
});

function hexCentro(col, fila){
  return { x: HEX * SQ3 * (col + 0.5 * (fila & 1)), y: HEX * 1.5 * fila };
}

function mundoAHex(x, y){
  const q = (SQ3 / 3 * x - y / 3) / HEX;
  const r = (2 / 3 * y) / HEX;
  const s = -q - r;
  let rq = Math.round(q), rr = Math.round(r);
  const rs = Math.round(s);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
  if(dq > dr && dq > ds) rq = -rr - rs;
  else if(dr > ds) rr = -rq - rs;
  return { col: rq + (rr - (rr & 1)) / 2, fila: rr };
}

// Rutas: para medir distancias y trazar líneas se pasa a coordenadas
// "cúbicas" (q, r, s), las mismas que usa mundoAHex.
function hexACubo(c){
  const q = c.col - (c.fila - (c.fila & 1)) / 2;
  return {q, r: c.fila, s: -q - c.fila};
}
function mismoHex(a, b){ return a.col === b.col && a.fila === b.fila; }
function distanciaHex(a, b){
  const A = hexACubo(a), B = hexACubo(b);
  return (Math.abs(A.q - B.q) + Math.abs(A.r - B.r) + Math.abs(A.s - B.s)) / 2;
}
// Casillas en línea recta desde a (sin incluirla) hasta b, una al lado de la
// otra. Sirve cuando el mouse salta varias casillas de golpe.
function lineaHex(a, b){
  const n = distanciaHex(a, b);
  const A = hexACubo(a), B = hexACubo(b);
  const res = [];
  for(let i = 1; i <= n; i++){
    const t = i / n;
    const q = A.q + (B.q - A.q) * t + 1e-6, r = A.r + (B.r - A.r) * t + 1e-6, s = -q - r;
    let rq = Math.round(q), rr = Math.round(r);
    const rs = Math.round(s);
    const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
    if(dq > dr && dq > ds) rq = -rr - rs;
    else if(dr > ds) rr = -rq - rs;
    res.push({col: rq + (rr - (rr & 1)) / 2, fila: rr});
  }
  return res;
}

// Ficha, invocación o creep al que está vinculado el token (si sigue
// existiendo). Las invocaciones van como "<fichaId>~<idInvocación>" y
// salen del resumen de la ficha de su personaje.
const SEP_INVOCACION = '~';
function vinculo(t){
  if(!t || !t.fichaId) return null;
  if(t.tipo === 'creep') return creepsPub.get(t.fichaId) || null;
  const [fichaId, invId] = t.fichaId.split(SEP_INVOCACION);
  const ficha = fichasPub.get(fichaId);
  if(!ficha) return null;
  if(!invId) return ficha;
  const inv = ((ficha.resumen && ficha.resumen.invocaciones) || []).find(i => i.id === invId);
  if(!inv) return null;
  return {
    nombre: String(inv.nombre || 'Invocación'),
    duenoUid: ficha.duenoUid,
    miniatura: inv.miniatura || '',
    deQuien: ficha.nombre,
    invocacion: true,
    resumen: {hp: inv.hp, hpMax: inv.hpMax, muerto: num(inv.hp) <= 0, dormida: inv.activa === false, estados: []},
  };
}
function nombreDe(t){
  const v = vinculo(t);
  return v && v.nombre ? v.nombre : t.nombre;
}
// Barras (0 a 1) y estados del token vinculado. De los creeps solo se
// publica el porcentaje de vida, sin números; los PJ tienen además SP.
function estadoDe(t){
  const v = vinculo(t);
  if(!v || !v.resumen) return null;
  const r = v.resumen;
  const entre01 = x => Math.max(0, Math.min(1, x));
  const hp = r.hpPct !== undefined
    ? entre01(num(r.hpPct) / 100)
    : (num(r.hpMax) > 0 ? entre01(num(r.hp) / num(r.hpMax)) : 0);
  const {sp: spActual, spMax} = spDeResumen(r);
  const sp = t.tipo === 'pj' && spMax > 0 ? entre01(spActual / spMax) : null;
  // No2: de los PJ sale del resumen; de los creeps, de su parte privada (GM).
  const n = valoresNo2(t);
  const no2 = n && n.max > 0 ? entre01(n.valor / n.max) : null;
  return {hp, sp, no2, muerto: !!r.muerto, dormida: !!r.dormida, estados: Array.isArray(r.estados) ? r.estados : []};
}
// SP de una ficha. Las fichas guardadas antes de la Iteración 2 publican
// bonos/bonosMax en vez de sp/spMax (hasta que su dueño las vuelva a abrir).
function spDeResumen(r){
  const nuevo = r.spMax !== undefined;
  return {
    sp: num(nuevo ? r.sp : r.bonos),
    spMax: num(nuevo ? r.spMax : r.bonosMax),
    campoGastado: nuevo ? 'spGastado' : 'bonosGastados',
    campoResumen: nuevo ? 'resumen.sp' : 'resumen.bonos',
  };
}

// Aura y barras que guarda cada token (las elige su dueño en el engranaje).
function auraDe(t){
  const a = t && t.aura;
  const radio = a ? num(a.radio) : 0;
  if(!(radio > 0)) return null;
  return {radio: Math.min(30, radio), color: /^#[0-9a-fA-F]{6}$/.test(a.color || '') ? a.color : '#E0A458'};
}
function barrasDe(t){
  const b = (t && t.barras) || {};
  return {hp: b.hp !== false, sp: b.sp !== false, no2: b.no2 === true};
}
function colorConAlfa(hex, alfa){
  const n = parseInt(String(hex).slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alfa})`;
}

// No2 del token: {valor, max} o null si no se conocen.
function valoresNo2(t){
  if(!t) return null;
  if(t.tipo === 'creep'){
    const sc = creepPrivadoDe(t.fichaId);
    if(!sc || sc.nitros === undefined || sc.nitros === null) return null;
    return {valor: num(sc.nitros), max: Math.max(num(sc.nitros), num(sc.nitrosMax) || num(sc.agl) || 0)};
  }
  if(t.fichaId && t.fichaId.includes(SEP_INVOCACION)) return null;
  const f = fichasPub.get(t.fichaId);
  const r = f && f.resumen;
  if(!r || r.nitros === undefined) return null;
  return {valor: num(r.nitros), max: num(r.nitrosMax) || num(r.nitros)};
}

/* ---------- Mantenimiento del GM ----------
   El GM toca "⟳ Mantenimiento": sube campanas/<partida>/mapa/mantenimiento.
   numero. Cada ficha y gm-tools aplican su propio mantenimiento (con la
   lógica de siempre) una sola vez por número, aunque estén cerradas: se
   ponen al día al abrirse. Además, para que se note enseguida, cada mapa
   corre en segundo plano (iframe oculto, uno por vez) las fichas de su
   dueño y, en el del GM, gm-tools. Si alguna ya lo aplicó, no pasa nada. */
let mantenimientoNumero = null;
const mantenimientoCola = [];
let mantenimientoMarco = null;

function escucharMantenimiento(){
  fbDb.doc(fbRutaCampana('mapa/mantenimiento')).onSnapshot(doc => {
    const numero = doc.exists ? Math.round(num(doc.data().numero)) : 0;
    const antes = mantenimientoNumero;
    mantenimientoNumero = numero;
    if(antes === null || numero <= antes || doc.metadata.hasPendingWrites) return;
    toast(`⟳ Mantenimiento: pasó el turno`);
    const base = '../';
    if(soyGM){
      mantenimientoEncolar(`${base}gm-toolset/gm-tools.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=mantenimiento`);
    }else{
      fichasPub.forEach((f, id) => {
        if(f.duenoUid === fbUsuario.uid) mantenimientoEncolar(`${base}ficha-personaje/ficha.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=mantenimiento#${encodeURIComponent(id)}`);
      });
    }
  }, err => console.error('Error escuchando el mantenimiento:', err));
}

function mantenimientoEncolar(url){
  if(!mantenimientoCola.includes(url)) mantenimientoCola.push(url);
  mantenimientoSiguiente();
}

function mantenimientoSiguiente(){
  if(mantenimientoMarco || !mantenimientoCola.length) return;
  const marco = document.createElement('iframe');
  marco.title = 'Mantenimiento en segundo plano';
  marco.style.cssText = 'position:absolute;width:1px;height:1px;border:0;left:-9999px;top:0;visibility:hidden';
  marco.src = mantenimientoCola.shift();
  mantenimientoMarco = marco;
  // Por si la herramienta nunca avisa (sin conexión, etc.), se cierra sola.
  marco.cierre = setTimeout(mantenimientoCerrarMarco, 45000);
  document.body.appendChild(marco);
}

function mantenimientoCerrarMarco(){
  if(!mantenimientoMarco) return;
  clearTimeout(mantenimientoMarco.cierre);
  mantenimientoMarco.remove();
  mantenimientoMarco = null;
  mantenimientoSiguiente();
}

window.addEventListener('message', e => {
  if(e.origin !== location.origin || !e.data || !mantenimientoMarco || e.source !== mantenimientoMarco.contentWindow) return;
  if(e.data.tipo === 'mantenimiento-listo') mantenimientoCerrarMarco();
});

$('#btn-mantenimiento').onclick = async () => {
  if(!soyGM) return;
  if(!confirm('¿Pasar el turno para toda la mesa?\n\nSe aplica el Mantenimiento a todas las fichas y a los creeps: turnos de los estados, efectos por turno y recarga de No2.')) return;
  const btn = $('#btn-mantenimiento');
  btn.disabled = true;
  try{
    const ref = fbDb.doc(fbRutaCampana('mapa/mantenimiento'));
    // El turno que se anuncia es el de gm-tools (gm/estado) más uno.
    const turno = await fbDb.runTransaction(async tx => {
      const [doc, estado] = await Promise.all([tx.get(ref), tx.get(fbDb.doc(fbRutaCampana('gm/estado')))]);
      const numero = (doc.exists ? Math.round(num(doc.data().numero)) : 0) + 1;
      tx.set(ref, {numero, cuando: firebase.firestore.FieldValue.serverTimestamp()});
      return (estado.exists ? Math.round(num(estado.data().turno)) : 0) + 1;
    });
    publicarPaseDeTurno(turno);
  }catch(err){
    console.error('No se pudo pasar el turno:', err);
    toast(err.code === 'permission-denied' ? 'Solo el GM puede pasar el turno' : 'No se pudo pasar el turno — mirá la consola');
  }finally{
    btn.disabled = false;
  }
};

// Nitros que cuesta mover este token: los PJ vinculados a su ficha y los
// creeps vinculados (no las invocaciones ni los NPC). null = se mueve sin
// costo, como también una ficha o creep que todavía no tiene No2 (abrila
// una vez, o abrí gm-tools).
function costoMoverDe(t){
  if(modoMapa !== 'combate') return null;  // en modo narrativo se mueve sin contar No2
  if(t && t.tipo === 'creep') return costoMoverCreep(t);
  if(!t || t.tipo !== 'pj' || !t.fichaId || t.fichaId.includes(SEP_INVOCACION)) return null;
  const f = fichasPub.get(t.fichaId);
  const r = f && f.resumen;
  if(!r || r.costoMover === undefined) return null;
  return {porCasillero: num(r.costoMover), disponibles: num(r.nitros)};
}

// Mismas reglas que la ficha publica en resumen.costoMover: 1 por
// casillero, 2 con Rengo, 0 (no se mueve) con Inmovilizado.
function costoMoverCreep(t){
  if(!soyGM || !t.fichaId) return null;
  const sc = creepPrivadoDe(t.fichaId);
  if(!sc || sc.nitros === undefined || sc.nitros === null) return null;
  const activos = (Array.isArray(sc.estados) ? sc.estados : []).filter(e => e && e.activo !== false);
  const porCasillero = activos.some(e => e.inmovilizado) ? 0 : activos.some(e => e.rengo) ? 2 : 1;
  return {porCasillero, disponibles: num(sc.nitros)};
}

function puedoMover(t){
  if(!t || !fbUsuario) return false;
  return t.tipo === 'creep' ? soyGM : t.duenoUid === fbUsuario.uid;
}
function puedoBorrar(t){
  return !!t && !!fbUsuario && (t.duenoUid === fbUsuario.uid || soyGM);
}
function nombreMiembro(uid){
  const m = miembros.get(uid);
  return m ? m.nombre : '(alguien que ya no está)';
}
function inicial(nombre){
  const letra = Array.from(String(nombre || '?').trim())[0] || '?';
  return letra.toUpperCase();
}

/* ---------- Vista ---------- */

function guardarVista(){
  try{ localStorage.setItem('mapa-vista', JSON.stringify(vista)); }catch(e){}
}
function cargarVista(){
  try{
    const v = JSON.parse(localStorage.getItem('mapa-vista') || 'null');
    if(v && Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.zoom)){ vista = v; return true; }
  }catch(e){}
  return false;
}
function pantallaAMundo(px, py){
  return { x: (px - vista.x) / vista.zoom, y: (py - vista.y) / vista.zoom };
}
function posEvento(e){
  const r = lienzo.getBoundingClientRect();
  return { px: e.clientX - r.left, py: e.clientY - r.top };
}
function centrarEn(x, y){
  vista.x = anchoPx / 2 - x * vista.zoom;
  vista.y = altoPx / 2 - y * vista.zoom;
  guardarVista(); pedirDibujo();
}
function zoomEn(px, py, factor){
  const nuevo = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, vista.zoom * factor));
  const m = pantallaAMundo(px, py);
  vista.zoom = nuevo;
  vista.x = px - m.x * nuevo;
  vista.y = py - m.y * nuevo;
  guardarVista(); pedirDibujo();
}
function centrarEnMios(){
  const mios = [...tokens.values()].filter(t => puedoMover(t) && t.tipo === 'pj');
  const lista = mios.length ? mios : (soyGM ? [...tokens.values()] : []);
  if(!lista.length){ centrarEn(0, 0); return; }
  const cs = lista.map(t => hexCentro(t.col, t.fila));
  centrarEn(cs.reduce((a, c) => a + c.x, 0) / cs.length, cs.reduce((a, c) => a + c.y, 0) / cs.length);
}

function ajustarTamano(){
  const r = lienzo.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  anchoPx = r.width; altoPx = r.height;
  lienzo.width = Math.round(r.width * dpr);
  lienzo.height = Math.round(r.height * dpr);
  // La primera vez que se conoce el tamaño, si no había una vista guardada,
  // se pone la casilla 0,0 en el medio.
  if(!ajustarTamano.hecho && anchoPx > 0){
    ajustarTamano.hecho = true;
    ajustarTamano.habiaVista = cargarVista();
    if(!ajustarTamano.habiaVista) centrarEn(0, 0);
  }
  pedirDibujo();
}

/* ---------- Dibujo ---------- */

let dibujoPedido = false;
function pedirDibujo(){
  if(dibujoPedido) return;
  dibujoPedido = true;
  requestAnimationFrame(() => {
    dibujoPedido = false;
    if(dibujar()) pedirDibujo();
  });
}

function trazarHex(cx, cy){
  ctx.moveTo(cx + ESQUINAS[0][0], cy + ESQUINAS[0][1]);
  for(let i = 1; i < 6; i++) ctx.lineTo(cx + ESQUINAS[i][0], cy + ESQUINAS[i][1]);
  ctx.closePath();
}

// Dónde va cada token: si varios comparten casilla, se acomodan en ronda.
function calcularDisposicion(){
  const orden = [...tokens.entries()]
    .map(([id, t]) => ({id, t}))
    .sort((a, b) => (a.t.creadoMs - b.t.creadoMs) || (a.id < b.id ? -1 : 1));
  const grupos = new Map();
  orden.forEach(o => {
    if(arrastre && arrastre.id === o.id) return;
    if(rutaPendiente && rutaPendiente.id === o.id) return;
    const k = o.t.col + ',' + o.t.fila;
    if(!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(o);
  });
  const res = [];
  grupos.forEach(grupo => {
    const n = grupo.length;
    grupo.forEach((o, i) => {
      const c = hexCentro(o.t.col, o.t.fila);
      if(n === 1){ res.push({id: o.id, x: c.x, y: c.y, radio: HEX * 0.68, solo: true}); return; }
      const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      const d = HEX * (n > 4 ? 0.45 : 0.38);
      res.push({id: o.id, x: c.x + d * Math.cos(ang), y: c.y + d * Math.sin(ang), radio: HEX * (n > 4 ? 0.3 : 0.42)});
    });
  });
  if(arrastre && tokens.has(arrastre.id)) res.push({id: arrastre.id, x: arrastre.x, y: arrastre.y, radio: HEX * 0.68, solo: true, arrastrado: true});
  // Esperando confirmación: el token queda en el destino de la ruta.
  if(rutaPendiente && tokens.has(rutaPendiente.id)){
    const fin = rutaPendiente.celdas[rutaPendiente.celdas.length - 1];
    const c = hexCentro(fin.col, fin.fila);
    res.push({id: rutaPendiente.id, x: c.x, y: c.y, radio: HEX * 0.68, solo: true});
  }
  return res;
}

// Devuelve true si todavía hay algo animándose.
function dibujar(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0F0C0E';
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  const z = vista.zoom;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * vista.x, dpr * vista.y);

  // Imagen de fondo (la pone el GM), debajo de la grilla.
  const imgFondo = fondo ? imagenLista(fondo.dato) : null;
  if(imgFondo){
    const alto = fondo.ancho * imgFondo.naturalHeight / imgFondo.naturalWidth;
    ctx.drawImage(imgFondo, fondo.x, fondo.y, fondo.ancho, alto);
  }

  // Grilla: solo las casillas que se ven.
  const a = pantallaAMundo(0, 0), b = pantallaAMundo(anchoPx, altoPx);
  const filaMin = Math.floor(a.y / (1.5 * HEX)) - 1, filaMax = Math.ceil(b.y / (1.5 * HEX)) + 1;
  const colMin = Math.floor(a.x / (SQ3 * HEX)) - 1, colMax = Math.ceil(b.x / (SQ3 * HEX)) + 1;
  ctx.beginPath();
  for(let f = filaMin; f <= filaMax; f++){
    for(let c = colMin; c <= colMax; c++){
      const p = hexCentro(c, f);
      trazarHex(p.x, p.y);
    }
  }
  if(!imgFondo){
    ctx.fillStyle = '#17121A';
    ctx.fill();
  }
  ctx.strokeStyle = imgFondo ? 'rgba(15,12,14,.45)' : 'rgba(201,133,69,.28)';
  ctx.lineWidth = 1 / z;
  ctx.stroke();

  // Casilla de origen marcada apenas, como referencia.
  ctx.beginPath(); trazarHex(0, 0);
  ctx.strokeStyle = 'rgba(224,164,88,.45)'; ctx.lineWidth = 2 / z; ctx.stroke();

  // Estelas: la ruta que se está dibujando, la que espera confirmación y las
  // de movimientos recientes (se desvanecen).
  let animando = false;
  const ahora = Date.now();
  // pagables: casilleros que alcanzan los Nitros; los de más van en rojo.
  const dibujarEstela = (celdas, alfa, pagables = Infinity) => {
    if(celdas.length < 2) return;
    const casillas = (color, lista) => {
      if(!lista.length) return;
      ctx.beginPath();
      lista.forEach(c => { const p = hexCentro(c.col, c.fila); trazarHex(p.x, p.y); });
      ctx.fillStyle = `rgba(${color},${0.2 * alfa})`; ctx.fill();
      ctx.strokeStyle = `rgba(${color},${0.75 * alfa})`; ctx.lineWidth = 2 / z; ctx.stroke();
    };
    casillas('224,164,88', celdas.slice(1, pagables + 1));
    casillas('214,69,69', celdas.slice(pagables + 1));
    ctx.beginPath();
    celdas.forEach((c, i) => { const p = hexCentro(c.col, c.fila); if(i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
    ctx.strokeStyle = `rgba(237,227,210,${0.85 * alfa})`; ctx.lineWidth = 4 / z; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    celdas.slice(1).forEach(c => {
      const p = hexCentro(c.col, c.fila);
      ctx.beginPath(); ctx.arc(p.x, p.y, 5 / z, 0, 2 * Math.PI);
      ctx.fillStyle = `rgba(237,227,210,${alfa})`; ctx.fill();
    });
  };
  estelas.forEach((e, id) => {
    const resta = e.hasta - ahora;
    if(resta <= 0){ estelas.delete(id); return; }
    dibujarEstela(e.celdas, Math.min(1, resta / 1200));
    animando = true;
  });
  if(rutaPendiente) dibujarEstela(rutaPendiente.celdas, 1, pasosPagables(rutaPendiente));
  if(arrastre && arrastre.movio) dibujarEstela(arrastre.ruta, 1, pasosPagables(arrastre.costo));

  // Auras: una superficie de color semitransparente alrededor del token.
  tokens.forEach((t, id) => {
    const aura = auraDe(t);
    if(!aura) return;
    const dib = disposicion.find(d => d.id === id);
    const vis = visibles.get(id);
    const c = vis || (dib ? {x: dib.x, y: dib.y} : hexCentro(t.col, t.fila));
    ctx.beginPath();
    ctx.arc(c.x, c.y, aura.radio * ANCHO_CASILLA, 0, 2 * Math.PI);
    ctx.fillStyle = colorConAlfa(aura.color, 0.18); ctx.fill();
    ctx.strokeStyle = colorConAlfa(aura.color, 0.5); ctx.lineWidth = 2 / z; ctx.stroke();
  });

  // Tokens.
  disposicion = calcularDisposicion();
  const etiquetas = HEX * z >= 22;
  disposicion.forEach(d => {
    const t = tokens.get(d.id);
    let v = visibles.get(d.id);
    if(!v || d.arrastrado){ v = {x: d.x, y: d.y}; visibles.set(d.id, v); }
    else{
      const dx = d.x - v.x, dy = d.y - v.y;
      if(Math.abs(dx) + Math.abs(dy) > 0.5){ v.x += dx * 0.25; v.y += dy * 0.25; animando = true; }
      else{ v.x = d.x; v.y = d.y; }
    }
    const x = v.x, y = v.y, rad = d.radio;

    ctx.beginPath(); ctx.arc(x + 2 / z, y + 3 / z, rad, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();

    const vin = vinculo(t);
    const est = estadoDe(t);
    const nombre = nombreDe(t);
    const mini = vin ? imagenLista(vin.miniatura) : null;

    ctx.beginPath(); ctx.arc(x, y, rad, 0, 2 * Math.PI);
    ctx.fillStyle = t.color || '#9A867E'; ctx.fill();
    if(mini){
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 2 * Math.PI); ctx.clip();
      ctx.drawImage(mini, x - rad, y - rad, rad * 2, rad * 2);
      ctx.restore();
    }
    if(est && (est.muerto || est.dormida)){
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(15,12,14,.62)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 2 * Math.PI);
    // Borde: dorado tuyos, verde otros jugadores, rojo creeps, gris NPC.
    ctx.lineWidth = Math.max(2.5 / z, rad * 0.13);
    ctx.strokeStyle = BORDE[claseToken(t)];
    ctx.stroke();

    if(seleccion === d.id){
      ctx.beginPath(); ctx.arc(x, y, rad + 5 / z, 0, 2 * Math.PI);
      ctx.strokeStyle = '#EDE3D2'; ctx.lineWidth = 2.5 / z; ctx.stroke();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if(!mini){
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${rad * 0.95}px "Space Grotesk", system-ui, sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 3;
      ctx.fillText(inicial(nombre), x, y + rad * 0.05);
      ctx.shadowBlur = 0;
    }
    if(est && est.muerto){
      ctx.strokeStyle = HP_COLOR; ctx.lineWidth = Math.max(2 / z, rad * 0.14);
      const k = rad * 0.45;
      ctx.beginPath(); ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k); ctx.stroke();
    }

    // Barras: vida (roja) y, en los PJ, SP (azul), justo debajo del token.
    let debajo = y + rad + 3 / z;
    if(est){
      const bw = rad * 1.8, bh = Math.max(3 / z, rad * 0.13);
      const barra = (valor, color) => {
        ctx.fillStyle = 'rgba(15,12,14,.85)';
        ctx.fillRect(x - bw / 2 - 1 / z, debajo - 1 / z, bw + 2 / z, bh + 2 / z);
        ctx.fillStyle = color;
        ctx.fillRect(x - bw / 2, debajo, bw * valor, bh);
        debajo += bh + 2 / z;
      };
      const barras = barrasDe(t);
      if(barras.hp) barra(est.hp, HP_COLOR);
      if(barras.sp && est.sp !== null) barra(est.sp, SP_COLOR);
      if(barras.no2 && est.no2 !== null) barra(est.no2, NO2_COLOR);
    }

    // Estados: circulitos con la inicial sobre el borde de arriba del token
    // (verde = beneficio, violeta = perjuicio). Con varios en la misma
    // casilla, solo los del seleccionado.
    if(est && est.estados.length && (d.solo || seleccion === d.id)){
      const max = 5;
      const lista = est.estados.slice(0, max);
      const r = Math.max(5 / z, rad * 0.24);
      lista.forEach((e, i) => {
        const ang = -Math.PI / 2 + (i - (lista.length - 1) / 2) * 0.62;
        const ex = x + rad * Math.cos(ang), ey = y + rad * Math.sin(ang);
        const resto = i === max - 1 && est.estados.length > max;
        ctx.beginPath(); ctx.arc(ex, ey, r, 0, 2 * Math.PI);
        ctx.fillStyle = resto ? '#3B2E34' : (ESTADO_COLOR[e.polaridad] || ESTADO_COLOR['']);
        ctx.fill();
        ctx.strokeStyle = '#0F0C0E'; ctx.lineWidth = 1.5 / z; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${r * 1.15}px "Space Grotesk", system-ui, sans-serif`;
        ctx.fillText(resto ? '+' + (est.estados.length - max + 1) : inicial(e.nombre), ex, ey + r * 0.06);
      });
    }

    // Con varios en la misma casilla, el nombre solo del seleccionado.
    if(etiquetas && (d.solo || seleccion === d.id)){
      const tam = 11 / z;
      ctx.font = `500 ${tam}px "Space Grotesk", system-ui, sans-serif`;
      const texto = nombre.length > 18 ? nombre.slice(0, 17) + '…' : nombre;
      const w = ctx.measureText(texto).width + 8 / z;
      const ty = debajo + 7 / z;
      ctx.fillStyle = 'rgba(15,12,14,.8)';
      ctx.fillRect(x - w / 2, ty - tam * 0.7, w, tam * 1.4);
      ctx.fillStyle = '#EDE3D2';
      ctx.fillText(texto, x, ty);
    }
  });
  hudUbicar();
  return animando;
}

function tokenEn(x, y){
  for(let i = disposicion.length - 1; i >= 0; i--){
    const d = disposicion[i];
    const v = visibles.get(d.id) || d;
    if(Math.hypot(v.x - x, v.y - y) <= d.radio + 3) return d.id;
  }
  return null;
}

/* ---------- Mouse / dedo sobre el mapa ---------- */

lienzo.addEventListener('pointerdown', e => {
  if(e.button !== 0 && e.pointerType === 'mouse') return;
  const {px, py} = posEvento(e);
  const m = pantallaAMundo(px, py);
  const id = tokenEn(m.x, m.y);
  lienzo.setPointerCapture(e.pointerId);
  if(id){
    seleccionar(id);
    const t = tokens.get(id);
    if(puedoMover(t)){
      const costo = costoMoverDe(t);
      if(rutaPendiente){
        resaltarRutaConfirmar();
      }else if(costo && costo.porCasillero <= 0){
        toast('No te podés mover ahora (Inmovilizado)');
      }else{
        const v = visibles.get(id) || hexCentro(t.col, t.fila);
        arrastre = {id, x: v.x, y: v.y, dx: v.x - m.x, dy: v.y - m.y, inicioX: px, inicioY: py, movio: false,
          ruta: [{col: t.col, fila: t.fila}], costo, avisado: false};
        lienzo.style.cursor = 'grabbing';
        return;
      }
    }
  }else{
    // Con el engranaje abierto, el primer clic en el mapa solo lo cierra:
    // así no se pierde lo que se estaba por guardar.
    if(hudGlobo){ hudCerrar(); renderPanel(); pedirDibujo(); return; }
    seleccionar(null);
    if(moverFondo && soyGM && fondo){
      arrastreFondo = {inicioX: px, inicioY: py, x: fondo.x, y: fondo.y};
      lienzo.style.cursor = 'move';
      return;
    }
  }
  paneo = {inicioX: px, inicioY: py, x: vista.x, y: vista.y};
  lienzo.style.cursor = 'grabbing';
});

lienzo.addEventListener('pointermove', e => {
  const {px, py} = posEvento(e);
  if(arrastre){
    if(!arrastre.movio && Math.hypot(px - arrastre.inicioX, py - arrastre.inicioY) < 4) return;
    arrastre.movio = true;
    const m = pantallaAMundo(px, py);
    arrastre.x = m.x + arrastre.dx; arrastre.y = m.y + arrastre.dy;
    extenderRuta(arrastre, mundoAHex(arrastre.x, arrastre.y));
    pedirDibujo();
    return;
  }
  if(arrastreFondo){
    fondo.x = arrastreFondo.x + (px - arrastreFondo.inicioX) / vista.zoom;
    fondo.y = arrastreFondo.y + (py - arrastreFondo.inicioY) / vista.zoom;
    pedirDibujo();
    return;
  }
  if(paneo){
    vista.x = paneo.x + px - paneo.inicioX;
    vista.y = paneo.y + py - paneo.inicioY;
    pedirDibujo();
    return;
  }
  const m = pantallaAMundo(px, py);
  const id = tokenEn(m.x, m.y);
  lienzo.style.cursor = id ? (puedoMover(tokens.get(id)) ? 'grab' : 'pointer') : (moverFondo && soyGM && fondo ? 'move' : 'default');
});

// Casilleros que alcanzan a pagarse con los Nitros disponibles (Infinity si
// el token se mueve sin costo). Los que siguen se dibujan en rojo.
function pasosPagables(costo){
  if(!costo) return Infinity;
  return Math.max(0, Math.floor(costo.disponibles / costo.porCasillero));
}

// La ruta sigue al token casilla por casilla. Volver sobre una casilla ya
// recorrida borra la estela desde ahí. Pasarse de los Nitros se permite
// (quedan en negativo), pero avisa y la estela sigue en rojo.
function extenderRuta(a, casilla){
  const ruta = a.ruta;
  const i = ruta.findIndex(c => mismoHex(c, casilla));
  if(i >= 0){ ruta.length = i + 1; return; }
  for(const c of lineaHex(ruta[ruta.length - 1], casilla)){
    const j = ruta.findIndex(x => mismoHex(x, c));
    if(j >= 0){ ruta.length = j + 1; continue; }
    if(ruta.length >= RUTA_MAX_CELDAS) break;
    ruta.push(c);
  }
  if(a.costo && ruta.length - 1 > pasosPagables(a.costo) && !a.avisado){
    toast(`⚠ Te estás pasando de tus No2 (te quedan ${fmt(a.costo.disponibles)})`);
    a.avisado = true;
  }
}

function soltar(){
  if(arrastre){
    const a = arrastre;
    arrastre = null;
    const t = tokens.get(a.id);
    const pasos = a.ruta.length - 1;
    if(a.movio && t && pasos > 0){
      visibles.set(a.id, {x: a.x, y: a.y});
      if(a.costo){
        rutaPendiente = {id: a.id, celdas: a.ruta, pasos, porCasillero: a.costo.porCasillero, disponibles: a.costo.disponibles};
        // Solo se pregunta si el movimiento se pasa de los No2 que quedan.
        if(pasos * a.costo.porCasillero > Math.max(0, a.costo.disponibles)) mostrarConfirmacionRuta();
        else confirmarRuta();
      }else{
        const fin = a.ruta[pasos];
        moverToken(a.id, fin.col, fin.fila, a.ruta);
      }
    }
    pedirDibujo();
  }
  if(paneo){ paneo = null; guardarVista(); }
  if(arrastreFondo){
    const movido = fondo.x !== arrastreFondo.x || fondo.y !== arrastreFondo.y;
    arrastreFondo = null;
    if(movido) guardarFondo({x: fondo.x, y: fondo.y});
  }
  lienzo.style.cursor = 'default';
}
lienzo.addEventListener('pointerup', soltar);
lienzo.addEventListener('pointercancel', soltar);

lienzo.addEventListener('wheel', e => {
  e.preventDefault();
  const {px, py} = posEvento(e);
  zoomEn(px, py, Math.exp(-e.deltaY * 0.0015));
}, {passive: false});

$('#btn-acercar').onclick = () => zoomEn(anchoPx / 2, altoPx / 2, 1.25);
$('#btn-alejar').onclick = () => zoomEn(anchoPx / 2, altoPx / 2, 0.8);
$('#btn-centrar').onclick = centrarEnMios;

document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(rutaPendiente && e.key === 'Enter'){ e.preventDefault(); confirmarRuta(); return; }
  if(rutaPendiente && e.key === 'Escape'){ cancelarRuta(); return; }
  if(e.key === 'Escape') seleccionar(null);
  if((e.key === 'Delete' || e.key === 'Backspace') && seleccion) borrarToken(seleccion);
});

/* ---------- Tokens en Firestore ---------- */

function coleccionTokens(){ return fbDb.collection(fbRutaCampana('tokens')); }

// La ruta viaja con el movimiento como [col, fila, col, fila…] para que
// los demás vean la estela unos segundos.
async function moverToken(id, col, fila, celdas){
  const t = tokens.get(id);
  if(!t) return;
  // Se mueve ya en pantalla; si Firebase lo rechaza, vuelve solo a su lugar.
  t.col = col; t.fila = fila;
  const ruta = (celdas || []).slice(-RUTA_MAX_CELDAS).flatMap(c => [c.col, c.fila]);
  if(celdas && celdas.length > 1){
    t.rutaJson = JSON.stringify(ruta);
    estelas.set(id, {celdas: celdas.slice(), hasta: Date.now() + ESTELA_MS});
  }
  renderPanel();
  pedirDibujo();
  const doc = coleccionTokens().doc(id);
  try{
    await doc.update(ruta.length > 2 ? {col, fila, ruta} : {col, fila});
  }catch(err){
    // Reglas de Firestore sin publicar todavía (no conocen "ruta"): se mueve
    // igual, solo que los demás no ven la estela.
    if(err.code === 'permission-denied' && ruta.length > 2){
      try{ await doc.update({col, fila}); return; }catch(e){ err = e; }
    }
    console.error('No se pudo mover el token:', err);
    toast(err.code === 'permission-denied' ? 'No podés mover ese token' : 'No se pudo mover el token');
  }
}

/* ---------- Mover gastando Nitros ---------- */

// Llama la atención sobre el cartel del movimiento sin confirmar.
function resaltarRutaConfirmar(){
  const caja = $('#ruta-confirmar');
  if(caja.hidden) return;
  caja.classList.remove('atencion');
  void caja.offsetWidth;  // reinicia la animación
  caja.classList.add('atencion');
  $('#ruta-si').focus();
}

function mostrarConfirmacionRuta(){
  const p = rutaPendiente;
  if(!p) return;
  const costo = p.pasos * p.porCasillero;
  const exceso = costo - Math.max(0, p.disponibles);
  $('#ruta-texto').textContent = `Mover ${p.pasos} casillero${p.pasos === 1 ? '' : 's'} · −${fmt(costo)} No2 (te quedan ${fmt(p.disponibles - costo)})` +
    (p.porCasillero !== 1 ? ` · ${fmt(p.porCasillero)} por casillero` : '') +
    (exceso > 0 ? ` · ⚠ te pasás por ${fmt(exceso)}` : '');
  $('#ruta-confirmar').classList.toggle('excede', exceso > 0);
  $('#ruta-confirmar').hidden = false;
  document.body.classList.add('con-ruta');

// Descuenta los Nitros en la ficha (parte "general" + resumen), igual que
// cambiarVidaPj con la vida. Puede quedar en negativo (moverse de más se
// permite, avisando). Devuelve los que quedan.
async function gastarNitros(fichaId, costo){
  const base = fbDb.doc(fbRutaCampana(`fichas/${fichaId}`));
  const parteRef = base.collection('partes').doc('general');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  return fbDb.runTransaction(async tx => {
    const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
    if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
    const datos = JSON.parse(parte.data().json || '{}');
    const r = ficha.data().resumen || {};
    const actual = datos.nitros === null || datos.nitros === undefined ? num(r.nitros) : num(datos.nitros);
    datos.nitros = actual - costo;
    tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
    tx.update(base, {'resumen.nitros': datos.nitros, actualizado: ts});
    return datos.nitros;
  });
}

// Lo mismo sobre la parte privada del creep (lo hace el GM).
function gastarNitrosCreep(creepId, costo){
  return modificarCreep(creepId, sc => {
    sc.nitros = num(sc.nitros) - costo;
    return sc.nitros;
  });
}

    rutaPendiente = null;
    const fin = p.celdas[p.celdas.length - 1];
    await moverToken(p.id, fin.col, fin.fila, p.celdas);
    toast(esCreep
      ? `${nombreDe(t)}: −${fmt(costo)} No2 · le quedan ${fmt(quedan)}${quedan < 0 ? ' ⚠ se pasó de sus No2' : ''}`
      : `−${fmt(costo)} No2 · te quedan ${fmt(quedan)}${quedan < 0 ? ' ⚠ te pasaste de tus No2' : ''}`);

}

function escucharTokens(){
  coleccionTokens().onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed'){
        tokens.delete(ch.doc.id); visibles.delete(ch.doc.id);
        if(seleccion === ch.doc.id) seleccion = null;
        return;
      }
      const d = ch.doc.data({serverTimestamps: 'estimate'});
      // Ruta nueva de otro (la propia ya se mostró al mover): estela unos segundos.
      const previo = tokens.get(ch.doc.id);
      const ruta = Array.isArray(d.ruta) ? d.ruta.map(v => Math.round(num(v))) : [];
      const rutaJson = JSON.stringify(ruta);
      if(ch.type === 'modified' && ruta.length > 2 && previo && previo.rutaJson !== rutaJson){
        const celdas = [];
        for(let i = 0; i + 1 < ruta.length; i += 2) celdas.push({col: ruta[i], fila: ruta[i + 1]});
        estelas.set(ch.doc.id, {celdas, hasta: Date.now() + ESTELA_MS});
      }
      tokens.set(ch.doc.id, {
        rutaJson,
        nombre: String(d.nombre || '?'),
        color: d.color,
        tipo: d.tipo === 'creep' ? 'creep' : 'pj',
        duenoUid: d.duenoUid,
        fichaId: typeof d.fichaId === 'string' ? d.fichaId : '',
        col: Math.round(num(d.col)),
        fila: Math.round(num(d.fila)),
        creadoMs: d.creado && d.creado.toMillis ? d.creado.toMillis() : 0,
      });
    });
    const primeraVez = !escucharTokens.listo;
    escucharTokens.listo = true;
    if(primeraVez && !ajustarTamano.habiaVista) centrarEnMios();
    renderPanel();
    pedirDibujo();

    console.error('Error escuchando los tokens:', err);

// Achica la imagen hasta que entre en un documento de Firebase (tope 1 MB).
function prepararImagenFondo(file){
  return new Promise((res, rej) => {
    if(!file.type || !file.type.startsWith('image/')){ rej(new Error('no-image')); return; }
    const lector = new FileReader();
    lector.onerror = () => rej(lector.error);
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('bad-image'));
      img.onload = () => {
        let lado = 2000, calidad = 0.82, dato = '';
        for(let i = 0; i < 8; i++){
          const escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.naturalWidth * escala);
          canvas.height = Math.round(img.naturalHeight * escala);
          const c = canvas.getContext('2d');
          c.fillStyle = '#17121A'; c.fillRect(0, 0, canvas.width, canvas.height);
          c.drawImage(img, 0, 0, canvas.width, canvas.height);
          dato = canvas.toDataURL('image/jpeg', calidad);
          if(dato.length < 900000) break;
          lado = Math.round(lado * 0.8); calidad = Math.max(0.6, calidad - 0.05);
        }
        dato.length < 900000 ? res(dato) : rej(new Error('muy-grande'));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

// Vida y SP desde el mapa, guardados en la ficha o en el creep, así los ve
// cambiados la ficha, gm-tools, el tablero y los demás. Los PJ los cambia
// su dueño; los creeps, el GM (lo imponen las reglas).
function puedoCambiarVida(t){
  if(!t || !t.fichaId || !fbUsuario) return false;
  if(t.tipo === 'creep') return soyGM && creepsPub.has(t.fichaId);
  const v = vinculo(t);
  return !!v && !soyGM && v.duenoUid === fbUsuario.uid;
}

// "12" fija el valor; "+5" / "-3" suma o resta. null si no se entiende.
function leerValorVital(texto, actual){
  const crudo = String(texto || '').trim().replace(',', '.').replace('−', '-');
  const m = crudo.match(/^([+-])\s*(\d+(?:\.\d+)?)$/);
  if(m) return actual + parseFloat(m[2]) * (m[1] === '-' ? -1 : 1);
  if(/^\d+(?:\.\d+)?$/.test(crudo)) return parseFloat(crudo);
  return null;
}
const ERROR_TIPEO = 'tipeo';

// Mismo hash que gm-tools usa para la firma del creep (gmHash): al cambiar
// la firma, gm-tools se da cuenta y trae el creep actualizado.
function hashGm(s){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

// Cambia el creep completo (parte privada) en una transacción y pone al día
// su resumen público y la firma. Devuelve lo que devuelva cambiar(sc).
async function modificarCreep(creepId, cambiar){
  const base = fbDb.doc(fbRutaCampana(`creeps/${creepId}`));
  const privRef = base.collection('privado').doc('ficha');
  return fbDb.runTransaction(async tx => {
    const [priv, pub] = await Promise.all([tx.get(privRef), tx.get(base)]);
    if(!priv.exists || !pub.exists) throw new Error('El creep ya no existe');
    const sc = JSON.parse(priv.data().json || '{}');
    const resultado = cambiar(sc);
    const hpMax = num(sc.hpMax);
    const json = JSON.stringify(sc);
    // La firma es hash(creep)-hash(imagen); la imagen no cambia.
    const firmaVieja = String(pub.data().firma || '');
    const parteImagen = firmaVieja.includes('-') ? firmaVieja.slice(firmaVieja.indexOf('-') + 1) : hashGm('');
    tx.set(privRef, {json});
    tx.update(base, {
      'resumen.hpPct': hpMax > 0 ? Math.round(Math.max(0, Math.min(1, sc.hp / hpMax)) * 100) : 0,
      'resumen.muerto': sc.hp <= 0,
      'resumen.estados': (Array.isArray(sc.estados) ? sc.estados : [])
        .filter(e => e && e.activo !== false && e.nombre).slice(0, 30)
        .map(e => ({
          nombre: String(e.nombre).slice(0, 60), turnos: num(e.turnos), permanente: !!e.permanente,
          polaridad: e.polaridad === 'buff' || e.polaridad === 'debuff' ? e.polaridad : '',
        })),
      firma: hashGm(json) + '-' + parteImagen,
      actualizado: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return resultado;
  });
}

async function cambiarVidaCreep(creepId, texto){
  await modificarCreep(creepId, sc => {
    const hpMax = num(sc.hpMax);
    const nuevo = leerValorVital(texto, num(sc.hp));
    if(nuevo === null) throw new Error(ERROR_TIPEO);
    sc.hp = Math.max(0, hpMax > 0 ? Math.min(hpMax, nuevo) : nuevo);
  });
}

async function cambiarVidaPj(t, clave, texto){
  const [fichaId, invId] = t.fichaId.split(SEP_INVOCACION);
  const base = fbDb.doc(fbRutaCampana(`fichas/${fichaId}`));
  const parteRef = base.collection('partes').doc(invId ? 'invocaciones' : 'general');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  await fbDb.runTransaction(async tx => {
    const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
    if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
    const datos = JSON.parse(parte.data().json || '{}');
    const r = ficha.data().resumen || {};
    const cambios = {actualizado: ts};
    if(invId){
      const inv = (datos.invocaciones || []).find(i => i && i.id === invId);
      if(!inv) throw new Error('La invocación ya no existe');
      const nuevo = leerValorVital(texto, num(inv.hp));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      inv.hp = Math.max(0, num(inv.hpMax) > 0 ? Math.min(num(inv.hpMax), nuevo) : nuevo);
      cambios['resumen.invocaciones'] = (r.invocaciones || []).map(i => i.id === invId ? {...i, hp: inv.hp} : i);
    }else if(clave === 'hp'){
      const hpMax = num(r.hpMax);
      const nuevo = leerValorVital(texto, num(datos.hp));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      datos.hp = Math.max(0, hpMax > 0 ? Math.min(hpMax, nuevo) : nuevo);
      cambios['resumen.hp'] = datos.hp;
    }else{
      // SP disponible = máximo - gastado (igual que en la ficha).
      const {spMax, campoGastado, campoResumen} = spDeResumen(r);
      const nuevo = leerValorVital(texto, spMax - num(datos[campoGastado]));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      const sp = Math.min(spMax, nuevo);
      datos[campoGastado] = spMax - sp;
      cambios[campoResumen] = sp;
    }
    tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
    tx.update(base, cambios);
  });
}

async function aplicarVital(input){
  const t = seleccion ? tokens.get(seleccion) : null;
  if(!puedoCambiarVida(t)) return;
  const texto = input.value;
  input.disabled = true;
  try{
    if(t.tipo === 'creep') await cambiarVidaCreep(t.fichaId, texto);
    else await cambiarVidaPj(t, input.dataset.vital, texto);
  }catch(err){
    console.error('No se pudo cambiar la vida:', err);
    toast(err.message === ERROR_TIPEO ? 'Escribí un número, o +5 / -3'
      : err.code === 'permission-denied' ? 'No podés cambiar eso' : 'No se pudo guardar: ' + err.message);
  }finally{
    input.disabled = false;
    input.blur();
    renderPanel(true);
  }
}

function creepPrivadoDe(creepId){
  const e = creepsPriv.get(creepId);
  return e ? e.sc : null;
}

// GM: escucha la parte privada de cada creep que tiene token en el mapa
// (vida con números y No2 para cobrar al moverlo). Deja de escuchar los
// que ya no están.
function actualizarEscuchasCreeps(){
  const queridos = new Set(soyGM && fbDb
    ? [...tokens.values()].filter(t => t.tipo === 'creep' && t.fichaId).map(t => t.fichaId)
    : []);
  creepsPriv.forEach((e, id) => {
    if(queridos.has(id)) return;
    e.cortar();
    creepsPriv.delete(id);
  });
  queridos.forEach(id => {
    if(creepsPriv.has(id)) return;
    const e = {sc: null, cortar: null};
    creepsPriv.set(id, e);
    e.cortar = fbDb.doc(fbRutaCampana(`creeps/${id}/privado/ficha`)).onSnapshot(doc => {
      let sc = null;
      try{ sc = doc.exists ? JSON.parse(doc.data().json || '{}') : null; }catch(err){}
      e.sc = sc;
      renderPanel();
    }, err => console.error('Error leyendo el creep:', err));
  });
}

function renderPanel(forzar){
  const panel = $('#panel-token');
  const t = seleccion ? tokens.get(seleccion) : null;
  actualizarEscuchasCreeps();

  const v = t ? vinculo(t) : null;
  const opciones = (creando || t) ? [
    [...fichasPub.entries()].filter(([, f]) => f.duenoUid === (fbUsuario && fbUsuario.uid)).map(([id, f]) => id + f.nombre + JSON.stringify(((f.resumen && f.resumen.invocaciones) || []).map(i => [i.id, i.nombre]))),
    [...creepsPub.entries()].map(([id, c]) => id + c.nombre),
  ] : null;
  const firma = clave + '|' + JSON.stringify([
    t && [t.nombre, t.color, t.tipo, t.duenoUid, t.col, t.fichaId, t.fila],
    v && [v.nombre, v.resumen],
    opciones, soyGM, [...miembros.entries()], !!fbMiembro,
    panelFondo && fondo && [fondo.ancho, !!fondo.dato], moverFondo,
    t && t.tipo === 'creep' && (s => s && [s.hp, s.hpMax, s.nitros])(creepPrivadoDe(t.fichaId)),
  ]);
  if(!forzar){
    if(firma === firmaPanel) return;
    // Si sigue abierto el mismo panel, no pisar lo que alguien está
    // escribiendo o eligiendo.
    const mismoPanel = firmaPanel.startsWith(clave + '|');
    if(mismoPanel && (creando || panel.contains(document.activeElement))) return;
  }
  firmaPanel = firma;
  $('#btn-nuevo').disabled = !fbMiembro;
  $('#btn-fondo').hidden = !soyGM;
  $('#caja-mantenimiento').hidden = !soyGM;
  $('#personajes-caja').hidden = !fbMiembro;

  if(panelFondo && soyGM){
    const casillas = fondo ? Math.round(fondo.ancho / ANCHO_CASILLA * 10) / 10 : 20;

      '<h2>Fondo del mapa</h2>' +
      '<div class="fila" style="margin-top:0">' +
        `<button type="button" class="btn primary" id="fondo-cargar">${fondo ? 'Cambiar imagen' : 'Cargar imagen'}</button>` +
        (fondo ? '<button type="button" class="btn peligro" id="fondo-quitar">Quitar</button>' : '') +
      '</div>' +
      (fondo
        ? `<label class="etiqueta">Ancho, en casillas</label><div class="fila" style="margin-top:0"><input id="fondo-ancho" type="number" min="1" max="400" step="0.5" value="${casillas}"><button type="button" class="btn" id="fondo-ancho-ok">Aplicar</button></div>` +

      '<div class="fila"><button type="button" class="btn" id="fondo-cerrar">Listo</button></div>';
    $('#fondo-cargar').onclick = () => $('#fondo-archivo').click();
    $('#fondo-cerrar').onclick = () => { panelFondo = false; moverFondo = false; renderPanel(true); pedirDibujo(); };
    if($('#fondo-quitar')) $('#fondo-quitar').onclick = async () => {
      if(!confirm('¿Quitar la imagen de fondo del mapa?')) return;
      try{
        const lote = fbDb.batch();
        lote.delete(fbDb.doc(fbRutaCampana('mapa/fondo')));
        lote.delete(fbDb.doc(fbRutaCampana('mapa/fondoImagen')));
        await lote.commit();
        moverFondo = false;

    if($('#fondo-ancho-ok')) $('#fondo-ancho-ok').onclick = () => {

      if(n < 1 || n > 400){ toast('Poné un ancho entre 1 y 400 casillas'); return; }

  if(creando){

      '<h2>Nuevo token</h2>' +
      (soyGM ? '<label class="etiqueta">Tipo</label><select id="nuevo-tipo"><option value="creep">Creep o NPC (lo mueve el GM)</option><option value="pj">Personaje (lo movés vos)</option></select>' +

      '<label class="etiqueta">Color (se ve si no tiene imagen)</label>' + htmlColores(color, true) +
      '<div class="fila"><button type="button" class="btn primary" id="nuevo-crear">Poner en el mapa</button><button type="button" class="btn" id="nuevo-cancelar">Cancelar</button></div>' +

    conectarColores(panel, c => color = c);
    const tipoActual = () => soyGM ? $('#nuevo-tipo').value : 'pj';
    const alVincular = () => {
      const id = $('#nuevo-vinculo').value;
      const vv = id ? vinculo({tipo: tipoActual(), fichaId: id}) : null;
      if(vv) $('#nuevo-nombre').value = vv.nombre.slice(0, 40);

    if(soyGM) $('#nuevo-tipo').onchange = () => { $('#nuevo-vinculo').innerHTML = opcionesVinculo(tipoActual(), ''); };
    const crear = () => {
      const nombre = $('#nuevo-nombre').value.trim();
      if(!nombre){ $('#nuevo-nombre').focus(); return; }
      crearToken({nombre, color, tipo: tipoActual(), fichaId: $('#nuevo-vinculo').value});
    };
    $('#nuevo-crear').onclick = crear;
    $('#nuevo-nombre').onkeydown = e => { if(e.key === 'Enter') crear(); };
    $('#nuevo-cancelar').onclick = () => { creando = false; renderPanel(true); };
    $('#nuevo-vinculo').focus();
    return;
  }

  if(!t){
    const item = (color, texto) => `<span><i style="border-color:${color}"></i>${texto}</span>`;
    // El GM no suele tener tokens de personaje propios: el dorado solo
    // aparece en su leyenda si tiene alguno.
    const gmConPropios = soyGM && [...tokens.values()].some(x => claseToken(x) === 'propio');

      ? 'Tocá un token para ver de quién es. Vos movés los creeps y los NPC arrastrándolos; los personajes los mueve cada jugador. ' +

      : 'Tocá un token para ver de quién es. Arrastrá los tuyos para moverlos: la estela marca la ruta casillero por casillero. En modo combate tus personajes gastan No2 al moverse (si te pasás, te pide confirmar); en modo narrativo, no. ';
    const leyenda = soyGM
      ? (gmConPropios ? item(BORDE.propio, 'Tuyos') : '') + item(BORDE.creep, 'Creeps') + item(BORDE.npc, 'NPC') + item(BORDE.jugador, 'Jugadores')
      : item(BORDE.propio, 'Tuyos') + item(BORDE.jugador, 'Otros jugadores') + item(BORDE.creep, 'Creeps') + item(BORDE.npc, 'NPC');
    panel.innerHTML =
      // La ayuda queda escondida detrás del (?): aparece al pasar el cursor
      // (o al tocarlo en pantallas táctiles).
      // Barra partida en dos: a la izquierda Token (?), a la derecha la
      // configuración de los dados 3D.
      '<div class="barra-token">' +
      '<h2 class="con-ayuda">Token <span class="ayuda-icono" tabindex="0" aria-label="Ayuda">?' +
        '<span class="ayuda-globo" role="tooltip">' +
          ayuda +
          'Arrastrá el fondo para desplazarte y usá la rueda o −/+ para el zoom.' +
          '<span class="leyenda">' + leyenda +
          '</span>' +
        '</span>' +
      '</span></h2>' +
      '<a class="btn chico-barra" href="../comun/prueba-dados.html" target="_blank" rel="noopener" style="text-decoration:none" title="Elegir cómo se ven y suenan tus dados 3D">Config 🎲</a>' +
      '</div>';
    return;
  }

  const editable = puedoMover(t);
  const titulo = t.tipo === 'creep' ? (t.fichaId ? 'Creep' : 'NPC') : (v && v.invocacion ? 'Invocación' : 'Personaje');
  const puedeEditar = editable || soyGM;
  // Personajes (y sus invocaciones) vinculados a una ficha: botón para
  // abrirla en otra pestaña. La de otro jugador se abre en solo lectura.
  const fichaDeToken = t.tipo === 'pj' && t.fichaId ? t.fichaId.split(SEP_INVOCACION)[0] : '';
  const botonFicha = fichaDeToken
    ? `<a class="btn" href="../ficha-personaje/ficha.html?partida=${encodeURIComponent(FB_CAMPANA)}#${encodeURIComponent(fichaDeToken)}" target="_blank" rel="noopener" style="text-decoration:none" title="Abrir la ficha en una pestaña nueva">📄 Ficha</a>`

  const botonBotonera = fichaDeToken && !(v && v.invocacion) && !soyGM && v && v.duenoUid === fbUsuario.uid

  // Vista normal: nombre, vida/SP (editables si corresponde), estados.

    panel.innerHTML =
      `<h2>${titulo}</h2>` +
      `<div class="dato"><b>${esc(nombreDe(t))}</b></div>` +
      (t.tipo === 'pj' ? `<div class="dato" style="color:var(--muted)">de ${esc(nombreMiembro(t.duenoUid))}${t.duenoUid === fbUsuario.uid ? ' (vos)' : ''}</div>` : '') +
      htmlEstadoToken(t) +
      ((puedeEditar || botonFicha) ? `<div class="fila">${puedeEditar ? '<button type="button" class="btn" id="token-editar">✎ Editar token</button>' : ''}${botonAcciones}${botonFicha}${botonBotonera}</div>` : '') +
      (!editable ? `<p class="ayuda" style="margin-top:8px">${t.tipo === 'creep' ? (t.fichaId ? 'Los creeps los mueve el GM.' : 'Los NPC los mueve el GM.') : 'Este personaje lo mueve su dueño.'}</p>` : '');
    panel.querySelectorAll('[data-vital]').forEach(input => {
      input.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); aplicarVital(input); } if(e.key === 'Escape') { input.blur(); renderPanel(true); } };
      input.onfocus = () => input.select();
    });
    if($('#token-editar')) $('#token-editar').onclick = () => { editandoToken = true; renderPanel(true); };
    if($('#token-botonera')) $('#token-botonera').onclick = () => abrirBotonera(fichaDeToken);
    if($('#token-acciones')) $('#token-acciones').onclick = () => abrirAcciones(t.fichaId);
    return;
  }

  // Edición: vínculo, nombre, color, dueño (GM), sacar del mapa.
  let color = t.color;
  panel.innerHTML =
    `<h2>Editar token · ${titulo.toLowerCase()}</h2>` +
    (editable
      ? `<label class="etiqueta">Vinculado a</label><select id="token-vinculo">${opcionesVinculo(t.tipo, t.fichaId)}</select>` +
        `<label class="etiqueta">Nombre (si no está vinculado)</label><input id="token-nombre" maxlength="40" value="${esc(t.nombre)}">` +
        '<label class="etiqueta">Color</label>' + htmlColores(t.color, true)
      : `<div class="dato"><b>${esc(nombreDe(t))}</b></div>`) +
    `<div class="dato" style="color:var(--muted)">Casilla ${t.col}, ${t.fila}</div>` +
    (soyGM && t.tipo === 'pj'
      ? '<label class="etiqueta">Cambiar dueño (si alguien cambió de cuenta)</label>' +
        '<div class="fila" style="margin-top:0"><select id="token-dueno">' +
        [...miembros.entries()].map(([uid, m]) => `<option value="${esc(uid)}"${uid === t.duenoUid ? ' selected' : ''}>${esc(m.nombre)}${m.gm ? ' (GM)' : ''}</option>`).join('') +
        '</select><button type="button" class="btn" id="token-dueno-ok">Cambiar</button></div>'
      : '') +
    '<div class="fila">' +
      (editable ? '<button type="button" class="btn primary" id="token-guardar">Guardar</button>' : '') +
      '<button type="button" class="btn" id="token-volver">Volver</button>' +
    '</div>' +
    (puedoBorrar(t) ? '<div class="fila"><button type="button" class="btn peligro" id="token-borrar">Sacar del mapa</button></div>' : '');

  $('#token-volver').onclick = () => { editandoToken = false; renderPanel(true); };
  if(editable){
    conectarColores(panel, c => color = c);
    const guardar = async () => {
      const fichaId = $('#token-vinculo').value;
      const vv = fichaId ? vinculo({tipo: t.tipo, fichaId}) : null;
      const nombre = ($('#token-nombre').value.trim() || (vv ? vv.nombre : '')).slice(0, 40);
      if(!nombre){ toast('El token necesita un nombre'); return; }
      const cambios = {nombre, color};
      cambios.fichaId = fichaId ? fichaId : firebase.firestore.FieldValue.delete();
      await editarToken(seleccion, cambios);
      editandoToken = false;
      renderPanel(true);
    };
    $('#token-guardar').onclick = guardar;
    $('#token-nombre').onkeydown = e => { if(e.key === 'Enter') guardar(); };
  }
  if($('#token-borrar')) $('#token-borrar').onclick = () => borrarToken(seleccion);
  if($('#token-dueno-ok')) $('#token-dueno-ok').onclick = () => {
    const nuevo = $('#token-dueno').value;
    if(nuevo && nuevo !== t.duenoUid) editarToken(seleccion, {duenoUid: nuevo});
  };
}
