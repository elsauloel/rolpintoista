<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testeos pendientes — Rol Pintoísta</title>
<link rel="icon" type="image/svg+xml" href="../comun/icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45;
  min-height:100vh;padding-bottom:40px;
}
a{color:var(--brass)}
button{font-family:inherit;color:inherit;font-size:15px;cursor:pointer}
.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--paper);border-radius:var(--r);
  padding:9px 14px;font-weight:700;font-size:14px;
}
.btn:active{background:var(--line)}
.btn.chico{padding:6px 11px;font-size:12.5px;font-weight:600}
.btn.ghost{background:transparent}

header{
  position:sticky;top:0;z-index:5;padding:14px 18px;
  background:rgba(15,12,14,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)
}
header h1{font-size:18px;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:12.5px}

main{max-width:760px;margin:0 auto;padding:16px 16px 0}

.resumen{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;
  padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
}
.resumen .num{font-family:"Space Mono",monospace;font-weight:700;color:var(--brass);font-size:15px}
.barra{flex:1;min-width:120px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.barra > div{height:100%;background:var(--bottle)}
.filtros{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.filtros label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

.area{margin-bottom:22px}
.area h2{
  font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-soft);
  display:flex;justify-content:space-between;gap:8px
}
.area h2 .cnt{font-family:"Space Mono",monospace;font-weight:400}

.item{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line);border-left:3px solid var(--copper);background:var(--panel);
  border-radius:var(--r);padding:10px 12px;margin-bottom:8px
}
.item.probado{border-left-color:var(--bottle);opacity:.6}
.item input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--bottle);flex:none}
.item .cuerpo{flex:1;min-width:0}
.item .txt{white-space:pre-wrap;word-break:break-word}
.item.probado .txt{text-decoration:line-through;text-decoration-color:var(--muted)}
.item .fecha{font-size:11px;color:var(--muted);font-family:"Space Mono",monospace;margin-top:3px}

.vacio{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px}
footer.acciones{max-width:760px;margin:8px auto 0;padding:0 16px;display:flex;justify-content:flex-end}
</style>
</head>
<body>

<header>
  <h1>🧪 Testeos pendientes</h1>
  <p>Mecánicas nuevas para ir probando en mesa. Se tilda acá mismo, en este navegador — no hace falta cuenta ni conexión.</p>
</header>

<main>
  <div class="resumen">
    <span class="num" id="resumen-num">0 / 0</span>
    <div class="barra"><div id="resumen-barra" style="width:0%"></div></div>
    <div class="filtros">
      <label><input type="checkbox" id="chk-probados"> Mostrar los ya probados</label>
    </div>
  </div>
  <div id="lista"></div>
</main>
<footer class="acciones">
  <button type="button" class="btn chico ghost" id="btn-reset">↺ Destildar todo</button>
</footer>

<script>
/* =========================================================
   TESTEOS PENDIENTES
   Checklist personal (sin Firebase, sin login) de mecánicas nuevas que
   ameritan probarse en mesa. TESTEOS_BASE es la fuente de la verdad: se
   edita a mano en este archivo. Regla del dueño (2026-09-22): acá solo se
   suman ítems cuando él lo pide explícitamente en la conversación, nunca
   de manera automática por cada cambio — ver testeos/CLAUDE.md.
   El tildado ("probado") vive en localStorage de cada navegador: es
   personal, no se comparte entre dispositivos ni con nadie más.

   (2026-09-22: las "notas pendientes" de repasos/auditorías/ideas se
   mudaron a preguntas-diseno/preguntas.html, pestaña "🎨 Desarrollo
   creativo" — ahí sí es compartido con Enro y Seba, que también pueden
   proponer. Esta herramienta queda solo para el checklist de testeo
   personal del dueño.)
   ========================================================= */

// Áreas en el orden en que se muestran (no alfabético: las más relevantes primero).
const AREA_ORDEN = [
  'Estados alterados', 'Mapa — combate', 'Botín y fin de combate', 'Trampas',
  'Creeps y habilidades', 'Mapa — sigilo y niebla', 'Mapa — tokens y mapas',
  'Ficha', 'Mesa', 'Tienda',
];

const TESTEOS_BASE = [
  // --- 2026-09-22 ---
  {id:'ataque-oportunidad', area:'Mapa — combate', fecha:'2026-09-22', texto:'Ataque de oportunidad: al alejar un token de un rival adyacente, sale un aviso rojo en la Mesa ("posible ataque de oportunidad"), sin frenar el movimiento.'},
  {id:'visualizador-rango', area:'Mapa — combate', fecha:'2026-09-22', texto:'Visualizador de rango: botones 📏 (Rango, Destreza) y 🔮 (Rango de casteo, Especial) junto a los lentes, con atajos R y Shift+R, muestran el área alrededor de tu propio token.'},
  {id:'sangrado-acumula', area:'Estados alterados', fecha:'2026-09-22', texto:'Sangrado ahora se acumula: reaplicarlo suma +1 al daño por turno en vez de duplicar el estado.'},
  {id:'armadura-rota-reemplaza-arruinada', area:'Estados alterados', fecha:'2026-09-22', texto:'Armadura arruinada se eliminó: lo que la aplicaba (3 hachas del catálogo y "Disolver la armadura") ahora aplica Armadura rota por stacks — revisar que los números de cada arma tengan sentido.'},
  {id:'cansado-exhausto-recalibrado', area:'Estados alterados', fecha:'2026-09-22', texto:'Cansado (2/3 de los No2 máximos) y Exhausto (1/3 del máximo natural, se puede sumar a Cansado) con los números recalibrados.'},
  {id:'stun-2-turnos', area:'Estados alterados', fecha:'2026-09-22', texto:'Stun dura 2 turnos y la Evasión falla directo, sin tirar el dado.'},
  {id:'pajaritos-creeps', area:'Estados alterados', fecha:'2026-09-22', texto:'Pajaritos (mitad de PdG y Evasión) ahora también afecta a los creeps desde GM Tools, no solo a la ficha.'},
  {id:'wildcards-contador', area:'Ficha', fecha:'2026-09-22', texto:'Contador de Wildcards en el panel de Exp y Job: valor y máximo, ambos editables a mano, sin fórmula todavía.'},
  {id:'mesa-color-estados', area:'Mesa', fecha:'2026-09-22', texto:'La Mesa muestra en rojo o verde cuándo una tirada estuvo afectada por un estado alterado (perjuicio o beneficio) y lo aclara en el texto.'},
  // --- 2026-09-21 ---
  {id:'batalla-terminada-publicar', area:'Botín y fin de combate', fecha:'2026-09-21', texto:'Batalla terminada: el GM ajusta y publica el botín, y recién ahí se les abre la ventana a los jugadores.'},
  {id:'botin-sumar-mochila', area:'Botín y fin de combate', fecha:'2026-09-21', texto:'Botín: "Sumar a la mochila" (se lo lleva el primero que llega) y Comparar; si la mochila está llena, el ítem no entra; los trofeos se apilan y no se equipan.'},
  {id:'botin-reporte-xp-dde', area:'Botín y fin de combate', fecha:'2026-09-21', texto:'Reporte de fin de combate: un valor de XP/DDE que aplica a todos los jugadores + un extra individual opcional.'},
  {id:'botin-boton-despojos', area:'Botín y fin de combate', fecha:'2026-09-21', texto:'El botón 🎁 Despojos (mapa, ficha, GM Tools) solo se habilita cuando el botín está publicado.'},
  {id:'proteccion-jefe', area:'Creeps y habilidades', fecha:'2026-09-21', texto:'Un creep marcado "Jefe" es automáticamente inmune a Stun y tiene +1 Res.Mg.'},
  {id:'grupos-vinculados-mapa', area:'Mapa — tokens y mapas', fecha:'2026-09-21', texto:'Grupos de creeps vinculados a un mapa guardado: traer todos los tokens de un grupo entero de un solo botón (★ en el menú 🎭).'},
  {id:'tienda-abierta-cerrada', area:'Tienda', fecha:'2026-09-21', texto:'Interruptor del GM para abrir/cerrar la tienda; comprar y vender ajustan el precio y solo funcionan con la tienda abierta.'},
  // --- 2026-09-20 ---
  {id:'trampas-ocultas-disparo', area:'Trampas', fecha:'2026-09-20', texto:'Trampas ocultas en el mapa: se disparan solas al pisarlas, tiran su daño automático y avisan en rojo en la Mesa.'},
  {id:'trampas-percepcion-aumentada', area:'Trampas', fecha:'2026-09-20', texto:'Percepción aumentada: al quedar justo al lado de una trampa (sin pisarla) se corta el movimiento y pide una tirada de percepción.'},
  {id:'trampas-automaticas-habilidad', area:'Trampas', fecha:'2026-09-20', texto:'Las habilidades de creep que son trampas (ej. las de los presets base) colocan la trampa sola en el mapa, oculta, al usarlas.'},
  {id:'catalogo-habilidades-armas-naturales', area:'Creeps y habilidades', fecha:'2026-09-20', texto:'Catálogo base de 321 habilidades de creep y 66 armas naturales con efectos al golpear, con filtros y escalado por nivel.'},
  {id:'habilidad-lenta-cooldown-inicial', area:'Creeps y habilidades', fecha:'2026-09-20', texto:'Una habilidad "lenta" arranca con el cooldown ya activo al crear el creep, traerlo de la biblioteca o reiniciar el combate (revisar que no se pueda usar de arranque).'},
  {id:'tokens-automaticos-importar', area:'Mapa — tokens y mapas', fecha:'2026-09-20', texto:'Importar tokens (de un grupo de creeps) y Tokens de jugadores: crean los tokens que faltan de un tirón, salteando los que ya están en el mapa.'},
  // --- 2026-09-19 ---
  {id:'sigilo-completo', area:'Mapa — sigilo y niebla', fecha:'2026-09-19', texto:'Sigilo completo: cono de detección, zona de alerta con tirada por paso, ruptura automática al entrar en el cono de un rival, y el corte de ruta al detectarte.'},
  {id:'niebla-de-guerra', area:'Mapa — sigilo y niebla', fecha:'2026-09-19', texto:'Niebla de guerra: doble capa (nunca visto / ya descubierto), visión compartida de todo el grupo, y el modo "Como jugador" del GM.'},
  {id:'bloqueo-parry-arma', area:'Mapa — combate', fecha:'2026-09-19', texto:'Bloqueo y Parry con el arma equipada: Parry cuesta Tipo÷2 fijo, Bloqueo depende del peso del arma, y la Mesa recuerda qué arma se usó.'},
  {id:'alertas-rojas-sin-nitros', area:'Mapa — combate', fecha:'2026-09-19', texto:'Forzar una acción sin No2 suficientes (atacar, habilidad, consumir, sigilo) deja un aviso rojo en la Mesa y gasta hasta 0, sin quedar en negativo.'},
  {id:'ctrl-z-deshacer-movimiento', area:'Mapa — combate', fecha:'2026-09-19', texto:'Ctrl+Z deshace el último movimiento o giro propio: repone el token, los No2 gastados y la niebla que ese paso había descubierto.'},
  {id:'vida-recibe-danio-vs-hp-directo', area:'Mapa — combate', fecha:'2026-09-19', texto:'Vida desde el HUD del mapa: modo "Recibe daño" (resta la Defensa sola) contra el modo "HP directo" de siempre.'},
];

const LS_KEY = 'testeos-probados';
function leerProbados(){
  try{ return new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); }catch(e){ return new Set(); }
}
function guardarProbados(set){
  try{ localStorage.setItem(LS_KEY, JSON.stringify([...set])); }catch(e){ /* modo privado: no persiste, no pasa nada */ }
}
let probados = leerProbados();
let mostrarProbados = false;

const $ = s => document.querySelector(s);

function render(){
  const total = TESTEOS_BASE.length;
  const hechos = TESTEOS_BASE.filter(t => probados.has(t.id)).length;
  $('#resumen-num').textContent = `${hechos} / ${total} probado${hechos === 1 ? '' : 's'}`;
  $('#resumen-barra').style.width = (total ? Math.round(hechos / total * 100) : 0) + '%';

  const porArea = new Map();
  TESTEOS_BASE.forEach(t => {
    if(!mostrarProbados && probados.has(t.id)) return;
    if(!porArea.has(t.area)) porArea.set(t.area, []);
    porArea.get(t.area).push(t);
  });

  const areas = [...porArea.keys()].sort((a, b) => {
    const ia = AREA_ORDEN.indexOf(a), ib = AREA_ORDEN.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  if(!areas.length){
    $('#lista').innerHTML = `<div class="vacio">${mostrarProbados ? 'Todavía no hay nada acá.' : '¡Ya está todo tildado! Tildá "Mostrar los ya probados" para verlo.'}</div>`;
    return;
  }

  $('#lista').innerHTML = areas.map(area => {
    const items = porArea.get(area).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    const hechosArea = items.filter(t => probados.has(t.id)).length;
    return `<div class="area">
      <h2>${area} <span class="cnt">${hechosArea}/${items.length}</span></h2>
      ${items.map(t => `
        <label class="item${probados.has(t.id) ? ' probado' : ''}" data-id="${t.id}">
          <input type="checkbox" ${probados.has(t.id) ? 'checked' : ''}>
          <span class="cuerpo">
            <span class="txt">${t.texto}</span>
            <div class="fecha">${t.fecha}</div>
          </span>
        </label>`).join('')}
    </div>`;
  }).join('');
}

document.addEventListener('change', e => {
  const label = e.target.closest('.item');
  if(!label) return;
  const id = label.dataset.id;
  if(e.target.checked) probados.add(id); else probados.delete(id);
  guardarProbados(probados);
  render();
});

$('#chk-probados').onchange = e => { mostrarProbados = e.target.checked; render(); };
$('#btn-reset').onclick = () => {
  if(!confirm('¿Destildar todo? No borra la lista, solo el progreso de este navegador.')) return;
  probados = new Set();
  guardarProbados(probados);
  render();
};

render();
</script>
</body>
</html>
