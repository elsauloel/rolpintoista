<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Tiendas</title>
<link rel="icon" type="image/svg+xml" href="../comun/icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    repeating-linear-gradient(0deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    radial-gradient(120% 80% at 50% 0%, #1C1418 0%, var(--ink) 70%);
  color:var(--paper); font-family:"Space Grotesk", system-ui, sans-serif; font-size:14px; line-height:1.4;
  min-height:100vh;
}
input,select,textarea,button{font-family:inherit;color:inherit}
input,textarea,select{
  min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:var(--r);
  color:var(--paper);padding:5px 7px;width:100%;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
button{cursor:pointer;background:none;border:none;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1400px;margin:0 auto;padding:22px 18px 90px}

.hero{
  border:1px solid var(--line);border-top:3px solid var(--copper);
  background:linear-gradient(180deg, rgba(201,133,69,.10), rgba(0,0,0,0) 60%), var(--panel);
  padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:60;box-shadow:0 8px 16px -8px rgba(0,0,0,.5);
}
.hero h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(22px,3vw,32px);margin:0;letter-spacing:-.01em}
.hero .eyebrow{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero > div:first-child{padding-left:40px} /* lugar para el menú del sitio (comun/menu-sitio.js) */

.btn{
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);white-space:nowrap
}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08;font-weight:700}
.btn.primary:hover{background:var(--brass)}
.btn.ghost{color:var(--muted)}
.btn.del{color:var(--danger);border-color:rgba(212,87,78,.4)}   /* Solicitar eliminar (2026-10-08: como en la ficha y GM Tools) */
.btn.del:hover{border-color:var(--danger);background:rgba(212,87,78,.12)}
.btn.publicar{background:#2E6B57;border-color:#2E6B57;color:#EAF3E6;font-weight:700}
.btn.publicar:hover{background:#3A8770;border-color:#3A8770}

.panel{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-top:16px}
.panel-titulo{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:12px}
.tienda-nombre-input{
  background:transparent;border:1px solid transparent;border-bottom:1px solid var(--line-soft);
  color:var(--paper);font-size:20px;font-weight:700;padding:2px 4px;width:100%;margin-bottom:12px
}
.tienda-nombre-input:hover{border-color:var(--line)}
.tienda-nombre-input:focus{outline:none;border-color:var(--copper);background:var(--panel2)}
.controles{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:5px;flex:0 1 260px}
.campo label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.campo select{width:100%}
.hint{color:var(--muted);font-size:12.5px}

.resumen{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.resumen-chip{
  font-family:"Space Mono",monospace;font-size:11px;border:1px solid var(--line);
  border-radius:99px;padding:4px 12px;color:var(--paper)
}
.resumen-chip b{color:var(--brass)}

.cat-grouphead{
  font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--copper);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)
}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:10px}
.cat-card{
  display:flex;flex-direction:column;gap:5px;border:1px solid var(--line-soft);
  background:var(--panel2);padding:9px 11px
}
.cat-card-titulo{display:flex;align-items:flex-start;gap:7px;justify-content:space-between}
.cat-nombre{font-weight:700;font-size:13px;min-width:0}
.cat-tier-badge{
  font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid;font-weight:700;flex:none;white-space:nowrap;margin-top:1px
}
.cat-meta{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
.cat-mods{font-family:"Space Mono",monospace;font-size:10.5px;line-height:1.5}
.cat-mods .mod-plus{color:var(--absenta)}
.cat-mods .mod-minus{color:var(--danger)}
.cat-detalle{font-size:11.5px;color:var(--muted);line-height:1.45}
.cat-card-pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.view-title{font-family:"Fraunces",serif;font-size:19px;font-weight:600;margin-bottom:10px}
.view-lines{display:flex;flex-direction:column;gap:4px}
.view-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-soft);padding-bottom:3px}
.view-label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.view-value{font-size:13px;text-align:right}
.view-detalle{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--paper)}
.view-detalle .view-label{display:block;margin-bottom:4px}
.view-wrap{display:flex;gap:14px;margin-bottom:12px}
.view-image-wrap{
  width:150px;flex:none;aspect-ratio:1/1;background:#0B0708;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-soft);overflow:hidden
}
.view-image{width:100%;height:100%;object-fit:contain}
.view-image-empty{font-family:"Fraunces",serif;font-size:12px;color:var(--muted);text-align:center;padding:0 8px}
.view-info{flex:1;min-width:0}
.view-wrap .view-title{margin-bottom:9px}
/* Texto de color del ítem: se lee como una cita, no como una regla. */
.view-narrativa{font-style:italic;color:#B9A796}
@media(max-width:480px){.view-wrap{flex-direction:column}.view-image-wrap{width:100%}}
.cat-precio{color:var(--brass);font-weight:700}
.cat-garantizado{
  font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--absenta);border:1px solid var(--absenta);border-radius:99px;padding:1px 7px;align-self:flex-start
}

.cat-card{position:relative}
.cat-quitar{
  position:absolute;top:6px;right:6px;width:20px;height:20px;line-height:1;
  border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:13px;
  display:none;align-items:center;justify-content:center
}
.cat-card:hover .cat-quitar{display:flex}
.cat-quitar:hover{border-color:var(--danger);color:var(--danger);background:rgba(212,87,78,.14)}
.cat-precio-viejo{text-decoration:line-through;color:var(--muted);margin-right:6px;font-weight:400}

.barra-edicion{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line-soft)
}
.ajuste-grupo{display:flex;align-items:center;gap:6px}
.ajuste-grupo label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ajuste-grupo input{width:74px;text-align:center;flex:none}
.ajuste-preset{
  font-family:"Space Mono",monospace;font-size:10px;border:1px solid var(--line);
  border-radius:99px;padding:4px 9px;color:var(--muted)
}
.ajuste-preset:hover{border-color:var(--copper);color:var(--paper)}
.ajuste-preset.activo{border-color:var(--copper);background:rgba(201,133,69,.18);color:var(--paper);font-weight:700}

.agregar-fila{
  border:1px solid var(--line-soft);
  background:var(--panel2);padding:7px 10px;margin-bottom:6px
}
.agregar-fila-top{display:flex;align-items:center;gap:10px}
.agregar-fila .cat-nombre{flex:1}
.agregar-fila .cat-detalle{margin-top:5px}
.scrim{position:fixed;inset:0;background:rgba(8,5,7,.78);display:none;z-index:80;padding:24px;overflow:hidden}
.scrim.open{display:flex;align-items:flex-start;justify-content:center}
.modal{
  max-width:820px;width:100%;margin:0 auto;border:1px solid var(--line);border-top:3px solid var(--copper);
  background:var(--panel);max-height:100%;display:flex;flex-direction:column;min-height:0
}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);gap:10px;flex:none}
.modal header h3{margin:0;font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.modal .body{padding:15px;overflow:auto;flex:1 1 auto;min-height:0}
.modal .filtros{display:flex;flex-wrap:wrap;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line-soft);flex:none}
.modal .filtros input{flex:2 1 220px}
.modal .filtros select{flex:1 1 150px;width:auto}
.agregar-filtros{padding:10px 15px;border-bottom:1px solid var(--line)}
.secciones-elegir{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:34px}
.secciones-elegir label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:13px}
.secciones-elegir input{width:auto;margin:0}
.preview-secs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;border-bottom:1px solid var(--line)}
.preview-sec{padding:8px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:rgba(255,255,255,.03);color:inherit;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.preview-sec:hover{background:rgba(255,255,255,.07)}
.preview-sec.on{background:rgba(201,133,69,.22);border-color:var(--copper);color:#fff}
.preview-sec b{font-family:"Space Mono",monospace;font-size:11px;font-weight:400;opacity:.75;margin-left:4px}
.iconbtn{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:var(--r)}
.iconbtn:hover{border-color:var(--copper);color:var(--paper)}
.modal footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 15px;border-top:1px solid var(--line);flex:none}   /* flex-wrap (2026-10-08): si los botones no entran, bajan de renglón en vez de salirse de la ventana */

/* Formulario de "Crear ítem nuevo" — mismo patrón que datos/catalogo-editor.html. */
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seccion{border:1px solid var(--line-soft);background:rgba(0,0,0,.15);padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.seccion-titulo{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper)}
.modrow{display:grid;grid-template-columns:1fr 90px 30px;gap:6px;align-items:center;margin-bottom:6px}
.modrow .mini{border:1px solid var(--line);background:none;color:var(--muted);border-radius:var(--r);height:100%}
.modrow .mini:hover{border-color:var(--danger);color:var(--danger)}
label.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
input[type=checkbox]{width:auto}

/* Estado de la tienda publicada (lo que ven los jugadores ahora). */
.publicacion{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  border:1px solid var(--line);border-left:3px solid var(--muted);background:var(--panel);
  padding:10px 16px;margin-top:16px;font-size:13px
}
.publicacion.al-dia{border-left-color:var(--absenta)}
.publicacion.pendiente{border-left-color:var(--brass)}
.publicacion b{color:var(--brass)}

/* Tiendas guardadas (una por lugar o vendedor). */
.guardar-fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.guardar-fila .tienda-nombre-input{flex:1 1 280px;width:auto;margin-bottom:0}
#guardar-estado.pendiente{color:var(--brass)}
#guardar-estado.al-dia{color:var(--absenta)}
.guardada-fila{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line-soft);
  background:var(--panel2);padding:8px 11px;margin-bottom:6px
}
.guardada-fila.abierta{border-color:var(--copper)}
.guardada-info{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.guardada-info b{font-size:14px}

/* Rerolear un ítem puntual: al lado de "Ver". */
.cat-card-pie .acciones{display:flex;gap:6px}

.bloqueo{
  position:fixed;inset:0;background:rgba(8,5,7,.92);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px
}
.bloqueo div{max-width:460px;border:1px solid var(--line);border-top:3px solid var(--copper);background:var(--panel);padding:20px;font-size:14px;line-height:1.5}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--panel);
  border:1px solid var(--copper);padding:10px 16px;font-family:"Space Mono",monospace;font-size:11.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:95;max-width:90vw;text-align:center
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div>
      <div class="eyebrow" id="tienda-identidad">🏪 Generador de tiendas</div>
      <h1>Generador de Tiendas</h1>
    </div>
    <div class="hero-right">
      <span class="hint" id="fb-estado">Conectando con la partida…</span>
      <a class="btn ghost" id="link-mapa" href="../vtt-hexgrid/mapa.html" target="_blank" rel="noopener" title="Abrir el mapa de la partida en una pestaña nueva">🗺 Mapa</a>
      <a class="btn ghost" id="link-gmtools" href="gm-tools.html">⚔ GM Tools</a>
    </div>
  </div>

  <div class="publicacion" id="publicacion" style="display:none">
    <span id="publicacion-texto"></span>
    <button class="btn" id="btn-abrir-tienda" style="display:none" title="Abrir o cerrar la tienda a los jugadores (el botón 🏪 de su ficha)">🔴 Cerrada · abrir</button>
    <button class="btn ghost" id="btn-cerrar-tienda" style="display:none" title="Los jugadores dejan de ver la tienda en su ficha">Retirar tienda</button>
  </div>

  <div class="panel">
    <div class="panel-titulo">Generar tienda</div>
    <div class="controles">
      <div class="campo">
        <label for="f-tamano">Tamaño del vendedor</label>
        <select id="f-tamano">
          <option value="ambulante">Vendedor ambulante</option>
          <option value="pueblito" selected>Pueblito</option>
          <option value="aldea">Aldea</option>
          <option value="ciudad">Ciudad</option>
          <option value="capital">Capital</option>
        </select>
      </div>
      <div class="campo">
        <label>Secciones <span class="hint" title="Una tienda, tres habitaciones (P179): el jugador ve una pestaña por sección. Tildá las que abre este lugar.">?</span></label>
        <div class="secciones-elegir" id="f-secciones">
          <label title="Guerra pesada: armas de Tipo 8 o más, escudos, armadura rígida, cascos y guanteletes"><input type="checkbox" data-seccion="herreria" checked> ⚒ Herrería</label>
          <label title="Cuero, madera y cuerda: armas a distancia y livianas (Tipo 4 y 6), cuero, botas, cinturones, mochilas y trampas"><input type="checkbox" data-seccion="talabarteria" checked> 🧵 Talabartería</label>
          <label title="Lo mágico: consumibles, varitas y báculos, orbes, anillos y piezas de caster"><input type="checkbox" data-seccion="bazar" checked> ✨ Bazar arcano</label>
        </div>
      </div>
      <div class="campo" style="flex:0 1 200px">
        <label for="f-nivel">Nivel de la zona</label>
        <select id="f-nivel" title="Qué calidades salen: Común en niveles 1–2, Buena en 3–4, Rara en 5 (y siempre una chance chica de un golpe de suerte)">
          <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
        </select>
      </div>
      <button class="btn primary" id="btn-generar" title="Arma una tienda nueva, sin nombre propio">Generar tienda</button>
      <button class="btn" id="btn-regenerar" disabled title="Vuelve a sortear todo el stock de la tienda abierta, sin cambiarle el nombre ni sacarla de la lista de guardadas">Regenerar</button>
      <button class="btn publicar" id="btn-publicar" disabled title="La publica y la abre: los jugadores ya pueden entrar (el interruptor la cierra un rato)">Publicar y abrir tienda</button>
      <button class="btn ghost" id="btn-personalizada">+ Tienda personalizada</button>
      <button class="btn ghost" id="btn-simular" title="Genera 200 tiendas con este tipo, tamaño y nivel y muestra qué sale en promedio y en el peor caso">🧪 Simular 200</button>
    </div>
    <div class="hint" id="hint-tamano" style="margin-top:10px"></div>
    <div id="simulacion" style="display:none;margin-top:12px"></div>
  </div>

  <div class="panel" id="panel-guardadas" style="display:none">
    <div class="panel-titulo">Tiendas guardadas</div>
    <div id="guardadas-lista"></div>
  </div>

  <div class="panel" id="panel-preview" style="display:none">
    <div class="panel-titulo">Vista previa del catálogo</div>
    <div class="guardar-fila">
      <input type="text" id="tienda-nombre" class="tienda-nombre-input" placeholder="Nombre de la tienda" maxlength="60">
      <span class="hint" id="guardar-estado"></span>
      <button class="btn" id="btn-guardar-tienda" style="display:none" title="Guardar esta tienda en la lista, para volver a abrirla igual más adelante">💾 Guardar tienda</button>
    </div>
    <div class="resumen" id="preview-resumen"></div>
    <div class="barra-edicion">
      <div class="ajuste-grupo">
        <label for="preview-buscar">Buscar</label>
        <input type="text" id="preview-buscar" placeholder="Buscar por nombre…" style="width:200px">
      </div>
      <div class="ajuste-grupo">
        <label for="f-ajuste">Al comprar</label>
        <input type="number" id="f-ajuste" step="5" value="0" title="Lo que pagan los jugadores: porcentaje sobre el precio de catálogo (negativo descuenta, positivo recarga)">
        <span class="hint">%</span>
      </div>
      <div class="ajuste-grupo" title="Si está tildado, los jugadores ven el botón 🔧 Reparación en esta tienda y pueden reparar la durabilidad de su equipo pagando por punto">
        <label for="f-herrero">🔨 Herrero</label>
        <input type="checkbox" id="f-herrero">
        <label for="f-precio-rep" style="margin-left:6px">Repara a</label>
        <input type="number" id="f-precio-rep" step="1" min="0" value="1" style="width:60px" title="DDE que cobra por cada punto de durabilidad reparado">
        <span class="hint">DDE/punto</span>
      </div>
      <div class="ajuste-grupo" title="Por defecto los jugadores solo pueden COMPRAR (con el carrito). Si tildás esto, ven además el botón «Agregar a mochila» que les da los ítems gratis (útil para repartir equipo inicial o premios)">
        <label for="f-gratis">🎁 Permitir agregar gratis</label>
        <input type="checkbox" id="f-gratis">
      </div>
      <div class="ajuste-grupo">
        <label for="f-ajuste-venta">Al vender</label>
        <input type="number" id="f-ajuste-venta" step="5" value="0" title="Lo que cobran los jugadores al venderle a esta tienda (ítems y despojos): porcentaje sobre el valor de venta. Negativo paga menos, positivo paga más.">
        <span class="hint">%</span>
      </div>
      <button type="button" class="ajuste-preset" data-ajuste="-25">-25%</button>
      <button type="button" class="ajuste-preset" data-ajuste="-10">-10%</button>
      <button type="button" class="ajuste-preset activo" data-ajuste="0">Normal</button>
      <button type="button" class="ajuste-preset" data-ajuste="10">+10%</button>

/* ---------- Catálogo (espejo del de ficha.html, sin imágenes) ---------- */
/* La tienda publicada guarda solo ids: la ficha resuelve nombre, imagen y
   stats desde su propio catálogo, así este archivo no duplica esos datos. */
/* Espejo del catálogo de ficha.html, sin las imágenes: son 1022 de los
   1060 KB del bloque original y acá no aportan nada. Todo lo demás
   (peso, dado, daño fijo, mods, detalle) viene completo para poder
   mostrar la misma tarjeta que ve el jugador. */
const GRUPOS = [
  {id:'con', label:'Con', full:'Constitución', color:'#C4485A', derived:[
    {id:'resmg', label:'Res.Esp', full:'Resistencia especial'},
    {id:'rescc', label:'Res.CC', full:'Resistencia al crowd control'},
    {id:'hpmax', label:'Hp.Max', full:'Health points máximos'}]},
  {id:'fue', label:'Fue', full:'Fuerza', color:'#D07B3A', derived:[
    {id:'dmg', label:'Dmg', full:'Damage'},
    {id:'potencia', label:'Potencia', full:'Potencia'},
    {id:'crgmax', label:'Crg.Max', full:'Carga máxima'}]},
  {id:'agl', label:'Agi', full:'Agilidad', color:'#8FB84F', derived:[
    {id:'eva', label:'Eva', full:'Evasión'},
    {id:'ini', label:'Iniciativa', full:'Iniciativa'},
    {id:'mov', label:'Mov', full:'Movimiento'}]},
  {id:'des', label:'Des', full:'Destreza', color:'#4FA88C', derived:[
    {id:'rng', label:'Rng', full:'Rango'},
    {id:'pdg', label:'PdG', full:'Probabilidad de golpe'},
    {id:'critpot', label:'Crít.Pot.', full:'Crítico potente'},
    {id:'crit', label:'Crít.Frec.', full:'Crítico frecuente'},
    {id:'parry', label:'Parry', full:'Parry'},
    {id:'percepcion', label:'Percep.', full:'Percepción'}]},
  {id:'esp', label:'Esp', full:'Especial', color:'#9B7BD4', derived:[
    {id:'pdgmg', label:'PdG.Esp', full:'Probabilidad de golpe especial'},
    {id:'resm', label:'Res.Mt', full:'Resistencia mental'},
    {id:'bonos', label:'Bonos', full:'Bonos'}]},
];
const EXTRA = [
  {id:'def', label:'Defensa', full:'Defensa'},
  {id:'accionesmax', label:'Acciones máx.', full:'Acciones máximas por turno'},
  {id:'tipo1', label:'Tipo 4', full:'Resistencia a crítico — armas Tipo 4 (d4)'},
  {id:'tipo2', label:'Tipo 6', full:'Resistencia a crítico — armas Tipo 6 (d6)'},
  {id:'tipo3', label:'Tipo 8', full:'Resistencia a crítico — armas Tipo 8 (d8)'},
  {id:'tipo4', label:'Tipo 10', full:'Resistencia a crítico — armas Tipo 10 (d10)'},
  {id:'tipo5', label:'Tipo 12', full:'Resistencia a crítico — armas Tipo 12 (d12, explosivos/modernas)'},
];
const STAT_LIST = [...GRUPOS.flatMap(g=>g.derived), ...EXTRA];

const DADOS_ARMA = [4, 6, 8, 10, 12];
const MOD_TARGETS = [...GRUPOS.map(g => ({id:g.id, label:g.label, full:g.full})), ...STAT_LIST];
const STAT_LABEL = Object.fromEntries(MOD_TARGETS.map(s=>[s.id,s.label]));
const TIPOS_IDS = ['tipo1','tipo2','tipo3','tipo4','tipo5'];

const CATEGORIAS = [
  {id:'', label:'— elegir categoría —'},
  {id:'arma_1m', label:'Arma de una mano', arma:true},
  {id:'arma_2m', label:'Arma de dos manos', arma:true},
  {id:'escudo_1m', label:'Escudo de una mano', defensivo:true},
  {id:'escudo_2m', label:'Escudo de dos manos', defensivo:true},
  {id:'armadura_blanda', label:'Armadura blanda', defensivo:true},
  {id:'armadura_rigida', label:'Armadura rígida', defensivo:true},
  {id:'manos', label:'Manos', defensivo:true},
  {id:'piernas', label:'Piernas', defensivo:true},
  {id:'cabeza', label:'Cabeza', defensivo:true},
  {id:'pies', label:'Pies', defensivo:true},
  {id:'cinturon', label:'Cinturón', defensivo:true},
  {id:'anillos', label:'Anillos'},
  {id:'otros', label:'Otros'},
  {id:'consumibles', label:'Consumibles'},
];
const CATEGORIA_LABEL = Object.fromEntries(CATEGORIAS.map(c=>[c.id, c.label]));
const ES_ARMA = catId => CATEGORIAS.find(c=>c.id===catId)?.arma === true;

// El catálogo de fábrica vive en comun/catalogo.js (una sola copia para todas las herramientas).
const CATALOGO = structuredClone(CATALOGO_BASE).filter(i => !i.archivo);   // sin lo archivado (2026-10-06): lo viejo no se publica
// Lo subido por el grupo (comun/items-subidos.js), sumado a CATALOGO en su lugar al entrar.
function cargarItemsSubidosTienda(){
  return ItemsSubidos.cargar().then(l => { const lista = ItemsSubidos.mezclar(CATALOGO, l); CATALOGO.splice(0, CATALOGO.length, ...lista); });
}

const TIER_COLOR = {'Común':'#9A867E', 'Buena Calidad':'#A8C256', 'Raro':'#5B8DBE', 'Excepcional':'#E0A458', 'Legendario':'#9B7BD4', 'A definir':'#D4574E'};
const TIERS = ['Común', 'Buena Calidad', 'Raro', 'Excepcional', 'Legendario'];

/* La regla de cómo se arma una tienda vive en comun/generador-tiendas.js (2026-10-06, docs/rework-tiendas.md): tamaño y nivel de la zona,
   recetas por tipo, variedad garantizada, escasez y golpe de suerte. Acá, solo la pantalla. */
const G = GeneradorTiendas;
const TAMANOS = G.TAMANOS;
// Las secciones que abre (P179): las tres = «Tienda de pueblito»; una sola = «Herrería de pueblito».
const seccionesLabel = secs => (secs || []).map(k => G.SECCIONES[k] ? `${G.SECCIONES[k].icono} ${G.SECCIONES[k].label}` : '').filter(Boolean).join(' · ');
const seccionesElegidas = () => [...document.querySelectorAll('#f-secciones [data-seccion]')].filter(c => c.checked).map(c => c.dataset.seccion);
function nombreAutoTienda(tamano, secs){
  const tamanoLabel = ((TAMANOS[tamano] || {}).label || '').toLowerCase();
  if(secs && secs.length === 1 && G.SECCIONES[secs[0]]) return tamano === 'ambulante' ? `${G.SECCIONES[secs[0]].label} ambulante` : `${G.SECCIONES[secs[0]].label} de ${tamanoLabel}`;
  return tamano === 'ambulante' ? 'Vendedor ambulante' : `Tienda de ${tamanoLabel}`;
}

// ES_ARMA sale de CATEGORIAS, arriba, junto con el catálogo.
const ES_DEFENSA = t => t.startsWith('escudo') || t.startsWith('armadura')
  || t === 'cabeza' || t === 'manos' || t === 'piernas' || t === 'pies' || t === 'cinturon' || t === 'mochila';

// Los escudos son categoría propia: tienen su porcentaje aparte del resto
// del equipo defensivo. Accesorios (anillos) es aparte de todo: no entra
// en el reparto normal por tamaño/categoría — solo lo llena la chance de
// ítem mágico (ver generarTienda).
function rubroDe(item){
  if(item.consumible || item.tipoItem === 'consumibles') return 'consumibles';
  if(ES_ARMA(item.tipoItem)) return 'armas';
  if(item.tipoItem.startsWith('escudo')) return 'escudos';
  if(item.tipoItem === 'anillos') return 'accesorios';
  if(ES_DEFENSA(item.tipoItem)) return 'defensivos';
  return 'otros';
}

const RUBRO_LABEL = {armas:'Armas', defensivos:'Defensa', escudos:'Escudos', accesorios:'Accesorios', consumibles:'Consumibles', otros:'Otros'};
const RUBRO_ORDEN = ['consumibles', 'armas', 'defensivos', 'escudos', 'accesorios', 'otros'];

function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

function armaDanoTxt(i){
  if(!ES_ARMA(i.tipoItem)) return '';
  // Un arma especial (varita, báculo) hace el daño de su hechizo, no el de un arma física (2026-10-08: decía «1d8» en todas).
  if(i.especial){
    const e = i.especial, modos = Array.isArray(e.modos) ? e.modos : [e];
    const d = [...new Set(modos.map(m => String(m.dano || '').trim()).filter(Boolean))];
    return d.length ? d.join(' o ') + (e.sumaEspecial ? ' + Ef.Esp' : '') : '';
  }
  const dados = Math.max(1, num(i.peso) || 1) + Math.max(0, num(i.danoAmplificado));
  const tipo = num(i.tipoDado) || 8;
  const fijo = num(i.danoFijo);
  return `${dados}d${tipo}${fijo ? ` + ${fmt(fijo)}` : ''}`;
}

function defValorDe(i){
  return (i.mods||[]).filter(m => m.stat === 'def').reduce((a,m) => a + num(m.val), 0);
}

function modsResumenHtml(item){
  const mods = (item.mods || []).filter(m => m.stat && m.stat !== 'def');
  if(!mods.length) return '';
  return mods.map(m => {
    const label = TIPOS_IDS.includes(m.stat) ? `Res.Crít. ${STAT_LABEL[m.stat]}` : (STAT_LABEL[m.stat] || m.stat);
    const val = num(m.val);
    const suf = '';
    const cls = val > 0 ? 'mod-plus' : val < 0 ? 'mod-minus' : '';
    return `<span class="${cls}">${esc(label)} ${val>0?'+':''}${fmt(val)}${suf}</span>`;
  }).join(' · ');
}

// Daño máximo posible del arma. Lo que no es arma da 0 y queda fuera del
// orden por daño (ver ordenarItems).
function danoDe(item){
  if(!ES_ARMA(item.tipoItem)) return 0;
  return Math.max(1, num(item.peso) || 1) * (num(item.tipoDado) || 8) + num(item.danoFijo);
}

function entero(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

function generarTienda(tamano, secciones, nivel){
  const r = G.generar({secciones, tamano, nivel, catalogo: CATALOGO});
  return {
    tamano: r.tamano,
    tamanoLabel: TAMANOS[r.tamano].label,
    secciones: r.secciones,
    categoriaLabel: seccionesLabel(r.secciones),
    nivel: r.nivel,
    nombre: nombreAutoTienda(r.tamano, r.secciones),
    generado: new Date().toISOString(),
    ajustePrecio: 0,
    ...(r.secciones.includes('herreria') ? {herrero: true} : {}),   // con Herrería, repara (se puede apagar)
    garantizados: r.garantizados,
    gondola: r.gondola,   // los gastables de la góndola (P181): 3 de cada uno al publicar
    items: r.items,
  };
}

/* 🧪 Simulador (2026-10-06): 200 tiendas con el tipo, tamaño y nivel elegidos → promedio y peor caso por parte, calidad y efecto escaso. */
function simularTiendas(){
  const secciones = seccionesElegidas(), tamano = $('#f-tamano').value, nivel = Number($('#f-nivel').value) || 1;
  if(!secciones.length){ toast('Tildá al menos una sección'); return; }
  const r = G.simular({secciones, tamano, nivel, catalogo: CATALOGO, veces: 200});
  const fila = (k, v, extra) => `<tr><td>${esc(k)}</td><td style="text-align:right">${fmt(v.prom)}</td><td style="text-align:right">${fmt(v.min)}–${fmt(v.max)}</td>${extra !== undefined ? `<td style="text-align:right">${extra}</td>` : '<td></td>'}</tr>`;
  const tabla = (titulo, filas) => `<table style="border-collapse:collapse;font-size:12.5px;min-width:260px"><thead><tr><th style="text-align:left">${titulo}</th><th>Promedio</th><th>Mín–máx</th><th></th></tr></thead><tbody>${filas}</tbody></table>`;
  const partes = Object.entries(r.parte).filter(([, v]) => v.max > 0).map(([k, v]) => fila(G.PARTE_LABEL[k] || k, v)).join('');
  const tiers = TIERS.map(t => fila(t, r.tier[t], `en el ${r.conTier[t]} % de las tiendas`)).join('');
  const etiq = Object.entries(r.etiqueta).filter(([, v]) => v.max > 0).map(([k, v]) => fila(k, v)).join('');
  $('#simulacion').style.display = '';
  $('#simulacion').innerHTML = `<div class="hint" style="margin-bottom:6px"><b>${r.veces} tiendas</b> · ${esc(seccionesLabel(secciones))} · ${esc(TAMANOS[tamano].label)} · nivel ${nivel}:
      ${fmt(r.items.prom)} ítems (${fmt(r.items.min)}–${fmt(r.items.max)}, con el stock fijo) · partes defensivas distintas ${fmt(r.defDistintas.min)}–${fmt(r.defDistintas.max)}
      <button class="btn ghost" id="btn-simular-cerrar" style="padding:2px 8px;margin-left:8px">✕</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">${tabla('Parte', partes)}${tabla('Calidad', tiers)}${tabla('Efecto escaso', etiq || '<tr><td colspan="4">ninguno</td></tr>')}</div>`;
  $('#btn-simular-cerrar').onclick = () => { $('#simulacion').style.display = 'none'; };
}

/* ---------- Orden ---------- */

const ORDENES = {
  categoria: {label:'Categoría', cmp:(a,b) => RUBRO_ORDEN.indexOf(rubroDe(a)) - RUBRO_ORDEN.indexOf(rubroDe(b)) || TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier) || a.nombre.localeCompare(b.nombre, 'es')},
  nombre:    {label:'Nombre',    cmp:(a,b) => a.nombre.localeCompare(b.nombre, 'es')},
  precio:    {label:'Precio',    cmp:(a,b) => num(a.precioCompra) - num(b.precioCompra)},
  peso:      {label:'Peso',      cmp:(a,b) => num(a.peso) - num(b.peso)},
  rareza:    {label:'Rareza',    cmp:(a,b) => TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier)},
  dano:      {label:'Daño',     valor: danoDe},
  defensa:   {label:'Defensa',  valor: defValorDe},
};

let ordenActual = 'categoria';
let ordenDesc = false;

// Ordenar por categoría mantiene los grupos (es la vista de siempre);
// cualquier otro criterio pasa a lista plana, porque agrupado no se puede
// ver "lo más caro de la tienda" de un vistazo.
function ordenarItems(items){
  const def = ORDENES[ordenActual] || ORDENES.categoria;
  const porNombre = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
  // Criterio con valor propio (daño, defensa): lo que no aplica queda
  // al final siempre, no mezclado entre los que sí tienen.
  if(def.valor){
    const con = items.filter(i => def.valor(i) > 0);
    const sin = items.filter(i => def.valor(i) <= 0).sort(porNombre);
    con.sort((a, b) => def.valor(a) - def.valor(b) || porNombre(a, b));
    if(ordenDesc) con.reverse();
    return [...con, ...sin];
  }
  const orden = items.slice().sort((a, b) => def.cmp(a, b) || porNombre(a, b));
  return ordenDesc ? orden.reverse() : orden;
}

// Entre los consumibles: primero el stock fijo de la tienda actual (si
// hay), después los legacy (Poción de HP, Antídoto, etc. — "los de
// siempre"), después el resto — sea cual sea el criterio de orden
// elegido. No toca el orden de nada que no sea consumible: el sort es
// estable y el comparador da 0 apenas uno de los dos no es consumible.
function conLegacyPrimero(items, garantizados){
  const rango = it => (garantizados && garantizados.has(it.id)) ? 0 : (it.legacy ? 1 : 2);
  return items.slice().sort((a, b) => {
    if(rubroDe(a) !== 'consumibles' || rubroDe(b) !== 'consumibles') return 0;
    return rango(a) - rango(b);
  });
}

function renderOrdenControles(){
  const sel = $('#f-orden');
  if(sel && !sel.dataset.listo){
    sel.innerHTML = Object.entries(ORDENES).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
    sel.dataset.listo = '1';
  }
  if(sel) sel.value = ordenActual;
  const b = $('#btn-orden-dir');
  if(b){
    b.textContent = ordenDesc ? '↓ Mayor a menor' : '↑ Menor a mayor';
    b.title = ordenDesc ? 'Cambiar a menor a mayor' : 'Cambiar a mayor a menor';
  }
}

/* ---------- Vista previa ---------- */

let tiendaActual = null;

// El ajuste es de la tienda entera, no de cada ítem: se guarda como
// porcentaje y el precio final se calcula al vuelo, así el catálogo base
// nunca se toca y cambiar el porcentaje no pierde el precio original.
function ajusteActual(){
  return tiendaActual ? (Number(tiendaActual.ajustePrecio) || 0) : 0;
}

function precioAjustado(item){
  const pct = ajusteActual();
  if(!pct) return Number(item.precioCompra) || 0;
  return Math.max(1, Math.round((Number(item.precioCompra) || 0) * (1 + pct / 100)));
}

function precioHtmlDe(item){
  const pct = ajusteActual();
  const final = precioAjustado(item);
  return pct
    ? `<span class="cat-precio-viejo">${fmt(item.precioCompra)}</span><b class="cat-precio">${fmt(final)} DDE</b>`
    : `<b class="cat-precio">${fmt(final)} DDE</b>`;
}

// Misma tarjeta que ve el jugador en el catálogo del fabricante, para que
// el GM arme la tienda mirando exactamente lo mismo que va a ver la mesa.
function itemCardHtml(item, esGarantizado){
  const color = TIER_COLOR[item.tier] || TIER_COLOR['Común'];
  const dano = armaDanoTxt(item);
  const defVal = defValorDe(item);
  const statTxt = dano ? `Daño ${dano}` : (defVal ? `Defensa ${defVal>0?'+':''}${fmt(defVal)}` : '');
  const modsHtml = modsResumenHtml(item);
  return `<div class="cat-card">
    <button type="button" class="cat-quitar" data-quitar="${esc(item.id)}" title="Quitar de la tienda">×</button>
    <div class="cat-card-titulo">
      <div class="cat-nombre">${esc(item.nombre)}</div>
      <div class="cat-tier-badge" style="color:${color};border-color:${color};background:${color}22">${esc(item.tier)}</div>
    </div>
    <div class="cat-meta">${precioHtmlDe(item)} · Peso ${fmt(num(item.peso))}${statTxt ? ` · ${esc(statTxt)}` : ''}${item.consumible?` · consumible${item.curahp?` (${num(item.curahp)>0?'+':''}${fmt(num(item.curahp))} HP)`:''}`:''}</div>
    ${modsHtml ? `<div class="cat-mods">${modsHtml}</div>` : ''}
    ${ItemCorto.grillaHtml(item)}
    <div class="cat-card-pie">
      ${esGarantizado ? '<span class="cat-garantizado">Clásico · siempre</span>' : (tiendaActual.gondola || []).includes(item.id) ? `<span class="cat-garantizado" title="Gastable de la góndola: ${G.UNIDADES_GONDOLA} unidades al publicar">🧺 Góndola ×${G.UNIDADES_GONDOLA}</span>` : '<span></span>'}
      <span class="acciones">
        ${esGarantizado ? '' : `<button type="button" class="iconbtn" data-reroll="${esc(item.id)}" title="Cambiar este ítem por otro del mismo rubro, sorteado con las rarezas de la tienda">🎲 Otro</button>`}
        <button type="button" class="iconbtn" data-ver="${esc(item.id)}">Ver</button>
      </span>
    </div>
  </div>`;
}

/* ---------- Tarjeta completa (Ver) ---------- */

function verItem(id){
  const item = CATALOGO.find(it => it.id === id);
  if(!item) return;
  const linea = (label, val) => (val === '' || val === null || val === undefined)
    ? '' : `<div class="view-line"><span class="view-label">${esc(label)}</span><span class="view-value">${esc(val)}</span></div>`;
  const L = [];
  if(item.tipoItem) L.push(linea('Categoría', CATEGORIA_LABEL[item.tipoItem] || item.tipoItem));
  L.push(linea('Rareza', item.tier));
  if(ES_ARMA(item.tipoItem)){
    L.push(linea('Tipo de dado', `d${num(item.tipoDado) || 8}`));
    if(EfectosGolpe.lista(item.efectosGolpe).length) L.push(linea('Al golpear', EfectosGolpe.resumenLista(item.efectosGolpe)));
    L.push(linea('Daño', armaDanoTxt(item)));
  }
  const defVal = defValorDe(item);
  if(defVal) L.push(linea('Defensa', `${defVal>0?'+':''}${fmt(defVal)}`));
  L.push(linea('Peso', fmt(num(item.peso))));
  if(Combatiente.durTexto(item)) L.push(linea('Durabilidad', Combatiente.durTexto(item)));   // variable de diseño (comun/combatiente.js)
  if(item.ranuras !== undefined) L.push(linea('Ranuras', fmt(num(item.ranuras))));
  const pct = ajusteActual();
  L.push(linea('Precio de lista', `${fmt(num(item.precioCompra))} DDE`));
  if(pct) L.push(linea(pct < 0 ? `Precio con ${Math.abs(pct)}% de descuento` : `Precio con ${pct}% de recargo`, `${fmt(precioAjustado(item))} DDE`));
  if(item.consumible) L.push(linea('Consumible', `${fmt(num(item.unidades) || 1)} unidad(es)${item.curahp ? ` · ${num(item.curahp)>0?'+':''}${fmt(num(item.curahp))} HP al consumir` : ''}`));
  TIPOS_IDS.forEach(tid => {
    const m = (item.mods || []).find(x => x.stat === tid);
    if(m && num(m.val)) L.push(linea(`Res. crítico ${STAT_LABEL[tid]}`, `${num(m.val)>0?'+':''}${fmt(num(m.val))}`));
  });
  const otros = (item.mods || []).filter(m => m.stat && m.stat !== 'def' && !TIPOS_IDS.includes(m.stat));
  if(otros.length) L.push(linea('Otros modificadores', otros.map(m => `${STAT_LABEL[m.stat]||m.stat} ${num(m.val)>0?'+':''}${fmt(num(m.val))}`).join(', ')));

  const enTienda = tiendaActual && tiendaActual.items.includes(item.id);
  $('#ver-titulo').textContent = item.nombre;
  $('#ver-body').innerHTML = `
    <div class="view-wrap">
      <div class="view-image-wrap">${item.imagen ? `<img src="${esc(item.imagen)}" class="view-image" alt="">` : `<span class="view-image-empty">Sin imagen</span>`}</div>
      <div class="view-info">
        <div class="view-title">${esc(item.nombre)}</div>
        <div class="view-lines">${L.filter(Boolean).join('')}</div>
      </div>
    </div>
    ${ItemCorto.verHtml(item)}
    ${(item.descripcionNarrativa||'').trim() ? `<div class="view-detalle view-narrativa">${esc(item.descripcionNarrativa)}</div>` : ''}
  `;
  const btn = $('#ver-toggle');
  btn.textContent = enTienda ? 'Quitar de la tienda' : 'Agregar a la tienda';
  btn.className = enTienda ? 'btn ghost' : 'btn primary';
  btn.dataset.item = item.id;
  btn.style.display = tiendaActual ? '' : 'none';
  $('#scrim-ver').classList.add('open');
}

let seccionVista = '';   // la pestaña que mira el GM en la vista previa ('' = todas)
function renderPreview(){
  if(!tiendaActual){ $('#panel-preview').style.display = 'none'; return; }
  $('#tienda-nombre').value = tiendaActual.nombre || '';
  const garantizados = new Set(tiendaActual.garantizados);
  const items = tiendaActual.items.map(id => CATALOGO.find(it => it.id === id)).filter(Boolean);
  const textoBusqueda = ($('#preview-buscar').value || '').trim().toLowerCase();
  // Las pestañas (dueño, 2026-10-08: «el GM también debe poder ver las pestañas por separado, para visualizar y editar mejor cada una»):
  // «Todas» y una por sección, con cuántos tiene. Con una sección abierta, la lista y «+ Agregar ítems» son de esa sección.
  const nSec = {};
  items.forEach(it => { const k = G.seccionDe(it); nSec[k] = (nSec[k] || 0) + 1; });
  const abiertas = G.seccionesDe(tiendaActual);
  const pestanas = G.SECCIONES_ORDEN.filter(k => nSec[k] || abiertas.includes(k));
  if(seccionVista && !pestanas.includes(seccionVista)) seccionVista = '';
  $('#preview-secciones').innerHTML = `<button type="button" class="preview-sec${seccionVista ? '' : ' on'}" data-preview-sec="">Todas<b>${fmt(items.length)}</b></button>` +
    pestanas.map(k => `<button type="button" class="preview-sec${seccionVista === k ? ' on' : ''}" data-preview-sec="${k}" title="${esc(G.SECCIONES[k].detalle)}">${G.SECCIONES[k].icono} ${esc(G.SECCIONES[k].label)}<b>${fmt(nSec[k] || 0)}</b></button>`).join('');
  const deVista = seccionVista ? items.filter(it => G.seccionDe(it) === seccionVista) : items;
  const visibles = textoBusqueda ? deVista.filter(it => it.nombre.toLowerCase().includes(textoBusqueda)) : deVista;

  const porTier = {};
  items.forEach(it => porTier[it.tier] = (porTier[it.tier] || 0) + 1);
  const pct = ajusteActual();
  $('#preview-resumen').innerHTML =
    `<span class="resumen-chip">${esc(tiendaActual.tamanoLabel)}</span>` +
    (tiendaActual.categoriaLabel ? `<span class="resumen-chip">${esc(tiendaActual.categoriaLabel)}</span>` : '') +
    `<span class="resumen-chip">Ítems <b>${fmt(items.length)}</b></span>` +
    (pct ? `<span class="resumen-chip" style="border-color:${pct < 0 ? 'var(--absenta)' : 'var(--brass)'}">${pct < 0 ? 'Descuento' : 'Recargo'} <b>${fmt(Math.abs(pct))}%</b></span>` : '') +
    TIERS.filter(t => porTier[t]).map(t =>
      `<span class="resumen-chip" style="border-color:${TIER_COLOR[t]}">${esc(t)} <b>${fmt(porTier[t])}</b></span>`
    ).join('');

  let html = '';
  if(!visibles.length){
    html = `<div class="hint">Ningún ítem de la tienda coincide con "${esc(textoBusqueda)}".</div>`;
  }else if(ordenActual === 'categoria' && seccionVista){
    // Una sola sección: con los mismos separadores que ve el jugador (qué es; los consumibles, en clásicos, pergaminos, pociones, utilería, trampas).
    FiltroCatalogo.agrupar(ordenarItems(visibles), {orden: 'categoria'}).forEach(g => {
      html += `<div class="cat-grouphead">${esc(g.label)} · ${fmt(g.items.length)}</div>`;
      html += `<div class="cat-grid">${g.items.map(it => itemCardHtml(it, garantizados.has(it.id))).join('')}</div>`;
    });
  }else if(ordenActual === 'categoria'){
    // Por sección (P179): lo que el jugador va a ver en cada pestaña.
    G.SECCIONES_ORDEN.forEach(k => {
      const delSec = conLegacyPrimero(ordenarItems(visibles.filter(it => G.seccionDe(it) === k)), garantizados);
      if(!delSec.length) return;
      html += `<div class="cat-grouphead" style="font-size:12px">${G.SECCIONES[k].icono} ${esc(G.SECCIONES[k].label)} · ${fmt(delSec.length)}</div>`;
      html += `<div class="cat-grid">${delSec.map(it => itemCardHtml(it, garantizados.has(it.id))).join('')}</div>`;
    });
  }else{
    const orden = conLegacyPrimero(ordenarItems(visibles), garantizados);
    html += `<div class="cat-grouphead">${esc(ORDENES[ordenActual].label)} · ${fmt(orden.length)}</div>`;
    html += `<div class="cat-grid">${orden.map(it => itemCardHtml(it, garantizados.has(it.id))).join('')}</div>`;
  }
  renderOrdenControles();
  $('#preview-lista').innerHTML = html;
  $('#panel-preview').style.display = '';
}

function quitarItem(id){
  if(!tiendaActual) return;
  const item = CATALOGO.find(it => it.id === id);
  tiendaActual.items = tiendaActual.items.filter(x => x !== id);
  // Si sacan un consumible del stock fijo se respeta: es la tienda del GM.
  tiendaActual.garantizados = (tiendaActual.garantizados || []).filter(x => x !== id);
  tiendaActual.gondola = (tiendaActual.gondola || []).filter(x => x !== id);
  tiendaCambio();
  renderAgregarLista();
  toast(`${item ? item.nombre : 'Ítem'} fuera de la tienda`);
}

function agregarItem(id){
  if(!tiendaActual) return;
  if(tiendaActual.items.includes(id)){ toast('Ese ítem ya está en la tienda'); return; }
  const item = CATALOGO.find(it => it.id === id);
  tiendaActual.items.push(id);
  if(item && G.gastable(item)){ tiendaActual.gondola = tiendaActual.gondola || []; tiendaActual.gondola.push(id); }   // un gastable va a la góndola
  tiendaCambio();
  renderAgregarLista();
  toast(`${item ? item.nombre : 'Ítem'} agregado`);
}

// Cambia un ítem puntual por otro del mismo rubro que no esté en la
// tienda. La rareza se vuelve a tirar con la tabla del tamaño (en una
// tienda personalizada, que no tiene tamaño, se busca la misma rareza).
// Un consumible "de los de siempre" se cambia por otro de esos, si queda.
function rerollItem(id){
  if(!tiendaActual) return;
  const idx = tiendaActual.items.indexOf(id);
  const viejo = CATALOGO.find(it => it.id === id);
  if(idx < 0 || !viejo) return;
  const nuevo = G.otro({tienda: tiendaActual, id, catalogo: CATALOGO});   // la misma parte, otra calidad con el nivel de la tienda, con la escasez
  if(!nuevo){ toast(`No queda otro ítem de ${G.PARTE_LABEL[G.parteDe(viejo)] || 'esa parte'} para cambiar`); return; }
  tiendaActual.items[idx] = nuevo.id;
  if((tiendaActual.gondola || []).includes(id)) tiendaActual.gondola = tiendaActual.gondola.map(x => x === id ? nuevo.id : x);
  tiendaCambio();
  renderAgregarLista();
  toast(`${viejo.nombre} → ${nuevo.nombre} (${nuevo.tier})`);
}

/* ---------- Crear ítem nuevo ----------
   Ítem hecho a mano por el GM para esta tienda, no viene del catálogo.
   Se suma a CATALOGO en memoria para que se vea en la vista previa como
   cualquier otro. No hace falta subirlo a ningún catálogo compartido: la
   tienda guardada y publicada lleva los datos completos de sus ítems
   (itemsDatos), así que la ficha del jugador lo puede mostrar y comprar. */
let itemNuevoDraft = null;

function defaultsItemNuevo(){
  return {
    nombre:'', tier:'Común', tipoItem:'', peso:0, ranuras:1, precioCompra:0, detalle:'', descripcionNarrativa:'',
    tipoDado:8, danoFijo:0, danoAmplificado:0, armaDeRango:false,
    unidades:1, cargaMax:0, curahp:0,
    mods:[],
  };
}

function modsHtmlItemNuevo(){
  const d = itemNuevoDraft;
  return `<div id="itemnuevo-mods-lista">${(d.mods || []).map((m, i) => `
    <div class="modrow">
      <select data-modstat="${i}">
        <option value="">— elegir stat —</option>
        ${MOD_TARGETS.map(s => `<option value="${s.id}" ${m.stat === s.id ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}
      </select>
      <input type="number" step="any" data-modval="${i}" value="${esc(m.val)}">
      <button type="button" class="iconbtn mini" data-modrm="${i}">×</button>
    </div>`).join('')}</div>
    <button type="button" class="iconbtn" id="itemnuevo-mod-add" style="align-self:flex-start">+ Modificador</button>`;
}

function drawItemNuevo(){
  const d = itemNuevoDraft;
  const esArma = ES_ARMA(d.tipoItem);
  const esCons = d.tipoItem === 'consumibles';
  let html = `
    <div class="seccion">
      <div class="f"><label>Nombre</label><input type="text" id="itemnuevo-nombre" value="${esc(d.nombre)}" placeholder="ej. Espada del alba"></div>
      <div class="f2">
        <div class="f"><label>Categoría</label>
          <select id="itemnuevo-tipo">${CATEGORIAS.map(c => `<option value="${c.id}" ${d.tipoItem === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select>
        </div>
        <div class="f"><label>Tier</label>
          <select id="itemnuevo-tier">${TIERS.map(t => `<option value="${esc(t)}" ${d.tier === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="f3">
        <div class="f"><label>Peso</label><input type="number" step="any" id="itemnuevo-peso" value="${esc(d.peso)}"></div>
        <div class="f"><label>Ranuras (mochila)</label><input type="number" step="1" id="itemnuevo-ranuras" value="${esc(d.ranuras)}"></div>
        <div class="f"><label>Precio (DDE)</label><input type="number" step="any" id="itemnuevo-precio" value="${esc(d.precioCompra)}"></div>
      </div>
      <div class="f"><label>Detalle (lo que lee el jugador)</label><textarea id="itemnuevo-detalle" rows="3">${esc(d.detalle)}</textarea></div>
      <div class="f"><label>Descripción narrativa</label><textarea id="itemnuevo-narrativa" rows="2">${esc(d.descripcionNarrativa)}</textarea></div>
    </div>`;

  if(esArma){
    html += `
    <div class="seccion">
      <div class="seccion-titulo">Arma</div>
      <div class="f3">
        <div class="f"><label>Dado</label>
          <select id="itemnuevo-dado">${DADOS_ARMA.map(v => `<option value="${v}" ${num(d.tipoDado) === v ? 'selected' : ''}>d${v}</option>`).join('')}</select>
        </div>
        <div class="f"><label>Daño fijo</label><input type="number" step="any" id="itemnuevo-fijo" value="${esc(d.danoFijo)}"></div>
        <div class="f"><label>Daño amplificado</label><input type="number" step="1" min="0" id="itemnuevo-amplificado" value="${esc(d.danoAmplificado)}"></div>
      </div>
      <label class="chk"><input type="checkbox" id="itemnuevo-derango" ${d.armaDeRango ? 'checked' : ''}> Arma de rango</label>
    </div>`;
  }
  if(esCons){
    html += `
    <div class="seccion">
      <div class="seccion-titulo">Consumible</div>
      <div class="f3">
        <div class="f"><label>Unidades</label><input type="number" step="1" id="itemnuevo-unidades" value="${esc(d.unidades)}"></div>
        <div class="f"><label>Cargas por unidad</label><input type="number" step="1" id="itemnuevo-cargamax" value="${esc(d.cargaMax)}"></div>
        <div class="f"><label>Cura HP</label><input type="number" step="any" id="itemnuevo-curahp" value="${esc(d.curahp)}"></div>
      </div>
    </div>`;
  }
  html += `
    <div class="seccion">
      <div class="seccion-titulo">Modificadores (mientras esté equipado)</div>
      ${modsHtmlItemNuevo()}
    </div>`;
  $('#itemnuevo-body').innerHTML = html;
}

function leerCamposItemNuevo(){
  const d = itemNuevoDraft;
  d.nombre = $('#itemnuevo-nombre').value;
  d.tipoItem = $('#itemnuevo-tipo').value;
  d.tier = $('#itemnuevo-tier').value;
  d.peso = num($('#itemnuevo-peso').value);
  d.ranuras = num($('#itemnuevo-ranuras').value);
  d.precioCompra = num($('#itemnuevo-precio').value);
  d.detalle = $('#itemnuevo-detalle').value;
  d.descripcionNarrativa = $('#itemnuevo-narrativa').value;
  // Guardado por existencia: si el select de categoría acaba de cambiar,
  // la sección arma/consumible vieja todavía está en el DOM (o la nueva
  // todavía no se dibujó) — leer sin chequear tira null.
  if(ES_ARMA(d.tipoItem) && $('#itemnuevo-dado')){
    d.tipoDado = num($('#itemnuevo-dado').value) || 8;
    d.danoFijo = num($('#itemnuevo-fijo').value);
    d.danoAmplificado = Math.max(0, num($('#itemnuevo-amplificado').value));
    d.armaDeRango = $('#itemnuevo-derango').checked;
  }
  if(d.tipoItem === 'consumibles' && $('#itemnuevo-unidades')){
    d.unidades = num($('#itemnuevo-unidades').value) || 1;
    d.cargaMax = num($('#itemnuevo-cargamax').value);
    d.curahp = num($('#itemnuevo-curahp').value);
  }
}

// Formulario común: solo para consumibles (el resto va por el asistente).
function abrirItemNuevoFormulario(inicial){
  itemNuevoDraft = {...defaultsItemNuevo(), ...(inicial || {}), tipoItem: 'consumibles'};
  drawItemNuevo();
  $('#scrim-item-nuevo').classList.add('open');
}

function slugItemNuevo(s){
  return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'item';
}

function crearItemNuevo(){
  leerCamposItemNuevo();
  const d = itemNuevoDraft;
  if(!d.nombre.trim()){ toast('Poné un nombre antes de crear el ítem'); return; }
  if(!d.tipoItem){ toast('Elegí una categoría antes de crear el ítem'); return; }
  agregarItemCreado(d);
  $('#scrim-item-nuevo').classList.remove('open');
}

function agregarItemCreado(d){
  let id = 'new-' + slugItemNuevo(d.nombre);
  if(CATALOGO.some(it => it.id === id)) id += '-' + Math.random().toString(36).slice(2, 6);
  const nuevo = {
    id, nombre: d.nombre.trim(), tier: d.tier, imagen: '', tipoItem: d.tipoItem,
    peso: d.peso, ranuras: d.ranuras, precioCompra: d.precioCompra,
    consumible: d.tipoItem === 'consumibles', legacy: false, escalaTipos: ESCALA_TIPOS,
    mods: (d.mods || []).filter(m => m.stat),
    detalle: d.detalle, descripcionNarrativa: d.descripcionNarrativa,
    ...(ES_ARMA(d.tipoItem) ? {tipoDado: d.tipoDado, danoFijo: d.danoFijo, danoAmplificado: d.danoAmplificado, armaDeRango: d.armaDeRango, efectosGolpe: d.efectosGolpe || []} : {}),
    ...(String(d.equipoEstadoNombre || '').trim() ? {equipoEstadoNombre: d.equipoEstadoNombre, equipoEstadoHpTurno: d.equipoEstadoHpTurno, equipoEstadoDetalle: d.equipoEstadoDetalle} : {}),
    ...(d.tipoItem === 'consumibles' ? {unidades: d.unidades, cargaMax: d.cargaMax, curahp: d.curahp} : {}),
  };
  CATALOGO.push(nuevo);
  agregarItem(nuevo.id);
  toast(`"${nuevo.nombre}" creado y agregado a la tienda`);
}

/* Ítems de la tienda: asistente paso a paso (comun/asistente-item.js), con
   los textos pensados para lo que ve el jugador en la tienda. */
function abrirItemNuevo(inicial){
  if(!tiendaActual){ toast('Primero generá una tienda'); return; }
  const ini = inicial || {};
  AsistenteItem.abrir({
    contexto: 'tienda',
    nuevo: true,
    titulo: 'Ítem nuevo para la tienda',
    draft: {tier: 'Común', peso: 0, ...ini},
    paso: 0,
    stats: MOD_TARGETS.map(s => ({id: s.id, label: s.label})),
    tiers: TIERS,
    conNarrativa: true,
    conPrecio: true,
    conRanuras: true,
    conEstadoEquipar: true,
    precioTxt: d => ajusteActual() ? `En esta tienda, con el ajuste de ${ajusteActual() > 0 ? '+' : ''}${ajusteActual()}%, se vende a <b>${precioAjustado(d)}</b> DDE.` : '',
    ejemplos: (tipoItem, t) => CATALOGO.filter(it => ES_ARMA(it.tipoItem) && num(it.tipoDado) === t).map(it => it.nombre),
    textoGuardar: 'Crear y agregar a la tienda',
    onConsumible: d => abrirItemNuevoFormulario(d),
    onGuardar: d => { agregarItemCreado(AsistenteItem.fusionar(defaultsItemNuevo(), d)); return true; },
  });
}

// ---------- Agregar ítems: el filtro (comun/filtro-catalogo.js, 2026-10-08: una sola pieza para todos lados; acá suma «Efecto escaso» y «De dónde sale»).
// Se filtra entre lo del catálogo que todavía no está en la tienda, con el precio ajustado de la tienda.
let agregarFiltro = null;
function filtroAgregar(){
  if(!agregarFiltro) agregarFiltro = FiltroCatalogo.crear($('#agregar-filtros'), {
    base: () => { if(!tiendaActual) return []; const en = new Set(tiendaActual.items); return CATALOGO.filter(it => !en.has(it.id) && (!seccionVista || G.seccionDe(it) === seccionVista)); },   // con una pestaña abierta, lo de esa sección
    precio: it => precioAjustado(it), statLabel: st => STAT_LABEL[st] || st, etiquetas: true, origen: true, clave: 'agregar',
    alCambiar: () => renderAgregarLista()});
  return agregarFiltro;
}
function renderAgregarLista(){
  if(!tiendaActual) return;
  const enTienda = new Set(tiendaActual.items);
  const fa = filtroAgregar();
  fa.actualizar();   // lo que queda para agregar cambia al agregar o sacar
  const candidatos = fa.filtrar();

  if(!candidatos.length){
    $('#agregar-lista').innerHTML = `<div class="hint">No quedan ítems del catálogo que coincidan${enTienda.size ? ' y no estén ya en la tienda' : ''}.</div>`;
    return;
  }
  $('#agregar-lista').innerHTML = candidatos.map(it => {
    const color = TIER_COLOR[it.tier] || TIER_COLOR['Común'];
    const dano = armaDanoTxt(it);
    const defVal = defValorDe(it);
    const statTxt = dano ? `Daño ${dano}` : (defVal ? `Def ${defVal>0?'+':''}${fmt(defVal)}` : '');
    return `<div class="agregar-fila">
      <div class="agregar-fila-top">
        <div class="cat-nombre">${esc(it.nombre)}${it.soloBotin ? ' <span title="Equipo con nombre propio de un creep: se consigue derrotándolo; no sale solo en las tiendas generadas" style="font-size:11px;opacity:.75">· 🎒 solo botín</span>' : ''}</div>
        <div class="cat-tier-badge" style="color:${color};border-color:${color};background:${color}22">${esc(it.tier)}</div>
        <span class="cat-meta">${fmt(precioAjustado(it))} DDE · Peso ${fmt(num(it.peso))}${statTxt ? ` · ${esc(statTxt)}` : ''}</span>
        <button type="button" class="iconbtn" data-ver="${esc(it.id)}">Ver</button>
        <button type="button" class="iconbtn" data-agregar="${esc(it.id)}">Agregar</button>
      </div>
      ${ItemCorto.grillaHtml(it)}
    </div>`;
  }).join('');
}

function abrirAgregar(){
  if(!tiendaActual){ toast('Primero generá una tienda'); return; }
  $('#agregar-titulo').textContent = seccionVista ? `Agregar ítems a ${G.SECCIONES[seccionVista].icono} ${G.SECCIONES[seccionVista].label}` : 'Agregar ítems a la tienda';   // la pestaña que mira el GM
  filtroAgregar().limpiar();
  renderAgregarLista();
  $('#scrim-agregar').classList.add('open');
  setTimeout(() => { try{ $('#agregar-filtros [data-fc="buscar"]').focus(); }catch(e){} }, 30);
}

function ajusteVentaActual(){
  return tiendaActual ? (Number(tiendaActual.ajusteVenta) || 0) : 0;
}
function aplicarAjusteVenta(pct){
  if(!tiendaActual) return;
  const n = Math.max(-90, Math.min(500, Math.round(Number(pct) || 0)));
  tiendaActual.ajusteVenta = n;
  $('#f-ajuste-venta').value = n;
  tiendaCambio();
}

function aplicarAjuste(pct){
  if(!tiendaActual) return;
  const n = Math.max(-90, Math.min(500, Math.round(Number(pct) || 0)));
  tiendaActual.ajustePrecio = n;
  $('#f-ajuste').value = n;
  marcarAjuste();
  tiendaCambio();
  renderAgregarLista();
}

function marcarAjuste(){
  const n = ajusteActual();
  $('#f-ajuste').value = n;
  $('#f-ajuste-venta').value = ajusteVentaActual();
  $('#f-herrero').checked = !!(tiendaActual && tiendaActual.herrero);
  $('#f-gratis').checked = !!(tiendaActual && tiendaActual.agregarGratis);
  $('#f-precio-rep').value = tiendaActual && tiendaActual.precioReparacion !== undefined ? tiendaActual.precioReparacion : 1;
  document.querySelectorAll('.ajuste-preset[data-ajuste]').forEach(b =>
    b.classList.toggle('activo', Number(b.dataset.ajuste) === n));
}

// nueva = "Generar tienda": una tienda distinta, sin nombre propio ni lugar
// en la lista de guardadas. Si no, "Regenerar": se vuelve a sortear el
// stock de la tienda abierta, que conserva su nombre, su ajuste de precios
// y su lugar en la lista (queda con cambios sin guardar).
function generar(nueva){
  if(nueva && !confirmarDejarTienda()) return;
  const clave = $('#f-tamano').value;
  const secciones = seccionesElegidas();
  if(!secciones.length){ toast('Tildá al menos una sección'); return; }
  const previa = tiendaActual;
  tiendaActual = generarTienda(clave, secciones, Number($('#f-nivel').value) || 1);
  if(previa && !nueva){   // Regenerar: conserva toda la configuración de la tienda (2026-10-06: antes se perdían venta, herrero, reparación y agregar gratis)
    ['ajustePrecio', 'ajusteVenta', 'herrero', 'precioReparacion', 'agregarGratis', 'guardadaId'].forEach(k => { if(previa[k] !== undefined) tiendaActual[k] = previa[k]; });
    if(previa.nombrePersonalizado){ tiendaActual.nombre = previa.nombre; tiendaActual.nombrePersonalizado = true; }
  }
  marcarAjuste();
  tiendaCambio();
  toast(`Tienda ${nueva ? 'generada' : 'regenerada'} · ${tiendaActual.items.length} ítems`);
}

// Arranca vacía: el usuario la arma ítem por ítem con "+ Agregar ítems",
// en vez de sortearla.
function crearTiendaPersonalizada(){
  if(!confirmarDejarTienda()) return;
  tiendaActual = {
    tamano: 'personalizada',
    tamanoLabel: 'Tienda personalizada',
    categoria: 'personalizada',
    categoriaLabel: '',
    nombre: 'Tienda personalizada',
    generado: new Date().toISOString(),
    ajustePrecio: 0,
    garantizados: [],
    items: [],
  };
  marcarAjuste();
  tiendaCambio();
  toast('Tienda personalizada creada — usá "+ Agregar ítems" para cargarla');
}

function actualizarHint(){

  const cal = G.CALIDAD_POR_NIVEL[G.nivelDe(nivel)];
