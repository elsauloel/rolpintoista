/* ---------- Vista ---------- */

function guardarVista(){
  try{ localStorage.setItem('mapa-vista', JSON.stringify(vista)); }catch(e){}
}
function cargarVista(){
  try{
    const v = JSON.parse(localStorage.getItem('mapa-vista') || 'null');
    if(v && Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.zoom)){ vista = v; return true; }
  }catch(e){}
  return false;
}
function pantallaAMundo(px, py){
  return { x: (px - vista.x) / vista.zoom, y: (py - vista.y) / vista.zoom };
}
function posEvento(e){
  const r = lienzo.getBoundingClientRect();
  return { px: e.clientX - r.left, py: e.clientY - r.top };
}
function centrarEn(x, y){
  vista.x = anchoPx / 2 - x * vista.zoom;
  vista.y = altoPx / 2 - y * vista.zoom;
  guardarVista(); pedirDibujo();
}
function zoomEn(px, py, factor){
  const nuevo = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, vista.zoom * factor));
  const m = pantallaAMundo(px, py);
  vista.zoom = nuevo;
  vista.x = px - m.x * nuevo;
  vista.y = py - m.y * nuevo;
  guardarVista(); pedirDibujo();
}
function centrarEnMios(){
  const mios = [...tokens.values()].filter(t => puedoMover(t) && t.tipo === 'pj');
  const lista = mios.length ? mios : (soyGM ? [...tokens.values()] : []);
  if(!lista.length){ centrarEn(0, 0); return; }
  const cs = lista.map(t => hexCentro(t.col, t.fila));
  centrarEn(cs.reduce((a, c) => a + c.x, 0) / cs.length, cs.reduce((a, c) => a + c.y, 0) / cs.length);
}

function ajustarTamano(){
  const r = lienzo.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  anchoPx = r.width; altoPx = r.height;
  lienzo.width = Math.round(r.width * dpr);
  lienzo.height = Math.round(r.height * dpr);
  // La primera vez que se conoce el tamaño, si no había una vista guardada,
  // se pone la casilla 0,0 en el medio.
  if(!ajustarTamano.hecho && anchoPx > 0){
    ajustarTamano.hecho = true;
    ajustarTamano.habiaVista = cargarVista();
    if(!ajustarTamano.habiaVista) centrarEn(0, 0);
  }
  pedirDibujo();
}

/* ---------- Dibujo ---------- */

let dibujoPedido = false;
function pedirDibujo(){
  if(dibujoPedido) return;
  dibujoPedido = true;
  requestAnimationFrame(() => {
    dibujoPedido = false;
    if(dibujar()) pedirDibujo();
  });
}

// Aura que sigue la grilla: todas las casillas a `radio` pasos o menos del
// token, pintadas juntas, con el borde solo por fuera.
function dibujarAuraHex(centro, aura, z){
  const C = hexACubo(centro);
  const R = aura.radio;
  const borde = [];
  ctx.beginPath();
  for(let dq = -R; dq <= R; dq++){
    for(let dr = Math.max(-R, -dq - R); dr <= Math.min(R, -dq + R); dr++){
      const r = C.r + dr, q = C.q + dq;
      const col = cuboACol(q, r);
      const h = hexCentro(col, cuboAFila(q, r));
      trazarHex(h.x, h.y);
      if(Math.max(Math.abs(dq), Math.abs(dr), Math.abs(dq + dr)) === R) borde.push({h, dq, dr});
    }
  }
  ctx.fillStyle = colorConAlfa(aura.color, 0.18); ctx.fill();
  ctx.beginPath();
  borde.forEach(({h, dq, dr}) => {
    VECINO_LADO.forEach(([vq, vr], i) => {
      const nq = dq + vq, nr = dr + vr;
      if(Math.max(Math.abs(nq), Math.abs(nr), Math.abs(nq + nr)) <= R) return;
      const a = ESQUINAS[i], b = ESQUINAS[(i + 1) % 6];
      ctx.moveTo(h.x + a[0], h.y + a[1]);
      ctx.lineTo(h.x + b[0], h.y + b[1]);
    });
  });
  ctx.strokeStyle = colorConAlfa(aura.color, 0.6); ctx.lineWidth = 2 / z; ctx.stroke();
}

function trazarHex(cx, cy){
  ctx.moveTo(cx + ESQUINAS[0][0], cy + ESQUINAS[0][1]);
  for(let i = 1; i < 6; i++) ctx.lineTo(cx + ESQUINAS[i][0], cy + ESQUINAS[i][1]);
  ctx.closePath();
}

// Vértices de un hexágono centrado en (cx,cy) con radio r (para los tokens,
// que pueden ser más chicos que una casilla cuando comparten lugar).
function verticesHex(cx, cy, r){
  const k = r / HEX;
  return ESQUINAS.map(([ex, ey]) => [cx + ex * k, cy + ey * k]);
}
function trazarPuntos(pts){
  ctx.beginPath();
  pts.forEach(([px, py], i) => { if(i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
  ctx.closePath();
}

// Dónde va cada token: si varios comparten casilla, se acomodan en ronda.
function calcularDisposicion(){
  // Tokens ocultos (solo el GM los prepara y los muestra cuando corresponde):
  // a los jugadores ni se les dibujan ni se pueden tocar.
  const orden = [...tokens.entries()]
    .filter(([, t]) => soyGM || !t.oculto)
    .map(([id, t]) => ({id, t}))
    .sort((a, b) => (a.t.creadoMs - b.t.creadoMs) || (a.id < b.id ? -1 : 1));
  const grupos = new Map();
  orden.forEach(o => {
    if(arrastre && arrastre.id === o.id) return;
    if(rutaPendiente && rutaPendiente.id === o.id) return;
    const k = o.t.col + ',' + o.t.fila;
    if(!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(o);
  });
  const res = [];
  grupos.forEach(grupo => {
    const n = grupo.length;
    grupo.forEach((o, i) => {
      const c = hexCentro(o.t.col, o.t.fila);
      if(n === 1){ res.push({id: o.id, x: c.x, y: c.y, radio: HEX * 0.68, solo: true}); return; }
      const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      const d = HEX * (n > 4 ? 0.45 : 0.38);
      res.push({id: o.id, x: c.x + d * Math.cos(ang), y: c.y + d * Math.sin(ang), radio: HEX * (n > 4 ? 0.3 : 0.42)});
    });
  });
  if(arrastre && tokens.has(arrastre.id)) res.push({id: arrastre.id, x: arrastre.x, y: arrastre.y, radio: HEX * 0.68, solo: true, arrastrado: true});
  // Esperando confirmación: el token queda en el destino de la ruta.
  if(rutaPendiente && tokens.has(rutaPendiente.id)){
    const fin = rutaPendiente.celdas[rutaPendiente.celdas.length - 1];
    const c = hexCentro(fin.col, fin.fila);
    res.push({id: rutaPendiente.id, x: c.x, y: c.y, radio: HEX * 0.68, solo: true});
  }
  return res;
}

// Devuelve true si todavía hay algo animándose.
function dibujar(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0F0C0E';
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  const z = vista.zoom;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * vista.x, dpr * vista.y);

  // Imagen de fondo (la pone el GM), debajo de la grilla.
  const imgFondo = fondo ? imagenLista(fondo.dato) : null;
  if(imgFondo){
    const alto = fondo.ancho * imgFondo.naturalHeight / imgFondo.naturalWidth;
    ctx.drawImage(imgFondo, fondo.x, fondo.y, fondo.ancho, alto);
  }

  // Grilla: solo las casillas que se ven.
  const a = pantallaAMundo(0, 0), b = pantallaAMundo(anchoPx, altoPx);
  const filaMin = Math.floor(a.y / (SQ3 * HEX)) - 1, filaMax = Math.ceil(b.y / (SQ3 * HEX)) + 1;
  const colMin = Math.floor(a.x / (1.5 * HEX)) - 1, colMax = Math.ceil(b.x / (1.5 * HEX)) + 1;
  ctx.beginPath();
  for(let f = filaMin; f <= filaMax; f++){
    for(let c = colMin; c <= colMax; c++){
      const p = hexCentro(c, f);
      trazarHex(p.x, p.y);
    }
  }
  if(!imgFondo){
    ctx.fillStyle = '#17121A';
    ctx.fill();
  }
  ctx.strokeStyle = imgFondo ? 'rgba(15,12,14,.45)' : 'rgba(201,133,69,.28)';
  ctx.lineWidth = 1 / z;
  ctx.stroke();

  // Casilla de origen marcada apenas, como referencia.
  ctx.beginPath(); trazarHex(0, 0);
  ctx.strokeStyle = 'rgba(224,164,88,.45)'; ctx.lineWidth = 2 / z; ctx.stroke();

  // Elementos de terreno/formas: van pegados al piso, debajo de los tokens.
  const trazarCeldas = (celdas) => {
    ctx.beginPath();
    celdas.forEach(c => { const h = hexCentro(c.col, c.fila); trazarHex(h.x, h.y); });
  };
  const bordeCeldas = (celdas) => {
    const set = new Set(celdas.map(c => c.col + ',' + c.fila));
    ctx.beginPath();
    celdas.forEach(c => {
      const cubo = hexACubo(c);
      const h = hexCentro(c.col, c.fila);
      VECINO_LADO.forEach(([vq, vr], i) => {
        const nq = cubo.q + vq, nr = cubo.r + vr;
        if(set.has(cuboACol(nq, nr) + ',' + cuboAFila(nq, nr))) return;
        const a = ESQUINAS[i], b = ESQUINAS[(i + 1) % 6];
        ctx.moveTo(h.x + a[0], h.y + a[1]);
        ctx.lineTo(h.x + b[0], h.y + b[1]);
      });
    });
  };
  elementos.forEach((el, id) => {
    if(el.invisible && !soyGM) return;  // sólido invisible: solo lo ve el GM
    const celdas = celdasDeElemento(el);
    const img = el.imagen ? imagenLista(el.imagen) : null;
    if(img){
      ctx.save();
      trazarCeldas(celdas); ctx.clip();
      // La imagen vive en el marco sin rotar y gira junto con el elemento
      // alrededor de su casilla origen.
      const co = hexCentro(el.origen.col, el.origen.fila);
      ctx.translate(co.x, co.y); ctx.rotate((el.rotacion || 0) * Math.PI / 180); ctx.translate(-co.x, -co.y);
      const caja = cajaCeldas(celdasDeElemento(el, true));
      const escala = Math.max(caja.w / img.naturalWidth, caja.h / img.naturalHeight) * (el.imgZoom || 1);
      const iw = img.naturalWidth * escala, ih = img.naturalHeight * escala;
      const cx = caja.minX + caja.w / 2 + (el.imgDX || 0), cy = caja.minY + caja.h / 2 + (el.imgDY || 0);
      ctx.globalAlpha = el.invisible ? el.alfa / 100 * 0.35 : el.alfa / 100;
      ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
      ctx.restore();
    }else{
      trazarCeldas(celdas);
      ctx.fillStyle = colorConAlfa(el.color, (el.invisible ? el.alfa / 100 * 0.35 : el.alfa / 100 * 0.7));
      ctx.fill();
    }
    bordeCeldas(celdas);
    if(el.invisible){
      // Solo GM: contorno punteado violeta, para no confundirlo con un
      // sólido que también ven los jugadores.
      ctx.setLineDash([5 / z, 4 / z]);
      ctx.strokeStyle = 'rgba(155,111,209,.85)';
      ctx.lineWidth = 1.5 / z;
      ctx.stroke();
      ctx.setLineDash([]);
    }else if(el.solido){
      // Sólido visible: borde de advertencia fijo, para que se note que
      // bloquea el paso más allá del color elegido.
      ctx.strokeStyle = 'rgba(216,82,75,.85)';
      ctx.lineWidth = 3 / z;
      ctx.stroke();
    }else{
      ctx.strokeStyle = colorConAlfa(el.color, Math.min(1, el.alfa / 100 + 0.25));
      ctx.lineWidth = 2 / z;
      ctx.stroke();
    }
    if(id === elementoSeleccionado){
      ctx.setLineDash([6 / z, 5 / z]);
      ctx.strokeStyle = 'rgba(237,227,210,.85)';
      ctx.lineWidth = 1.5 / z;
      bordeCeldas(celdas); ctx.stroke();
      ctx.setLineDash([]);
      if(puedeManipularElemento(el)){
        const c = hexCentro(el.origen.col, el.origen.fila);
        if(!el.fijado){
          const h = elementoManijaMundo(el);
          ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(h.x, h.y);
          ctx.strokeStyle = 'rgba(79,168,224,.7)'; ctx.lineWidth = 1.5 / z; ctx.stroke();
          ctx.beginPath(); ctx.arc(h.x, h.y, 9 / z, 0, 2 * Math.PI);
          ctx.fillStyle = '#4FA8E0'; ctx.fill();
          ctx.strokeStyle = 'rgba(15,12,14,.6)'; ctx.lineWidth = 2 / z; ctx.stroke();
        }
        // Botón de pinear/despinear: rojo y candado cerrado si ya está
        // pineado (clic para soltarlo), celeste con 📌 si no (clic para
        // fijarlo — pineado, se comporta como el terreno de abajo).
        const p = elementoPinMundo(el);
        ctx.beginPath(); ctx.arc(p.x, p.y, 9 / z, 0, 2 * Math.PI);
        ctx.fillStyle = el.fijado ? '#D8524B' : '#4FA8E0';
        ctx.fill();
        ctx.strokeStyle = 'rgba(15,12,14,.6)'; ctx.lineWidth = 2 / z; ctx.stroke();
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `${11 / z}px "Space Grotesk", system-ui, sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.fillText(el.fijado ? '🔓' : '📌', p.x, p.y + 0.5 / z);
        ctx.restore();
        // Botón de editar: color, transparencia, imagen y su acomodo.
        const g = elementoGearMundo(el);
        ctx.beginPath(); ctx.arc(g.x, g.y, 9 / z, 0, 2 * Math.PI);
        ctx.fillStyle = '#9A867E'; ctx.fill();
        ctx.strokeStyle = 'rgba(15,12,14,.6)'; ctx.lineWidth = 2 / z; ctx.stroke();
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `${11 / z}px "Space Grotesk", system-ui, sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.fillText('⚙️', g.x, g.y + 0.5 / z);
        ctx.restore();
      }
    }
  });
  // El elemento que se está armando ahora mismo (línea o forma libre).
  if(dibujandoElemento){
    const c0 = hexACubo(dibujandoElemento.origen);
    const celdas = [...dibujandoElemento.celdas.values()].map(({dq, dr}) => ({col: cuboACol(c0.q + dq, c0.r + dr), fila: cuboAFila(c0.q + dq, c0.r + dr)}));
    const colorPreview = elemColor;
    trazarCeldas(celdas);
    ctx.fillStyle = colorConAlfa(colorPreview, 0.35);
    ctx.fill();
    bordeCeldas(celdas);
    ctx.strokeStyle = colorPreview; ctx.lineWidth = 2 / z; ctx.stroke();
  }

  // Estelas: la ruta que se está dibujando, la que espera confirmación y las
  // de movimientos recientes (se desvanecen).
  let animando = false;
  const ahora = Date.now();
  // pagables: casilleros que alcanzan los Nitros; los de más van en rojo.
  const dibujarEstela = (celdas, alfa, pagables = Infinity) => {
    if(celdas.length < 2) return;
    const casillas = (color, lista) => {
      if(!lista.length) return;
      ctx.beginPath();
      lista.forEach(c => { const p = hexCentro(c.col, c.fila); trazarHex(p.x, p.y); });
      ctx.fillStyle = `rgba(${color},${0.2 * alfa})`; ctx.fill();
      ctx.strokeStyle = `rgba(${color},${0.75 * alfa})`; ctx.lineWidth = 2 / z; ctx.stroke();
    };
    casillas('224,164,88', celdas.slice(1, pagables + 1));
    casillas('214,69,69', celdas.slice(pagables + 1));
    ctx.beginPath();
    celdas.forEach((c, i) => { const p = hexCentro(c.col, c.fila); if(i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
    ctx.strokeStyle = `rgba(237,227,210,${0.85 * alfa})`; ctx.lineWidth = 4 / z; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    celdas.slice(1).forEach(c => {
      const p = hexCentro(c.col, c.fila);
      ctx.beginPath(); ctx.arc(p.x, p.y, 5 / z, 0, 2 * Math.PI);
      ctx.fillStyle = `rgba(237,227,210,${alfa})`; ctx.fill();
    });
  };
  estelas.forEach((e, id) => {
    const resta = e.hasta - ahora;
    if(resta <= 0){ estelas.delete(id); return; }
    dibujarEstela(e.celdas, Math.min(1, resta / 1200));
    animando = true;
  });
  if(rutaPendiente) dibujarEstela(rutaPendiente.celdas, 1, pasosPagables(rutaPendiente));
  if(arrastre && arrastre.movio) dibujarEstela(arrastre.ruta, 1, pasosPagables(arrastre.costo));

  // Auras: una superficie de color semitransparente alrededor del token.
  tokens.forEach((t, id) => {
    if(t.oculto && !soyGM) return;
    const aura = auraDe(t);
    if(!aura) return;
    const dib = disposicion.find(d => d.id === id);
    const vis = visibles.get(id);
    const c = vis || (dib ? {x: dib.x, y: dib.y} : hexCentro(t.col, t.fila));
    if(aura.forma === 'hex'){
      dibujarAuraHex(vis ? mundoAHex(vis.x, vis.y) : {col: t.col, fila: t.fila}, aura, z);
      return;
    }
    ctx.beginPath();
    ctx.arc(c.x, c.y, aura.radio * ANCHO_CASILLA, 0, 2 * Math.PI);
    ctx.fillStyle = colorConAlfa(aura.color, 0.18); ctx.fill();
    ctx.strokeStyle = colorConAlfa(aura.color, 0.5); ctx.lineWidth = 2 / z; ctx.stroke();
  });

  // Tokens.
  disposicion = calcularDisposicion();
  const etiquetas = HEX * z >= 22;
  disposicion.forEach(d => {
    const t = tokens.get(d.id);
    let v = visibles.get(d.id);
    if(!v || d.arrastrado){ v = {x: d.x, y: d.y}; visibles.set(d.id, v); }
    else{
      const dx = d.x - v.x, dy = d.y - v.y;
      if(Math.abs(dx) + Math.abs(dy) > 0.5){ v.x += dx * 0.25; v.y += dy * 0.25; animando = true; }
      else{ v.x = d.x; v.y = d.y; }
    }
    const x = v.x, y = v.y, rad = d.radio;
    // Hexágono del token: mismo tamaño y orientación que la casilla de la
    // grilla (fijo — no rota con el frente), para que calce con el mapa.
    const puntos = verticesHex(x, y, rad);
    // Oculto: solo lo dibuja el GM (los demás ni lo tienen en disposicion),
    // más transparente para acordarse de que los jugadores no lo ven.
    if(t.oculto) ctx.globalAlpha = 0.5;

    trazarPuntos(verticesHex(x + 2 / z, y + 3 / z, rad));
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();

    const vin = vinculo(t);
    const est = estadoDe(t);
    const nombre = nombreDe(t);
    const mini = vin ? imagenLista(vin.miniatura) : imagenLista(t.imagen);

    trazarPuntos(puntos);
    ctx.fillStyle = t.color || '#9A867E'; ctx.fill();
    if(mini){
      ctx.save();
      trazarPuntos(puntos); ctx.clip();
      // La ilustración mira "abajo" con rotación 0 (así vienen casi todas);
      // rotar el token solo gira la imagen adentro del hexágono fijo.
      ctx.translate(x, y);
      ctx.rotate(num(t.rotacion || 0) * Math.PI / 180);
      ctx.drawImage(mini, -rad, -rad, rad * 2, rad * 2);
      ctx.restore();
    }
    if(est && (est.muerto || est.dormida)){
      trazarPuntos(puntos);
      ctx.fillStyle = 'rgba(15,12,14,.62)'; ctx.fill();
    }
    // Borde: dorado tuyos, verde otros jugadores, rojo creeps, gris NPC.
    trazarPuntos(puntos);
    ctx.lineWidth = Math.max(2.5 / z, rad * 0.13);
    ctx.strokeStyle = BORDE[claseToken(t)];
    ctx.stroke();
    // Frente: el lado que mira la ilustración (abajo con rotación 0) se
    // resalta en celeste, para ubicarlo de un vistazo sin seleccionar el
    // token. El lado 1 del hexágono (ver ESQUINAS) es "abajo".
    {
      const frenteI = (Math.round(num(t.rotacion || 0) / 60) + 1) % 6;
      const [fx1, fy1] = puntos[frenteI], [fx2, fy2] = puntos[(frenteI + 1) % 6];
      ctx.beginPath(); ctx.moveTo(fx1, fy1); ctx.lineTo(fx2, fy2);
      ctx.strokeStyle = FRENTE_COLOR; ctx.lineWidth = Math.max(3 / z, rad * 0.16); ctx.lineCap = 'round'; ctx.stroke();
    }

    if(seleccion === d.id){
      trazarPuntos(verticesHex(x, y, rad + 5 / z));
      ctx.strokeStyle = '#EDE3D2'; ctx.lineWidth = 2.5 / z; ctx.stroke();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if(!mini){
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${rad * 0.95}px "Space Grotesk", system-ui, sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 3;
      ctx.fillText(inicial(nombre), x, y + rad * 0.05);
      ctx.shadowBlur = 0;
    }
    if(est && est.muerto){
      ctx.strokeStyle = HP_COLOR; ctx.lineWidth = Math.max(2 / z, rad * 0.14);
      const k = rad * 0.45;
      ctx.beginPath(); ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k); ctx.stroke();
    }

    // Barras: vida (roja) y, en los PJ, SP (azul), justo debajo del token.
    // (rad*sqrt3/2: el hexágono de lado arriba no llega a "rad" de alto.)
    const bordeV = rad * SQ3 / 2;
    let debajo = y + bordeV + 3 / z;
    if(est){
      const bw = rad * 1.8, bh = Math.max(3 / z, rad * 0.13);
      const barra = (valor, color) => {
        ctx.fillStyle = 'rgba(15,12,14,.85)';
        ctx.fillRect(x - bw / 2 - 1 / z, debajo - 1 / z, bw + 2 / z, bh + 2 / z);
        ctx.fillStyle = color;
        ctx.fillRect(x - bw / 2, debajo, bw * valor, bh);
        debajo += bh + 2 / z;
      };
      const barras = barrasDe(t);
      if(barras.hp) barra(est.hp, HP_COLOR);
      if(barras.sp && est.sp !== null) barra(est.sp, SP_COLOR);
      if(barras.no2 && est.no2 !== null) barra(est.no2, NO2_COLOR);
    }

    // Estados: circulitos con la inicial sobre el borde de arriba del token
    // (verde = beneficio, violeta = perjuicio). Solo en el seleccionado: sin
    // seleccionar, el mapa muestra nada más que el token y sus barras.
    if(est && est.estados.length && seleccion === d.id){
      const max = 5;
      const lista = est.estados.slice(0, max);
      const r = Math.max(5 / z, rad * 0.24);
      lista.forEach((e, i) => {
        const ang = -Math.PI / 2 + (i - (lista.length - 1) / 2) * 0.62;
        const ex = x + bordeV * Math.cos(ang), ey = y + bordeV * Math.sin(ang);
        const resto = i === max - 1 && est.estados.length > max;
        ctx.beginPath(); ctx.arc(ex, ey, r, 0, 2 * Math.PI);
        ctx.fillStyle = resto ? '#3B2E34' : (ESTADO_COLOR[e.polaridad] || ESTADO_COLOR['']);
        ctx.fill();
        ctx.strokeStyle = '#0F0C0E'; ctx.lineWidth = 1.5 / z; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${r * 1.15}px "Space Grotesk", system-ui, sans-serif`;
        ctx.fillText(resto ? '+' + (est.estados.length - max + 1) : inicial(e.nombre), ex, ey + r * 0.06);
      });
    }

    // El nombre, solo del seleccionado, sobre un fondo translúcido.
    if(etiquetas && seleccion === d.id){
      const tam = 11 / z;
      ctx.font = `500 ${tam}px "Space Grotesk", system-ui, sans-serif`;
      const texto = nombre.length > 18 ? nombre.slice(0, 17) + '…' : nombre;
      const w = ctx.measureText(texto).width + 8 / z;
      const ty = debajo + 7 / z;
      ctx.fillStyle = 'rgba(15,12,14,.45)';
      ctx.fillRect(x - w / 2, ty - tam * 0.7, w, tam * 1.4);
      ctx.fillStyle = '#EDE3D2';
      ctx.fillText(texto, x, ty);
    }
    ctx.globalAlpha = 1;
  });

  // Trazos del lápiz: los temporales se ven un rato y se desvanecen sobre
  // el final (los borra el que los ve, por eso conviene que se note antes
  // de irse); los permanentes quedan fijos hasta que alguien los mueva o
  // los borre.
  trazos.forEach((t, id) => {
    const alfa = t.permanente ? 1 : Math.max(0, Math.min(1, (t.creadoMs + ESTELA_MS - ahora) / 800));
    if(!t.permanente && alfa <= 0) return;
    ctx.save();
    ctx.translate(t.origen.x, t.origen.y);
    ctx.rotate(t.rotacion * Math.PI / 180);
    ctx.beginPath();
    trazarSuave(ctx, t.puntos);
    ctx.globalAlpha = alfa;
    ctx.strokeStyle = t.color;
    ctx.lineWidth = t.grosor / z;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;
    if(id === trazoSeleccionado){
      ctx.setLineDash([6 / z, 5 / z]);
      ctx.strokeStyle = 'rgba(237,227,210,.85)';
      ctx.lineWidth = 1.5 / z;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
    if(id === trazoSeleccionado && puedeManipularTrazo(t)){
      const h = trazoManijaMundo(t);
      ctx.beginPath(); ctx.moveTo(t.origen.x, t.origen.y); ctx.lineTo(h.x, h.y);
      ctx.strokeStyle = 'rgba(79,168,224,.7)'; ctx.lineWidth = 1.5 / z; ctx.stroke();
      ctx.beginPath(); ctx.arc(h.x, h.y, 9 / z, 0, 2 * Math.PI);
      ctx.fillStyle = '#4FA8E0'; ctx.fill();
      ctx.strokeStyle = 'rgba(15,12,14,.6)'; ctx.lineWidth = 2 / z; ctx.stroke();
    }
    if(!t.permanente) animando = true;
  });
  // El trazo que se está dibujando ahora mismo, en vivo.
  if(dibujando && dibujando.puntos.length > 1){
    ctx.beginPath();
    trazarSuave(ctx, simplificarTrazo(dibujando.puntos, 1.5 / z));
    ctx.strokeStyle = lapizColor;
    ctx.lineWidth = 4 / z;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Ping (clic derecho): un anillo que se expande y se apaga solo, con
  // el nombre de quién lo mandó, arriba de todo lo demás.
  pings.forEach((p, id) => {
    const t = (Date.now() - p.creadoMs) / PING_MS;
    if(t >= 1){ pings.delete(id); return; }
    animando = true;
    const radio = HEX * (0.4 + t * 2.2);
    const alfa = 1 - t;
    ctx.beginPath(); ctx.arc(p.x, p.y, radio, 0, 2 * Math.PI);
    ctx.strokeStyle = `rgba(224,164,88,${alfa})`; ctx.lineWidth = 3 / z; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, radio - HEX * 0.5), 0, 2 * Math.PI);
    ctx.strokeStyle = `rgba(224,164,88,${alfa * 0.6})`; ctx.lineWidth = 2 / z; ctx.stroke();
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${12 / z}px "Space Grotesk", system-ui, sans-serif`;
    ctx.fillStyle = `rgba(237,227,210,${alfa})`;
    ctx.fillText(nombreMiembro(p.duenoUid), p.x, p.y - radio - 10 / z);
    ctx.restore();
  });

  hudUbicar();
  return animando;
}

function tokenEn(x, y){
  for(let i = disposicion.length - 1; i >= 0; i--){
    const d = disposicion[i];
    const v = visibles.get(d.id) || d;
    if(Math.hypot(v.x - x, v.y - y) <= d.radio + 3) return d.id;
  }
  return null;
}

/* ---------- Mouse / dedo sobre el mapa ---------- */

lienzo.addEventListener('contextmenu', e => e.preventDefault());
lienzo.addEventListener('pointerdown', e => {
  if(e.pointerType === 'mouse' && e.button === 2){
    // Con una herramienta de dibujo activa, el clic derecho es "salir de
    // acá" (no ping) — es la forma más práctica de volver al cursor
    // normal sin ir a buscar el botón de la barra lateral.
    if(herramientaActiva){ desactivarHerramienta(); return; }
    const {px, py} = posEvento(e);
    const m = pantallaAMundo(px, py);
    guardarPing(m.x, m.y);
    return;
  }
  if(e.button !== 0 && e.pointerType === 'mouse') return;
  const {px, py} = posEvento(e);
  const m = pantallaAMundo(px, py);
  const id = tokenEn(m.x, m.y);
  lienzo.setPointerCapture(e.pointerId);
  const libre = moverLibre && tokens.get(moverLibre);
  if(libre && !rutaPendiente){
    if(id === moverLibre){
      // Arrastrar el token: sin ruta ni costo.
      const v = visibles.get(id) || hexCentro(libre.col, libre.fila);
      arrastre = {id, x: v.x, y: v.y, dx: v.x - m.x, dy: v.y - m.y, inicioX: px, inicioY: py, movio: false,
        ruta: [{col: libre.col, fila: libre.fila}], costo: null, avisado: false, libre: true};
      lienzo.style.cursor = 'grabbing';
      return;
    }
    // Tocar otra casilla: el token aparece ahí.
    const destino = mundoAHex(m.x, m.y);
    moverTokenLibre(moverLibre, destino.col, destino.fila);
    return;
  }
  if(id){
    seleccionar(id);
    const t = tokens.get(id);
    if(puedoMover(t)){
      const costo = costoMoverDe(t);
      if(rutaPendiente){
        // Ese clic confirmó el movimiento marcado: no empieza otro arrastre.
      }else if(costo && costo.porCasillero <= 0){
        toast('No te podés mover ahora (Inmovilizado)');
      }else{
        const v = visibles.get(id) || hexCentro(t.col, t.fila);
        arrastre = {id, x: v.x, y: v.y, dx: v.x - m.x, dy: v.y - m.y, inicioX: px, inicioY: py, movio: false,
          ruta: [{col: t.col, fila: t.fila}], costo, avisado: false};
        lienzo.style.cursor = 'grabbing';
        return;
      }
    }
  }else{
    // Handle de rotación del trazo ya seleccionado (si se puede manipular).
    if(trazoSeleccionado && trazos.has(trazoSeleccionado)){
      const ts = trazos.get(trazoSeleccionado);
      if(puedeManipularTrazo(ts)){
        const h = trazoManijaMundo(ts);
        if(Math.hypot(m.x - h.x, m.y - h.y) <= 12 / vista.zoom){
          rotandoTrazo = {id: trazoSeleccionado};
          lienzo.style.cursor = 'grabbing';
          return;
        }
      }
    }
    // Un trazo permanente ahí: seleccionarlo y, si se puede, arrastrarlo.
    const idTrazo = trazoEn(m.x, m.y);
    if(idTrazo){
      trazoSeleccionar(idTrazo);
      const t = trazos.get(idTrazo);
      if(puedeManipularTrazo(t)){
        arrastreTrazo = {id: idTrazo, dx: m.x - t.origen.x, dy: m.y - t.origen.y, inicioX: px, inicioY: py, movio: false};
        lienzo.style.cursor = 'grabbing';
      }
      return;
    }
    // Lápiz activo: empieza un trazo nuevo a mano alzada.
    if(herramientaActiva === 'lapiz'){
      trazoSeleccionar(null);
      dibujando = {puntos: [m]};
      lienzo.style.cursor = 'crosshair';
      return;
    }
    // Botón de editar, de pinear/despinear y handle de rotación del
    // elemento (terreno/formas) ya seleccionado.
    if(elementoSeleccionado && elementos.has(elementoSeleccionado)){
      const els = elementos.get(elementoSeleccionado);
      if(puedeManipularElemento(els)){
        const g = elementoGearMundo(els);
        if(Math.hypot(m.x - g.x, m.y - g.y) <= 12 / vista.zoom){
          abrirEditorElemento(elementoSeleccionado);
          return;
        }
        const p = elementoPinMundo(els);
        if(Math.hypot(m.x - p.x, m.y - p.y) <= 12 / vista.zoom){
          moverElemento(elementoSeleccionado, {fijado: !els.fijado});
          return;
        }
        if(!els.fijado){
          const h = elementoManijaMundo(els);
          if(Math.hypot(m.x - h.x, m.y - h.y) <= 12 / vista.zoom){
            rotandoElemento = {id: elementoSeleccionado};
            lienzo.style.cursor = 'grabbing';
            return;
          }
        }
      }
    }
    // Un elemento (terreno/formas) en esta casilla: seleccionarlo y, si se
    // puede y no está pineado, prepararlo para arrastrarlo. Pineado: se
    // comporta como el terreno de abajo — clickear y arrastrar mueve el
    // mapa, no el elemento (para eso está el botón de despinear).
    const casillaClic = mundoAHex(m.x, m.y);
    const idElemento = elementoEn(casillaClic.col, casillaClic.fila);
    if(idElemento){
      const elHit = elementos.get(idElemento);
      elementoSeleccionar(idElemento);
      if(elHit.fijado){
        paneo = {inicioX: px, inicioY: py, x: vista.x, y: vista.y};
        lienzo.style.cursor = 'grabbing';
        return;
      }
      if(puedeManipularElemento(elHit)){
        arrastreElemento = {id: idElemento, inicioX: px, inicioY: py, movio: false};
        lienzo.style.cursor = 'grabbing';
      }
      return;
    }
    // Terreno/Formas activo: crea un elemento nuevo (flor de un clic;
    // línea/libre se arman arrastrando, ver pointermove/soltar).
    if(herramientaActiva === 'elemento'){
      elementoSeleccionar(null);
      if(elemTipo === 'flor'){
        guardarElemento('flor', casillaClic, celdasFlor(elemTamano));
      }else{
        dibujandoElemento = {tipo: elemTipo, origen: casillaClic, celdas: new Map([['0,0', {dq: 0, dr: 0}]])};
        lienzo.style.cursor = 'crosshair';
      }
      return;
    }
    // Con el engranaje abierto, el primer clic en el mapa solo lo cierra:
    // así no se pierde lo que se estaba por guardar.
    if(hudGlobo){ hudCerrar(); renderPanel(); pedirDibujo(); return; }
    seleccionar(null);
    trazoSeleccionar(null);
    elementoSeleccionar(null);
    if(moverFondo && soyGM && fondo){
      arrastreFondo = {inicioX: px, inicioY: py, x: fondo.x, y: fondo.y};
      lienzo.style.cursor = 'move';
      return;
    }
  }
  paneo = {inicioX: px, inicioY: py, x: vista.x, y: vista.y};
  lienzo.style.cursor = 'grabbing';
});

lienzo.addEventListener('pointermove', e => {
  const {px, py} = posEvento(e);
  if(dibujando){
    dibujando.puntos.push(pantallaAMundo(px, py));
    pedirDibujo();
    return;
  }
  if(dibujandoElemento){
    const m = pantallaAMundo(px, py);
    const casilla = mundoAHex(m.x, m.y);
    const c0 = hexACubo(dibujandoElemento.origen), c1 = hexACubo(casilla);
    if(dibujandoElemento.tipo === 'linea'){
      const celdas = celdasLinea({dq: c1.q - c0.q, dr: c1.r - c0.r}, elemTamano);
      dibujandoElemento.celdas = new Map(celdas.map(c => [`${c.dq},${c.dr}`, c]));
    }else{
      dibujandoElemento.celdas.set(`${c1.q - c0.q},${c1.r - c0.r}`, {dq: c1.q - c0.q, dr: c1.r - c0.r});
    }
    pedirDibujo();
    return;
  }
  if(arrastreElemento){
    if(!arrastreElemento.movio && Math.hypot(px - arrastreElemento.inicioX, py - arrastreElemento.inicioY) < 4) return;
    arrastreElemento.movio = true;
    const els = elementos.get(arrastreElemento.id);
    if(els){ const m = pantallaAMundo(px, py); els.origen = mundoAHex(m.x, m.y); }
    pedirDibujo();
    return;
  }
  if(rotandoElemento){
    const els = elementos.get(rotandoElemento.id);
    if(els){
      const m = pantallaAMundo(px, py);
      const c = hexCentro(els.origen.col, els.origen.fila);
      const dx = m.x - c.x, dy = m.y - c.y;
      if(Math.hypot(dx, dy) > 6 / vista.zoom){
        const ang = (Math.atan2(-dx, dy) * 180 / Math.PI + 360) % 360;
        els.rotacion = Math.round(ang / 60) * 60 % 360;
      }
    }
    pedirDibujo();
    return;
  }
  if(arrastreTrazo){
    if(!arrastreTrazo.movio && Math.hypot(px - arrastreTrazo.inicioX, py - arrastreTrazo.inicioY) < 4) return;
    arrastreTrazo.movio = true;
    const m = pantallaAMundo(px, py);
    const t = trazos.get(arrastreTrazo.id);
    if(t){ t.origen.x = m.x - arrastreTrazo.dx; t.origen.y = m.y - arrastreTrazo.dy; }
    pedirDibujo();
    return;
  }
  if(rotandoTrazo){
    const t = trazos.get(rotandoTrazo.id);
    if(t){
      const m = pantallaAMundo(px, py);
      const dx = m.x - t.origen.x, dy = m.y - t.origen.y;
      if(Math.hypot(dx, dy) > 4 / vista.zoom) t.rotacion = (Math.atan2(-dx, dy) * 180 / Math.PI + 360) % 360;
    }
    pedirDibujo();
    return;
  }
  if(arrastre){
    if(!arrastre.movio && Math.hypot(px - arrastre.inicioX, py - arrastre.inicioY) < 4) return;
    arrastre.movio = true;
    const m = pantallaAMundo(px, py);
    arrastre.x = m.x + arrastre.dx; arrastre.y = m.y + arrastre.dy;
    if(!arrastre.libre) extenderRuta(arrastre, mundoAHex(arrastre.x, arrastre.y));
    pedirDibujo();
    return;
  }
  if(arrastreFondo){
    fondo.x = arrastreFondo.x + (px - arrastreFondo.inicioX) / vista.zoom;
    fondo.y = arrastreFondo.y + (py - arrastreFondo.inicioY) / vista.zoom;
    pedirDibujo();
    return;
  }
  if(paneo){
    vista.x = paneo.x + px - paneo.inicioX;
    vista.y = paneo.y + py - paneo.inicioY;
    pedirDibujo();
    return;
  }
  const m = pantallaAMundo(px, py);
  const id = tokenEn(m.x, m.y);
  if(moverLibre){ lienzo.style.cursor = id === moverLibre ? 'grab' : 'crosshair'; return; }
  if(!id){
    if(trazoSeleccionado && trazos.has(trazoSeleccionado) && puedeManipularTrazo(trazos.get(trazoSeleccionado))){
      const h = trazoManijaMundo(trazos.get(trazoSeleccionado));
      if(Math.hypot(m.x - h.x, m.y - h.y) <= 12 / vista.zoom){ lienzo.style.cursor = 'grab'; return; }
    }
    const idTrazo = trazoEn(m.x, m.y);
    if(idTrazo){ lienzo.style.cursor = puedeManipularTrazo(trazos.get(idTrazo)) ? 'grab' : 'pointer'; return; }
    if(elementoSeleccionado && elementos.has(elementoSeleccionado) && puedeManipularElemento(elementos.get(elementoSeleccionado))){
      const els = elementos.get(elementoSeleccionado);
      const g = elementoGearMundo(els);
      if(Math.hypot(m.x - g.x, m.y - g.y) <= 12 / vista.zoom){ lienzo.style.cursor = 'pointer'; return; }
      const p = elementoPinMundo(els);
      if(Math.hypot(m.x - p.x, m.y - p.y) <= 12 / vista.zoom){ lienzo.style.cursor = 'pointer'; return; }
      if(!els.fijado){
        const h = elementoManijaMundo(els);
        if(Math.hypot(m.x - h.x, m.y - h.y) <= 12 / vista.zoom){ lienzo.style.cursor = 'grab'; return; }
      }
    }
    const casilla = mundoAHex(m.x, m.y);
    const idElemento = elementoEn(casilla.col, casilla.fila);
    if(idElemento){
      const elHover = elementos.get(idElemento);
      lienzo.style.cursor = elHover.fijado ? 'default' : (puedeManipularElemento(elHover) ? 'grab' : 'pointer');
      return;
    }
    if(herramientaActiva === 'lapiz' || herramientaActiva === 'elemento'){ lienzo.style.cursor = 'crosshair'; return; }
  }
  lienzo.style.cursor = id ? (puedoMover(tokens.get(id)) ? 'grab' : 'pointer') : (moverFondo && soyGM && fondo ? 'move' : 'default');
});

// Casilleros que alcanzan a pagarse con los Nitros disponibles (Infinity si
// el token se mueve sin costo). Los que siguen se dibujan en rojo.
function pasosPagables(costo){
  if(!costo) return Infinity;
  return Math.max(0, Math.floor(costo.disponibles / costo.porCasillero));
}

// La ruta sigue al token casilla por casilla. Volver sobre una casilla ya
// recorrida borra la estela desde ahí. Pasarse de los Nitros se permite
// (quedan en negativo), pero avisa y la estela sigue en rojo.
function extenderRuta(a, casilla){
  const ruta = a.ruta;
  const i = ruta.findIndex(c => mismoHex(c, casilla));
  if(i >= 0){ ruta.length = i + 1; return; }
  for(const c of lineaHex(ruta[ruta.length - 1], casilla)){
    const j = ruta.findIndex(x => mismoHex(x, c));
    if(j >= 0){ ruta.length = j + 1; continue; }
    if(ruta.length >= RUTA_MAX_CELDAS) break;
    ruta.push(c);
  }
  if(a.costo && ruta.length - 1 > pasosPagables(a.costo) && !a.avisado){
    // Sin aviso verde: la estela en rojo y el cartel ya lo muestran.
    a.avisado = true;
  }
}

function soltar(){
  if(dibujando){
    const puntos = dibujando.puntos;
    dibujando = null;
    if(puntos.length > 1) guardarTrazo(puntos, lapizPermanente);
    pedirDibujo();
  }
  if(arrastreTrazo){
    const a = arrastreTrazo;
    arrastreTrazo = null;
    const t = trazos.get(a.id);
    if(a.movio && t) moverTrazo(a.id, {origen: {x: t.origen.x, y: t.origen.y}});
    pedirDibujo();
  }
  if(rotandoTrazo){
    const a = rotandoTrazo;
    rotandoTrazo = null;
    const t = trazos.get(a.id);
    if(t) moverTrazo(a.id, {rotacion: t.rotacion});
    pedirDibujo();
  }
  if(dibujandoElemento){
    const d = dibujandoElemento;
    dibujandoElemento = null;
    if(d.celdas.size > 1 || d.tipo === 'flor') guardarElemento(d.tipo, d.origen, [...d.celdas.values()]);
    pedirDibujo();
  }
  if(arrastreElemento){
    const a = arrastreElemento;
    arrastreElemento = null;
    const els = elementos.get(a.id);
    if(a.movio && els) moverElemento(a.id, {origen: {col: els.origen.col, fila: els.origen.fila}});
    pedirDibujo();
  }
  if(rotandoElemento){
    const a = rotandoElemento;
    rotandoElemento = null;
    const els = elementos.get(a.id);
    if(els) moverElemento(a.id, {rotacion: els.rotacion});
    pedirDibujo();
  }
  if(arrastre){
    const a = arrastre;
    arrastre = null;
    const t = tokens.get(a.id);
    const pasos = a.ruta.length - 1;
    if(a.libre){
      const fin = mundoAHex(a.x, a.y);
      if(a.movio && t && !mismoHex(fin, t)){
        visibles.set(a.id, {x: a.x, y: a.y});
        moverTokenLibre(a.id, fin.col, fin.fila);
      }
    }else if(a.movio && t && pasos > 0 && a.ruta.slice(1).some(c => elementoSolidoEn(c.col, c.fila))){
      toast('Ese camino pasa por un obstáculo — no se puede confirmar así');
      visibles.delete(a.id);
    }else if(a.movio && t && pasos > 0){
      visibles.set(a.id, {x: a.x, y: a.y});
      if(a.costo){
        rutaPendiente = {id: a.id, celdas: a.ruta, pasos, porCasillero: a.costo.porCasillero, disponibles: a.costo.disponibles};
        // Solo se pregunta si el movimiento se pasa de los No2 que quedan.
        if(pasos * a.costo.porCasillero > Math.max(0, a.costo.disponibles)) mostrarConfirmacionRuta();
        else confirmarRuta();
      }else{
        const fin = a.ruta[pasos];
        moverToken(a.id, fin.col, fin.fila, a.ruta);
      }
    }
    pedirDibujo();
  }
  if(paneo){ paneo = null; guardarVista(); }
  if(arrastreFondo){
    const movido = fondo.x !== arrastreFondo.x || fondo.y !== arrastreFondo.y;
    arrastreFondo = null;
    if(movido) guardarFondo({x: fondo.x, y: fondo.y});
  }
  lienzo.style.cursor = moverLibre ? 'crosshair' : 'default';
}
lienzo.addEventListener('pointerup', soltar);
lienzo.addEventListener('pointercancel', soltar);

lienzo.addEventListener('wheel', e => {
  e.preventDefault();
  const {px, py} = posEvento(e);
  zoomEn(px, py, Math.exp(-e.deltaY * 0.0015));
}, {passive: false});

$('#btn-acercar').onclick = () => zoomEn(anchoPx / 2, altoPx / 2, 1.25);
$('#btn-alejar').onclick = () => zoomEn(anchoPx / 2, altoPx / 2, 0.8);
$('#btn-centrar').onclick = centrarEnMios;

document.addEventListener('keydown', e => {
  // Con la Botonera o las Acciones abiertas, el teclado es de esa ventana:
  // Escape se le pasa (cierra la de más arriba) y el mapa no hace nada más.
  if(!$('#botonera-capa').hidden){
    if(e.key === 'Escape') escapeABotonera();
    return;
  }
  if(editandoElemento && e.key === 'Escape'){ cerrarEditorElemento(true); return; }
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(rutaPendiente && e.key === 'Enter'){ e.preventDefault(); confirmarRuta(); return; }
  if(rutaPendiente && e.key === 'Escape'){ cancelarRuta(); return; }
  if(moverLibre && e.key === 'Escape'){ activarMoverLibre(moverLibre); return; }
  if(herramientaActiva && e.key === 'Escape'){ desactivarHerramienta(); return; }
  if(e.key === 'Escape'){ seleccionar(null); trazoSeleccionar(null); elementoSeleccionar(null); }
  if((e.key === 'Delete' || e.key === 'Backspace') && seleccion) borrarToken(seleccion);
  if((e.key === 'Delete' || e.key === 'Backspace') && trazoSeleccionado && puedeManipularTrazo(trazos.get(trazoSeleccionado))){
    borrarTrazo(trazoSeleccionado);
    trazoSeleccionar(null);
  }
  if((e.key === 'Delete' || e.key === 'Backspace') && elementoSeleccionado && puedeManipularElemento(elementos.get(elementoSeleccionado))){
    borrarElemento(elementoSeleccionado);
    elementoSeleccionar(null);
  }
});

/* ---------- Tokens en Firestore ---------- */

function coleccionTokens(){
  return mapaMostrado === MAPA_PRINCIPAL
    ? fbDb.collection(fbRutaCampana('tokens'))
    : fbDb.collection(fbRutaCampana(`mapas/${mapaMostrado}/tokens`));
}
function coleccionTrazos(){
  return mapaMostrado === MAPA_PRINCIPAL
    ? fbDb.collection(fbRutaCampana('trazos'))
    : fbDb.collection(fbRutaCampana(`mapas/${mapaMostrado}/trazos`));
}

function puedeManipularTrazo(t){
  return !!(t && fbUsuario && (soyGM || t.duenoUid === fbUsuario.uid));
}

function coleccionPings(){
  return mapaMostrado === MAPA_PRINCIPAL
    ? fbDb.collection(fbRutaCampana('pings'))
    : fbDb.collection(fbRutaCampana(`mapas/${mapaMostrado}/pings`));
}
function escucharPings(){
  cortarPingsListener = coleccionPings().onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed'){ pings.delete(ch.doc.id); return; }
      const d = ch.doc.data({serverTimestamps: 'estimate'});
      const creadoMs = d.creado && d.creado.toMillis ? d.creado.toMillis() : Date.now();
      pings.set(ch.doc.id, {x: num(d.x), y: num(d.y), duenoUid: d.duenoUid, creadoMs});
      const restan = PING_MS - (Date.now() - creadoMs);
      setTimeout(() => { coleccionPings().doc(ch.doc.id).delete().catch(() => {}); }, Math.max(0, restan));
    });
    pedirDibujo();
  }, err => console.error('Error escuchando los pings del mapa:', err));
}
// Clic derecho en el mapa: un anillo que se expande y se apaga solo, para
// todos — "miren acá". No usa herramienta ni selección, así que anda
// aunque haya otra cosa activa (lápiz, terreno…).
async function guardarPing(x, y){
  if(!fbUsuario) return;
  try{
    await coleccionPings().add({
      x, y, duenoUid: fbUsuario.uid, creado: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(err){
    console.error('No se pudo mandar el ping:', err);
  }
}

function coleccionElementos(){
  return mapaMostrado === MAPA_PRINCIPAL
    ? fbDb.collection(fbRutaCampana('elementos'))
    : fbDb.collection(fbRutaCampana(`mapas/${mapaMostrado}/elementos`));
}
function puedeManipularElemento(el){
  return !!(el && fbUsuario && (soyGM || el.duenoUid === fbUsuario.uid));
}
// Las casillas que ocupa de verdad ahora mismo (origen + cada offset, ya
// rotado). {col,fila} absolutos.
function celdasDeElemento(el, sinRotar){
  return el.celdas.map(({dq, dr}) => {
    const rot = rotarCubo(dq, dr, sinRotar ? 0 : el.rotacion / 60);
    const c0 = hexACubo(el.origen);
    const q = c0.q + rot.dq, r = c0.r + rot.dr;
    return {col: cuboACol(q, r), fila: cuboAFila(q, r)};
  });
}
function elementoEn(col, fila){
  const lista = [...elementos.entries()].reverse();
  for(const [id, el] of lista){
    if(el.invisible && !soyGM) continue;  // no se puede seleccionar lo que no se ve
    if(celdasDeElemento(el).some(c => c.col === col && c.fila === fila)) return id;
  }
  return null;
}
// Handle para rotar (60° por paso), a un costado de la casilla origen.
function elementoManijaMundo(el){
  const c = hexCentro(el.origen.col, el.origen.fila);
  const rad = el.rotacion * Math.PI / 180;
  const r = HEX * 1.6;
  return {x: c.x - r * Math.sin(rad), y: c.y + r * Math.cos(rad)};
}
// Botón de pinear/despinear: siempre del lado opuesto a la manija de
// rotar (mismo radio, 180° más), así nunca se pisan sea cual sea la
// rotación.
function elementoPinMundo(el){
  const c = hexCentro(el.origen.col, el.origen.fila);
  const rad = (el.rotacion + 180) * Math.PI / 180;
  const r = HEX * 1.6;
  return {x: c.x - r * Math.sin(rad), y: c.y + r * Math.cos(rad)};
}
// Botón de editar (⚙️): a 90° de la manija de rotar, así con las tres
// (rotar/pinear/editar) nunca se pisan entre sí sea cual sea la rotación.
function elementoGearMundo(el){
  const c = hexCentro(el.origen.col, el.origen.fila);
  const rad = (el.rotacion + 90) * Math.PI / 180;
  const r = HEX * 1.6;
  return {x: c.x - r * Math.sin(rad), y: c.y + r * Math.cos(rad)};
}
// Caja (en el mundo) que envuelve todas las casillas, para que una
// imagen de fondo la cubra entera ("cover", sin achatarse).
function cajaCeldas(celdas){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  celdas.forEach(c => {
    const h = hexCentro(c.col, c.fila);
    minX = Math.min(minX, h.x - HEX); maxX = Math.max(maxX, h.x + HEX);
    minY = Math.min(minY, h.y - HEX); maxY = Math.max(maxY, h.y + HEX);
  });
  return {minX, minY, w: maxX - minX, h: maxY - minY};
}

function escucharElementos(){
  cortarElementosListener = coleccionElementos().onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed'){
        elementos.delete(ch.doc.id);
        if(elementoSeleccionado === ch.doc.id) elementoSeleccionado = null;
        if(editandoElemento && editandoElemento.id === ch.doc.id) cerrarEditorElemento(false);
        return;
      }
      const d = ch.doc.data();
      const crudo = Array.isArray(d.celdas) ? d.celdas : [];
      const celdas = [];
      for(let i = 0; i + 1 < crudo.length; i += 2) celdas.push({dq: num(crudo[i]), dr: num(crudo[i + 1])});
      elementos.set(ch.doc.id, {
        tipo: d.tipo === 'linea' || d.tipo === 'libre' ? d.tipo : 'flor',
        origen: {col: Math.round(num(d.origen && d.origen.col)), fila: Math.round(num(d.origen && d.origen.fila))},
        celdas,
        rotacion: (((Math.round(num(d.rotacion) / 60) * 60) % 360) + 360) % 360,
        color: /^#[0-9a-fA-F]{6}$/.test(d.color || '') ? d.color : '#3F6FB0',
        alfa: Math.max(10, Math.min(100, num(d.alfa) || 45)),
        solido: d.solido === true,
        invisible: d.invisible === true,
        imagen: typeof d.imagen === 'string' ? d.imagen : '',
        imgZoom: Math.max(1, Math.min(6, num(d.imgZoom) || 1)),
        imgDX: num(d.imgDX) || 0,
        imgDY: num(d.imgDY) || 0,
        fijado: d.fijado === true,
        duenoUid: d.duenoUid,
      });
    });
    pedirDibujo();
  }, err => console.error('Error escuchando los elementos del mapa:', err));
}

async function guardarElemento(tipo, origen, celdasSet){
  if(!fbUsuario) return;
  const celdas = [];
  celdasSet.forEach(({dq, dr}) => celdas.push(dq, dr));
  if(!celdas.length) return;
  const invisible = !!(elemSolido && soyGM && elemInvisible);
  try{
    await coleccionElementos().add({
      tipo, origen, celdas, rotacion: 0,
      color: elemColor, alfa: elemAlfa,
      solido: elemSolido, invisible, imagen: elemImagen || '', imgZoom: 1, imgDX: 0, imgDY: 0, fijado: false,
      duenoUid: fbUsuario.uid, creado: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(err){
    console.error('No se pudo crear el elemento:', err);
    toast(err.code === 'permission-denied' ? 'No se pudo: faltan publicar las reglas nuevas de Firestore' : 'No se pudo crear');
  }
}
// Si algún elemento sólido (Formas) ocupa esa casilla — cualquiera,
// invisible o no: lo invisible solo cambia quién lo VE, no si bloquea.
function elementoSolidoEn(col, fila){
  for(const el of elementos.values()){
    if(el.solido && celdasDeElemento(el).some(c => c.col === col && c.fila === fila)) return true;
  }
  return false;
}
async function moverElemento(id, cambios){
  try{ await coleccionElementos().doc(id).update(cambios); }
  catch(err){ console.error('No se pudo mover el elemento:', err); toast('No se pudo mover'); }
}
async function borrarElemento(id){
  try{ await coleccionElementos().doc(id).delete(); }
  catch(err){ console.error('No se pudo borrar el elemento:', err); toast('No se pudo borrar'); }
}

/* ---------- Editar un elemento ya creado (⚙️ al seleccionarlo) ----------
   Color, transparencia e imagen (elegirla, moverla/hacerle zoom, o
   quitarla) se aplican en vivo sobre el elemento de verdad (para que se
   vea cómo queda en el mapa antes de decidir) y recién se guardan de
   verdad al tocar Guardar; Cancelar (o la ✕, o Esc) los vuelve a como
   estaban. tipo/celdas/solido no se pueden editar — para eso se borra y
   se crea uno nuevo. */
function cerrarEditorElemento(cancelar){
  if(!editandoElemento) return;
  if(cancelar){
    const el = elementos.get(editandoElemento.id);
    if(el) Object.assign(el, editandoElemento.original);
  }
  editandoElemento = null;
  const caja = $('#elem-edit');
  caja.hidden = true;
  caja.innerHTML = '';
  pedirDibujo();
}

function abrirEditorElemento(id){
  const el = elementos.get(id);
  if(!el || !puedeManipularElemento(el)) return;
  if(editandoElemento) cerrarEditorElemento(true);
  editandoElemento = {
    id,
    original: {color: el.color, alfa: el.alfa, imagen: el.imagen, imgZoom: el.imgZoom, imgDX: el.imgDX, imgDY: el.imgDY},
  };
  renderEditorElemento();
}

function elegirImagenParaElemento(vivo){
  const entrada = $('#elemento-imagen-archivo');
  entrada.onchange = async ev => {
    const file = ev.target.files[0];
    ev.target.value = '';
    if(!file) return;
    try{
      const dato = await prepararImagenElemento(file);
      vivo({imagen: dato, imgZoom: 1, imgDX: 0, imgDY: 0});
      renderEditorElemento();
    }catch(err){
      console.error('No se pudo preparar la imagen del elemento:', err);
      toast(err.message === 'no-image' ? 'Eso no es una imagen' : 'No se pudo usar esa imagen');
    }
  };
  entrada.click();
}

function renderEditorElemento(){
  if(!editandoElemento) return;
  const id = editandoElemento.id;
  const el = elementos.get(id);
  const caja = $('#elem-edit');
  if(!el){ cerrarEditorElemento(false); return; }
  caja.hidden = false;

  const tieneImagen = !!el.imagen;
  const img = tieneImagen ? imagenLista(el.imagen) : null;
  if(tieneImagen && !img){
    // Todavía no cargó (recién puesta en el mapa): en cuanto cargue, se
    // vuelve a armar el panel para que aparezcan el visor y el zoom.
    const cruda = imagenesCache.get(el.imagen);
    if(cruda) cruda.addEventListener('load', () => {
      if(editandoElemento && editandoElemento.id === id) renderEditorElemento();
    }, {once: true});
  }
  let V = null;
  if(tieneImagen && img){
    const cajaMundo = cajaCeldas(celdasDeElemento(el, true));
    const dispScale = Math.min(230 / cajaMundo.w, 170 / cajaMundo.h);
    V = {w: Math.round(cajaMundo.w * dispScale), h: Math.round(cajaMundo.h * dispScale), dispScale, caja: cajaMundo};
  }

  caja.innerHTML = `
    <div id="elem-edit-cab"><span>⚙️ Editar elemento</span><button type="button" id="elem-edit-x" title="Cerrar sin guardar">✕</button></div>
    <label class="etiqueta" style="margin-top:0">Color</label>
    <div class="tk-lapiz-colores">${COLORES.map(c => `<button type="button" class="tk-color${c === el.color ? ' elegido' : ''}" data-eled-color="${c}" style="background:${c}"></button>`).join('')}</div>
    <label class="etiqueta">Transparencia</label>
    <input type="range" id="elem-edit-alfa" min="10" max="100" step="5" value="${el.alfa}">
    ${tieneImagen && V ? `
      <label class="etiqueta">Imagen (arrastrar para mover, rueda del mouse para zoom)</label>
      <div class="elem-edit-visor" id="elem-edit-visor" style="width:${V.w}px;height:${V.h}px"><img id="elem-edit-img" src="${el.imagen}"></div>
      <input type="range" id="elem-edit-zoom" min="100" max="600" step="1" value="${Math.round(el.imgZoom * 100)}">
      <div class="fila" style="margin-top:0">
        <button type="button" class="btn" id="elem-edit-imagen-cambiar">Cambiar imagen</button>

      <button type="button" class="btn primary" id="elem-edit-guardar">Guardar</button>
    </div>`;

  const vivo = cambios => { Object.assign(el, cambios); pedirDibujo(); };

  caja.querySelector('#elem-edit-x').onclick = () => cerrarEditorElemento(true);
  caja.querySelector('#elem-edit-cancelar').onclick = () => cerrarEditorElemento(true);
  caja.querySelector('#elem-edit-guardar').onclick = () => {
    const cambios = {color: el.color, alfa: el.alfa, imagen: el.imagen, imgZoom: el.imgZoom, imgDX: el.imgDX, imgDY: el.imgDY};
    editandoElemento = null;
    caja.hidden = true; caja.innerHTML = '';
    moverElemento(id, cambios);
  };
  caja.querySelectorAll('[data-eled-color]').forEach(b => b.onclick = () => {
    vivo({color: b.dataset.eledColor});
    caja.querySelectorAll('[data-eled-color]').forEach(x => x.classList.toggle('elegido', x === b));
  });
  caja.querySelector('#elem-edit-alfa').oninput = e => vivo({alfa: num(e.target.value)});

  if(tieneImagen && V){
    const visor = caja.querySelector('#elem-edit-visor');
    const elImg = caja.querySelector('#elem-edit-img');
    const zoomInput = caja.querySelector('#elem-edit-zoom');
    const aplicarImg = () => {
      const escalaBase = Math.max(V.caja.w / img.naturalWidth, V.caja.h / img.naturalHeight);
      const dispEscala = escalaBase * el.imgZoom * V.dispScale;
      const iw = img.naturalWidth * dispEscala, ih = img.naturalHeight * dispEscala;
      const cx = V.w / 2 + el.imgDX * V.dispScale, cy = V.h / 2 + el.imgDY * V.dispScale;
      elImg.style.width = iw + 'px'; elImg.style.height = ih + 'px';
      elImg.style.transform = `translate(${cx - iw / 2}px, ${cy - ih / 2}px)`;
    };
    const clamp = () => {
      const escalaBase = Math.max(V.caja.w / img.naturalWidth, V.caja.h / img.naturalHeight);
      const escalaMundo = escalaBase * el.imgZoom;
      const iwMundo = img.naturalWidth * escalaMundo, ihMundo = img.naturalHeight * escalaMundo;
      const maxDX = Math.max(0, (iwMundo - V.caja.w) / 2), maxDY = Math.max(0, (ihMundo - V.caja.h) / 2);
      el.imgDX = Math.max(-maxDX, Math.min(maxDX, el.imgDX));
      el.imgDY = Math.max(-maxDY, Math.min(maxDY, el.imgDY));
    };
    aplicarImg();
    let arrastre = null;
    visor.addEventListener('pointerdown', e => {
      visor.setPointerCapture(e.pointerId);
      arrastre = {x: e.clientX, y: e.clientY, dx: el.imgDX, dy: el.imgDY};
    });
    visor.addEventListener('pointermove', e => {
      if(!arrastre) return;
      el.imgDX = arrastre.dx + (e.clientX - arrastre.x) / V.dispScale;
      el.imgDY = arrastre.dy + (e.clientY - arrastre.y) / V.dispScale;
      clamp(); aplicarImg(); pedirDibujo();
    });
    const soltar = () => { arrastre = null; };
    visor.addEventListener('pointerup', soltar);
    visor.addEventListener('pointercancel', soltar);
    const porZoom = nuevoZoom => {
      el.imgZoom = Math.max(1, Math.min(6, nuevoZoom));
      clamp(); aplicarImg(); pedirDibujo();
      zoomInput.value = Math.round(el.imgZoom * 100);
    };
    zoomInput.addEventListener('input', () => porZoom(zoomInput.value / 100));
    visor.addEventListener('wheel', e => {
      e.preventDefault();
      porZoom(el.imgZoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
    }, {passive: false});
    caja.querySelector('#elem-edit-imagen-quitar').onclick = () => {
      vivo({imagen: '', imgZoom: 1, imgDX: 0, imgDY: 0});
      renderEditorElemento();
    };
    caja.querySelector('#elem-edit-imagen-cambiar').onclick = () => elegirImagenParaElemento(vivo);
  }else{
    caja.querySelector('#elem-edit-imagen-elegir').onclick = () => elegirImagenParaElemento(vivo);
  }
}

// Simplifica una línea a mano alzada (Douglas-Peucker): sacar puntos que
// no cambian casi nada el dibujo, tanto para que no pese como para limar
// el temblor del pulso. tolerancia en unidades del mapa.
function simplificarTrazo(puntos, tolerancia){
  if(puntos.length <= 2) return puntos;
  const distanciaSegmento = (p, a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const largo2 = dx * dx + dy * dy;
    if(!largo2) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / largo2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  };
  const recursivo = (pts) => {
    if(pts.length <= 2) return pts;
    let peorD = 0, peorI = 0;
    for(let i = 1; i < pts.length - 1; i++){
      const d = distanciaSegmento(pts[i], pts[0], pts[pts.length - 1]);
      if(d > peorD){ peorD = d; peorI = i; }
    }
    if(peorD <= tolerancia) return [pts[0], pts[pts.length - 1]];
    const izq = recursivo(pts.slice(0, peorI + 1));
    const der = recursivo(pts.slice(peorI));
    return izq.slice(0, -1).concat(der);
  };
  return recursivo(puntos);
}

// Línea suave entre puntos ya simplificados: una curva cuadrática por los
// puntos medios, para que no se note el trazo "poligonal".
function trazarSuave(ctx2, puntos){
  if(puntos.length < 2){
    if(puntos.length === 1){ ctx2.moveTo(puntos[0].x, puntos[0].y); ctx2.lineTo(puntos[0].x, puntos[0].y); }
    return;
  }
  ctx2.moveTo(puntos[0].x, puntos[0].y);
  if(puntos.length === 2){ ctx2.lineTo(puntos[1].x, puntos[1].y); return; }
  for(let i = 1; i < puntos.length - 1; i++){
    const p = puntos[i], sig = puntos[i + 1];
    const mx = (p.x + sig.x) / 2, my = (p.y + sig.y) / 2;
    ctx2.quadraticCurveTo(p.x, p.y, mx, my);
  }
  ctx2.lineTo(puntos[puntos.length - 1].x, puntos[puntos.length - 1].y);
}

function escucharTrazos(){
  let primeraVez = true;
  cortarTrazosListener = coleccionTrazos().onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed'){ trazos.delete(ch.doc.id); if(trazoSeleccionado === ch.doc.id) trazoSeleccionado = null; return; }
      const d = ch.doc.data({serverTimestamps: 'estimate'});
      const puntosCrudos = Array.isArray(d.puntos) ? d.puntos : [];
      const puntos = [];
      for(let i = 0; i + 1 < puntosCrudos.length; i += 2) puntos.push({x: num(puntosCrudos[i]), y: num(puntosCrudos[i + 1])});
      trazos.set(ch.doc.id, {
        puntos,
        origen: {x: num(d.origen && d.origen.x), y: num(d.origen && d.origen.y)},
        rotacion: num(d.rotacion),
        color: /^#[0-9a-fA-F]{6}$/.test(d.color || '') ? d.color : '#E0A458',
        grosor: num(d.grosor) || 4,
        permanente: d.permanente === true,
        duenoUid: d.duenoUid,
        creadoMs: d.creado && d.creado.toMillis ? d.creado.toMillis() : Date.now(),
      });
      // Temporal (estela): se borra sola a los pocos segundos, para todos
      // (cualquiera que la vea programa el borrado; si el que la dibujó se
      // fue, no queda huérfana).
      if(d.permanente !== true){
        const restan = ESTELA_MS - (Date.now() - (d.creado && d.creado.toMillis ? d.creado.toMillis() : Date.now()));
        setTimeout(() => { coleccionTrazos().doc(ch.doc.id).delete().catch(() => {}); }, Math.max(0, restan));
      }
    });
    pedirDibujo();
  }, err => console.error('Error escuchando los trazos:', err));
}

// Guarda un trazo nuevo ya simplificado, relativo a su propio centro (para
// poder moverlo/rotarlo entero después si es permanente).
async function guardarTrazo(puntosMundo, permanente){
  if(!fbUsuario || puntosMundo.length < 2) return;
  const tolerancia = 2.5 / vista.zoom;
  const suaves = simplificarTrazo(puntosMundo, tolerancia);
  const xs = suaves.map(p => p.x), ys = suaves.map(p => p.y);
  const origen = {x: (Math.min(...xs) + Math.max(...xs)) / 2, y: (Math.min(...ys) + Math.max(...ys)) / 2};
  const puntos = [];
  suaves.forEach(p => { puntos.push(p.x - origen.x, p.y - origen.y); });
  try{
    await coleccionTrazos().add({
      puntos, origen, rotacion: 0, color: lapizColor, grosor: 4, permanente: !!permanente,
      duenoUid: fbUsuario.uid, creado: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(err){
    console.error('No se pudo guardar el trazo:', err);
    toast(err.code === 'permission-denied' ? 'No se pudo: faltan publicar las reglas nuevas de Firestore' : 'No se pudo dibujar');
  }
}

// El trazo más cercano al punto (dentro de un margen), el de más arriba
// primero. Solo entre los permanentes: los temporales no se manipulan.
// Dónde va el handle para rotar el trazo seleccionado: a una distancia
// fija de su centro, en la dirección que ya tiene (0° = abajo, sentido
// horario — mismo criterio que el handle de rotación de los tokens).
function trazoManijaMundo(t){
  const rad = t.rotacion * Math.PI / 180;
  const r = HEX * 0.9;
  return {x: t.origen.x - r * Math.sin(rad), y: t.origen.y + r * Math.cos(rad)};
}

// Casilleros de una "flor": el centro y los que están a R pasos o menos.
function celdasFlor(R){
  const res = [];
  for(let dq = -R; dq <= R; dq++){
    for(let dr = Math.max(-R, -dq - R); dr <= Math.min(R, -dq + R); dr++) res.push({dq, dr});
  }
  return res;
}
// Línea recta de N casilleros (contando el origen) en la dirección más
// cercana a "hacia" (offset cubo aproximado, no hace falta que sea exacto).
function celdasLinea(hacia, N){
  let mejor = 0, mejorD = Infinity;
  VECINO_LADO.forEach(([dq, dr], i) => {
    const d = Math.hypot(hacia.dq - dq, hacia.dr - dr);
    if(d < mejorD){ mejorD = d; mejor = i; }
  });
  const [pq, pr] = VECINO_LADO[mejor];
  const res = [];
  for(let i = 0; i < N; i++) res.push({dq: pq * i, dr: pr * i});
  return res;
}

function trazoEn(x, y){
  const margen = 8 / vista.zoom;
  const distanciaSegmento = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    const largo2 = dx * dx + dy * dy;
    if(!largo2) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / largo2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  };
  const lista = [...trazos.entries()].filter(([, t]) => t.permanente).reverse();
  for(const [id, t] of lista){
    const ang = -t.rotacion * Math.PI / 180;
    const cos = Math.cos(ang), sin = Math.sin(ang);
    // Al punto, en el sistema propio del trazo (deshace traslación + rotación).
    const lx = (x - t.origen.x) * cos - (y - t.origen.y) * sin;
    const ly = (x - t.origen.x) * sin + (y - t.origen.y) * cos;
    for(let i = 0; i + 1 < t.puntos.length; i++){
      if(distanciaSegmento(lx, ly, t.puntos[i].x, t.puntos[i].y, t.puntos[i + 1].x, t.puntos[i + 1].y) <= margen + t.grosor / 2){
        return id;
      }
    }
  }
  return null;
}

// La ruta viaja con el movimiento como [col, fila, col, fila…] para que
// los demás vean la estela unos segundos.
async function moverToken(id, col, fila, celdas){
  const t = tokens.get(id);
  if(!t) return;
  // Se mueve ya en pantalla; si Firebase lo rechaza, vuelve solo a su lugar.
  t.col = col; t.fila = fila;
  const ruta = (celdas || []).slice(-RUTA_MAX_CELDAS).flatMap(c => [c.col, c.fila]);
  if(celdas && celdas.length > 1){
    t.rutaJson = JSON.stringify(ruta);
    estelas.set(id, {celdas: celdas.slice(), hasta: Date.now() + ESTELA_MS});
  }
  renderPanel();
  pedirDibujo();
  const doc = coleccionTokens().doc(id);
  try{
    await doc.update(ruta.length > 2 ? {col, fila, ruta} : {col, fila});
  }catch(err){
    // Reglas de Firestore sin publicar todavía (no conocen "ruta"): se mueve
    // igual, solo que los demás no ven la estela.
    if(err.code === 'permission-denied' && ruta.length > 2){
      try{ await doc.update({col, fila}); return; }catch(e){ err = e; }
    }
    console.error('No se pudo mover el token:', err);
    toast(err.code === 'permission-denied' ? 'No podés mover ese token' : 'No se pudo mover el token');
  }
}

// Mover libre: solo la casilla nueva. Se borra la ruta guardada para que
// nadie vea estela. El modo queda prendido para seguir moviendo sin
// clickear 🦶 de nuevo — lo apaga el mismo botón, Esc o cambiar de
// selección (activarMoverLibre, Escape más abajo, seleccionar()).
async function moverTokenLibre(id, col, fila){
  const t = tokens.get(id);
  if(!t){ moverLibre = null; lienzo.style.cursor = 'default'; return; }
  lienzo.style.cursor = 'crosshair';
  if(t.col === col && t.fila === fila){ pedirDibujo(); return; }
  const antes = {col: t.col, fila: t.fila, rutaJson: t.rutaJson};
  t.col = col; t.fila = fila; t.rutaJson = '[]';
  estelas.delete(id);
  renderPanel();
  pedirDibujo();
  try{
    await coleccionTokens().doc(id).update({col, fila, ruta: firebase.firestore.FieldValue.delete()});
  }catch(err){
    console.error('No se pudo mover el token:', err);
    Object.assign(t, antes);
    visibles.delete(id);
    pedirDibujo();
    toast(err.code === 'permission-denied'
      ? (soyGM && t.tipo === 'pj' ? 'No se pudo: faltan publicar las reglas nuevas de Firebase' : 'No podés mover ese token')
      : 'No se pudo mover el token');
  }
}

// Llama la atención sobre el cartel del movimiento sin confirmar.
function resaltarRutaConfirmar(){
  const caja = $('#ruta-confirmar');
  if(caja.hidden) return;
  caja.classList.remove('atencion');
  void caja.offsetWidth;  // reinicia la animación
  caja.classList.add('atencion');
  $('#ruta-no').focus();
}

function mostrarConfirmacionRuta(){
  const p = rutaPendiente;
  if(!p) return;
  const costo = p.pasos * p.porCasillero;
  const exceso = costo - Math.max(0, p.disponibles);
  $('#ruta-texto').textContent = `Mover ${p.pasos} casillero${p.pasos === 1 ? '' : 's'} · −${fmt(costo)} No2 (te quedan ${fmt(p.disponibles - costo)})` +
    (p.porCasillero !== 1 ? ` · ${fmt(p.porCasillero)} por casillero` : '') +
    (exceso > 0 ? ` · ⚠ te pasás por ${fmt(exceso)}` : '') +
    ' · clic afuera para confirmar';
  $('#ruta-confirmar').classList.toggle('excede', exceso > 0);
  $('#ruta-confirmar').hidden = false;
  document.body.classList.add('con-ruta');
}

function cancelarRuta(){
  rutaPendiente = null;
  $('#ruta-confirmar').hidden = true;
  document.body.classList.remove('con-ruta');
  pedirDibujo();
}

// Descuenta los Nitros en la ficha (parte "general" + resumen), igual que
// cambiarVidaPj con la vida. Puede quedar en negativo (moverse de más se
// permite, avisando). Devuelve los que quedan.
async function gastarNitros(fichaId, costo){
  const base = fbDb.doc(fbRutaCampana(`fichas/${fichaId}`));
  const parteRef = base.collection('partes').doc('general');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  return fbDb.runTransaction(async tx => {
    const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
    if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
    const datos = JSON.parse(parte.data().json || '{}');
    const r = ficha.data().resumen || {};
    const actual = datos.nitros === null || datos.nitros === undefined ? num(r.nitros) : num(datos.nitros);
    datos.nitros = actual - costo;
    tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
    tx.update(base, {'resumen.nitros': datos.nitros, actualizado: ts});
    return datos.nitros;
  });
}

// Lo mismo sobre la parte privada del creep (lo hace el GM).
function gastarNitrosCreep(creepId, costo){
  return modificarCreep(creepId, sc => {
    sc.nitros = num(sc.nitros) - costo;
    return sc.nitros;
  });
}

async function confirmarRuta(){
  const p = rutaPendiente;
  if(!p || p.confirmando) return;  // un solo cobro aunque lleguen dos clics
  p.confirmando = true;
  const t = tokens.get(p.id);
  $('#ruta-confirmar').hidden = true;
  document.body.classList.remove('con-ruta');
  if(!t){ cancelarRuta(); return; }
  const costo = p.pasos * p.porCasillero;
  try{
    const esCreep = t.tipo === 'creep';
    const quedan = esCreep ? await gastarNitrosCreep(t.fichaId, costo) : await gastarNitros(t.fichaId, costo);
    rutaPendiente = null;
    const fin = p.celdas[p.celdas.length - 1];
    await moverToken(p.id, fin.col, fin.fila, p.celdas);
    toast(esCreep
      ? `${nombreDe(t)}: −${fmt(costo)} No2 · le quedan ${fmt(quedan)}${quedan < 0 ? ' ⚠ se pasó de sus No2' : ''}`
      : `−${fmt(costo)} No2 · te quedan ${fmt(quedan)}${quedan < 0 ? ' ⚠ te pasaste de tus No2' : ''}`);
  }catch(err){
    console.error('No se pudo mover gastando Nitros:', err);
    toast(err.code === 'permission-denied' ? 'No podés gastar los Nitros de esa ficha' : 'No se pudo mover — mirá la consola');
    cancelarRuta();
  }
}
$('#ruta-no').onclick = cancelarRuta;

function escucharTokens(){
  escucharTokens.listo = false;
  cortarTokensListener = coleccionTokens().onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed'){
        tokens.delete(ch.doc.id); visibles.delete(ch.doc.id);
        if(seleccion === ch.doc.id) seleccion = null;
        return;
      }
      const d = ch.doc.data({serverTimestamps: 'estimate'});
      // Ruta nueva de otro (la propia ya se mostró al mover): estela unos segundos.
      const previo = tokens.get(ch.doc.id);
      const ruta = Array.isArray(d.ruta) ? d.ruta.map(v => Math.round(num(v))) : [];
      const rutaJson = JSON.stringify(ruta);
      if(ch.type === 'modified' && ruta.length > 2 && previo && previo.rutaJson !== rutaJson){
        const celdas = [];
        for(let i = 0; i + 1 < ruta.length; i += 2) celdas.push({col: ruta[i], fila: ruta[i + 1]});
        estelas.set(ch.doc.id, {celdas, hasta: Date.now() + ESTELA_MS});
      }
      tokens.set(ch.doc.id, {
        rutaJson,
        nombre: String(d.nombre || '?'),
        color: d.color,
        tipo: d.tipo === 'creep' ? 'creep' : 'pj',
        duenoUid: d.duenoUid,
        fichaId: typeof d.fichaId === 'string' ? d.fichaId : '',
        col: Math.round(num(d.col)),
        fila: Math.round(num(d.fila)),
        creadoMs: d.creado && d.creado.toMillis ? d.creado.toMillis() : 0,
        // Ojo: lo que no se copie acá se pierde al volver de Firebase.
        aura: d.aura && typeof d.aura === 'object' ? d.aura : null,
        barras: d.barras && typeof d.barras === 'object' ? d.barras : null,
        imagen: typeof d.imagen === 'string' ? d.imagen : '',
        rotacion: (((Math.round(num(d.rotacion) / 60) * 60) % 360) + 360) % 360,
        oculto: d.oculto === true,
      });
    });
    renderIniciativa();
    const primeraVez = !escucharTokens.listo;
    escucharTokens.listo = true;
    if(primeraVez && !ajustarTamano.habiaVista) centrarEnMios();
    renderPanel();
    pedirDibujo();
  }, err => {
    console.error('Error escuchando los tokens:', err);
    mostrarAviso('No se pudieron leer los tokens. ¿Están publicadas las reglas nuevas de Firestore? (mirá la consola)');
  });
}

function prepararImagenFondo(file){
  return new Promise((res, rej) => {
    if(!file.type || !file.type.startsWith('image/')){ rej(new Error('no-image')); return; }
    const lector = new FileReader();
    lector.onerror = () => rej(lector.error);
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('bad-image'));
      img.onload = () => {
        let lado = 2000, calidad = 0.82, dato = '';
        for(let i = 0; i < 8; i++){
          const escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.naturalWidth * escala);
          canvas.height = Math.round(img.naturalHeight * escala);
          const c = canvas.getContext('2d');
          c.fillStyle = '#17121A'; c.fillRect(0, 0, canvas.width, canvas.height);
          c.drawImage(img, 0, 0, canvas.width, canvas.height);
          dato = canvas.toDataURL('image/jpeg', calidad);
          if(dato.length < 900000) break;
          lado = Math.round(lado * 0.8); calidad = Math.max(0.6, calidad - 0.05);
        }
        dato.length < 900000 ? res(dato) : rej(new Error('muy-grande'));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

        for(let i = 0; i < 8; i++){

      .forEach(([id, f]) => {

// cambiados la ficha, gm-tools, el tablero y los demás. Los PJ los cambia

function puedoCambiarVida(t){

// "12" fija el valor; "+5" / "-3" suma o resta. null si no se entiende.
function leerValorVital(texto, actual){
  const crudo = String(texto || '').trim().replace(',', '.').replace('−', '-');
  const m = crudo.match(/^([+-])\s*(\d+(?:\.\d+)?)$/);
  if(m) return actual + parseFloat(m[2]) * (m[1] === '-' ? -1 : 1);
  if(/^\d+(?:\.\d+)?$/.test(crudo)) return parseFloat(crudo);
  return null;
}
const ERROR_TIPEO = 'tipeo';

// Mismo hash que gm-tools usa para la firma del creep (gmHash): al cambiar
// la firma, gm-tools se da cuenta y trae el creep actualizado.
function hashGm(s){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

// Cambia el creep completo (parte privada) en una transacción y pone al día
// su resumen público y la firma. Devuelve lo que devuelva cambiar(sc).
async function modificarCreep(creepId, cambiar){
  const base = fbDb.doc(fbRutaCampana(`creeps/${creepId}`));
  const privRef = base.collection('privado').doc('ficha');
  return fbDb.runTransaction(async tx => {
    const [priv, pub] = await Promise.all([tx.get(privRef), tx.get(base)]);
    if(!priv.exists || !pub.exists) throw new Error('El creep ya no existe');
    const sc = JSON.parse(priv.data().json || '{}');
    const resultado = cambiar(sc);
    const hpMax = num(sc.hpMax);
    const json = JSON.stringify(sc);
    // La firma es hash(creep)-hash(imagen); la imagen no cambia.
    const firmaVieja = String(pub.data().firma || '');
    const parteImagen = firmaVieja.includes('-') ? firmaVieja.slice(firmaVieja.indexOf('-') + 1) : hashGm('');
    tx.set(privRef, {json});
    tx.update(base, {
      'resumen.hpPct': hpMax > 0 ? Math.round(Math.max(0, Math.min(1, sc.hp / hpMax)) * 100) : 0,
      'resumen.muerto': sc.hp <= 0,
      'resumen.estados': (Array.isArray(sc.estados) ? sc.estados : [])
        .filter(e => e && e.activo !== false && e.nombre).slice(0, 30)
        .map(e => ({
          nombre: String(e.nombre).slice(0, 60), turnos: num(e.turnos), permanente: !!e.permanente,
          polaridad: e.polaridad === 'buff' || e.polaridad === 'debuff' ? e.polaridad : '',
        })),
      firma: hashGm(json) + '-' + parteImagen,
      actualizado: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return resultado;
  });
}

async function cambiarVidaCreep(creepId, texto){
  await modificarCreep(creepId, sc => {
    const hpMax = num(sc.hpMax);
    const nuevo = leerValorVital(texto, num(sc.hp));
    if(nuevo === null) throw new Error(ERROR_TIPEO);
    sc.hp = Math.max(0, hpMax > 0 ? Math.min(hpMax, nuevo) : nuevo);
  });
}

async function cambiarVidaPj(t, clave, texto){
  const [fichaId, invId] = t.fichaId.split(SEP_INVOCACION);
  const base = fbDb.doc(fbRutaCampana(`fichas/${fichaId}`));
  const parteRef = base.collection('partes').doc(invId ? 'invocaciones' : 'general');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  await fbDb.runTransaction(async tx => {
    const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
    if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
    const datos = JSON.parse(parte.data().json || '{}');
    const r = ficha.data().resumen || {};
    const cambios = {actualizado: ts};
    if(invId){
      const inv = (datos.invocaciones || []).find(i => i && i.id === invId);
      if(!inv) throw new Error('La invocación ya no existe');
      const nuevo = leerValorVital(texto, num(inv.hp));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      inv.hp = Math.max(0, num(inv.hpMax) > 0 ? Math.min(num(inv.hpMax), nuevo) : nuevo);
      cambios['resumen.invocaciones'] = (r.invocaciones || []).map(i => i.id === invId ? {...i, hp: inv.hp} : i);
    }else if(clave === 'hp'){
      const hpMax = num(r.hpMax);
      const nuevo = leerValorVital(texto, num(datos.hp));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      datos.hp = Math.max(0, hpMax > 0 ? Math.min(hpMax, nuevo) : nuevo);
      cambios['resumen.hp'] = datos.hp;
    }else{
      // SP disponible = máximo - gastado (igual que en la ficha).
      const {spMax, campoGastado, campoResumen} = spDeResumen(r);
      const nuevo = leerValorVital(texto, spMax - num(datos[campoGastado]));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      const sp = Math.min(spMax, nuevo);
      datos[campoGastado] = spMax - sp;
      cambios[campoResumen] = sp;
    }
    tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
    tx.update(base, cambios);
  });
}

// GM: escucha la parte privada de cada creep que tiene token en el mapa
// (vida con números y No2 para cobrar al moverlo). Deja de escuchar los
// que ya no están.
function actualizarEscuchasCreeps(){
  const queridos = new Set(soyGM && fbDb
    ? [...tokens.values()].filter(t => t.tipo === 'creep' && t.fichaId).map(t => t.fichaId)
    : []);
  creepsPriv.forEach((e, id) => {
    if(queridos.has(id)) return;
    e.cortar();
    creepsPriv.delete(id);
  });
  queridos.forEach(id => {
    if(creepsPriv.has(id)) return;
    const e = {sc: null, cortar: null};
    creepsPriv.set(id, e);
    e.cortar = fbDb.doc(fbRutaCampana(`creeps/${id}/privado/ficha`)).onSnapshot(doc => {
      let sc = null;
      try{ sc = doc.exists ? JSON.parse(doc.data().json || '{}') : null; }catch(err){}
      e.sc = sc;
      renderPanel();
    }, err => console.error('Error leyendo el creep:', err));
  });
}
