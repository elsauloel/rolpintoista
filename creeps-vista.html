<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creeps — Vista de jugadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    repeating-linear-gradient(0deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    radial-gradient(120% 80% at 50% 0%, #1C1418 0%, var(--ink) 70%);
  color:var(--paper); font-family:"Space Grotesk", system-ui, sans-serif; font-size:14px; line-height:1.4;
  min-height:100vh;
}
button{cursor:pointer;background:none;border:none;padding:0;font-family:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:22px 18px 90px}

.hero{
  border:1px solid var(--line);border-top:3px solid var(--copper);
  background:linear-gradient(180deg, rgba(201,133,69,.10), rgba(0,0,0,0) 60%), var(--panel);
  padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
}
.hero h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em}
.eyebrow{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.actualizado{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}

.btn{
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);white-space:nowrap
}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08;font-weight:700}
.btn.primary:hover{background:var(--brass)}
input[type=file]{display:none}

.empty-state{
  border:1px dashed var(--line);padding:44px 20px;text-align:center;color:var(--muted);
  font-family:"Space Mono",monospace;font-size:12px;margin-top:16px
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.creep-card{border:1px solid var(--line);background:var(--panel);border-top:3px solid var(--accent,var(--copper));display:flex;flex-direction:column}
.creep-thumb{width:100%;aspect-ratio:4/3;background:#0B0708;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line-soft)}
.creep-thumb img{width:100%;height:100%;object-fit:cover}
.creep-thumb .vacio{font-family:"Fraunces",serif;font-size:13px;color:var(--muted)}
.creep-body{padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.creep-nombre{font-family:"Fraunces",serif;font-weight:700;font-size:15px}
.hp-bar-wrap{border:1px solid var(--line-soft);background:rgba(0,0,0,.3);height:9px;position:relative;overflow:hidden}
.hp-bar-fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--wine),#C4485A)}
.hp-nums{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.hp-nums b{color:var(--brass)}
.estado-tags{display:flex;flex-wrap:wrap;gap:5px}
.estado-tag{
  font-family:"Space Mono",monospace;font-size:9.5px;border:1px solid var(--absenta);color:var(--absenta);
  padding:2px 7px;border-radius:99px
}
.sin-estados{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted)}
.verbtn{
  font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);padding:6px 10px;border-radius:var(--r);color:var(--paper);margin-top:2px
}
.verbtn:hover{border-color:var(--copper);color:var(--brass)}

.scrim{position:fixed;inset:0;background:rgba(8,5,7,.78);backdrop-filter:blur(3px);display:none;z-index:80;padding:24px;overflow:auto}
.scrim.open{display:block}
.modal{max-width:460px;margin:6vh auto;border:1px solid var(--line);border-top:3px solid var(--copper);background:var(--panel)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.iconbtn{
  font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);padding:3px 8px;color:var(--muted);border-radius:var(--r)
}
.iconbtn:hover{border-color:var(--copper);color:var(--brass)}
.view-image-wrap{width:100%;aspect-ratio:4/3;background:#0B0708;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden}
.view-image-wrap img{width:100%;height:100%;object-fit:contain}
.view-image-wrap .vacio{font-family:"Fraunces",serif;font-size:14px;color:var(--muted)}
.view-body{padding:16px}
.view-hp{font-family:"Space Mono",monospace;font-size:22px;font-weight:700;color:var(--brass);margin-bottom:10px}
.view-hp span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow">Vista de jugadores</div>
      <h1>Estado de los Creeps</h1>
      <div class="actualizado" id="actualizado"></div>
    </div>
    <div>
      <button class="btn primary" id="btn-load">Cargar datos</button>
      <input type="file" id="file-input" accept=".json">
    </div>
  </div>

  <div id="empty" class="empty-state">Todavía no cargaste ningún archivo. Tocá "Cargar datos" y elegí el <b>creeps-publico.json</b> que subió el máster.</div>
  <div class="grid" id="grid"></div>
</div>

<div class="scrim" id="scrim-view">
  <div class="modal">
    <header><h3 id="view-title">Creep</h3><button class="iconbtn" id="view-x">Cerrar</button></header>
    <div class="view-image-wrap" id="view-image-wrap"></div>
    <div class="view-body" id="view-body"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmt = n => Number.isInteger(n) ? n : Math.round(n*100)/100;
const esc = s => String(s??'').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const COLORES = ['#C4485A','#D07B3A','#8FB84F','#4FA88C','#9B7BD4','#6FA8D8'];

let data = { actualizado:'', creeps:[] };

function render(){
  $('#empty').style.display = data.creeps.length ? 'none' : 'block';
  $('#actualizado').textContent = data.actualizado ? `Última actualización: ${new Date(data.actualizado).toLocaleString('es-AR')}` : '';
  $('#grid').innerHTML = data.creeps.map((sc, i) => {
    const pct = sc.hpMax > 0 ? Math.max(0, Math.min(100, num(sc.hp)/num(sc.hpMax)*100)) : 0;
    const estados = (sc.estados||[]).filter(es => es.nombre);
    return `<div class="creep-card" style="--accent:${COLORES[i % COLORES.length]}" data-idx="${i}">
      <div class="creep-thumb">${sc.imagen ? `<img src="${esc(sc.imagen)}" alt="">` : `<span class="vacio">Sin imagen</span>`}</div>
      <div class="creep-body">
        <div class="creep-nombre">${esc(sc.nombre)}</div>
        <div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:${pct}%"></div></div>
        <div class="hp-nums"><span>HP</span><b>${fmt(num(sc.hp))} / ${fmt(num(sc.hpMax))}</b></div>
        ${estados.length
          ? `<div class="estado-tags">${estados.map(es => `<span class="estado-tag">${esc(es.nombre)} · ${fmt(num(es.turnos))}t</span>`).join('')}</div>`
          : `<div class="sin-estados">Sin estados alterados.</div>`}
        <button class="verbtn" data-ver="${i}">Ver</button>
      </div>
    </div>`;
  }).join('');
}

function verCreep(i){
  const sc = data.creeps[i];
  if(!sc) return;
  $('#view-title').textContent = sc.nombre || 'Creep';
  $('#view-image-wrap').innerHTML = sc.imagen ? `<img src="${esc(sc.imagen)}" alt="">` : `<span class="vacio">Sin imagen</span>`;
  const estados = (sc.estados||[]).filter(es => es.nombre);
  $('#view-body').innerHTML = `
    <div class="view-hp">${fmt(num(sc.hp))} <span>/ ${fmt(num(sc.hpMax))} HP</span></div>
    <div class="estado-tags">${estados.length
      ? estados.map(es => `<span class="estado-tag">${esc(es.nombre)} · ${fmt(num(es.turnos))} turno(s)</span>`).join('')
      : '<span class="sin-estados">Sin estados alterados.</span>'}</div>
  `;
  $('#scrim-view').classList.add('open');
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.id === 'btn-load'){ $('#file-input').click(); return; }
  if(b.id === 'view-x'){ $('#scrim-view').classList.remove('open'); return; }
  if(b.dataset.ver !== undefined){ verCreep(+b.dataset.ver); return; }
});
$('#scrim-view').addEventListener('mousedown', e => { if(e.target.id==='scrim-view') $('#scrim-view').classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key==='Escape') $('#scrim-view').classList.remove('open'); });

$('#file-input').onchange = ev => {
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      if(!Array.isArray(parsed.creeps)) throw new Error('formato inválido');
      data = parsed;
      render();
    }catch(err){
      alert('Ese archivo no tiene el formato esperado (creeps-publico.json).');
    }
  };
  r.readAsText(f);
  ev.target.value = '';
};

render();
</script>
</body>
</html>
