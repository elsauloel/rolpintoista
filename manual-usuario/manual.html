<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual — Rol Pintoísta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --azul:#5B9BD5; --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 80% at 50% 0%, #1C1418 0%, var(--ink) 70%);
  color:var(--paper);font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px;line-height:1.5;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
h1,h2,h3,h4{font-family:"Fraunces",serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--brass)}
.mono{font-family:"Space Mono",monospace}

/* ---------- Cabecera ---------- */
header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
header .marca{font-family:"Fraunces",serif;font-size:18px;font-weight:600;cursor:pointer;white-space:nowrap;background:none;border:none;color:var(--paper);padding:0}
header .marca small{display:block;font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);font-weight:400}
.buscador{position:relative;flex:1;max-width:560px;min-width:160px}
.buscador input{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--paper);
  padding:8px 34px 8px 34px;border-radius:999px;font:inherit;font-size:14px
}
.buscador input:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
.buscador .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.buscador kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
#sugerencias{
  position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--copper);
  border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.6);z-index:60;max-height:70vh;overflow-y:auto;display:none
}
#sugerencias.abierto{display:block}
.sug{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line-soft);padding:9px 12px}
.sug:last-child{border-bottom:none}
.sug.sel,.sug:hover{background:var(--panel2)}
.sug .t{font-weight:700;color:var(--brass)}
.sug .c{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);margin-left:6px}
.sug .s{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sug-vacio{padding:12px;color:var(--muted)}
mark{background:rgba(224,164,88,.32);color:var(--paper);border-radius:2px;padding:0 1px}
header .acciones{display:flex;gap:6px;margin-left:auto}
.iconbtn{border:1px solid var(--line);background:none;color:var(--muted);border-radius:var(--r);padding:6px 10px;font-size:13px;white-space:nowrap}
.iconbtn:hover:not(:disabled){border-color:var(--copper);color:var(--brass)}
.iconbtn:disabled{opacity:.35;cursor:default}

/* ---------- Estructura ---------- */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 250px}
nav.arbol,main.contenido,aside.lateral{min-height:0;overflow-y:auto}
nav.arbol{border-right:1px solid var(--line);padding:14px 10px}
aside.lateral{border-left:1px solid var(--line);padding:18px 14px}
main.contenido{padding:26px 38px 60px;scroll-behavior:smooth}
main.contenido > .hoja{max-width:780px;margin:0 auto}
@media(max-width:1180px){.layout{grid-template-columns:250px minmax(0,1fr)} aside.lateral{display:none}}
@media(max-width:800px){
  body{height:auto;overflow:auto}
  .layout{display:block}
  nav.arbol{border-right:none;border-bottom:1px solid var(--line);max-height:38vh}
  main.contenido{padding:18px 16px 50px;overflow:visible}
}

/* ---------- Árbol ---------- */
.arbol .cap-cab{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--r);cursor:pointer;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);user-select:none}
.arbol .cap-cab:hover{background:var(--panel2)}
.arbol .cap-cab .car{font-size:9px;color:var(--muted);transition:transform .15s}
.arbol .cap.cerrado .car{transform:rotate(-90deg)}
.arbol .cap.cerrado .notas{display:none}
.arbol .cap-cab .n{margin-left:auto;color:var(--muted);font-size:10px}
.arbol .notas{display:flex;flex-direction:column;gap:1px;margin:1px 0 8px 12px;padding-left:8px;border-left:1px solid var(--line-soft)}
.arbol .nota-btn{text-align:left;border:none;background:none;padding:5px 8px;border-radius:var(--r);font-size:13px;color:var(--paper);border-left:2px solid transparent;display:flex;gap:6px;align-items:baseline}
.arbol .nota-btn:hover{background:var(--panel2)}
.arbol .nota-btn.activa{background:var(--panel2);border-left-color:var(--copper);color:var(--brass);font-weight:700}
.arbol .nota-btn .e{font-size:9px;opacity:.85;flex:none}
.arbol h5{margin:16px 8px 6px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--copper);color:var(--brass)}
.chip .n{opacity:.6;margin-left:3px}

/* ---------- Nota ---------- */
.migas{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.migas a{color:var(--copper);text-decoration:none}
.migas a:hover{text-decoration:underline}
.hoja > h1{font-size:34px;line-height:1.15;margin-bottom:10px}
.hoja .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.badge{font-family:"Space Mono",monospace;font-size:10.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.badge.confirmado{color:var(--absenta);border-color:rgba(168,194,86,.5)}
.badge.borrador{color:var(--brass);border-color:rgba(224,164,88,.5)}
.badge.pendiente{color:var(--muted)}
.cuerpo{font-size:15.5px;line-height:1.75}
.cuerpo p{margin:0 0 15px}
.cuerpo ul,.cuerpo ol{margin:0 0 15px;padding-left:24px}
.cuerpo li{margin-bottom:5px}
.cuerpo li > ul,.cuerpo li > ol{margin:5px 0 5px}
.cuerpo strong{color:var(--brass)}
.cuerpo em{color:#f1e7d4}
.cuerpo code{font-family:"Space Mono",monospace;font-size:12.8px;background:var(--panel2);border:1px solid var(--line-soft);padding:1px 6px;border-radius:var(--r)}
.cuerpo h2{font-size:24px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);scroll-margin-top:12px}
.cuerpo h3{font-size:19px;margin:26px 0 10px;color:var(--brass);scroll-margin-top:12px}
.cuerpo h4{font-size:16px;margin:20px 0 8px;scroll-margin-top:12px}
.cuerpo hr{border:none;border-top:1px solid var(--line-soft);margin:24px 0}
.cuerpo .tabla{overflow-x:auto;margin:0 0 18px}
.cuerpo table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.cuerpo th,.cuerpo td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
.cuerpo th{background:var(--panel2);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
.cuerpo tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.cuerpo blockquote{margin:0 0 15px;padding:10px 16px;border-left:3px solid var(--copper);background:rgba(201,133,69,.07);border-radius:0 var(--r) var(--r) 0}
.cuerpo .task{list-style:none;margin-left:-22px}
.cuerpo pre{background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;overflow-x:auto;font-size:12.8px}

/* Enlaces internos, estilo Obsidian */
a.wl{color:var(--azul);text-decoration:none;border-bottom:1px dotted rgba(91,155,213,.55);cursor:pointer}
a.wl:hover{color:#8fc2ee;border-bottom-style:solid}
a.wl.roto{color:var(--muted);border-bottom:1px dashed var(--muted)}
a.wl.roto::after{content:" ✎";font-size:.8em}

/* Callouts */
.callout{margin:0 0 17px;border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);background:var(--panel);overflow:hidden}
.callout .ct{display:flex;gap:8px;align-items:center;padding:8px 14px;font-weight:700;font-size:14px}
.callout .cb{padding:0 16px 4px;font-size:15px}
.callout .cb > :last-child{margin-bottom:10px}
.callout.tip{border-left-color:var(--absenta)} .callout.tip .ct{color:var(--absenta);background:rgba(168,194,86,.07)}
.callout.info,.callout.note{border-left-color:var(--azul)} .callout.info .ct,.callout.note .ct{color:var(--azul);background:rgba(91,155,213,.07)}
.callout.warning{border-left-color:var(--danger)} .callout.warning .ct{color:var(--danger);background:rgba(212,87,78,.07)}
.callout.example{border-left-color:var(--brass)} .callout.example .ct{color:var(--brass);background:rgba(224,164,88,.07)}
.callout.question{border-left-color:#B784E0;border-style:dashed;border-left-style:solid} .callout.question .ct{color:#c9a3ea;background:rgba(183,132,224,.09)}

/* Pie de la nota */
.pie{margin-top:44px;border-top:1px solid var(--line);padding-top:18px}
.pie h4{font-family:"Space Mono",monospace;font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lista-links{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:18px}

/* Lateral */
aside.lateral h4{font-family:"Space Mono",monospace;font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
aside.lateral .bloque{margin-bottom:22px}
aside.lateral a.item{display:block;color:var(--paper);text-decoration:none;padding:3px 0;font-size:13px;border-left:2px solid transparent;padding-left:8px}
aside.lateral a.item:hover{color:var(--brass);border-left-color:var(--copper)}
aside.lateral a.item.h3{padding-left:20px;color:var(--muted);font-size:12.5px}
aside.lateral .vacio{color:var(--muted);font-size:12.5px}

/* Inicio y listas */
.hero{padding:10px 0 24px}
.hero h1{font-size:40px;line-height:1.1;margin-bottom:8px}
.hero p{color:var(--muted);font-size:16px;max-width:560px}
.grilla-cap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:22px 0}
.tarjeta{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px 16px;text-align:left;text-decoration:none;color:var(--paper);display:block}
.tarjeta:hover{border-color:var(--copper);background:var(--panel2)}
.tarjeta .ic{font-size:24px}
.tarjeta h3{font-size:17px;margin:4px 0 4px}
.tarjeta p{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.45}
.barra{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line-soft)}
.barra i{display:block;height:100%}
.barra .c{background:var(--absenta)} .barra .b{background:var(--brass)} .barra .p{background:#5a4d52}
.tarjeta .mini{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);margin-top:5px}
.resultado{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;text-decoration:none;color:var(--paper);background:var(--panel)}
.resultado:hover{border-color:var(--copper)}
.resultado .t{font-weight:700;color:var(--brass);font-size:16px}
.resultado .c{font-family:"Space Mono",monospace;font-size:10.5px;color:var(--muted);margin-left:8px}
.resultado .s{color:var(--muted);font-size:13.5px;margin-top:3px}
.az{columns:2 280px;column-gap:26px}
.az a{display:block;padding:3px 0;color:var(--paper);text-decoration:none;break-inside:avoid}
.az a:hover{color:var(--brass)}
.az .letra{font-family:"Fraunces",serif;font-size:22px;color:var(--copper);margin:14px 0 4px;break-after:avoid}
.az small{color:var(--muted)}
.vacio-grande{text-align:center;color:var(--muted);padding:40px 0}

/* Vista previa al pasar el mouse */
#preview{position:fixed;z-index:80;max-width:340px;background:var(--panel);border:1px solid var(--copper);border-radius:var(--r);padding:11px 14px;box-shadow:0 10px 26px rgba(0,0,0,.6);display:none;pointer-events:none}
#preview .t{font-family:"Fraunces",serif;font-weight:600;color:var(--brass);margin-bottom:4px}
#preview .s{font-size:13px;color:var(--paper);line-height:1.5}
#preview .c{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);margin-top:6px}

/* Grafo */
#grafo{position:fixed;inset:0;z-index:70;background:#0c090b;display:none;flex-direction:column}
#grafo.abierto{display:flex}
#grafo .barra-g{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
#grafo .barra-g h3{font-size:17px;white-space:nowrap}
#grafo .leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-left:14px}
#grafo .leyenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#grafo canvas{flex:1;width:100%;min-height:0;cursor:grab}
#grafo .ayuda{position:absolute;left:18px;bottom:12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <button class="marca" id="btn-inicio" title="Ir al inicio">📖 Manual<small>ROL PINTOÍSTA</small></button>
  <div class="buscador">
    <span class="lupa">🔍</span>
    <input id="q" type="search" autocomplete="off" placeholder="Buscar una regla, un término, una palabra…" aria-label="Buscar en el manual">
    <kbd>/</kbd>
    <div id="sugerencias"></div>
  </div>
  <div class="acciones">
    <button class="iconbtn" id="btn-atras" title="Volver (Alt + ←)">←</button>
    <button class="iconbtn" id="btn-adelante" title="Adelante (Alt + →)">→</button>
    <button class="iconbtn" id="btn-az" title="Índice de todas las notas">A–Z</button>
    <button class="iconbtn" id="btn-pend" title="Preguntas abiertas y cosas por completar">📌 Pendientes</button>
    <button class="iconbtn" id="btn-grafo" title="Mapa de cómo se conectan las notas">🕸 Mapa</button>
  </div>
</header>

<div class="layout">
  <nav class="arbol" id="arbol" aria-label="Índice del manual"></nav>
  <main class="contenido" id="contenido"><div class="hoja"><p class="vacio-grande">Cargando el manual…</p></div></main>
  <aside class="lateral" id="lateral"></aside>
</div>

<div id="preview"></div>

<div id="grafo">
  <div class="barra-g">
    <h3>🕸 Mapa del manual</h3>
    <div class="leyenda" id="leyenda-g"></div>
    <button class="iconbtn" id="cerrar-grafo" style="margin-left:auto">✕ Cerrar (Esc)</button>
  </div>
  <canvas id="lienzo"></canvas>
  <div class="ayuda">Arrastrá el fondo para mover · rueda para acercar · clic en una nota para abrirla · las notas huecas todavía no están escritas</div>
</div>

<script>
/* =========================================================
   Manual del Rol Pintoísta — navegable como un vault de Obsidian.
   El contenido vive en datos/manual.json, que sale de compilar los
   archivos de manual-usuario/notas/*.md con
   herramientas/compilar_manual.py. Este archivo solo lee y muestra.
   ========================================================= */
const GH_REPO = 'elsauloel/rolpintoista';
const GH_BRANCH = 'nueva-version';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const slug = s => fold(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const ESTADO = {confirmado: ['✅', 'Confirmado'], borrador: ['🟡', 'Borrador'], pendiente: ['🔲', 'Pendiente']};
const PALETA = ['#E0A458', '#5B9BD5', '#A8C256', '#D4574E', '#B784E0', '#4FA88C', '#D07B3A', '#C4485A', '#8FB84F', '#7d9ab8', '#c9a3ea', '#e6c87a', '#6fbf9f', '#b89a7a'];

let M = null, porId = {}, porNombre = {}, capPorId = {}, enlacesSal = {}, enlacesEnt = {}, rotos = {};

/* ---------- Carga ---------- */
async function cargar(){
  let datos = null;
  try{
    const r = await fetch('../datos/manual.json', {cache: 'no-store'});
    if(r.ok) datos = await r.json();
  }catch(e){ /* file:// u offline: se prueba GitHub */ }
  if(!datos){
    try{
      const r = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/datos/manual.json`, {cache: 'no-store'});
      if(r.ok) datos = await r.json();
    }catch(e){}
  }
  if(!datos){
    $('#contenido').innerHTML = '<div class="hoja"><p class="vacio-grande">No se pudo cargar el manual. Abrilo desde el sitio web, o revisá tu conexión.</p></div>';
    return;
  }
  M = datos;
  indexar();
  dibujarArbol();
  window.addEventListener('hashchange', ruta);
  ruta();
}

function indexar(){
  porId = {}; porNombre = {}; capPorId = {}; enlacesSal = {}; enlacesEnt = {}; rotos = {};
  M.capitulos.forEach(c => capPorId[c.id] = c);
  M.notas.forEach(n => {
    porId[n.id] = n;
    [n.id, n.titulo, ...(n.alias || [])].forEach(k => { const f = fold(k); if(f && !porNombre[f]) porNombre[f] = n; });
    n._t = fold(n.titulo); n._a = (n.alias || []).map(fold); n._tags = (n.tags || []).map(fold);
    n._plano = textoPlano(n.cuerpo);
    n._b = fold(n._plano);
    n._h = fold(encabezados(n.cuerpo).map(h => h.texto).join(' | '));
    n._res = resumenDe(n.cuerpo);
  });
  M.notas.forEach(n => {
    enlacesSal[n.id] = new Set();
    for(const m of sinCodigo(n.cuerpo).replace(/\\\|/g, '|').matchAll(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g)){
      const dest = porNombre[fold(m[1].trim())];
      if(dest){
        if(dest.id !== n.id){
          enlacesSal[n.id].add(dest.id);
          (enlacesEnt[dest.id] = enlacesEnt[dest.id] || new Set()).add(n.id);
        }
      }else{
        const k = m[1].trim();
        (rotos[k] = rotos[k] || new Set()).add(n.id);
      }
    }
  });
}

/* ---------- Texto plano y resúmenes ---------- */
function sinCodigo(md){ return md.replace(/```[\s\S]*?```/g, '').replace(/`[^`\n]*`/g, ''); }
function textoPlano(md){
  return md.replace(/\\\|/g, '|').replace(/^\s*>\s*\[![^\]]+\][+-]?\s*/gm, '').replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?\|([^\]]+)\]\]/g, '$2')
    .replace(/\[\[([^\]|#]+)(?:#([^\]|]*))?\]\]/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^\s*#{1,4}\s*/gm, '').replace(/^\s*>\s?/gm, '').replace(/^\s*\|?[-: |]+\|?\s*$/gm, '')
    .replace(/[*_`|]/g, '').replace(/^\s*[-*]\s+/gm, '').replace(/\s+/g, ' ').trim();
}
function resumenDe(md){
  const bloques = md.split(/\n\s*\n/).map(b => b.trim()).filter(b => b && !/^(#|\||>\s*\[!|---)/.test(b));
  const t = textoPlano(bloques[0] || '');
  return t.length > 230 ? t.slice(0, 227).replace(/\s+\S*$/, '') + '…' : t;
}
function encabezados(md){
  const out = [];
  let enCodigo = false;
  md.split('\n').forEach(l => {
    if(/^```/.test(l)) enCodigo = !enCodigo;
    const m = !enCodigo && l.match(/^(#{2,4})\s+(.*)$/);
    if(m) out.push({nivel: m[1].length, texto: m[2].replace(/[*_`]/g, '').trim(), id: slug(m[2])});
  });
  return out;
}

/* ---------- Markdown ---------- */
function resolverLink(nombre){ return porNombre[fold(nombre.trim())] || null; }
function inline(s){
  const cods = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { cods.push(c); return `@@C${cods.length - 1}@@`; });
  s = esc(s);
  s = s.replace(/\[\[([^\]|#]+)(?:#([^\]|]*))?(?:\|([^\]]*))?\]\]/g, (_, nom, sec, txt) => {
    nom = nom.replace(/&amp;/g, '&');
    const n = resolverLink(nom);
    const vista = txt || (sec ? `${nom} › ${sec}` : nom);
    if(!n) return `<a class="wl roto" data-nombre="${esc(nom)}" href="#/falta/${encodeURIComponent(nom.trim())}">${vista}</a>`;
    return `<a class="wl" data-id="${n.id}" href="#/nota/${n.id}${sec ? '/' + slug(sec) : ''}">${txt || (sec ? `${esc(n.titulo)} › ${sec}` : (fold(nom) === fold(n.titulo) ? esc(n.titulo) : nom))}</a>`;
  });
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s.replace(/@@C(\d+)@@/g, (_, i) => `<code>${esc(cods[i])}</code>`);
}

const CALLOUT = {
  tip: ['💡', 'Tip'], info: ['ℹ️', 'Para saber'], note: ['📝', 'Nota'], warning: ['⚠️', 'Ojo'],
  example: ['🎲', 'Ejemplo'], question: ['❓', 'Abierto — a completar'],
};

function md(texto){
  const L = texto.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  const esBlanco = l => /^\s*$/.test(l);
  const esLista = l => /^\s*([-*]|\d+\.)\s+/.test(l);
  const esTabla = (l, sig) => /^\s*\|.*\|\s*$/.test(l) && sig !== undefined && /^\s*\|?[\s:|-]+\|?\s*$/.test(sig) && sig.includes('-');
  while(i < L.length){
    const l = L[i];
    if(esBlanco(l)){ i++; continue; }
    if(/^```/.test(l)){
      const cod = []; i++;
      while(i < L.length && !/^```/.test(L[i])) cod.push(L[i++]);
      i++; out.push(`<pre>${esc(cod.join('\n'))}</pre>`); continue;
    }
    let m = l.match(/^(#{1,4})\s+(.*)$/);
    if(m){
      const nivel = Math.max(2, m[1].length);
      out.push(`<h${nivel} id="s-${slug(m[2])}">${inline(m[2])}</h${nivel}>`); i++; continue;
    }
    if(/^\s*---+\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(esTabla(l, L[i + 1])){
      const celdas = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').replace(/\\\|/g, '@@BAR@@').split('|').map(c => c.replace(/@@BAR@@/g, '|').trim());
      const cab = celdas(l); i += 2;
      const filas = [];
      while(i < L.length && /^\s*\|/.test(L[i])) filas.push(celdas(L[i++]));
      out.push(`<div class="tabla"><table><thead><tr>${cab.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${
        filas.map(f => `<tr>${cab.map((_, k) => `<td>${inline(f[k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if(/^\s*>/.test(l)){
      const q = [];
      while(i < L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/, ''));
      const c = q[0].match(/^\[!(\w+)\][+-]?\s*(.*)$/);
      if(c){
        const tipo = CALLOUT[c[1].toLowerCase()] ? c[1].toLowerCase() : 'note';
        const [ic, def] = CALLOUT[tipo];
        out.push(`<div class="callout ${tipo}"><div class="ct"><span>${ic}</span><span>${inline(c[2] || def)}</span></div><div class="cb">${md(q.slice(1).join('\n'))}</div></div>`);
      }else out.push(`<blockquote>${md(q.join('\n'))}</blockquote>`);
      continue;
    }
    if(esLista(l)){
      const items = [];
      while(i < L.length && (esLista(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        if(esLista(L[i])){
          const mm = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          items.push({sang: Math.floor(mm[1].replace(/\t/g, '  ').length / 2), orden: /\d/.test(mm[2]), txt: mm[3]});
        }else items[items.length - 1].txt += ' ' + L[i].trim();
        i++;
      }
      out.push(listaHtml(items));
      continue;
    }
    const par = [];
    while(i < L.length && !esBlanco(L[i]) && !/^(#{1,4}\s|```|\s*>|\s*---+\s*$)/.test(L[i]) && !esLista(L[i]) && !esTabla(L[i], L[i + 1])) par.push(L[i++]);
    out.push(`<p>${inline(par.join(' '))}</p>`);
  }
  return out.join('\n');
}
function listaHtml(items){
  let html = '', pila = [];
  const abrir = it => { const t = it.orden ? 'ol' : 'ul'; pila.push(t); html += `<${t}>`; };
  items.forEach((it, k) => {
    const nivel = Math.min(it.sang, pila.length);
    while(pila.length > nivel + 1 && pila.length > 1){ html += `</li></${pila.pop()}>`; }
    if(pila.length === 0) abrir(it);
    else if(it.sang >= pila.length){ abrir(it); }
    else html += '</li>';
    let txt = it.txt, cls = '';
    const t = txt.match(/^\[( |x)\]\s+(.*)$/i);
    if(t){ txt = (t[1].toLowerCase() === 'x' ? '☑ ' : '☐ ') + t[2]; cls = ' class="task"'; }
    html += `<li${cls}>${inline(txt)}`;
  });
  while(pila.length){ html += `</li></${pila.pop()}>`; }
  return html;
}

/* ---------- Búsqueda ---------- */
function buscar(q){
  const ts = fold(q).split(/\s+/).filter(Boolean);
  if(!ts.length) return [];
  const res = [];
  M.notas.forEach(n => {
    let total = 0;
    for(const t of ts){
      let s = 0;
      if(n._t === t) s += 100; else if(n._t.startsWith(t)) s += 60; else if(n._t.includes(t)) s += 40;
      n._a.forEach(a => { if(a === t) s += 90; else if(a.startsWith(t)) s += 50; else if(a.includes(t)) s += 30; });
      if(n._tags.some(x => x === t || x.includes(t))) s += 25;
      if(n._h.includes(t)) s += 15;
      const veces = n._b.split(t).length - 1;
      if(veces) s += 4 + Math.min(veces, 8);
      if(!s){ total = 0; break; }
      total += s;
    }
    if(total) res.push({n, s: total});
  });
  return res.sort((a, b) => b.s - a.s || a.n.titulo.localeCompare(b.n.titulo, 'es'));
}
function marcar(txt, ts){
  const f = fold(txt), rangos = [];
  ts.forEach(t => { if(t.length < 2) return; let d = 0, i; while((i = f.indexOf(t, d)) !== -1){ rangos.push([i, i + t.length]); d = i + t.length; } });
  if(!rangos.length) return esc(txt);
  rangos.sort((x, y) => x[0] - y[0]);
  let out = '', p = 0;
  rangos.forEach(([a, b]) => { if(a < p) return; out += esc(txt.slice(p, a)) + '<mark>' + esc(txt.slice(a, b)) + '</mark>'; p = b; });
  return out + esc(txt.slice(p));
}
function fragmento(n, ts){
  const t = ts.find(x => n._b.includes(x));
  if(!t) return esc(n._res);
  const i = n._b.indexOf(t);
  const a = Math.max(0, i - 60), b = Math.min(n._plano.length, i + 130);
  const trozo = (a > 0 ? '…' : '') + n._plano.slice(a, b) + (b < n._plano.length ? '…' : '');
  return marcar(trozo, ts);
}
function vistaBusqueda(q){
  const ts = fold(q).split(/\s+/).filter(Boolean);
  const res = buscar(q);
  $('#q').value = q;
  $('#contenido').innerHTML = `<div class="hoja"><div class="migas"><a href="#/inicio">Inicio</a> › búsqueda</div>
    <h1>Resultados para «${esc(q)}»</h1><p style="color:var(--muted);margin:0 0 18px">${res.length} nota(s)</p>
    ${res.map(({n}) => `<a class="resultado" href="#/nota/${n.id}"><span class="t">${marcar(n.titulo, ts)}</span><span class="c">${esc(capTxt(n))}</span> ${badge(n)}<div class="s">${fragmento(n, ts)}</div></a>`).join('')
      || `<p class="vacio-grande">No encontré nada con «${esc(q)}».<br>Probá con otra palabra, o mirá el <a href="#/az">índice A–Z</a>.</p>`}</div>`;
  lateralVacio();
}

const inp = $('#q'), sug = $('#sugerencias');
let selSug = -1;
function mostrarSug(){
  const q = inp.value.trim();
  if(!q){ sug.classList.remove('abierto'); return; }
  const ts = fold(q).split(/\s+/).filter(Boolean);
  const res = buscar(q).slice(0, 8);
  selSug = -1;
  sug.innerHTML = res.length
    ? res.map(({n}) => `<button class="sug" data-id="${n.id}"><span class="t">${marcar(n.titulo, ts)}</span><span class="c">${esc(capTxt(n))}</span><span class="s">${fragmento(n, ts)}</span></button>`).join('')
      + `<button class="sug" data-todos="1"><span class="t">Ver todos los resultados →</span></button>`
    : `<div class="sug-vacio">Nada con «${esc(q)}». Enter para buscar igual.</div>`;
  sug.classList.add('abierto');
}
inp.addEventListener('input', mostrarSug);
inp.addEventListener('focus', mostrarSug);
inp.addEventListener('keydown', e => {
  const btns = [...sug.querySelectorAll('.sug')];
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!btns.length) return;
    selSug = (selSug + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle('sel', i === selSug));
    btns[selSug].scrollIntoView({block: 'nearest'});
  }else if(e.key === 'Enter'){
    e.preventDefault();
    const b = btns[selSug];
    if(b && b.dataset.id){ sug.classList.remove('abierto'); ir('#/nota/' + b.dataset.id); }
    else{ sug.classList.remove('abierto'); if(inp.value.trim()) ir('#/buscar/' + encodeURIComponent(inp.value.trim())); }
  }else if(e.key === 'Escape'){ sug.classList.remove('abierto'); inp.blur(); }
});
sug.addEventListener('mousedown', e => {
  const b = e.target.closest('.sug');
  if(!b) return;
  e.preventDefault();
  sug.classList.remove('abierto');
  if(b.dataset.id) ir('#/nota/' + b.dataset.id);
  else ir('#/buscar/' + encodeURIComponent(inp.value.trim()));
});
document.addEventListener('click', e => { if(!e.target.closest('.buscador')) sug.classList.remove('abierto'); });

/* ---------- Vista previa al pasar el mouse por un enlace ---------- */
const prev = $('#preview');
document.addEventListener('mouseover', e => {
  const a = e.target.closest('a.wl');
  if(!a || !M) return;
  const n = a.dataset.id ? porId[a.dataset.id] : null;
  if(n){
    prev.innerHTML = `<div class="t">${esc(n.titulo)}</div><div class="s">${esc(n._res) || '<em>(nota vacía)</em>'}</div><div class="c">${esc(capTxt(n))} · ${ESTADO[n.estado] ? ESTADO[n.estado][1] : ''}</div>`;
  }else if(a.classList.contains('roto')){
    prev.innerHTML = `<div class="t">${esc(a.dataset.nombre || '')}</div><div class="s"><em>Nota por escribir.</em></div>`;
  }else return;
  prev.style.display = 'block';
  const r = a.getBoundingClientRect();
  const w = prev.offsetWidth, h = prev.offsetHeight;
  let x = Math.min(r.left, innerWidth - w - 12), y = r.bottom + 8;
  if(y + h > innerHeight - 8) y = r.top - h - 8;
  prev.style.left = Math.max(8, x) + 'px'; prev.style.top = Math.max(8, y) + 'px';
});
document.addEventListener('mouseout', e => { if(e.target.closest && e.target.closest('a.wl')) prev.style.display = 'none'; });
document.addEventListener('click', () => { prev.style.display = 'none'; });

/* ---------- Mapa (grafo) ---------- */
const cv = $('#lienzo'), ctx = cv.getContext('2d');
let G = null, animG = 0;
function abrirGrafo(actual){
  if(!M) return;
  const nodos = [], idx = {};
  const colorCap = {};
  M.capitulos.forEach((c, i) => colorCap[c.id] = PALETA[i % PALETA.length]);
  M.notas.forEach(n => { idx[n.id] = nodos.length; nodos.push({id: n.id, n, x: 0, y: 0, vx: 0, vy: 0, grado: 0, color: colorCap[n.capitulo], titulo: n.titulo}); });
  const aristas = [];
  M.notas.forEach(n => enlacesSal[n.id].forEach(d => { aristas.push([idx[n.id], idx[d]]); nodos[idx[n.id]].grado++; nodos[idx[d]].grado++; }));
  Object.entries(rotos).forEach(([k, set]) => {
    const i = nodos.length; nodos.push({id: null, roto: k, x: 0, y: 0, vx: 0, vy: 0, grado: 0, color: '#6b5a60', titulo: k});
    set.forEach(o => { if(idx[o] !== undefined){ aristas.push([idx[o], i]); nodos[i].grado++; nodos[idx[o]].grado++; } });
  });
  nodos.forEach((n, i) => { const a = i * 2.399, r = 30 + Math.sqrt(i) * 34; n.x = Math.cos(a) * r; n.y = Math.sin(a) * r; });
  G = {nodos, aristas, zoom: 1, ox: 0, oy: 0, actual, hover: null, alpha: 1, idx};
  $('#leyenda-g').innerHTML = M.capitulos.map(c => `<span><i style="background:${colorCap[c.id]}"></i>${esc(c.titulo)}</span>`).join('') + (Object.keys(rotos).length ? '<span><i style="background:#6b5a60"></i>por escribir</span>' : '');
  $('#grafo').classList.add('abierto');
  redimensionar();
  cancelAnimationFrame(animG);
  for(let k = 0; k < 320; k++) simular();
  ajustarGrafo();
  dibujarGrafo();
}
function cerrarGrafo(){ $('#grafo').classList.remove('abierto'); cancelAnimationFrame(animG); }
function ajustarGrafo(){
  const r = cv.getBoundingClientRect();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  G.nodos.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
  G.zoom = Math.max(.25, Math.min(1.6, Math.min(r.width / (x1 - x0 + 220), r.height / (y1 - y0 + 120))));
  G.ox = -(x0 + x1) / 2; G.oy = -(y0 + y1) / 2;
}
function simular(){
  const {nodos, aristas} = G, a = G.alpha;
  for(let i = 0; i < nodos.length; i++){
    const p = nodos[i];
    p.vx -= p.x * 0.0025 * a; p.vy -= p.y * 0.0025 * a;
    for(let j = i + 1; j < nodos.length; j++){
      const q = nodos[j];
      let dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy + 0.01;
      if(d2 > 360000) continue;
      const f = 9000 / d2 * a, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f;
    }
  }
  aristas.forEach(([i, j]) => {
    const p = nodos[i], q = nodos[j];
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
    const f = (d - 110) * 0.01 * a;
    p.vx += dx / d * f; p.vy += dy / d * f; q.vx -= dx / d * f; q.vy -= dy / d * f;
  });
  nodos.forEach(p => { if(p.fijo) return; p.x += p.vx; p.y += p.vy; p.vx *= 0.6; p.vy *= 0.6; });
  G.alpha *= 0.985;
}
function redimensionar(){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function aPantalla(p){ const r = cv.getBoundingClientRect(); return [r.width / 2 + (p.x + G.ox) * G.zoom, r.height / 2 + (p.y + G.oy) * G.zoom]; }
function dibujarGrafo(){
  if(!G) return;
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  const vecinos = new Set();
  const act = G.hover !== null ? G.hover : (G.actual !== undefined ? G.idx[G.actual] : undefined);
  if(act !== undefined) G.aristas.forEach(([i, j]) => { if(i === act) vecinos.add(j); if(j === act) vecinos.add(i); });
  ctx.lineWidth = 1;
  G.aristas.forEach(([i, j]) => {
    const [x1, y1] = aPantalla(G.nodos[i]), [x2, y2] = aPantalla(G.nodos[j]);
    const res = act !== undefined && (i === act || j === act);
    ctx.strokeStyle = res ? 'rgba(224,164,88,.75)' : 'rgba(150,130,125,.22)';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
  G.nodos.forEach((p, i) => {
    const [x, y] = aPantalla(p);
    const rad = (3.5 + Math.min(p.grado, 14) * 0.55) * Math.max(.7, Math.min(G.zoom, 1.6));
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 7);
    if(p.roto){ ctx.strokeStyle = '#9a867e'; ctx.lineWidth = 1.2; ctx.setLineDash([2, 2]); ctx.stroke(); ctx.setLineDash([]); }
    else{ ctx.fillStyle = p.color; ctx.globalAlpha = (act === undefined || i === act || vecinos.has(i)) ? 1 : .45; ctx.fill(); ctx.globalAlpha = 1; }
    if(i === act){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    const mostrar = i === act || vecinos.has(i) || p.grado >= 10 || G.zoom > 1.5;
    if(mostrar){
      ctx.font = (i === act ? '700 13px' : '12px') + ' "Space Grotesk",sans-serif';
      ctx.fillStyle = i === act ? '#fff' : 'rgba(237,227,210,.85)';
      ctx.fillText(p.titulo, x + rad + 4, y + 4);
    }
  });
}
function nodoEn(mx, my){
  let mejor = null, d = 1e9;
  G.nodos.forEach((p, i) => { const [x, y] = aPantalla(p); const dd = (x - mx) ** 2 + (y - my) ** 2; const rad = 9 + Math.min(p.grado, 14) * .5; if(dd < rad * rad && dd < d){ d = dd; mejor = i; } });
  return mejor;
}
let arrastre = null;
cv.addEventListener('mousedown', e => {
  if(!G) return;
  const r = cv.getBoundingClientRect(), i = nodoEn(e.clientX - r.left, e.clientY - r.top);
  arrastre = {x: e.clientX, y: e.clientY, mov: false, nodo: i, ox: G.ox, oy: G.oy};
  cv.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if(!G || !$('#grafo').classList.contains('abierto')) return;
  const r = cv.getBoundingClientRect();
  if(arrastre){
    const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
    if(Math.abs(dx) + Math.abs(dy) > 3) arrastre.mov = true;
    if(arrastre.mov){
      if(arrastre.nodo !== null){ const p = G.nodos[arrastre.nodo]; p.fijo = true; p.x += (e.clientX - arrastre.x) / G.zoom; p.y += (e.clientY - arrastre.y) / G.zoom; arrastre.x = e.clientX; arrastre.y = e.clientY; G.alpha = Math.max(G.alpha, .3); }
      else{ G.ox = arrastre.ox + dx / G.zoom; G.oy = arrastre.oy + dy / G.zoom; }
      dibujarGrafo();
      if(G.alpha > .015) requestAnimationFrame(() => { simular(); dibujarGrafo(); });
    }
  }else{
    const i = nodoEn(e.clientX - r.left, e.clientY - r.top);
    if(i !== G.hover){ G.hover = i; cv.style.cursor = i !== null ? 'pointer' : 'grab'; dibujarGrafo(); }
  }
});
window.addEventListener('mouseup', () => {
  if(!arrastre) return;
  const a = arrastre; arrastre = null; cv.style.cursor = 'grab';
  if(G) G.nodos.forEach(p => p.fijo = false);
  if(!a.mov && a.nodo !== null && G){
    const p = G.nodos[a.nodo];
    if(p.id){ cerrarGrafo(); ir('#/nota/' + p.id); }
    else{ cerrarGrafo(); ir('#/falta/' + encodeURIComponent(p.roto)); }
  }
});
cv.addEventListener('wheel', e => { if(!G) return; e.preventDefault(); G.zoom = Math.max(.35, Math.min(4, G.zoom * (e.deltaY < 0 ? 1.12 : .89))); dibujarGrafo(); }, {passive: false});
window.addEventListener('resize', () => { if($('#grafo').classList.contains('abierto')){ redimensionar(); dibujarGrafo(); } });

/* ---------- Botones y atajos ---------- */
$('#btn-inicio').addEventListener('click', () => ir('#/inicio'));
$('#btn-atras').addEventListener('click', () => history.back());
$('#btn-adelante').addEventListener('click', () => history.forward());
$('#btn-az').addEventListener('click', () => ir('#/az'));
$('#btn-pend').addEventListener('click', () => ir('#/pendientes'));
$('#btn-grafo').addEventListener('click', () => { const m = location.hash.match(/#\/nota\/([^/]+)/); abrirGrafo(m ? decodeURIComponent(m[1]) : undefined); });
$('#cerrar-grafo').addEventListener('click', cerrarGrafo);
document.addEventListener('keydown', e => {
  const enCampo = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''));
  if(e.key === '/' && !enCampo){ e.preventDefault(); inp.focus(); inp.select(); }
  else if(e.key === 'Escape'){ cerrarGrafo(); prev.style.display = 'none'; }
});

cargar();
</script>
