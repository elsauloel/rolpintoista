/* ---------- Controles flotantes del token (HUD) ----------
   Al seleccionar un token aparecen encima, como en Roll20: tres círculos
   con Vida (rojo), SP (azul) y No2 (verde) que se pueden editar con un
   clic, un botón de estados alterados, el engranaje (barras y aura) y el
   rayo (Botonera de la ficha o Acciones del creep). Todo se guarda donde
   corresponde: la ficha, el creep o el propio token. */

let hudGlobo = '';      // '' | 'estados' | 'ajustes'
let hudEditando = '';   // 'hp' | 'sp' | 'no2'

function hudCerrar(){
  hudGlobo = '';
  hudEditando = '';
}

// Valores que se muestran en los círculos.
function hudDatos(t){
  const v = vinculo(t);
  const r = (v && v.resumen) || {};
  const sc = t.tipo === 'creep' ? creepPrivadoDe(t.fichaId) : null;
  const n = valoresNo2(t);
  const invocacion = !!(v && v.invocacion);
  const secreto = t.tipo === 'creep' && !soyGM;  // los jugadores no ven números de creeps
  const hp = secreto ? null : (t.tipo === 'creep' ? (sc ? num(sc.hp) : null) : num(r.hp));
  const {sp, spMax} = spDeResumen(r);
  return {
    hp, hpMax: t.tipo === 'creep' ? (sc ? num(sc.hpMax) : null) : num(r.hpMax),
    sp: (t.tipo === 'pj' && !invocacion && spMax > 0) ? sp : null,
    no2: secreto ? null : (n ? n.valor : null),
    estados: (v && v.resumen && v.resumen.estados) || [],
  };
}

function hudHtml(t){
  const d = hudDatos(t);
  const puede = puedoCambiarVida(t);
  const circulo = (clave, valor, color) => {
    if(valor === null || valor === undefined) return '';
    if(hudEditando === clave && puede){
      return `<input class="hud-in" data-hud-in="${clave}" style="border-color:${color}" inputmode="decimal" placeholder="${fmt(valor)}" title="Escribí el valor, o +5 / -3, y apretá Enter">`;
    }
    return `<button type="button" class="hud-circulo" data-hud-valor="${clave}" style="border-color:${color}" ${puede ? '' : 'disabled'} title="${puede ? 'Clic para cambiar' : 'Solo lo cambia su dueño'}">${fmt(valor)}</button>`;
  };
  const icono = (clave, simbolo, titulo, activo) =>
    `<button type="button" class="hud-circulo icono${activo ? ' abierto' : ''}" data-hud-boton="${clave}" title="${titulo}">${simbolo}</button>`;

  const fichaDeToken = t.tipo === 'pj' && t.fichaId ? t.fichaId.split(SEP_INVOCACION)[0] : '';
  const propio = fichaDeToken && !soyGM && vinculo(t) && vinculo(t).duenoUid === fbUsuario.uid && !t.fichaId.includes(SEP_INVOCACION);
  const conRayo = propio || (soyGM && t.tipo === 'creep' && t.fichaId && creepsPub.has(t.fichaId));

  let html = '<div class="hud-fila">' +
    circulo('hp', d.hp, HP_COLOR) + circulo('sp', d.sp, SP_COLOR) + circulo('no2', d.no2, NO2_COLOR) +
    icono('estados', '◎', 'Estados alterados', hudGlobo === 'estados') +
    (puedoMover(t) ? icono('ajustes', '⚙', 'Barras y aura del token', hudGlobo === 'ajustes') : '') +
    (conRayo ? icono('rayo', '⚡', propio ? 'Abrir la Botonera' : 'Abrir las Acciones del creep') : '') +
    '</div>';
  if(hudGlobo === 'estados') html += hudEstadosHtml(t, d.estados, puede);
  if(hudGlobo === 'ajustes' && puedoMover(t)) html += hudAjustesHtml(t);
  return html;
}

function hudEstadosHtml(t, estados, puede){
  if(!estados.length) return '<div class="hud-globo"><h3>Estados alterados</h3><span style="color:var(--muted)">Ninguno activo.</span></div>';
  return '<div class="hud-globo"><h3>Estados alterados</h3>' + estados.map((e, i) => {
    const turnos = e.permanente ? '∞' : (num(e.turnos) ? fmt(num(e.turnos)) + 't' : '—');
    return `<div class="hud-estado">
      <span style="width:9px;height:9px;border-radius:50%;background:${ESTADO_COLOR[e.polaridad] || ESTADO_COLOR['']};flex:none"></span>
      <span class="nom" title="${esc(e.detalle || e.nombre)}">${esc(e.nombre)}</span>
      <span class="turnos">${turnos}</span>` +
      (puede && !e.permanente ? `<button type="button" class="hud-mini" data-hud-turnos="${i}:-1" title="Un turno menos">−</button>
        <button type="button" class="hud-mini" data-hud-turnos="${i}:1" title="Un turno más">+</button>` : '') +
      (puede ? `<button type="button" class="hud-mini peligro" data-hud-quitar="${i}" title="Sacar este estado">✕</button>` : '') +
    '</div>';
  }).join('') + (puede ? '<p class="ayuda" style="margin-top:8px">Para agregar estados, usá la ficha o gm-tools.</p>' : '') + '</div>';
}

function hudAjustesHtml(t){
  const barras = barrasDe(t);
  const aura = t.aura || {};
  const check = (clave, texto, si) =>
    `<div class="hud-campo"><label>${texto}</label><input type="checkbox" data-hud-barra="${clave}"${si ? ' checked' : ''}></div>`;
  return '<div class="hud-globo"><h3>Barras del token</h3>' +
    check('hp', 'Vida (roja)', barras.hp) +
    check('sp', 'SP (azul)', barras.sp) +
    check('no2', 'No2 (verde)', barras.no2) +
    '<h3 style="margin-top:12px">Aura</h3>' +
    `<div class="hud-campo"><label>Radio (casilleros)</label><input type="number" min="0" max="30" step="0.5" value="${fmt(num(aura.radio))}" data-hud-aura="radio"></div>` +
    `<div class="hud-campo"><label>Color</label><input type="color" value="${/^#[0-9a-fA-F]{6}$/.test(aura.color || '') ? aura.color : '#E0A458'}" data-hud-aura="color"></div>` +
    '<div class="fila" style="margin-top:10px">' +
      '<button type="button" class="hud-mini" data-hud-aura-ok="1">Guardar aura</button>' +
      (aura.radio ? '<button type="button" class="hud-mini peligro" data-hud-aura-no="1">Quitar</button>' : '') +
    '</div>' +
    '<p class="ayuda" style="margin-top:6px">El radio va en casilleros. Las barras se guardan solas. La ven todos.</p>' +
    '</div>';
}

// Dibuja el HUD y lo acomoda sobre el token seleccionado.
function hudUbicar(){
  const hud = $('#hud');
  const t = seleccion ? tokens.get(seleccion) : null;
  if(!t || !fbMiembro || creando || panelFondo){ hud.hidden = true; return; }
  const d = disposicion.find(x => x.id === seleccion);
  const vis = visibles.get(seleccion) || (d ? {x: d.x, y: d.y} : hexCentro(t.col, t.fila));
  const radio = (d ? d.radio : HEX * 0.68) * vista.zoom;
  const px = vis.x * vista.zoom + vista.x, py = vis.y * vista.zoom + vista.y;
  const firma = JSON.stringify([seleccion, hudGlobo, hudEditando, hudDatos(t), barrasDe(t), t.aura || null, soyGM]);
  if(hud.dataset.firma !== firma){
    hud.dataset.firma = firma;
    hud.innerHTML = hudHtml(t);
    hudConectar(t);
  }
  hud.hidden = false;
  hud.style.left = Math.round(px) + 'px';
  hud.style.top = Math.round(py - radio - 46) + 'px';
}

function hudConectar(t){
  const hud = $('#hud');
  hud.querySelectorAll('[data-hud-valor]').forEach(b => b.onclick = () => {
    hudEditando = b.dataset.hudValor; hudGlobo = ''; pedirDibujo();
    setTimeout(() => { const i = hud.querySelector('[data-hud-in]'); if(i) i.focus(); }, 30);
  });
  const campo = hud.querySelector('[data-hud-in]');
  if(campo){
    campo.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); hudAplicar(campo.dataset.hudIn, campo.value); }
      if(e.key === 'Escape'){ hudEditando = ''; pedirDibujo(); }
    };
    campo.onblur = () => { hudEditando = ''; pedirDibujo(); };
  }
  hud.querySelectorAll('[data-hud-boton]').forEach(b => b.onclick = () => {
    const clave = b.dataset.hudBoton;
    if(clave === 'rayo'){
      const fichaDeToken = t.tipo === 'pj' && t.fichaId ? t.fichaId.split(SEP_INVOCACION)[0] : '';
      if(fichaDeToken) abrirBotonera(fichaDeToken); else abrirAcciones(t.fichaId);
      return;
    }
    hudGlobo = hudGlobo === clave ? '' : clave;
    hudEditando = '';
    pedirDibujo();
  });
  hud.querySelectorAll('[data-hud-quitar]').forEach(b => b.onclick = () => hudEstadoCambiar(t, num(b.dataset.hudQuitar), 'quitar'));
  hud.querySelectorAll('[data-hud-turnos]').forEach(b => b.onclick = () => {
    const [i, delta] = b.dataset.hudTurnos.split(':');
    hudEstadoCambiar(t, num(i), 'turnos', num(delta));
  });
  hud.querySelectorAll('[data-hud-barra]').forEach(c => c.onchange = () => {
    const barras = {...barrasDe(t)};
    barras[c.dataset.hudBarra] = c.checked;
    editarToken(seleccion, {barras});
  });
  const guardarAura = () => {
    const radio = num(hud.querySelector('[data-hud-aura="radio"]').value);
    const color = hud.querySelector('[data-hud-aura="color"]').value;
    editarToken(seleccion, {aura: radio > 0 ? {radio: Math.min(30, radio), color} : firebase.firestore.FieldValue.delete()});
  };
  const campoRadio = hud.querySelector('[data-hud-aura="radio"]');
  if(campoRadio) campoRadio.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); guardarAura(); } };
  const ok = hud.querySelector('[data-hud-aura-ok]');
  if(ok) ok.onclick = guardarAura;
  const quitar = hud.querySelector('[data-hud-aura-no]');
  if(quitar) quitar.onclick = () => {
    hud.querySelector('[data-hud-aura="radio"]').value = '0';
    guardarAura();
  };
}

async function hudAplicar(clave, texto){
  const t = seleccion ? tokens.get(seleccion) : null;
  if(!t || !puedoCambiarVida(t) || !String(texto).trim()){ hudEditando = ''; pedirDibujo(); return; }
  try{
    if(clave === 'no2') await cambiarNitros(t, texto);
    else if(t.tipo === 'creep') await cambiarVidaCreep(t.fichaId, texto);
    else await cambiarVidaPj(t, clave, texto);
  }catch(err){
    console.error('No se pudo cambiar el valor:', err);
    toast(err.message === ERROR_TIPEO ? 'Escribí un número, o +5 / -3'
      : err.code === 'permission-denied' ? 'No podés cambiar eso' : 'No se pudo guardar: ' + err.message);
  }finally{
    hudEditando = '';
    pedirDibujo();
  }
}

// No2 desde el HUD (los PJ en su ficha, los creeps en su parte privada).
async function cambiarNitros(t, texto){
  if(t.tipo === 'creep'){
    await modificarCreep(t.fichaId, sc => {
      const nuevo = leerValorVital(texto, num(sc.nitros));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      sc.nitros = Math.max(0, nuevo);
    });
    return;
  }
  const base = fbDb.doc(fbRutaCampana(`fichas/${t.fichaId}`));
  const parteRef = base.collection('partes').doc('general');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  await fbDb.runTransaction(async tx => {
    const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
    if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
    const datos = JSON.parse(parte.data().json || '{}');
    const r = ficha.data().resumen || {};
    const actual = datos.nitros === null || datos.nitros === undefined ? num(r.nitros) : num(datos.nitros);
    const nuevo = leerValorVital(texto, actual);
    if(nuevo === null) throw new Error(ERROR_TIPEO);
    datos.nitros = Math.max(0, nuevo);
    tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
    tx.update(base, {'resumen.nitros': datos.nitros, actualizado: ts});
  });
}

// Estados alterados desde el HUD: sacar uno o cambiarle los turnos.
async function hudEstadoCambiar(t, indice, accion, delta){
  const v = vinculo(t);
  const lista = (v && v.resumen && v.resumen.estados) || [];
  const objetivo = lista[indice];
  if(!objetivo || !puedoCambiarVida(t)) return;
  const tocar = arr => {
    const i = arr.findIndex(e => e && e.nombre === objetivo.nombre && e.activo !== false);
    if(i < 0) throw new Error('Ese estado ya no está');
    if(accion === 'quitar') arr.splice(i, 1);
    else arr[i].turnos = Math.max(0, num(arr[i].turnos) + delta);
    return arr;
  };
  try{
    if(t.tipo === 'creep'){
      await modificarCreep(t.fichaId, sc => { sc.estados = tocar(Array.isArray(sc.estados) ? sc.estados : []); });
    }else{
      const base = fbDb.doc(fbRutaCampana(`fichas/${t.fichaId.split(SEP_INVOCACION)[0]}`));
      const parteRef = base.collection('partes').doc('efectos');
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      await fbDb.runTransaction(async tx => {
        const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
        if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
        const datos = JSON.parse(parte.data().json || '{}');
        datos.efectos = tocar(Array.isArray(datos.efectos) ? datos.efectos : []);
        const resumen = datos.efectos.filter(e => e && e.activo !== false && e.nombre).slice(0, 30).map(e => ({
          nombre: String(e.nombre).slice(0, 60), turnos: num(e.turnos), permanente: !!e.permanente,
          polaridad: e.polaridad === 'buff' || e.polaridad === 'debuff' ? e.polaridad : '',
          detalle: String(e.detalle || '').slice(0, 200),
        }));
        tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
        tx.update(base, {'resumen.estados': resumen, actualizado: ts});
      });
    }
  }catch(err){
    console.error('No se pudo cambiar el estado:', err);
    toast(err.code === 'permission-denied' ? 'No podés cambiar eso' : 'No se pudo cambiar el estado: ' + err.message);
  }
}

/* ---------- Botonera de la ficha, dentro del mapa ----------
   Carga la ficha en un iframe (?modo=botonera), que muestra solo la
   Botonera. El iframe queda cargado mientras sea el mismo personaje, así
   volver a abrirla es instantáneo. Lo que se haga ahí se guarda en la
   ficha como siempre y se ve en el token. */
// La misma capa sirve para las Acciones de un creep (gm-tools con
// ?modo=acciones, solo GM). herramienta: 'ficha' | 'gm'.
let botonera = {herramienta: '', fichaId: '', lista: false};

function abrirBotonera(fichaId){
  const capa = $('#botonera-capa');
  const marco = $('#botonera-marco');
  capa.hidden = false;
  if(botonera.herramienta === 'ficha' && botonera.fichaId === fichaId && botonera.lista){
    marco.contentWindow.postMessage({tipo: 'abrir-botonera'}, location.origin);
    return;
  }
  botonera = {herramienta: 'ficha', fichaId, lista: false};
  $('#botonera-cargando-texto').textContent = 'Abriendo la Botonera…';
  $('#botonera-cargando').hidden = false;
  marco.src = `../ficha-personaje/ficha.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=botonera#${encodeURIComponent(fichaId)}`;
}

function abrirAcciones(creepId){
  const capa = $('#botonera-capa');
  const marco = $('#botonera-marco');
  capa.hidden = false;
  // gm-tools ya cargado: solo cambia de creep (instantáneo).
  if(botonera.herramienta === 'gm' && botonera.lista){
    botonera.fichaId = creepId;
    marco.contentWindow.postMessage({tipo: 'abrir-acciones', creep: creepId}, location.origin);
    return;
  }
  botonera = {herramienta: 'gm', fichaId: creepId, lista: false};
  $('#botonera-cargando-texto').textContent = 'Abriendo las Acciones…';
  $('#botonera-cargando').hidden = false;
  marco.src = `../gm-toolset/gm-tools.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=acciones&creep=${encodeURIComponent(creepId)}`;
}

function cerrarBotonera(){
  $('#botonera-capa').hidden = true;
  $('#botonera-cargando').hidden = true;
}

window.addEventListener('message', e => {
  if(e.origin !== location.origin || !e.data || e.source !== $('#botonera-marco').contentWindow) return;
  if(e.data.tipo === 'botonera-lista' || e.data.tipo === 'acciones-lista'){ botonera.lista = true; $('#botonera-cargando').hidden = true; }
  if(e.data.tipo === 'botonera-cerrada' || e.data.tipo === 'acciones-cerrada') cerrarBotonera();
});

$('#botonera-cargando-x').onclick = () => { cerrarBotonera(); botonera = {herramienta: '', fichaId: '', lista: false}; $('#botonera-marco').src = 'about:blank'; };

/* ---------- Mesa (tiradas compartidas) ---------- */

const MESA_MAX = 30;
let mesaIdsVistos = null;

function parseDados(formula){
  const limpio = String(formula || '').trim().toLowerCase().replace(/\s+/g, '');
  if(!limpio) return null;
  const dadoRe = /(\d*)d(\d+)/g;
  const dados = [];
  let m;
  while((m = dadoRe.exec(limpio))){
    const n = m[1] ? parseInt(m[1], 10) : 1;
    const caras = parseInt(m[2], 10);
    if(n < 1 || n > 100 || caras < 2) return null;
    dados.push({n, caras});
  }
  const sinDados = limpio.replace(/\d*d\d+/g, '');
  let mod = 0;
  const modRe = /([+-]\d+)/g;
  let mm;
  while((mm = modRe.exec(sinDados))) mod += parseInt(mm[1], 10);
  if(!dados.length && !mod) return null;
  if(/[^+\-0-9]/.test(sinDados.replace(/[+-]\d+/g, ''))) return null;
  return {dados, mod};
}

function tirarDados(formula){
  const p = parseDados(formula);
  if(!p) return null;
  const rolls = [];
  p.dados.forEach(d => { for(let i = 0; i < d.n; i++) rolls.push(1 + Math.floor(Math.random() * d.caras)); });
  const suma = rolls.reduce((a, b) => a + b, 0);
  const formulaTxt = p.dados.map(d => `${d.n}d${d.caras}`).join('+') + (p.mod ? (p.mod > 0 ? `+${p.mod}` : `${p.mod}`) : '');
  return { formula: formulaTxt || `${p.mod}`, rolls, mod: p.mod, total: suma + p.mod };
}

async function mesaPublicar(origen, r){
  if(!fbDb || !fbUsuario || !fbMiembro){ toast('Entrá a la mesa para tirar'); return; }
  try{
    await fbDb.collection(fbRutaCampana('tiradas')).add({
      uid: fbUsuario.uid,
      jugador: fbMiembro.nombre,
      quien: '',
      origen: String(origen || ''),
      formula: String(r.formula || ''),
      rolls: (r.rolls || []).slice(0, 100),
      mod: num(r.mod),
      total: num(r.total),
      desde: 'mapa',
      cuando: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(err){
    console.error('No se pudo publicar la tirada en la mesa:', err);
    toast('La tirada no se pudo compartir con la mesa');
  }
}

// Color del nombre en la Mesa: dorado las propias, verde las de aliados,
// rojo las de creeps (desde gm-tools con un creep), blanco las neutras
// (tiradas libres sin personaje de otros) y lila el pase de turno.
function mesaClaseQuien(t){
  if(t.desde === 'mantenimiento') return 'mesa-q-turno';
  if(t.desde === 'gm' && t.quien) return 'mesa-q-creep';
  if(fbUsuario && t.uid === fbUsuario.uid) return 'mesa-q-propia';
  return t.quien ? 'mesa-q-aliado' : 'mesa-q-neutra';
}

function mesaRender(docs){
  const cuerpo = $('#mesa-cuerpo');
  const primeraVez = mesaIdsVistos === null;
  const nuevasIds = new Set(primeraVez ? [] : docs.map(d => d.id).filter(id => !mesaIdsVistos.has(id)));
  // La última tirada (no las líneas del sistema) va con fondo verde.
  const ultima = docs.find(d => !['mantenimiento', 'recordatorio'].includes(d.data().desde));
  const ultimaId = ultima ? ultima.id : null;
  cuerpo.innerHTML = docs.length ? '' : '<div class="mesa-vacia">Todavía nadie tiró.</div>';
  docs.forEach(d => {
    const t = d.data({serverTimestamps: 'estimate'});
    const nueva = !primeraVez && !mesaIdsVistos.has(d.id);
    // Líneas del sistema (no son tiradas): pase de turno y recordatorios.
    if(t.desde === 'mantenimiento' || t.desde === 'recordatorio'){
      const div = document.createElement('div');
      div.className = 'mesa-tirada mesa-sistema' + (t.desde === 'mantenimiento' ? ' mesa-turno' : '') + (nueva ? ' nueva' : '');
      div.innerHTML = t.desde === 'mantenimiento'
        ? `<span class="mesa-quien mesa-q-turno">⟳ ${esc(t.origen)}</span><div class="mesa-detalle">Pasó el turno</div>`
        : `<span class="mesa-quien ${mesaClaseQuien(t)}">${esc(t.quien || t.jugador || '?')}</span>${t.quien && t.jugador && t.quien !== t.jugador ? ` <span class="mesa-usuario">(${esc(t.jugador)})</span>` : ''} 🔔 ${esc(t.origen)}${t.formula ? `<div class="mesa-detalle">${esc(t.formula)}</div>` : ''}`;
      if(nueva) setTimeout(() => div.classList.remove('nueva'), 1500);
      cuerpo.appendChild(div);
      return;
    }
    const quien = t.quien || t.jugador || '?';
    // Personaje o creep en color y, entre paréntesis, quién lo maneja.
    const usuario = t.quien && t.jugador && t.quien !== t.jugador ? ` <span class="mesa-usuario">(${esc(t.jugador)})</span>` : '';
    const mod = num(t.mod) ? ` ${t.mod > 0 ? '+' : ''}${fmt(num(t.mod))}` : '';
    const div = document.createElement('div');
    div.className = 'mesa-tirada' + (d.id === ultimaId ? ' ultima' : '') + (nueva ? ' nueva' : '');
    div.innerHTML =
      `<span class="mesa-total">${fmt(num(t.total))}</span>` +
      `<span class="mesa-quien ${mesaClaseQuien(t)}">${esc(quien)}</span>${usuario} ${esc(t.origen)}` +
      `<div class="mesa-detalle">${esc(t.formula)} [${esc((t.rolls || []).join(', '))}]${esc(mod)}</div>`;
    if(nueva) setTimeout(() => div.classList.remove('nueva'), 1500);
    cuerpo.appendChild(div);
  });
  mesaIdsVistos = new Set(docs.map(d => d.id));
  // Dados 3D para las tiradas nuevas, de la más vieja a la más nueva.
  if(!primeraVez && typeof dadosAnimarTirada === 'function'){
    docs.filter(d => nuevasIds.has(d.id)).reverse().forEach(d => dadosAnimarTirada(d.data()));
  }
}

function mesaEscuchar(){
  $('#mesa-cuerpo').innerHTML = '<div class="mesa-vacia">Cargando tiradas…</div>';
  fbDb.collection(fbRutaCampana('tiradas'))
    .orderBy('cuando', 'desc').limit(MESA_MAX)
    .onSnapshot(snap => mesaRender(snap.docs), err => {
      console.error('Error escuchando la mesa:', err);
      $('#mesa-cuerpo').innerHTML = '<div class="mesa-vacia">No se pudieron leer las tiradas — mirá la consola.</div>';
    });
}

$('#mesa-dados').innerHTML = dadosBotonHtml();
dadosConectarBoton($('#mesa-dados'));
$('#mesa-historial').innerHTML = mesaBorrarHtml();
// Grilla de dados debajo del botón de la barra de arriba (comun/grilla-dados.js).
grillaConectar($('#btn-dados'), {lado: 'abajo', alTirar: f => mesaPublicar('Tirada libre', tirarDados(f))});

$('#mesa-tirar').onsubmit = e => {
  e.preventDefault();
  const r = tirarDados($('#mesa-formula').value);
  if(!r){ toast('Fórmula no válida — ej: 2d6+3'); return; }
  mesaPublicar('Tirada libre', r);
  $('#mesa-formula').value = '';
};

/* ---------- Arranque ---------- */

function mostrarAviso(html, boton){
  const a = $('#aviso-mapa');
  a.innerHTML = html + (boton ? `<div><button type="button" class="btn primary" id="aviso-boton">${esc(boton.texto)}</button></div>` : '');
  a.hidden = false;
  if(boton) $('#aviso-boton').onclick = boton.accion;
}

function arrancarEnVivo(){
  $('#aviso-mapa').hidden = true;
  estado(`${fbPartida.nombre} · ${fbMiembro.nombre}`);
  soyGM = fbMiembro.gm === true;
  escucharMiembros();
  escucharVinculables();
  escucharFondo();
  escucharModo();
  escucharMantenimiento();
  escucharTokens();
  mesaEscuchar();
  mesaHistorialAlEntrar();
  renderPanel(true);
}

async function iniciar(){
  new ResizeObserver(ajustarTamano).observe(lienzo);
  ajustarTamano();
  renderPanel(true);

  // Sin sesión, sin partida elegida o sin haberse unido: al inicio del sitio.
  const entrada = await fbEntrarAPartida();
  if(entrada === 'redirigiendo') return;
  if(entrada !== 'ok'){
    estado('sin internet');
    mostrarAviso('No se pudo cargar Firebase. Revisá la conexión y recargá la página.');
    $('#mesa-cuerpo').innerHTML = '<div class="mesa-vacia">Sin conexión.</div>';
    return;
  }
  $('#link-inicio').href = fbUrlInicio(FB_CAMPANA);
  arrancarEnVivo();
}

iniciar();
