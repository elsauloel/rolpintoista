<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    repeating-linear-gradient(0deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    radial-gradient(120% 80% at 50% 0%, #1C1418 0%, var(--ink) 70%);
  color:var(--paper); font-family:"Space Grotesk", system-ui, sans-serif; font-size:14px; line-height:1.4;
  min-height:100vh;
}
input,select,textarea,button{font-family:inherit;color:inherit}
input,textarea,select{
  min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:var(--r);
  color:var(--paper);padding:5px 7px;width:100%;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
button{cursor:pointer;background:none;border:none;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1400px;margin:0 auto;padding:22px 18px 90px}

.hero{
  border:1px solid var(--line);border-top:3px solid var(--copper);
  background:linear-gradient(180deg, rgba(201,133,69,.10), rgba(0,0,0,0) 60%), var(--panel);
  padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:60;box-shadow:0 8px 16px -8px rgba(0,0,0,.5);
}
.hero h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(22px,3vw,32px);margin:0;letter-spacing:-.01em}
.hero .eyebrow{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);white-space:nowrap
}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08;font-weight:700}
.btn.primary:hover{background:var(--brass)}
.btn.ghost{color:var(--muted)}
.btn.publicar{background:#2E6B57;border-color:#2E6B57;color:#EAF3E6;font-weight:700}
.btn.publicar:hover{background:#3A8770;border-color:#3A8770}

.panel{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-top:16px}
.panel-titulo{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:12px}
.controles{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:5px;flex:0 1 260px}
.campo label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.campo select{width:100%}
.hint{color:var(--muted);font-size:12.5px}

.resumen{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.resumen-chip{
  font-family:"Space Mono",monospace;font-size:11px;border:1px solid var(--line);
  border-radius:99px;padding:4px 12px;color:var(--paper)
}
.resumen-chip b{color:var(--brass)}

.cat-grouphead{
  font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--copper);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)
}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:10px}
.cat-card{
  display:flex;flex-direction:column;gap:5px;border:1px solid var(--line-soft);
  background:var(--panel2);padding:9px 11px
}
.cat-card-titulo{display:flex;align-items:flex-start;gap:7px;justify-content:space-between}
.cat-nombre{font-weight:700;font-size:13px;min-width:0}
.cat-tier-badge{
  font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid;font-weight:700;flex:none;white-space:nowrap;margin-top:1px
}
.cat-meta{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
.cat-precio{color:var(--brass);font-weight:700}
.cat-garantizado{
  font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--absenta);border:1px solid var(--absenta);border-radius:99px;padding:1px 7px;align-self:flex-start
}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--panel);
  border:1px solid var(--copper);padding:10px 16px;font-family:"Space Mono",monospace;font-size:11.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:95;max-width:90vw;text-align:center
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div>
      <div class="eyebrow">Rol Pintoísta</div>
      <h1>Vendor Generator</h1>
    </div>
    <div class="hero-right">
      <a class="btn ghost" href="ficha.html">Abrir ficha</a>
      <a class="btn ghost" href="gm-tools.html">Abrir GM Tools</a>
      <button class="btn ghost" id="btn-token">Cambiar token GitHub</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-titulo">Generar tienda</div>
    <div class="controles">
      <div class="campo">
        <label for="f-tamano">Tamaño del vendedor</label>
        <select id="f-tamano">
          <option value="ambulante">Vendedor ambulante</option>
          <option value="pueblito">Pueblito</option>
          <option value="aldea" selected>Aldea</option>
          <option value="ciudad">Ciudad</option>
          <option value="capital">Capital</option>
        </select>
      </div>
      <button class="btn primary" id="btn-generar">Generar Shop</button>
      <button class="btn" id="btn-regenerar" disabled>Regenerar</button>
      <button class="btn publicar" id="btn-publicar" disabled>Publicar Shop</button>
    </div>
    <div class="hint" id="hint-tamano" style="margin-top:10px"></div>
  </div>

  <div class="panel" id="panel-preview" style="display:none">
    <div class="panel-titulo">Vista previa del catálogo</div>
    <div class="resumen" id="preview-resumen"></div>
    <div id="preview-lista"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('es-AR').format(n);

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

const TIER_COLOR = {'Común':'#9A867E', 'Buena Calidad':'#A8C256', 'Raro':'#5B8DBE', 'Excepcional':'#E0A458', 'Legendario':'#9B7BD4'};
const TIERS = ['Común', 'Buena Calidad', 'Raro', 'Excepcional', 'Legendario'];

/* Consumibles que todo vendedor ofrece siempre, sin importar el tamaño.
   No entran en los porcentajes del resto del catálogo. */
const GARANTIZADOS = ['cat-pocion-hp', 'cat-pocion-bonos', 'cat-revive'];

/* Pesos de rareza por tamaño. Son probabilidades, no topes: hasta el
   vendedor ambulante puede sacar algo Excepcional, solo que casi nunca. */
const TAMANOS = {
  ambulante: {label:'Vendedor ambulante', min:8,  max:12,  pesos:{'Común':78, 'Buena Calidad':18, 'Raro':3.5, 'Excepcional':0.4, 'Legendario':0.1}},
  pueblito:  {label:'Pueblito',           min:15, max:20,  pesos:{'Común':68, 'Buena Calidad':25, 'Raro':6,   'Excepcional':0.8, 'Legendario':0.2}},
  aldea:     {label:'Aldea',              min:25, max:35,  pesos:{'Común':55, 'Buena Calidad':32, 'Raro':11,  'Excepcional':1.7, 'Legendario':0.3}},
  ciudad:    {label:'Ciudad',             min:40, max:60,  pesos:{'Común':42, 'Buena Calidad':35, 'Raro':18,  'Excepcional':4,   'Legendario':1}},
  capital:   {label:'Capital',            min:70, max:100, pesos:{'Común':30, 'Buena Calidad':33, 'Raro':25,  'Excepcional':9,   'Legendario':3}},
};

const ES_ARMA = t => t.startsWith('arma_');
const ES_DEFENSA = t => t.startsWith('escudo') || t.startsWith('armadura') || t.startsWith('casco')
  || t.startsWith('guantes') || t.startsWith('piernas') || t.startsWith('botas');

function rubroDe(item){
  if(item.consumible || item.tipoItem === 'consumibles') return 'consumibles';
  if(ES_ARMA(item.tipoItem)) return 'ofensivo';
  if(ES_DEFENSA(item.tipoItem)) return 'defensivo';
  return 'otros';
}

const RUBRO_LABEL = {ofensivo:'Armas', defensivo:'Defensa', consumibles:'Consumibles', otros:'Otros'};
const RUBRO_ORDEN = ['ofensivo', 'defensivo', 'consumibles', 'otros'];

function entero(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

/* Elige un tier al azar respetando los pesos del tamaño, pero solo entre
   los tiers que todavía tienen stock disponible en ese rubro. */
function sortearTier(pesos, disponiblesPorTier){
  const posibles = TIERS.filter(t => (disponiblesPorTier[t] || []).length);
  if(!posibles.length) return null;
  const total = posibles.reduce((a, t) => a + (pesos[t] || 0), 0);
  if(total <= 0) return posibles[entero(0, posibles.length - 1)];
  let r = Math.random() * total;
  for(const t of posibles){
    r -= (pesos[t] || 0);
    if(r <= 0) return t;
  }
  return posibles[posibles.length - 1];
}

function elegirDeRubro(candidatos, cantidad, pesos, usados){
  const porTier = {};
  candidatos.forEach(it => {
    if(usados.has(it.id)) return;
    (porTier[it.tier] = porTier[it.tier] || []).push(it);
  });
  const elegidos = [];
  for(let i = 0; i < cantidad; i++){
    const tier = sortearTier(pesos, porTier);
    if(!tier) break;
    const lista = porTier[tier];
    const idx = entero(0, lista.length - 1);
    const item = lista.splice(idx, 1)[0];
    if(!lista.length) delete porTier[tier];
    usados.add(item.id);
    elegidos.push(item);
  }
  return elegidos;
}

function generarTienda(claveTamano){
  const cfg = TAMANOS[claveTamano];
  const usados = new Set();

  // 1. Stock garantizado: va siempre y no cuenta para los porcentajes.
  const garantizados = GARANTIZADOS
    .map(id => CATALOGO.find(it => it.id === id))
    .filter(Boolean);
  garantizados.forEach(it => usados.add(it.id));

  // 2. El resto se reparte: hasta 20% consumibles, la otra parte mitad y
  //    mitad entre ofensivo y defensivo.
  const total = entero(cfg.min, cfg.max);
  const nConsumibles = Math.round(total * 0.20);
  const resto = total - nConsumibles;
  const nOfensivos = Math.ceil(resto / 2);
  const nDefensivos = resto - nOfensivos;

  const porRubro = {ofensivo: [], defensivo: [], consumibles: []};
  CATALOGO.forEach(it => {
    const r = rubroDe(it);
    if(porRubro[r]) porRubro[r].push(it);
  });

  const elegidos = [
    ...elegirDeRubro(porRubro.ofensivo, nOfensivos, cfg.pesos, usados),
    ...elegirDeRubro(porRubro.defensivo, nDefensivos, cfg.pesos, usados),
    ...elegirDeRubro(porRubro.consumibles, nConsumibles, cfg.pesos, usados),
  ];

  return {
    tamano: claveTamano,
    tamanoLabel: cfg.label,
    generado: new Date().toISOString(),
    garantizados: garantizados.map(it => it.id),
    items: [...garantizados, ...elegidos].map(it => it.id),
  };
}

let tiendaActual = null;

function itemCardHtml(item, esGarantizado){
  const color = TIER_COLOR[item.tier] || TIER_COLOR['Común'];
  return `<div class="cat-card">
    <div class="cat-card-titulo">
      <div class="cat-nombre">${esc(item.nombre)}</div>
      <div class="cat-tier-badge" style="color:${color};border-color:${color};background:${color}22">${esc(item.tier)}</div>
    </div>
    <div class="cat-meta"><span class="cat-precio">${fmt(item.precioCompra)} DDE</span></div>
    ${esGarantizado ? '<div class="cat-garantizado">Stock fijo</div>' : ''}
  </div>`;
}

function renderPreview(){
  if(!tiendaActual){ $('#panel-preview').style.display = 'none'; return; }
  const garantizados = new Set(tiendaActual.garantizados);
  const items = tiendaActual.items.map(id => CATALOGO.find(it => it.id === id)).filter(Boolean);

  const porTier = {};
  items.forEach(it => porTier[it.tier] = (porTier[it.tier] || 0) + 1);
  $('#preview-resumen').innerHTML =
    `<span class="resumen-chip">${esc(tiendaActual.tamanoLabel)}</span>` +
    `<span class="resumen-chip">Ítems <b>${fmt(items.length)}</b></span>` +
    TIERS.filter(t => porTier[t]).map(t =>
      `<span class="resumen-chip" style="border-color:${TIER_COLOR[t]}">${esc(t)} <b>${fmt(porTier[t])}</b></span>`
    ).join('');

  let html = '';
  RUBRO_ORDEN.forEach(rubro => {
    const delRubro = items.filter(it => rubroDe(it) === rubro);
    if(!delRubro.length) return;
    delRubro.sort((a, b) => TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier) || a.nombre.localeCompare(b.nombre, 'es'));
    html += `<div class="cat-grouphead">${RUBRO_LABEL[rubro]} · ${fmt(delRubro.length)}</div>`;
    html += `<div class="cat-grid">${delRubro.map(it => itemCardHtml(it, garantizados.has(it.id))).join('')}</div>`;
  });
  $('#preview-lista').innerHTML = html;
  $('#panel-preview').style.display = '';
}

function generar(){
  const clave = $('#f-tamano').value;
  tiendaActual = generarTienda(clave);
  renderPreview();
  $('#btn-regenerar').disabled = false;
  $('#btn-publicar').disabled = false;
  toast(`Tienda generada · ${tiendaActual.items.length} ítems`);
}

/* ---------- GitHub ---------- */

const GH_REPO = 'elsauloel/rolpintoista';
const GH_BRANCH = 'main';
const ARCHIVO_TIENDA = 'tienda-publica.json';

const GH_TOKEN_URL = 'https://github.com/settings/tokens/new?description=Rolpintoista&scopes=public_repo';

/* Pide el token en un cartel dentro de esta misma pestaña.
   Antes se abría GitHub con window.open() y enseguida se llamaba a
   prompt(): como la pestaña de GitHub se lleva el foco, el navegador
   no muestra el prompt de la pestaña de atrás y no quedaba a la vista
   dónde pegar el token. Ahora el cartel se abre primero y el botón
   "Abrir GitHub" es el que abre la otra pestaña. */
function ghPedirToken(){
  return new Promise(res => {
    const btnCss = 'padding:8px 12px;border-radius:8px;border:1px solid #555;background:#2a2a30;color:#eee;cursor:pointer;font:inherit';
    const fondo = document.createElement('div');
    fondo.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999';
    const caja = document.createElement('div');
    caja.style.cssText = 'background:#1b1b1f;color:#eee;border:1px solid #444;border-radius:12px;max-width:460px;width:100%;padding:18px;font:14px/1.5 system-ui,sans-serif';
    caja.innerHTML =
      '<h3 style="margin:0 0 10px;font-size:16px">Token de GitHub</h3>' +
      '<ol style="margin:0 0 14px;padding-left:20px">' +
        '<li>Tocá <b>Abrir GitHub</b>: se abre en otra pestaña, ya con los permisos correctos elegidos.</li>' +
        '<li>Bajá hasta el final y tocá <b>Generate token</b>.</li>' +
        '<li>Copiá el token verde (ojo: solo se muestra una vez).</li>' +
        '<li>Volvé <b>a esta pestaña</b> y pegalo en el casillero de abajo.</li>' +
      '</ol>' +
      '<button type="button" data-gh="abrir" style="' + btnCss + ';width:100%;margin-bottom:10px">Abrir GitHub ↗</button>' +
      '<input type="text" data-gh="input" placeholder="Pegá el token acá (ghp_…)" ' +
        'style="width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #555;background:#111;color:#eee;font:inherit;margin-bottom:12px">' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
        '<button type="button" data-gh="cancelar" style="' + btnCss + '">Cancelar</button>' +
        '<button type="button" data-gh="guardar" style="' + btnCss + ';border-color:#6a8;background:#2c4636">Guardar</button>' +
      '</div>' +
      '<div style="margin-top:10px;opacity:.65;font-size:12px">Queda guardado en este navegador para las próximas veces.</div>';
    fondo.appendChild(caja);
    document.body.appendChild(fondo);
    const campo = caja.querySelector('[data-gh="input"]');
    campo.focus();
    const cerrar = valor => {
      document.removeEventListener('keydown', teclas);
      fondo.remove();
      res(valor);
    };
    const teclas = e => {
      if(e.key === 'Escape') cerrar(null);
      if(e.key === 'Enter' && document.activeElement === campo) cerrar(campo.value.trim() || null);
    };
    document.addEventListener('keydown', teclas);
    caja.querySelector('[data-gh="abrir"]').onclick = () => window.open(GH_TOKEN_URL, '_blank');
    caja.querySelector('[data-gh="cancelar"]').onclick = () => cerrar(null);
    caja.querySelector('[data-gh="guardar"]').onclick = () => cerrar(campo.value.trim() || null);
    fondo.onmousedown = e => { if(e.target === fondo) cerrar(null); };
  });
}

async function ghToken(pedirDeNuevo){
  let t = localStorage.getItem('gh-token');
  if(!t || pedirDeNuevo){
    t = await ghPedirToken();
    if(t) localStorage.setItem('gh-token', t.trim());
  }
  return t ? t.trim() : null;
}

function aBase64(texto){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(new Blob([texto]));
  });
}

/* Para pisar un archivo que ya está en el repo hay que mandarle a GitHub
   el sha de la versión anterior; si no, contesta 422 ("sha wasn't
   supplied"). Antes, si la consulta del sha fallaba por lo que fuera, se
   seguía igual sin sha y la subida moría con ese 422 sin decir por qué.
   Ahora, si la consulta directa no sirve, el sha se busca en el listado
   de la carpeta (otra ruta de la API, respuesta chica) y cualquier
   rareza queda anotada en la consola. */
async function ghShaPorListado(ruta, cab){
  const partes = ruta.split('/');
  const archivo = partes.pop();
  const carpeta = partes.join('/');
  const resp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${carpeta}?ref=${GH_BRANCH}`, {headers: cab, cache: 'no-store'});
  if(resp.status === 401 || resp.status === 403) throw {auth:true};
  if(!resp.ok) return undefined;
  const cuerpo = await resp.json();
  const lista = Array.isArray(cuerpo) ? cuerpo : (cuerpo.entries || []);
  const item = lista.find(x => x.name === archivo);
  return item ? item.sha : undefined;
}

async function ghSha(ruta, cab){
  const resp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${ruta}?ref=${GH_BRANCH}`, {headers: cab, cache: 'no-store'});
  if(resp.status === 401 || resp.status === 403) throw {auth:true};
  if(resp.status === 404) return undefined; // todavía no existe: se crea de cero
  if(resp.ok){
    const sha = (await resp.json()).sha;
    if(sha) return sha;
    console.warn(`GitHub contestó 200 para ${ruta} pero sin sha — lo busco en el listado de la carpeta`);
  }else{
    console.warn(`GitHub respondió ${resp.status} consultando ${ruta} — busco el sha en el listado de la carpeta`);
  }
  return await ghShaPorListado(ruta, cab);
}

async function ghSubir(ruta, contenidoB64, token, mensaje){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${ruta}`;
  const cab = {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.object+json'};
  const mandar = sha => fetch(url, {
    method: 'PUT',
    headers: cab,
    body: JSON.stringify({message: mensaje, content: contenidoB64, branch: GH_BRANCH, ...(sha ? {sha} : {})}),
  });
  const sha = await ghSha(ruta, cab);
  let resp = await mandar(sha);
  // 422 = el archivo existe y el sha que mandamos no le sirve: o no lo
  // encontramos, o alguien subió una versión nueva recién. Se vuelve a
  // pedir el sha y se reintenta una sola vez.
  if(resp.status === 422){
    const nuevo = await ghShaPorListado(ruta, cab);
    if(nuevo && nuevo !== sha) resp = await mandar(nuevo);
  }
  if(resp.status === 401 || resp.status === 403) throw {auth:true};
  if(!resp.ok) throw new Error(`GitHub respondió ${resp.status} subiendo ${ruta}: ${await resp.text()}`);
}

async function publicarShop(){
  if(!tiendaActual){ toast('Primero generá una tienda'); return; }
  const btn = $('#btn-publicar');
  const token = await ghToken(false);
  if(!token){ toast('Sin token no se puede publicar'); return; }
  btn.disabled = true;
  toast('Publicando en GitHub…');
  try{
    const b64 = await aBase64(JSON.stringify(tiendaActual, null, 2));
    await ghSubir(ARCHIVO_TIENDA, b64, token, `Publicar tienda (${tiendaActual.tamanoLabel})`);
    toast('Tienda publicada ✓ — los jugadores ya pueden cargarla');
  }catch(err){
    if(err && err.auth){
      localStorage.removeItem('gh-token');
      toast('El token no sirve o venció — tocá Publicar Shop de nuevo');
    }else{
      console.error('Error publicando la tienda:', err);
      toast('No se pudo publicar — revisá la consola');
    }
  }finally{
    btn.disabled = false;
  }
}

$('#btn-generar').addEventListener('click', generar);
$('#btn-regenerar').addEventListener('click', generar);
$('#btn-publicar').addEventListener('click', publicarShop);
