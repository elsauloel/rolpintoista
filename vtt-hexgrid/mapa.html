  if(panelMapas && soyGM){
    const filas = [MAPA_PRINCIPAL, ...[...mapasLista.keys()].filter(id => id !== MAPA_PRINCIPAL)
      .sort((a, b) => mapasLista.get(a).creadoMs - mapasLista.get(b).creadoMs)]
      .map(id => {
        const viendo = id === mapaMostrado, activo = id === mapaActivo;
        return `<div class="mapa-fila${viendo ? ' viendo' : ''}">
          <span class="mapa-nombre">${esc(nombreMapa(id))}${activo ? ' <b>· en juego</b>' : ''}</span>
          <div class="fila" style="margin-top:4px">
            ${viendo ? '' : `<button type="button" class="btn" data-mapa-ver="${esc(id)}">Ver</button>`}
            ${activo ? '' : `<button type="button" class="btn primary" data-mapa-publicar="${esc(id)}">Publicar</button>`}
            <button type="button" class="btn" data-mapa-renombrar="${esc(id)}" title="Renombrar">✎</button>
            ${id === MAPA_PRINCIPAL ? '' : `<button type="button" class="btn peligro" data-mapa-borrar="${esc(id)}" title="Borrar">✕</button>`}
          </div>
        </div>`;
      }).join('');
    panel.innerHTML =
      '<h2>Mapas</h2>' +
      '<p class="ayuda" style="margin-top:0">"Ver" cambia lo que estás mirando vos, para ir armándolo. "Publicar" cambia lo que ven los jugadores.</p>' +
      filas +
      '<div class="fila" style="margin-top:10px"><button type="button" class="btn primary" id="mapa-nuevo">+ Nuevo mapa</button><button type="button" class="btn" id="mapas-cerrar">Cerrar</button></div>';
    panel.querySelectorAll('[data-mapa-ver]').forEach(b => b.onclick = () => verMapa(b.dataset.mapaVer));
    panel.querySelectorAll('[data-mapa-publicar]').forEach(b => b.onclick = () => publicarMapa(b.dataset.mapaPublicar));
    panel.querySelectorAll('[data-mapa-renombrar]').forEach(b => b.onclick = () => renombrarMapa(b.dataset.mapaRenombrar));
    panel.querySelectorAll('[data-mapa-borrar]').forEach(b => b.onclick = () => borrarMapa(b.dataset.mapaBorrar));
    $('#mapa-nuevo').onclick = crearMapa;
    $('#mapas-cerrar').onclick = () => { panelMapas = false; renderPanel(true); };
    return;
  }

  if(panelFondo && soyGM){
    const casillas = fondo ? Math.round(fondo.ancho / ANCHO_CASILLA * 10) / 10 : 20;
    panel.innerHTML =
      '<h2>Fondo del mapa</h2>' +
      '<div class="fila" style="margin-top:0">' +
        `<button type="button" class="btn primary" id="fondo-cargar">${fondo ? 'Cambiar imagen' : 'Cargar imagen'}</button>` +
        (fondo ? '<button type="button" class="btn peligro" id="fondo-quitar">Quitar</button>' : '') +
      '</div>' +
      (fondo
        ? `<label class="etiqueta">Ancho, en casillas</label><div class="fila" style="margin-top:0"><input id="fondo-ancho" type="number" min="1" max="400" step="0.5" value="${casillas}"><button type="button" class="btn" id="fondo-ancho-ok">Aplicar</button></div>` +
          `<label class="fila" style="cursor:pointer"><input type="checkbox" id="fondo-mover" style="width:auto"${moverFondo ? ' checked' : ''}> Arrastrar el fondo con el mouse</label>` +
          '<p class="ayuda" style="margin-top:6px">Con esa casilla tildada, arrastrar un lugar vacío mueve la imagen para acomodarla a la grilla. Destildala para volver a desplazar la vista.</p>'
        : '<p class="ayuda" style="margin-top:8px">La imagen se achica sola para que entre en la mesa. Todos la ven debajo de la grilla.</p>') +
      '<div class="fila"><button type="button" class="btn" id="fondo-cerrar">Listo</button></div>';
    $('#fondo-cargar').onclick = () => $('#fondo-archivo').click();
    $('#fondo-cerrar').onclick = () => { panelFondo = false; moverFondo = false; renderPanel(true); pedirDibujo(); };
    if($('#fondo-quitar')) $('#fondo-quitar').onclick = async () => {
      if(!confirm('¿Quitar la imagen de fondo del mapa?')) return;
      try{
        const lote = fbDb.batch();
        lote.delete(fbDb.doc(fbRutaCampana(rutaMapaEstado('fondo'))));
        lote.delete(fbDb.doc(fbRutaCampana(rutaMapaEstado('fondoImagen'))));
        await lote.commit();
        moverFondo = false;
      }
      catch(err){ console.error(err); toast('No se pudo quitar el fondo'); }
    };
    if($('#fondo-ancho-ok')) $('#fondo-ancho-ok').onclick = () => {
      const n = num($('#fondo-ancho').value);
      if(n < 1 || n > 400){ toast('Poné un ancho entre 1 y 400 casillas'); return; }
      fondo.ancho = n * ANCHO_CASILLA;
      pedirDibujo();
      guardarFondo({ancho: fondo.ancho});
    };
    if($('#fondo-mover')) $('#fondo-mover').onchange = e => { moverFondo = e.target.checked; };
    return;
  }

  if(creando){
    let color = COLORES[Math.floor(Math.random() * COLORES.length)];
    let imagenNueva = '';   // solo para tokens sin vincular (NPC, objetos)
    const tipoInicial = soyGM ? 'creep' : 'pj';
    panel.innerHTML =
      '<h2>Nuevo token</h2>' +
      (soyGM ? '<label class="etiqueta">Tipo</label><select id="nuevo-tipo"><option value="creep">Creep o NPC (lo mueve el GM)</option><option value="pj">Personaje (lo movés vos)</option></select>' +
        '<p class="ayuda" style="margin-top:4px">Vinculado a un creep de gm-tools: borde rojo. Sin vincular: NPC, borde gris.</p>' : '') +
      `<label class="etiqueta">Vincular a ${soyGM ? 'un creep o ficha' : 'uno de tus personajes'}</label><select id="nuevo-vinculo">${opcionesVinculo(tipoInicial, '', soyGM)}</select>` +
      '<div id="nuevo-dueno-caja"></div>' +
      '<label class="etiqueta">Nombre</label><input id="nuevo-nombre" maxlength="40" placeholder="Ej: Aurelio">' +
      '<div id="nuevo-imagen"></div>' +
      '<label class="etiqueta">Color (se ve si no tiene imagen)</label>' + htmlColores(color, true) +
      '<div class="fila"><button type="button" class="btn primary" id="nuevo-crear">Poner en el mapa</button><button type="button" class="btn" id="nuevo-cancelar">Cancelar</button></div>' +
      '<p class="ayuda" style="margin-top:8px">Vinculado, el token toma el nombre, la imagen, las barras y los estados de su ficha. Aparece en el centro de lo que estás viendo.</p>';
    // Imagen propia: solo tiene sentido sin vincular (vinculado, la toma de
    // la ficha o el creep). Se guarda ya achicada, lista para crear el token.
    const imagenNuevaHtml = () => {
      if($('#nuevo-vinculo').value) return '';
      return '<label class="etiqueta">Imagen (opcional)</label>' +
        '<div class="fila" style="margin-top:0;align-items:center">' +
          (imagenNueva ? `<img src="${esc(imagenNueva)}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid ${esc(color)}">` : '') +
          `<button type="button" class="btn" id="nuevo-imagen-elegir">${imagenNueva ? 'Cambiar imagen' : 'Elegir imagen'}</button>` +
          (imagenNueva ? '<button type="button" class="btn peligro" id="nuevo-imagen-quitar">Quitar</button>' : '') +
        '</div>';
    };
    const actualizarImagenNueva = () => {
      $('#nuevo-imagen').innerHTML = imagenNuevaHtml();
      const elegir = $('#nuevo-imagen-elegir');
      if(elegir) elegir.onclick = () => {
        const entrada = $('#token-imagen-archivo');
        entrada.onchange = async ev => {
          const file = ev.target.files[0];
          ev.target.value = '';
          if(!file) return;
          try{ imagenNueva = await recortarImagen(file, {lado: TOKEN_IMG_PX, tope: TOKEN_IMG_MAX}); actualizarImagenNueva(); }
          catch(err){
            if(err.message === 'cancelado') return;
            console.error('No se pudo preparar la imagen del token:', err);
            toast(err.message === 'no-image' ? 'Eso no es una imagen' : 'No se pudo usar esa imagen');
          }
        };
        entrada.click();
      };
      const quitar = $('#nuevo-imagen-quitar');
      if(quitar) quitar.onclick = () => { imagenNueva = ''; actualizarImagenNueva(); };
    };
    actualizarImagenNueva();
    conectarColores(panel, c => { color = c; actualizarImagenNueva(); });
    const tipoActual = () => soyGM ? $('#nuevo-tipo').value : 'pj';
    // Dueño: solo el GM lo elige, y solo para un token de tipo "pj" — el
    // token queda de quien se elija acá, no de quien lo crea (para poder
    // armar el token de cada jugador de antemano en un mapa que todavía no
    // se publicó). Arranca en el dueño de la ficha vinculada, si hay.
    const actualizarDueno = duenoSugerido => {
      const caja = $('#nuevo-dueno-caja');
      if(!soyGM || tipoActual() !== 'pj'){ caja.innerHTML = ''; return; }
      const previo = $('#nuevo-dueno') ? $('#nuevo-dueno').value : '';
      caja.innerHTML = '<label class="etiqueta">Dueño (quién lo mueve)</label>' +
        `<select id="nuevo-dueno">${opcionesDueno(duenoSugerido || previo)}</select>`;
    };
    actualizarDueno();
    const alVincular = () => {
      const id = $('#nuevo-vinculo').value;
      const vv = id ? vinculo({tipo: tipoActual(), fichaId: id}) : null;
      if(vv) $('#nuevo-nombre').value = vv.nombre.slice(0, 40);
      actualizarDueno(vv && vv.duenoUid);
      actualizarImagenNueva();
    };
    $('#nuevo-vinculo').onchange = alVincular;
    if(soyGM) $('#nuevo-tipo').onchange = () => {
      $('#nuevo-vinculo').innerHTML = opcionesVinculo(tipoActual(), '', true);
      actualizarDueno();
      actualizarImagenNueva();
    };
    const crear = () => {
      const nombre = $('#nuevo-nombre').value.trim();
      if(!nombre){ $('#nuevo-nombre').focus(); return; }
      const fichaId = $('#nuevo-vinculo').value;
      const duenoUid = soyGM && tipoActual() === 'pj' && $('#nuevo-dueno') ? $('#nuevo-dueno').value : undefined;
      crearToken({nombre, color, tipo: tipoActual(), fichaId, imagen: fichaId ? '' : imagenNueva, duenoUid});
    };
    $('#nuevo-crear').onclick = crear;
    $('#nuevo-nombre').onkeydown = e => { if(e.key === 'Enter') crear(); };
    $('#nuevo-cancelar').onclick = () => { creando = false; renderPanel(true); };
    $('#nuevo-vinculo').focus();
    return;
  }

  // Los datos del token se ven en los controles flotantes (HUD): el panel
  // del costado queda solo con Token (?) y la configuración de los dados.
  if(!t || !editandoToken){
    const item = (color, texto) => `<span><i style="border-color:${color}"></i>${texto}</span>`;
    // El GM no suele tener tokens de personaje propios: el dorado solo
    // aparece en su leyenda si tiene alguno.
    const gmConPropios = soyGM && [...tokens.values()].some(x => claseToken(x) === 'propio');
    const ayuda = soyGM
      ? 'Tocá un token para ver de quién es. Vos movés los creeps y los NPC arrastrándolos; los personajes los mueve cada jugador. ' +
        'En modo combate los creeps gastan sus No2 al moverse (si se pasan, te pide confirmar); los NPC se mueven sin costo. Con el switch de arriba pasás de modo narrativo a combate para toda la mesa. '
      : 'Tocá un token para ver de quién es. Arrastrá los tuyos para moverlos: la estela marca la ruta casillero por casillero. En modo combate tus personajes gastan No2 al moverse (si te pasás, te pide confirmar); en modo narrativo, no. ';
    const leyenda = soyGM
      ? (gmConPropios ? item(BORDE.propio, 'Tuyos') : '') + item(BORDE.creep, 'Creeps') + item(BORDE.npc, 'NPC') + item(BORDE.jugador, 'Jugadores')
      : item(BORDE.propio, 'Tuyos') + item(BORDE.jugador, 'Otros jugadores') + item(BORDE.creep, 'Creeps') + item(BORDE.npc, 'NPC');
    panel.innerHTML =
      // La ayuda queda escondida detrás del (?): aparece al pasar el cursor
      // (o al tocarlo en pantallas táctiles).
      // Barra partida en dos: a la izquierda Token (?), a la derecha la
      // configuración de los dados 3D.
      '<div class="barra-token">' +
      '<h2 class="con-ayuda">Token <span class="ayuda-icono" tabindex="0" aria-label="Ayuda">?' +
        '<span class="ayuda-globo" role="tooltip">' +
          ayuda +
          'Arrastrá el fondo para desplazarte y usá la rueda o −/+ para el zoom.' +
          '<span class="leyenda">' + leyenda +
          '</span>' +
        '</span>' +
      '</span></h2>' +
      '<a class="btn chico-barra" href="../comun/prueba-dados.html" target="_blank" rel="noopener" style="text-decoration:none" title="Elegir cómo se ven y suenan tus dados 3D">Personalización 🎲</a>' +
      '</div>';
    return;
  }

  const editable = puedoMover(t);
  const titulo = t.tipo === 'creep' ? (t.fichaId ? 'Creep' : 'NPC') : (v && v.invocacion ? 'Invocación' : 'Personaje');

  // Edición: vínculo, nombre, color, dueño (GM), sacar del mapa.
  let color = t.color;
  panel.innerHTML =
    `<h2>Editar token · ${titulo.toLowerCase()}</h2>` +
    (editable
      ? `<label class="etiqueta">Vinculado a</label><select id="token-vinculo">${opcionesVinculo(t.tipo, t.fichaId)}</select>` +
        `<label class="etiqueta">Nombre (si no está vinculado)</label><input id="token-nombre" maxlength="40" value="${esc(t.nombre)}">` +
        '<label class="etiqueta">Color</label>' + htmlColores(t.color, true)
      : `<div class="dato"><b>${esc(nombreDe(t))}</b></div>`) +
    `<div class="dato" style="color:var(--muted)">Casilla ${t.col}, ${t.fila}</div>` +
    (soyGM && t.tipo === 'pj'
      ? '<label class="etiqueta">Cambiar dueño (si alguien cambió de cuenta)</label>' +
        `<div class="fila" style="margin-top:0"><select id="token-dueno">${opcionesDueno(t.duenoUid)}</select>` +
        '<button type="button" class="btn" id="token-dueno-ok">Cambiar</button></div>'
      : '') +
    '<div class="fila">' +
      (editable ? '<button type="button" class="btn primary" id="token-guardar">Guardar</button>' : '') +
      '<button type="button" class="btn" id="token-volver">Volver</button>' +
    '</div>' +
    (puedoBorrar(t) ? '<div class="fila"><button type="button" class="btn peligro" id="token-borrar">Sacar del mapa</button></div>' : '');

  $('#token-volver').onclick = () => { editandoToken = false; renderPanel(true); };
  if(editable){
    conectarColores(panel, c => color = c);
    const guardar = async () => {
      const fichaId = $('#token-vinculo').value;
      const vv = fichaId ? vinculo({tipo: t.tipo, fichaId}) : null;
      const nombre = ($('#token-nombre').value.trim() || (vv ? vv.nombre : '')).slice(0, 40);
      if(!nombre){ toast('El token necesita un nombre'); return; }
      const cambios = {nombre, color};
      cambios.fichaId = fichaId ? fichaId : firebase.firestore.FieldValue.delete();
      await editarToken(seleccion, cambios);
      editandoToken = false;
      renderPanel(true);
    };
    $('#token-guardar').onclick = guardar;
    $('#token-nombre').onkeydown = e => { if(e.key === 'Enter') guardar(); };
  }
  if($('#token-borrar')) $('#token-borrar').onclick = () => borrarToken(seleccion);
  if($('#token-dueno-ok')) $('#token-dueno-ok').onclick = () => {
    const nuevo = $('#token-dueno').value;
    if(nuevo && nuevo !== t.duenoUid) editarToken(seleccion, {duenoUid: nuevo});
  };
}

/* ---------- Controles flotantes del token (HUD) ----------
   Al seleccionar un token aparecen encima, como en Roll20: tres círculos
   con Vida (rojo), SP (azul) y No2 (verde) que se pueden editar con un
   clic, un botón de estados alterados, el engranaje (barras y aura) y el
   rayo (Botonera de la ficha o Acciones del creep). Todo se guarda donde
   corresponde: la ficha, el creep o el propio token. */

let hudGlobo = '';      // '' | 'estados' | 'ajustes'
let hudEditando = '';   // 'hp' | 'sp' | 'no2'

function hudCerrar(){
  hudGlobo = '';
  hudEditando = '';
}

// Valores que se muestran en los círculos.
function hudDatos(t){
  const v = vinculo(t);
  const r = (v && v.resumen) || {};
  const sc = t.tipo === 'creep' ? creepPrivadoDe(t.fichaId) : null;
  const n = valoresNo2(t);
  const invocacion = !!(v && v.invocacion);
  const secreto = t.tipo === 'creep' && !soyGM;  // los jugadores no ven números de creeps
  const hp = secreto ? null : (t.tipo === 'creep' ? (sc ? num(sc.hp) : null) : num(r.hp));
  const {sp, spMax} = spDeResumen(r);
  const conSp = t.tipo === 'pj' && !invocacion && spMax > 0;
  return {
    hp, hpMax: t.tipo === 'creep' ? (sc ? num(sc.hpMax) : null) : num(r.hpMax),
    sp: conSp ? sp : null, spMax: conSp ? spMax : null,
    no2: secreto ? null : (n ? n.valor : null), no2Max: secreto ? null : (n ? n.max : null),
    estados: (v && v.resumen && v.resumen.estados) || [],
  };
}

function hudHtml(t){
  const d = hudDatos(t);
  const puede = puedoCambiarVida(t);
  const circulo = (clave, valor, color) => {
    if(valor === null || valor === undefined) return '';
    if(hudEditando === clave && puede){
      return `<input class="hud-in" data-hud-in="${clave}" style="border-color:${color}" inputmode="decimal" placeholder="${fmt(valor)}" title="Escribí el valor, o +5 / -3, y apretá Enter">`;
    }
    return `<button type="button" class="hud-circulo" data-hud-valor="${clave}" style="border-color:${color}" ${puede ? '' : 'disabled'} title="${puede ? 'Clic para cambiar' : 'Solo lo cambia su dueño'}">${fmt(valor)}</button>`;
  };
  const icono = (clave, simbolo, titulo, activo) =>
    `<button type="button" class="hud-circulo icono${activo ? ' abierto' : ''}" data-hud-boton="${clave}" title="${titulo}">${simbolo}</button>`;

  const fichaDeToken = t.tipo === 'pj' && t.fichaId ? t.fichaId.split(SEP_INVOCACION)[0] : '';
  // Una invocación la maneja el mismo dueño que su personaje: mismo ⚡
  // (Botonera propia) que un PJ, ya no queda afuera.
  const propio = fichaDeToken && !soyGM && vinculo(t) && vinculo(t).duenoUid === fbUsuario.uid;
  const conRayo = propio || (soyGM && t.tipo === 'creep' && t.fichaId && creepsPub.has(t.fichaId));

  // Los botones se acomodan en ronda alrededor del token (ver hudUbicar).
  let html = '<div class="hud-anillo">' +
    circulo('hp', d.hp, HP_COLOR) + circulo('sp', d.sp, SP_COLOR) + circulo('no2', d.no2, NO2_COLOR) +
    icono('estados', '◎', 'Estados alterados', hudGlobo === 'estados') +
    (fichaDeToken ? icono('ficha', '📜', 'Abrir la ficha en otra pestaña') : '') +
    ((puedoMover(t) || soyGM) ? icono("ajustes", "⚙", "Barras, aura y edición del token", hudGlobo === "ajustes") : "") +
    (puedoMoverLibre(t) ? icono('libre', '🦶', 'Mover libre: llevarlo a otra casilla sin gastar No2 ni dejar estela', !!moverLibre && moverLibre === seleccion) : '') +
    (soyGM ? icono('oculto', t.oculto ? '🙈' : '👁', t.oculto ? 'Oculto: mostrarlo a los jugadores' : 'Ocultarlo (armarlo antes de que entre en la partida)', t.oculto) : '') +
    (conRayo ? icono('rayo', '⚡', propio ? 'Abrir la Botonera' : 'Abrir las Acciones del creep') : '') +
    '</div>' +
    (puedoMoverLibre(t) ? '<div class="hud-rotar" data-hud-rotar="1" title="Arrastrá para rotar el frente (celeste)">↻</div>' : '');
  let globo = '';
  if(hudGlobo === 'estados') globo = hudEstadosHtml(t, d.estados, puede);
  if(hudGlobo === "ajustes" && (puedoMover(t) || soyGM)) globo = hudAjustesHtml(t, d);
  return html + (globo ? '<div class="hud-globos">' + globo + '</div>' : '');
}

function hudEstadosHtml(t, estados, puede){
  // El + abre el selector de estados de la ficha (o de gm-tools en creeps),
  // dentro del mapa, con sus presets y su mecánica.
  const agregar = puede && puedeAgregarEstado(t)
    ? '<div class="hud-globo-acciones"><button type="button" class="hud-mini" data-hud-estado-nuevo="1">+ Estado</button></div>' : '';
  if(!estados.length) return '<div class="hud-globo"><h3>Estados alterados</h3><span style="color:var(--muted)">Ninguno activo.</span>' + agregar + '</div>';
  return '<div class="hud-globo"><h3>Estados alterados</h3>' + estados.map((e, i) => {
    const turnos = e.permanente ? "∞" : (num(e.turnos) ? fmt(num(e.turnos)) + "t" : "—");
    const det = String(e.detalle || "").trim();
    return `<div class="hud-estado">
      <span style="width:9px;height:9px;border-radius:50%;background:${ESTADO_COLOR[e.polaridad] || ESTADO_COLOR['']};flex:none"></span>
      <span class="nom${det ? " con-tip" : ""}" tabindex="${det ? 0 : -1}" title="${esc(det || e.nombre)}">${esc(e.nombre)}</span>
      ${det ? `<span class="estado-tip"><b>${esc(e.nombre)}</b>${esc(det)}</span>` : ""}
      <span class="turnos">${turnos}</span>` +
      (puede && !e.permanente ? `<button type="button" class="hud-mini" data-hud-turnos="${i}:-1" title="Un turno menos">−</button>
        <button type="button" class="hud-mini" data-hud-turnos="${i}:1" title="Un turno más">+</button>` : '') +
      (puede ? `<button type="button" class="hud-mini peligro" data-hud-quitar="${i}" title="Sacar este estado">✕</button>` : '') +
      (puede && puedeAgregarEstado(t) ? `<button type="button" class="hud-mini" data-hud-estado-editar="${i}" title="Editar este estado">⚙</button>` : '') +
    '</div>';
  }).join('') + agregar + '</div>';
}

function hudAjustesHtml(t, d){
  const barras = barrasDe(t);
  const aura = t.aura || {};
  const puede = puedoMover(t);
  const check = (clave, texto, color, si) =>
    `<label class="hud-chip" style="--chip:${color}" title="Mostrar la barra de ${texto} debajo del token">` +
    `<input type="checkbox" data-hud-barra="${clave}"${si ? ' checked' : ''}><span class="muestra"></span>${texto}</label>`;
  // Caja "actual / máximo" debajo de cada barra: el actual se edita ahí
  // mismo (mismo mecanismo que tocar el círculo del anillo); el máximo es
  // de lectura, sale de la ficha (fórmula) o del creep.
  const recurso = (clave, valor, maximo) => {
    if(valor === null || valor === undefined) return '<div class="hud-recurso vacio">—</div>';
    return `<div class="hud-recurso">` +
      `<input type="text" inputmode="decimal" class="hud-recurso-actual" data-hud-recurso="${clave}" value="${fmt(valor)}" title="Escribí el valor, o +5 / -3, y apretá Enter">` +
      `<span class="hud-recurso-max">/ ${maximo === null || maximo === undefined ? '—' : fmt(maximo)}</span>` +
    '</div>';
  };
  const seccion = (titulo, cuerpo) => `<div class="hud-seccion"><h3>${titulo}</h3>${cuerpo}</div>`;
  // Los tokens sin ficha ni creep (NPC, objetos) pueden llevar su propia
  // imagen; los vinculados usan la miniatura de su ficha o creep.
  const imagenHtml = (!puede || vinculo(t)) ? '' : seccion('Imagen',
    '<div style="display:flex;align-items:center;gap:10px">' +
      (t.imagen ? `<img src="${esc(t.imagen)}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid ${esc(t.color || '#9A867E')}">` : '') +
      '<div class="hud-acciones" style="margin:0;flex:1">' +
        `<button type="button" class="hud-mini" data-hud-imagen="1">${t.imagen ? 'Cambiar' : 'Elegir imagen'}</button>` +
        (t.imagen ? '<button type="button" class="hud-mini peligro" data-hud-imagen-no="1">Quitar</button>' : '') +
      '</div>' +
    '</div>');
  // Nombre, color, vínculo y dueño se editan en el panel del costado.
  const editarHtml = (puede || soyGM)
    ? '<div class="hud-pie"><button type="button" class="hud-mini" data-hud-editar="1">✎ Editar token</button></div>'
    : '';
  if(!puede) return '<div class="hud-globo">' + seccion('Token', '') + editarHtml + '</div>';
  return '<div class="hud-globo">' +
    seccion('Barras',
      '<div class="hud-barras">' +
        check('hp', 'Vida', HP_COLOR, barras.hp) +
        check('sp', 'SP', SP_COLOR, barras.sp) +
        check('no2', 'No2', NO2_COLOR, barras.no2) +
      '</div>' +
      '<div class="hud-recursos">' +
        recurso('hp', d.hp, d.hpMax) +
        recurso('sp', d.sp, d.spMax) +
        recurso('no2', d.no2, d.no2Max) +
      '</div>') +
    seccion('Aura',
      '<div class="hud-rejilla">' +
        '<label for="hud-aura-radio">Radio</label>' +
        `<input id="hud-aura-radio" type="number" min="0" max="30" step="1" inputmode="numeric" value="${Math.round(num(aura.radio))}" data-hud-aura="radio" title="Casilleros enteros: 1 = su casilla y las 6 de alrededor; 0 = sin aura">` +
        '<label for="hud-aura-color">Color</label>' +
        `<input id="hud-aura-color" type="color" value="${/^#[0-9a-fA-F]{6}$/.test(aura.color || '') ? aura.color : '#E0A458'}" data-hud-aura="color">` +
        '<label for="hud-aura-forma">Forma</label>' +
        '<select id="hud-aura-forma" data-hud-aura="forma" style="grid-column:span 3">' +
          `<option value="hex"${aura.forma === 'circulo' ? '' : ' selected'}>Hexágonos</option>` +
          `<option value="circulo"${aura.forma === 'circulo' ? ' selected' : ''}>Círculo</option>` +
        '</select>' +
      '</div>' +
      '<div class="hud-acciones">' +
        (aura.radio ? '<button type="button" class="hud-mini peligro" data-hud-aura-no="1">Quitar</button>' : '') +
        '<button type="button" class="hud-mini" data-hud-aura-ok="1">Guardar aura</button>' +
      '</div>' +
      '<p class="hud-ayuda">Radio en casilleros (1 = su casilla y las 6 de alrededor). La ven todos.</p>') +
    imagenHtml +
    editarHtml +
    '</div>';
}

// Cartel fijo arriba a la derecha con el nombre del token y su dueño (el
// jugador, o "GM" en un creep/NPC): no se achica con el zoom, para
// leerlo igual con la grilla chiquita.
function actualizarEtiquetaToken(){
  const el = $('#token-etiqueta');
  const t = seleccion ? tokens.get(seleccion) : null;
  if(!t || !fbMiembro || creando || panelFondo || panelMapas){ el.hidden = true; return; }
  const dueno = t.tipo === 'creep' ? 'GM' : nombreMiembro(t.duenoUid);
  el.innerHTML = `<b>${esc(nombreDe(t))}</b> <span>(${esc(dueno)})</span>`;
  el.hidden = false;
}

// Dibuja el HUD y lo acomoda sobre el token seleccionado.
function hudUbicar(){
  actualizarEtiquetaToken();
  const hud = $('#hud');
  const t = seleccion ? tokens.get(seleccion) : null;
  if(!t || !fbMiembro || creando || panelFondo || panelMapas){ hud.hidden = true; return; }
  const d = disposicion.find(x => x.id === seleccion);
  const vis = visibles.get(seleccion) || (d ? {x: d.x, y: d.y} : hexCentro(t.col, t.fila));
  const radio = (d ? d.radio : HEX * 0.68) * vista.zoom;
  const px = vis.x * vista.zoom + vista.x, py = vis.y * vista.zoom + vista.y;
  const firma = JSON.stringify([seleccion, hudGlobo, hudEditando, hudDatos(t), barrasDe(t), t.aura || null, (t.imagen || '').length, soyGM, !!t.oculto, moverLibre === seleccion]);
  if(hud.dataset.firma !== firma){
    hud.dataset.firma = firma;
    hud.innerHTML = hudHtml(t);
    hudConectar(t);
  }
  hud.hidden = false;
  hud.style.left = Math.round(px) + 'px';
  hud.style.top = Math.round(py) + 'px';
  hudAcomodarAnillo(radio);
  hudAcomodarRotar(t, radio);
}

// Ubica el handle de rotación en el lado del frente, un poco más afuera
// que el anillo. Se llama sola (sin depender de la firma) para que se
// mueva en cada cuadro, tanto al arrastrarlo como cuando llega un cambio
// de otra pantalla.
function hudAcomodarRotar(t, radioToken){
  const handle = $('#hud').querySelector('.hud-rotar');
  if(!handle) return;
  const ang = (90 + num(t.rotacion || 0)) * Math.PI / 180;
  const r = radioToken + 28;
  handle.style.left = Math.round(Math.cos(ang) * r) + 'px';
  handle.style.top = Math.round(Math.sin(ang) * r) + 'px';
}

// Reparte los botones en ronda alrededor del token, dejando un hueco abajo
// (ahí van las barras y el nombre). El radio crece con el zoom y con la
// cantidad de botones, para que no se pisen.
function hudAcomodarAnillo(radioToken){
  const hud = $('#hud');
  const botones = [...hud.querySelectorAll('.hud-anillo > *')];
  if(!botones.length) return;
  const ARCO = 300;              // grados que ocupa la ronda (60 libres abajo)
  const paso = botones.length > 1 ? ARCO / (botones.length - 1) : 0;
  const minRadio = botones.length > 1 ? 21 / Math.sin(Math.min(Math.PI / 2, paso * Math.PI / 360)) : 0;
  // Como en Roll20: la ronda va por fuera de las casillas vecinas (un casillero
  // y medio), así se ve lo que hay alrededor del token.
  const afuera = Math.min(ANCHO_CASILLA * vista.zoom * 1.5 + 6, 200);
  const r = Math.max(radioToken + 34, afuera, minRadio, 52);
  botones.forEach((b, i) => {
    const ang = (-90 - ARCO / 2 + paso * i) * Math.PI / 180;
    b.style.left = Math.round(Math.cos(ang) * r) + 'px';
    b.style.top = Math.round(Math.sin(ang) * r) + 'px';
  });
  const globos = hud.querySelector('.hud-globos');
  if(globos) hudAcomodarGlobo(globos, r);
}

// El panel que se abre (estados o ajustes) va al costado del anillo, sin
// tapar el token: a la derecha, o a la izquierda si no entra. Siempre dentro
// del mapa y, si es más alto que la pantalla, con scroll.
function hudAcomodarGlobo(globos, r){
  const caja = $('#lienzo-caja').getBoundingClientRect();
  const hud = $('#hud').getBoundingClientRect();
  const px = hud.left - caja.left, py = hud.top - caja.top;   // centro del token
  const margen = 8;
  globos.style.maxHeight = Math.max(120, caja.height - margen * 2) + 'px';
  const w = globos.offsetWidth, h = globos.offsetHeight;
  const lado = r + 26;
  let x, y;
  if(px + lado + w <= caja.width - margen || px - lado - w >= margen){
    x = px + lado + w <= caja.width - margen ? px + lado : px - lado - w;
    y = py - h / 2;
  }else{
    // No entra a ningún costado (pantalla angosta): abajo o arriba del anillo.
    x = px - w / 2;
    y = py + lado;
    if(y + h > caja.height - margen) y = py - lado - h;
  }
  x = Math.max(margen, Math.min(x, caja.width - w - margen));
  y = Math.max(margen, Math.min(y, caja.height - h - margen));
  globos.style.left = Math.round(x - px) + 'px';
  globos.style.top = Math.round(y - py) + 'px';
}

function hudConectar(t){
  const hud = $('#hud');
  hud.querySelectorAll('[data-hud-valor]').forEach(b => b.onclick = () => {
    hudEditando = b.dataset.hudValor; hudGlobo = ''; pedirDibujo();
    setTimeout(() => { const i = hud.querySelector('[data-hud-in]'); if(i) i.focus(); }, 30);
  });
  const campo = hud.querySelector('[data-hud-in]');
  if(campo){
    campo.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); hudAplicar(campo.dataset.hudIn, campo.value); }
      if(e.key === 'Escape'){ hudEditando = ''; pedirDibujo(); }
    };
    campo.onblur = () => { hudEditando = ''; pedirDibujo(); };
  }
  hud.querySelectorAll('[data-hud-boton]').forEach(b => b.onclick = () => {
    const clave = b.dataset.hudBoton;
    if(clave === 'ficha'){ abrirFichaDeToken(t); return; }
    if(clave === 'libre'){ activarMoverLibre(seleccion); return; }
    if(clave === 'oculto'){ editarToken(seleccion, {oculto: !t.oculto}); return; }
    if(clave === 'rayo'){
      const fichaDeToken = t.tipo === 'pj' && t.fichaId ? t.fichaId.split(SEP_INVOCACION)[0] : '';
      const invDeToken = t.tipo === 'pj' && t.fichaId && t.fichaId.includes(SEP_INVOCACION) ? t.fichaId.split(SEP_INVOCACION)[1] : '';
      if(fichaDeToken) abrirBotonera(fichaDeToken, undefined, invDeToken); else abrirAcciones(t.fichaId);
      return;
    }
    hudGlobo = hudGlobo === clave ? '' : clave;
    hudEditando = '';
    pedirDibujo();
  });
  const nuevoEstado = hud.querySelector('[data-hud-estado-nuevo]');
  if(nuevoEstado) nuevoEstado.onclick = () => abrirEstadoNuevo(t);
  // Descripción del estado: se muestra al pasar el mouse (o con Tab) y se
  // ubica a mano, para que no la recorte el scroll del globo ni el borde
  // del mapa.
  hud.querySelectorAll('.hud-estado .nom.con-tip').forEach(nom => {
    const tip = nom.parentElement.querySelector('.estado-tip');
    if(!tip) return;
    const mostrar = () => {
      tip.classList.add('visible');
      const caja = $('#lienzo-caja').getBoundingClientRect();
      const r = nom.getBoundingClientRect();
      const margen = 8;
      const ancho = tip.offsetWidth, alto = tip.offsetHeight;
      let x = r.left;
      x = Math.max(caja.left + margen, Math.min(x, caja.right - ancho - margen));
      let y = r.top - alto - 6;                       // arriba del renglón
      if(y < caja.top + margen) y = r.bottom + 6;     // no entra: abajo
      y = Math.max(caja.top + margen, Math.min(y, caja.bottom - alto - margen));
      tip.style.left = Math.round(x) + 'px';
      tip.style.top = Math.round(y) + 'px';
    };
    const esconder = () => tip.classList.remove('visible');
    nom.onmouseenter = mostrar;
    nom.onfocus = mostrar;
    nom.onmouseleave = esconder;
    nom.onblur = esconder;
  });
  hud.querySelectorAll('[data-hud-estado-editar]').forEach(b => b.onclick = () => {
    const v = vinculo(t);
    const e = ((v && v.resumen && v.resumen.estados) || [])[num(b.dataset.hudEstadoEditar)];
    if(e) abrirEditarEstado(t, e.nombre);
  });
  hud.querySelectorAll('[data-hud-quitar]').forEach(b => b.onclick = () => hudEstadoCambiar(t, num(b.dataset.hudQuitar), 'quitar'));
  hud.querySelectorAll('[data-hud-turnos]').forEach(b => b.onclick = () => {
    const [i, delta] = b.dataset.hudTurnos.split(':');
    hudEstadoCambiar(t, num(i), 'turnos', num(delta));
  });
  hud.querySelectorAll('[data-hud-barra]').forEach(c => c.onchange = () => {
    const barras = {...barrasDe(t)};
    barras[c.dataset.hudBarra] = c.checked;
    editarToken(seleccion, {barras});
  });
  // Caja "actual / máximo": Enter guarda (mismo camino que el círculo del
  // anillo), Escape o perder el foco sin guardar vuelve al valor de antes.
  hud.querySelectorAll('[data-hud-recurso]').forEach(inp => {
    inp.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); hudAplicar(inp.dataset.hudRecurso, inp.value); }
      if(e.key === 'Escape'){ inp.value = inp.defaultValue; inp.blur(); }
    };
    inp.onblur = () => { inp.value = inp.defaultValue; };
  });
  const handleRotar = hud.querySelector('[data-hud-rotar]');
  if(handleRotar) handleRotar.onpointerdown = e => {
    e.preventDefault();
    handleRotar.setPointerCapture(e.pointerId);
    const centro = handleRotar.parentElement.getBoundingClientRect();
    const d = disposicion.find(x => x.id === seleccion);
    rotando = {id: seleccion, cx: centro.left, cy: centro.top, radio: (d ? d.radio : HEX * 0.68) * vista.zoom};
  };
  if(handleRotar) handleRotar.onpointermove = e => {
    if(!rotando || rotando.id !== seleccion) return;
    const dx = e.clientX - rotando.cx, dy = e.clientY - rotando.cy;
    if(Math.hypot(dx, dy) < 6) return;
    // 0° = frente abajo, sentido horario (mismo criterio que rota la imagen).
    let ang = Math.atan2(-dx, dy) * 180 / Math.PI;
    ang = (((Math.round(ang / 60) * 60) % 360) + 360) % 360;
    const tok = tokens.get(rotando.id);
    if(tok && tok.rotacion !== ang){
      tok.rotacion = ang;
      hudAcomodarRotar(tok, rotando.radio);
      pedirDibujo();
    }
  };
  if(handleRotar) handleRotar.onpointerup = e => {
    if(!rotando) return;
    const id = rotando.id;
    const tok = tokens.get(id);
    rotando = null;
    handleRotar.releasePointerCapture(e.pointerId);
    if(tok) editarToken(id, {rotacion: num(tok.rotacion || 0)});
  };
  const botonEditar = hud.querySelector("[data-hud-editar]");
  if(botonEditar) botonEditar.onclick = () => { editandoToken = true; hudCerrar(); renderPanel(true); pedirDibujo(); };
  const botonImagen = hud.querySelector("[data-hud-imagen]");
  if(botonImagen) botonImagen.onclick = () => elegirImagenToken(seleccion);
  const quitarImagen = hud.querySelector('[data-hud-imagen-no]');
  if(quitarImagen) quitarImagen.onclick = () => editarToken(seleccion, {imagen: firebase.firestore.FieldValue.delete()});
  const guardarAura = () => {
    const radio = Math.min(30, Math.max(0, Math.round(num(hud.querySelector('[data-hud-aura="radio"]').value))));
    const color = hud.querySelector('[data-hud-aura="color"]').value;
    const forma = hud.querySelector('[data-hud-aura="forma"]').value === 'circulo' ? 'circulo' : 'hex';
    editarToken(seleccion, {aura: radio > 0 ? {radio, forma, color} : firebase.firestore.FieldValue.delete()});
  };
  const campoRadio = hud.querySelector('[data-hud-aura="radio"]');
  // Solo números naturales: se descartan comas, puntos y signos al tipear.
  if(campoRadio) campoRadio.oninput = () => {
    const limpio = campoRadio.value.replace(/[^0-9]/g, '');
    if(limpio !== campoRadio.value) campoRadio.value = limpio;
  };
  if(campoRadio) campoRadio.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); guardarAura(); } };
  const ok = hud.querySelector('[data-hud-aura-ok]');
  if(ok) ok.onclick = guardarAura;
  const quitar = hud.querySelector('[data-hud-aura-no]');
  if(quitar) quitar.onclick = () => {
    hud.querySelector('[data-hud-aura="radio"]').value = '0';
    guardarAura();
  };
}

async function hudAplicar(clave, texto){
  const t = seleccion ? tokens.get(seleccion) : null;
  if(!t || !puedoCambiarVida(t) || !String(texto).trim()){ hudEditando = ''; pedirDibujo(); return; }
  try{
    if(clave === 'no2') await cambiarNitros(t, texto);
    else if(t.tipo === 'creep') await cambiarVidaCreep(t.fichaId, texto);
    else await cambiarVidaPj(t, clave, texto);
  }catch(err){
    console.error('No se pudo cambiar el valor:', err);
    toast(err.message === ERROR_TIPEO ? 'Escribí un número, o +5 / -3'
      : err.code === 'permission-denied' ? 'No podés cambiar eso' : 'No se pudo guardar: ' + err.message);
  }finally{
    hudEditando = '';
    pedirDibujo();
  }
}

// No2 desde el HUD (los PJ en su ficha, los creeps en su parte privada).
async function cambiarNitros(t, texto){
  if(t.tipo === 'creep'){
    await modificarCreep(t.fichaId, sc => {
      const nuevo = leerValorVital(texto, num(sc.nitros));
      if(nuevo === null) throw new Error(ERROR_TIPEO);
      sc.nitros = Math.max(0, nuevo);
    });
    return;
  }
  const base = fbDb.doc(fbRutaCampana(`fichas/${t.fichaId}`));
  const parteRef = base.collection('partes').doc('general');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  await fbDb.runTransaction(async tx => {
    const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
    if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
    const datos = JSON.parse(parte.data().json || '{}');
    const r = ficha.data().resumen || {};
    const actual = datos.nitros === null || datos.nitros === undefined ? num(r.nitros) : num(datos.nitros);
    const nuevo = leerValorVital(texto, actual);
    if(nuevo === null) throw new Error(ERROR_TIPEO);
    datos.nitros = Math.max(0, nuevo);
    tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
    tx.update(base, {'resumen.nitros': datos.nitros, actualizado: ts});
  });
}

function puedeAgregarEstado(t){
  if(!t || !t.fichaId) return false;
  return t.tipo === 'creep' ? soyGM : true;
}

// Abre el selector de estados de la herramienta que corresponde.
function abrirFichaDeToken(t){
  const fichaId = t.tipo === 'pj' && t.fichaId ? t.fichaId.split(SEP_INVOCACION)[0] : '';
  if(!fichaId) return;
  const url = '../ficha-personaje/ficha.html?partida=' + encodeURIComponent(FB_CAMPANA) + '#' + encodeURIComponent(fichaId);
  window.open(url, '_blank', 'noopener');
}

function abrirEstadoNuevo(t){
  if(!puedeAgregarEstado(t)) return;
  if(t.tipo === 'creep') abrirAcciones(t.fichaId, {tipo: 'abrir-estados', creep: t.fichaId});
  else{
    const invId = t.fichaId.includes(SEP_INVOCACION) ? t.fichaId.split(SEP_INVOCACION)[1] : '';
    abrirBotonera(t.fichaId.split(SEP_INVOCACION)[0], {tipo: 'abrir-estados', inv: invId}, invId);
  }
}

// ⚙ de un estado: abre su editor en la ficha o en gm-tools (se busca por
// nombre, porque el resumen no guarda el id del estado). Las invocaciones
// no tienen editor individual de estado: solo reabre su Botonera (el
// estado se saca con × ahí mismo).
function abrirEditarEstado(t, nombre){
  if(!puedeAgregarEstado(t)) return;
  if(t.tipo === 'creep') abrirAcciones(t.fichaId, {tipo: 'editar-estado', creep: t.fichaId, nombre});
  else{
    const invId = t.fichaId.includes(SEP_INVOCACION) ? t.fichaId.split(SEP_INVOCACION)[1] : '';
    abrirBotonera(t.fichaId.split(SEP_INVOCACION)[0], {tipo: 'editar-estado', nombre, inv: invId}, invId);
  }
}

// Estados alterados desde el HUD: sacar uno o cambiarle los turnos.
async function hudEstadoCambiar(t, indice, accion, delta){
  const v = vinculo(t);
  const lista = (v && v.resumen && v.resumen.estados) || [];
  const objetivo = lista[indice];
  if(!objetivo || !puedoCambiarVida(t)) return;
  const tocar = arr => {
    const i = arr.findIndex(e => e && e.nombre === objetivo.nombre && e.activo !== false);
    if(i < 0) throw new Error('Ese estado ya no está');
    if(accion === 'quitar') arr.splice(i, 1);
    else arr[i].turnos = Math.max(0, num(arr[i].turnos) + delta);
    return arr;
  };
  try{
    if(t.tipo === 'creep'){
      await modificarCreep(t.fichaId, sc => { sc.estados = tocar(Array.isArray(sc.estados) ? sc.estados : []); });
    }else{
      const [fichaId, invId] = t.fichaId.split(SEP_INVOCACION);
      const base = fbDb.doc(fbRutaCampana(`fichas/${fichaId}`));
      const parteRef = base.collection('partes').doc(invId ? 'invocaciones' : 'efectos');
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      await fbDb.runTransaction(async tx => {
        const [parte, ficha] = await Promise.all([tx.get(parteRef), tx.get(base)]);
        if(!parte.exists || !ficha.exists) throw new Error('La ficha todavía no se guardó en la mesa');
        const datos = JSON.parse(parte.data().json || '{}');
        const cambios = {actualizado: ts};
        if(invId){
          const r = ficha.data().resumen || {};
          const inv = (datos.invocaciones || []).find(i => i && i.id === invId);
          if(!inv) throw new Error('La invocación ya no existe');
          inv.estados = tocar(Array.isArray(inv.estados) ? inv.estados : []);
          const resumenEstados = inv.estados.filter(e => e && e.activo !== false && e.nombre).slice(0, 30).map(e => ({
            nombre: String(e.nombre).slice(0, 60), turnos: num(e.turnos), permanente: !!e.permanente,
            polaridad: e.polaridad === 'buff' || e.polaridad === 'debuff' ? e.polaridad : '',
            detalle: String(e.detalle || '').slice(0, 200),
          }));
          cambios['resumen.invocaciones'] = (r.invocaciones || []).map(i => i.id === invId ? {...i, estados: resumenEstados} : i);
        }else{
          datos.efectos = tocar(Array.isArray(datos.efectos) ? datos.efectos : []);
          cambios['resumen.estados'] = datos.efectos.filter(e => e && e.activo !== false && e.nombre).slice(0, 30).map(e => ({
            nombre: String(e.nombre).slice(0, 60), turnos: num(e.turnos), permanente: !!e.permanente,
            polaridad: e.polaridad === 'buff' || e.polaridad === 'debuff' ? e.polaridad : '',
            detalle: String(e.detalle || '').slice(0, 200),
          }));
        }
        tx.set(parteRef, {json: JSON.stringify(datos), actualizado: ts});
        tx.update(base, cambios);
      });
    }
  }catch(err){
    console.error('No se pudo cambiar el estado:', err);
    toast(err.code === 'permission-denied' ? 'No podés cambiar eso' : 'No se pudo cambiar el estado: ' + err.message);
  }
}

/* ---------- Botonera de la ficha, dentro del mapa ----------
   Carga la ficha en un iframe (?modo=botonera), que muestra solo la
   Botonera. El iframe queda cargado mientras sea el mismo personaje, así
   volver a abrirla es instantáneo. Lo que se haga ahí se guarda en la
   ficha como siempre y se ve en el token. */
// La misma capa sirve para las Acciones de un creep (gm-tools con
// ?modo=acciones, solo GM). herramienta: 'ficha' | 'gm'.
let botonera = {herramienta: '', fichaId: '', lista: false};

// En pantallas anchas la capa tapa solo la mitad izquierda del mapa; en la
// otra mitad se sigue viendo el mapa, centrado en el token de esa ventana.
function botoneraEnMitad(){ return window.innerWidth > 760; }

function ubicarBotoneraCapa(){
  const capa = $('#botonera-capa');
  if(capa.hidden) return;
  if(!botoneraEnMitad()){ capa.removeAttribute('style'); return; }
  const r = $('#lienzo-caja').getBoundingClientRect();
  Object.assign(capa.style, {
    left: r.left + 'px', top: r.top + 'px', right: 'auto', bottom: 'auto',
    width: Math.round(r.width / 2) + 'px', height: r.height + 'px',
  });
}
window.addEventListener('resize', ubicarBotoneraCapa);

function centrarTokenDeBotonera(herramienta, id){
  const es = t => !!(t && t.fichaId && (herramienta === 'gm'
    ? t.tipo === 'creep' && t.fichaId === id
    : t.tipo === 'pj' && t.fichaId.split(SEP_INVOCACION)[0] === id));
  const lista = [...tokens.values()];
  const sel = seleccion ? tokens.get(seleccion) : null;
  const t = es(sel) ? sel : (lista.find(x => es(x) && !x.fichaId.includes(SEP_INVOCACION)) || lista.find(es));
  if(!t) return;
  const c = hexCentro(t.col, t.fila);
  const centroLibre = botoneraEnMitad() ? anchoPx * 0.75 : anchoPx / 2;
  vista.x = centroLibre - c.x * vista.zoom;
  vista.y = altoPx / 2 - c.y * vista.zoom;
  guardarVista(); pedirDibujo();
}

// invId: si viene, abre la Botonera de esa invocación del personaje en vez
// de la propia (mismo iframe: la ficha ya sabe mostrar una u otra).
function abrirBotonera(fichaId, mensaje, invId){
  const capa = $('#botonera-capa');
  const marco = $('#botonera-marco');
  capa.hidden = false;
  ubicarBotoneraCapa();
  centrarTokenDeBotonera('ficha', fichaId);
  if(botonera.herramienta === 'ficha' && botonera.fichaId === fichaId && botonera.lista){
    botonera.invId = invId || '';
    marco.contentWindow.postMessage(mensaje || {tipo: 'abrir-botonera', inv: invId || ''}, location.origin);
    enfocarBotonera();
    return;
  }
  botonera = {herramienta: 'ficha', fichaId, invId: invId || '', lista: false, pendiente: mensaje || null};
  $('#botonera-cargando-texto').textContent = 'Abriendo la Botonera…';
  $('#botonera-cargando').hidden = false;
  const inv = invId ? `&inv=${encodeURIComponent(invId)}` : '';
  marco.src = sinCache(`../ficha-personaje/ficha.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=botonera${inv}#${encodeURIComponent(fichaId)}`);
}

function abrirAcciones(creepId, mensaje){
  const capa = $('#botonera-capa');
  const marco = $('#botonera-marco');
  capa.hidden = false;
  ubicarBotoneraCapa();
  centrarTokenDeBotonera('gm', creepId);
  // gm-tools ya cargado: solo cambia de creep (instantáneo).
  if(botonera.herramienta === 'gm' && botonera.lista){
    botonera.fichaId = creepId;
    marco.contentWindow.postMessage(mensaje || {tipo: 'abrir-acciones', creep: creepId}, location.origin);
    enfocarBotonera();
    return;
  }
  botonera = {herramienta: 'gm', fichaId: creepId, lista: false, pendiente: mensaje || null};
  $('#botonera-cargando-texto').textContent = 'Abriendo las Acciones…';
  $('#botonera-cargando').hidden = false;
  marco.src = sinCache(`../gm-toolset/gm-tools.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=acciones&creep=${encodeURIComponent(creepId)}`);
}

// El foco pasa a la ventana del iframe, así sus teclas (Escape) le llegan directo.
function enfocarBotonera(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  try{ $('#botonera-marco').contentWindow.focus(); }catch(e){}
}

function escapeABotonera(){
  if(!botonera.lista){
    $('#botonera-cargando-x').click();
    return;
  }
  $('#botonera-marco').contentWindow.postMessage({tipo: 'tecla-escape'}, location.origin);
}

function cerrarBotonera(){
  $('#botonera-capa').hidden = true;
  $('#botonera-cargando').hidden = true;
}

window.addEventListener('message', e => {
  if(e.origin !== location.origin || !e.data || e.source !== $('#botonera-marco').contentWindow) return;
  if(e.data.tipo === 'botonera-lista' || e.data.tipo === 'acciones-lista'){
    botonera.lista = true;
    $('#botonera-cargando').hidden = true;
    enfocarBotonera();
    // Lo que se pidió mientras cargaba (por ejemplo, agregar un estado).
    if(botonera.pendiente){
      $('#botonera-marco').contentWindow.postMessage(botonera.pendiente, location.origin);
      botonera.pendiente = null;
    }
  }
  if(e.data.tipo === 'botonera-cerrada' || e.data.tipo === 'acciones-cerrada') cerrarBotonera();
});

$('#botonera-cargando-x').onclick = () => { cerrarBotonera(); botonera = {herramienta: '', fichaId: '', lista: false}; $('#botonera-marco').src = 'about:blank'; };

let bitacoraFlotanteAbierta = false;

// Imagen de fondo (opcional) para el próximo elemento (Terreno/Formas

function imagenElementoOpcionHtml(imagen){

      ${imagen ? `<img src="${imagen}" alt="" style="width:32px;height:32px;border-radius:4px;object-fit:cover;border:1px solid var(--line)">` : ''}

      ${imagen ? `<button type="button" class="btn peligro" data-elemento-imagen-quitar="1">Quitar</button>` : ''}

}

  {id: 'elemento', icono: '⬡', nombre: 'Terreno y Formas', detalle: 'Nubes, charcos, muros… con color o imagen; "Sólido" bloquea el paso', lista: true},
  // No es un modo de dibujo: abre o cierra la bitácora flotante (más abajo).
  {id: 'bitacora', icono: '📖', nombre: 'Bitácora', detalle: 'Notas compartidas de la partida', lista: true},
];
let herramientaActiva = '';
// Salir de una herramienta de dibujo (lápiz/terreno/formas): clic derecho
// en el mapa, Esc, la ✕ de su ventanita, o tocar el mismo botón de nuevo.
function desactivarHerramienta(){
  if(!herramientaActiva) return;
  herramientaActiva = '';
  dibujando = null;
  dibujandoElemento = null;
  lienzo.style.cursor = 'default';
  renderToolkit();
}
let toolkitAbierto = false;
try{ toolkitAbierto = localStorage.getItem('mapa-toolkit-abierto') === '1'; }catch(e){}

function renderToolkit(){
  $('#toolkit').classList.toggle('abierto', toolkitAbierto);
  $('#lienzo-caja').classList.toggle('toolkit-abierto', toolkitAbierto);
  const pestana = $('#toolkit-pestana');
  pestana.setAttribute('aria-expanded', toolkitAbierto ? 'true' : 'false');

      <span class="tk-icono" aria-hidden="true">${h.icono}</span>
      <span class="tk-nombre">${esc(h.nombre)}${h.lista ? '' : '<span class="tk-pronto">Pronto</span>'}</span>
      <span class="tk-detalle">${esc(h.detalle)}</span>

// Ventanita propia de Lápiz/Terreno/Formas (la única activa a la vez):

// bloque más cada vez que había una herramienta lista.

  const caja = $('#herramienta-flotante');
  if(!herramientaActiva){ caja.hidden = true; caja.innerHTML = ''; return; }
  const datos = HERRAMIENTAS.find(h => h.id === herramientaActiva);
  let cuerpo = '';
  if(herramientaActiva === 'lapiz'){
    cuerpo = `
      <div class="tk-lapiz-colores">${COLORES.map(c => `<button type="button" class="tk-color${c === lapizColor ? ' elegido' : ''}" data-lapiz-color="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>
      <label class="tk-lapiz-check"><input type="checkbox" id="lapiz-permanente-check"${lapizPermanente ? ' checked' : ''}> Dibujo permanente</label>
      <p class="tk-lapiz-ayuda">${lapizPermanente ? 'Queda como un objeto: cualquiera con permiso lo mueve o lo rota después.' : 'Se ve un par de segundos y se borra sola, como la estela al moverse.'}</p>`;
  }else if(herramientaActiva === 'elemento'){
    cuerpo = `
      <label class="etiqueta" style="margin-top:0">Forma</label>
      <select id="elem-tipo-select">
        <option value="flor"${elemTipo === 'flor' ? ' selected' : ''}>Flor (un centro + alrededor)</option>
        <option value="linea"${elemTipo === 'linea' ? ' selected' : ''}>Línea</option>
        <option value="libre"${elemTipo === 'libre' ? ' selected' : ''}>Forma libre (pintar casilleros)</option>
      </select>
      ${elemTipo !== 'libre' ? `<label class="etiqueta">${elemTipo === 'flor' ? 'Radio' : 'Largo'} (1 a ${TAMANO_ELEMENTO_MAX})</label>
      <input type="number" id="elem-tamano-input" min="1" max="${TAMANO_ELEMENTO_MAX}" step="1" value="${elemTamano}">` : ''}
      <label class="etiqueta">Color</label>
      <div class="tk-lapiz-colores">${COLORES.map(c => `<button type="button" class="tk-color${c === elemColor ? ' elegido' : ''}" data-elem-color="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>
      <label class="etiqueta">Transparencia</label>
      <input type="range" id="elem-alfa-slider" min="10" max="100" step="5" value="${elemAlfa}">
      ${imagenElementoOpcionHtml(elemImagen)}
      <label class="tk-lapiz-check"><input type="checkbox" id="elem-solido-check"${elemSolido ? ' checked' : ''}> Sólido (bloquea el paso)</label>
      ${elemSolido && soyGM ? `<label class="tk-lapiz-check"><input type="checkbox" id="elem-invisible-check"${elemInvisible ? ' checked' : ''}> Invisible para jugadores</label>` : ''}
      <p class="tk-lapiz-ayuda">${elemTipo === 'flor' ? 'Clic en el mapa: aparece centrado ahí.' : elemTipo === 'linea' ? 'Clic y arrastrá hacia el lado que apunta.' : 'Clic y arrastrá para pintar los casilleros.'} ${elemSolido ? 'Sólido — bloquea ese casillero y cualquier ruta que lo cruce.' : 'Transitable — no bloquea el paso.'}${elemSolido && soyGM ? ' Invisible: solo vos ves el contorno (punteado violeta); sirve para marcar zonas intransitables ya dibujadas en el fondo, sin que se note un dibujo de más.' : ''}</p>`;
  }else{
    caja.hidden = true; caja.innerHTML = ''; return;
  }
  caja.hidden = false;
  caja.innerHTML = `
    <div class="herr-cab"><span>${datos ? datos.icono + ' ' + esc(datos.nombre) : ''}</span><button type="button" id="herr-cerrar" title="Salir de esta herramienta (Esc o clic derecho en el mapa)">✕</button></div>
    ${cuerpo}`;
}

function abrirToolkit(abrir){
  toolkitAbierto = abrir;
  try{ localStorage.setItem('mapa-toolkit-abierto', abrir ? '1' : ''); }catch(e){}

}

$('#toolkit-pestana').onclick = () => abrirToolkit(!toolkitAbierto);
$('#toolkit-lista').addEventListener('click', e => {

  const h = HERRAMIENTAS.find(x => x.id === b.dataset.herramienta);

$('#herramienta-flotante').addEventListener('click', e => {

  const color = e.target.closest('[data-lapiz-color]');

$('#herramienta-flotante').addEventListener('change', e => {
  if(e.target.id === 'lapiz-permanente-check'){

    try{ localStorage.setItem('lapiz-permanente', lapizPermanente ? '1' : ''); }catch(err){}
    renderHerramientaFlotante();

  }
  if(e.target.id === 'elem-tipo-select'){
    elemTipo = e.target.value;
    try{ localStorage.setItem('elem-tipo', elemTipo); }catch(err){}

  if(e.target.id === 'elem-invisible-check'){
    elemInvisible = e.target.checked;

$('#herramienta-flotante').addEventListener('input', e => {
  if(e.target.id === 'elem-alfa-slider'){

});

/* ---------- Bitácora de la partida ----------
   Compartida con la ficha (mismo esquema, mismos permisos): todos la
   leen; cualquiera suma páginas y entradas y corrige cualquiera; borra el
   autor (o quien creó la página) o el GM. Acá vive en una cajita
   flotante y arrastrable (mismo patrón que la Mesa de la ficha), que se
   abre y se cierra del todo con 📖 en la caja de herramientas.
   campanas/<partida>/bitacora/<página> = {nombre, creado, creadoUid, creadoPor}
   campanas/<partida>/bitacora/<página>/entradas/<id> =
     {texto, uid, autor, creado, editado?, editadoUid?, editadoPor?} */
const BITACORA_COLORES = ['#E0A458', '#8EE6A8', '#7FB3F0', '#F08FA8', '#C9A8F5', '#F2D16B', '#6FD6C8', '#F0A36F'];
let bitacoraPaginas = [];        // [{id, nombre, creadoUid}]
let bitacoraActiva = '';
let bitacoraEntradas = [];       // de la página activa
let bitacoraCorteEntradas = null;
let bitacoraEditando = '';       // id de la entrada que se está corrigiendo
let bitacoraConectada = false;

function bitacoraColor(uid){
  let h = 0;
  for(const ch of String(uid || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return BITACORA_COLORES[h % BITACORA_COLORES.length];
}
function bitacoraFecha(ts){
  if(!ts || !ts.toDate) return '';
  const d = ts.toDate();
  return `${d.getDate()}/${d.getMonth() + 1}`;
}

function bitacoraEscuchar(){
  if(bitacoraConectada) return;
  bitacoraConectada = true;
  try{ bitacoraActiva = localStorage.getItem('bitacora-activa-' + FB_CAMPANA) || ''; }catch(e){}
  fbDb.collection(fbRutaCampana('bitacora')).orderBy('creado').onSnapshot(snap => {
    bitacoraPaginas = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if(!bitacoraPaginas.some(p => p.id === bitacoraActiva)) bitacoraElegir(bitacoraPaginas.length ? bitacoraPaginas[0].id : '');
    else if(!bitacoraCorteEntradas) bitacoraElegir(bitacoraActiva);
    else bitacoraRender();
  }, err => {
    console.error('Error escuchando la bitácora:', err);
    $('#bitacora-estado').textContent = 'No se pudo leer. ¿Reglas nuevas de Firestore?';
  });
}

// Página anterior (-1) o siguiente (+1) a la activa, en el orden de
// bitacoraPaginas (por fecha de creación). No hace nada en las puntas.
function bitacoraIrPagina(delta){
  const idx = bitacoraPaginas.findIndex(p => p.id === bitacoraActiva);
  if(idx < 0) return;
  const destino = idx + delta;
  if(destino < 0 || destino >= bitacoraPaginas.length) return;
  bitacoraElegir(bitacoraPaginas[destino].id);
}

function bitacoraElegir(id){
  bitacoraActiva = id;
  bitacoraEditando = '';
  try{ localStorage.setItem('bitacora-activa-' + FB_CAMPANA, id); }catch(e){}
  if(bitacoraCorteEntradas){ bitacoraCorteEntradas(); bitacoraCorteEntradas = null; }
  bitacoraEntradas = [];
  if(id){
    bitacoraCorteEntradas = fbDb.collection(fbRutaCampana(`bitacora/${id}/entradas`)).orderBy('creado')
      .onSnapshot(snap => {
        bitacoraEntradas = snap.docs.map(d => ({id: d.id, ...d.data({serverTimestamps: 'estimate'})}));
        const lista = $('#bitacora-entradas');
        const alFondo = lista.scrollHeight - lista.scrollTop - lista.clientHeight < 30;
        bitacoraRender();
        if(alFondo) lista.scrollTop = lista.scrollHeight;
      }, err => console.error('Error escuchando las entradas de la bitácora:', err));
  }
  bitacoraRender();
}

function bitacoraPuedeBorrar(uidAutor){
  return !!(fbMiembro && (soyGM || (fbUsuario && fbUsuario.uid === uidAutor)));
}

function bitacoraRender(){
  const tabs = $('#bitacora-tabs'), lista = $('#bitacora-entradas');
  if(!tabs || !lista) return;
  const conectado = !!(bitacoraConectada && fbDb && fbMiembro);
  $('#bitacora-estado').textContent = conectado ? '' : 'conectando…';
  $('#btn-bitacora-add').disabled = !conectado;
  $('#bitacora-sumar').disabled = !conectado || !bitacoraActiva;
  $('#bitacora-nueva').disabled = !conectado || !bitacoraActiva;
  if(!conectado){
    tabs.innerHTML = '';
    lista.innerHTML = '<div class="bit-vacia">Sin conexión con la partida.</div>';
    return;
  }
  // No redibujar las pestañas mientras alguien les cambia el nombre (pero
  // sí después de clickear una flecha o borrar: el foco queda en ese
  // botón, que también está adentro de #bitacora-tabs).
  const editandoNombre = document.activeElement && document.activeElement.matches
    && document.activeElement.matches('[data-bit-nombre]') && tabs.contains(document.activeElement);
  if(!editandoNombre){
    const idx = bitacoraPaginas.findIndex(p => p.id === bitacoraActiva);
    const activa = idx >= 0 ? bitacoraPaginas[idx] : null;
    // Una sola pestaña a la vez (la activa) con flechas para pasar de
    // página y un contador — antes se listaban todas juntas y la fila
    // se agrandaba sin límite a medida que se sumaban páginas.
    tabs.innerHTML = activa ? `
      <button type="button" class="bit-nav-flecha" data-bit-pag-prev title="Página anterior"${idx <= 0 ? ' disabled' : ''}>◀</button>
      <div class="bit-tab active" data-bit-pagina="${esc(activa.id)}">
        <input class="bit-tab-name" data-bit-nombre="${esc(activa.id)}" value="${esc(activa.nombre || 'Página')}" maxlength="40" title="Editá el nombre y apretá Enter">
        ${bitacoraPuedeBorrar(activa.creadoUid) ? `<button type="button" class="bit-tab-x" data-bit-borrar-pagina="${esc(activa.id)}" title="Borrar página">×</button>` : ''}
      </div>
      <button type="button" class="bit-nav-flecha" data-bit-pag-next title="Página siguiente"${idx >= bitacoraPaginas.length - 1 ? ' disabled' : ''}>▶</button>
      <span class="bit-contador">${idx + 1}/${bitacoraPaginas.length}</span>
    ` : '';
  }
  if(!bitacoraPaginas.length){
    lista.innerHTML = '<div class="bit-vacia">Todavía no hay páginas. Tocá "+ Página" para empezar.</div>';
    return;
  }
  if(!bitacoraEntradas.length){
    lista.innerHTML = '<div class="bit-vacia">Esta página está vacía: sumá lo primero abajo.</div>';
    return;
  }
  // No redibujar mientras alguien corrige una entrada (se perdería lo escrito).
  if(bitacoraEditando && lista.querySelector('textarea[data-bit-edicion]')) return;
  lista.innerHTML = bitacoraEntradas.map(en => {
    const color = bitacoraColor(en.uid);
    const firma = `${esc(en.autor || '?')} · ${bitacoraFecha(en.creado)}` +
      (en.editadoPor ? ` · editado por ${esc(en.editadoPor)} ${bitacoraFecha(en.editado)}` : '');
    if(en.id === bitacoraEditando){
      return `<div class="bit-entrada" style="border-left-color:${color};flex-direction:column">
        <textarea data-bit-edicion="${esc(en.id)}">${esc(en.texto || '')}</textarea>
        <div class="fila" style="margin-top:4px;gap:6px">
          <button type="button" class="mini" data-bit-guardar="${esc(en.id)}">Guardar</button>
          <button type="button" class="mini" data-bit-cancelar="1">Cancelar</button>
        </div>
      </div>`;
    }
    return `<div class="bit-entrada" style="border-left-color:${color}">
      <div class="bit-texto" style="color:${color}">${esc(en.texto || '')} <span class="bit-firma">(${firma})</span></div>
      <div class="bit-botones">
        <button type="button" class="mini" data-bit-editar="${esc(en.id)}" title="Corregir">✎</button>
        ${bitacoraPuedeBorrar(en.uid) ? `<button type="button" class="mini peligro" data-bit-borrar="${esc(en.id)}" title="Borrar">✕</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function bitacoraNuevaPagina(){
  if(!fbDb || !fbMiembro) return;
  try{
    const ref = await fbDb.collection(fbRutaCampana('bitacora')).add({
      nombre: `Página ${bitacoraPaginas.length + 1}`,
      creado: firebase.firestore.FieldValue.serverTimestamp(),
      creadoUid: fbUsuario.uid,
      creadoPor: fbMiembro.nombre,
    });
    bitacoraElegir(ref.id);
    setTimeout(() => { const i = document.querySelector(`[data-bit-nombre="${ref.id}"]`); if(i){ i.focus(); i.select(); } }, 300);
  }catch(err){
    console.error('No se pudo crear la página:', err);
    toast(err.code === 'permission-denied' ? 'No se pudo: faltan publicar las reglas nuevas de Firestore' : 'No se pudo crear la página');
  }
}

async function bitacoraSumar(){
  const campo = $('#bitacora-nueva');
  const texto = campo.value.trim();
  if(!texto || !bitacoraActiva || !fbDb || !fbMiembro) return;
  campo.disabled = true;
  try{
    await fbDb.collection(fbRutaCampana(`bitacora/${bitacoraActiva}/entradas`)).add({
      texto: texto.slice(0, 4000),
      uid: fbUsuario.uid,
      autor: fbMiembro.nombre,
      creado: firebase.firestore.FieldValue.serverTimestamp(),
    });
    campo.value = '';
    const lista = $('#bitacora-entradas');
    setTimeout(() => { lista.scrollTop = lista.scrollHeight; }, 50);
  }catch(err){
    console.error('No se pudo sumar a la bitácora:', err);
    toast(err.code === 'permission-denied' ? 'No se pudo: faltan publicar las reglas nuevas de Firestore' : 'No se pudo sumar a la bitácora');
  }finally{
    campo.disabled = false;
    campo.focus();
  }
}

async function bitacoraGuardarEdicion(id){
  const campo = document.querySelector(`textarea[data-bit-edicion="${id}"]`);
  if(!campo) return;
  const texto = campo.value.trim();
  if(!texto){ toast('Si querés sacarla, usá ✕'); return; }
  try{
    await fbDb.doc(fbRutaCampana(`bitacora/${bitacoraActiva}/entradas/${id}`)).update({
      texto: texto.slice(0, 4000),
      editado: firebase.firestore.FieldValue.serverTimestamp(),
      editadoUid: fbUsuario.uid,
      editadoPor: fbMiembro.nombre,
    });
    bitacoraEditando = '';
    bitacoraRender();
  }catch(err){
    console.error('No se pudo corregir la entrada:', err);
    toast('No se pudo guardar la corrección');
  }
}

async function bitacoraBorrarPagina(id){
  const p = bitacoraPaginas.find(x => x.id === id);
  if(!confirm(`¿Borrar la página "${p ? p.nombre : ''}" con todo lo que tiene, para toda la mesa?`)) return;
  try{
    const entradas = await fbDb.collection(fbRutaCampana(`bitacora/${id}/entradas`)).get();
    const lote = fbDb.batch();
    entradas.docs.forEach(d => lote.delete(d.ref));
    lote.delete(fbDb.doc(fbRutaCampana(`bitacora/${id}`)));
    await lote.commit();
  }catch(err){
    console.error('No se pudo borrar la página:', err);
    toast('No se pudo borrar la página (solo quien la creó o el GM)');
  }
}

$('#btn-bitacora-add').onclick = bitacoraNuevaPagina;
$('#bitacora-sumar').onclick = bitacoraSumar;
$('#bitacora-nueva').addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); bitacoraSumar(); }
});
$('#bitacora-tabs').addEventListener('click', e => {
  const borrar = e.target.closest('[data-bit-borrar-pagina]');
  if(borrar){ bitacoraBorrarPagina(borrar.dataset.bitBorrarPagina); return; }
  if(e.target.closest('[data-bit-pag-prev]')){ bitacoraIrPagina(-1); return; }
  if(e.target.closest('[data-bit-pag-next]')){ bitacoraIrPagina(1); return; }
  const tab = e.target.closest('[data-bit-pagina]');
  if(tab && tab.dataset.bitPagina !== bitacoraActiva) bitacoraElegir(tab.dataset.bitPagina);
});
$('#bitacora-tabs').addEventListener('change', e => {
  const input = e.target.closest('[data-bit-nombre]');
  if(!input) return;
  const nombre = input.value.trim().slice(0, 40);
  if(!nombre) return;
  fbDb.doc(fbRutaCampana(`bitacora/${input.dataset.bitNombre}`)).update({nombre})
    .catch(err => { console.error('No se pudo renombrar la página:', err); toast('No se pudo renombrar la página'); });
});
$('#bitacora-tabs').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('[data-bit-nombre]')){ e.preventDefault(); e.target.blur(); }
});
$('#bitacora-entradas').addEventListener('click', e => {
  const editar = e.target.closest('[data-bit-editar]');
  if(editar){
    bitacoraEditando = editar.dataset.bitEditar;
    bitacoraRender();
    const campo = document.querySelector(`textarea[data-bit-edicion="${bitacoraEditando}"]`);
    if(campo){ campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    return;
  }
  const guardar = e.target.closest('[data-bit-guardar]');
  if(guardar){ bitacoraGuardarEdicion(guardar.dataset.bitGuardar); return; }
  if(e.target.closest('[data-bit-cancelar]')){ bitacoraEditando = ''; bitacoraRender(); return; }
  const borrar = e.target.closest('[data-bit-borrar]');
  if(borrar){
    if(!confirm('¿Borrar esta entrada de la bitácora, para toda la mesa?')) return;
    fbDb.doc(fbRutaCampana(`bitacora/${bitacoraActiva}/entradas/${borrar.dataset.bitBorrar}`)).delete()
      .catch(err => { console.error('No se pudo borrar la entrada:', err); toast('No se pudo borrar (solo su autor o el GM)'); });
  }
});

/* Cajita flotante y arrastrable (mismo patrón que #mesa en la ficha). */
{
  const caja = $('#bitacora-flotante');
  const cabecera = $('#bitacora-cabecera');
  let posicion = null;
  try{ posicion = JSON.parse(localStorage.getItem('bitacora-posicion') || 'null'); }catch(e){}
  const encuadrar = () => {
    if(!posicion){ caja.style.left = caja.style.top = ''; return; }
    const x = Math.max(0, Math.min(posicion.x, window.innerWidth - caja.offsetWidth));
    const y = Math.max(0, Math.min(posicion.y, window.innerHeight - caja.offsetHeight));
    caja.style.left = x + 'px'; caja.style.top = y + 'px';
    caja.style.right = caja.style.bottom = 'auto';
  };
  window.addEventListener('resize', () => { if(!caja.hidden) encuadrar(); });

  let arrastre = null, recienMovida = false;
  cabecera.addEventListener('pointerdown', e => {
    if(e.button !== 0 || e.target.closest('#bitacora-cerrar, #bitacora-opacidad-caja')) return;
    const r = caja.getBoundingClientRect();
    arrastre = {px: e.clientX, py: e.clientY, x: r.left, y: r.top, movio: false};
    cabecera.setPointerCapture(e.pointerId);
  });
  cabecera.addEventListener('pointermove', e => {
    if(!arrastre) return;
    const dx = e.clientX - arrastre.px, dy = e.clientY - arrastre.py;
    if(!arrastre.movio && Math.abs(dx) + Math.abs(dy) < 5) return;
    arrastre.movio = true;
    caja.classList.add('arrastrando');
    posicion = {x: arrastre.x + dx, y: arrastre.y + dy};
    encuadrar();
  });
  const soltar = () => {
    if(!arrastre) return;
    recienMovida = arrastre.movio;
    arrastre = null;
    caja.classList.remove('arrastrando');
    if(recienMovida){
      posicion = {x: parseFloat(caja.style.left), y: parseFloat(caja.style.top)};
      try{ localStorage.setItem('bitacora-posicion', JSON.stringify(posicion)); }catch(e){}
    }
  };
  cabecera.addEventListener('pointerup', soltar);
  cabecera.addEventListener('pointercancel', soltar);

  const aplicarColapso = colapsada => {
    caja.classList.toggle('colapsada', colapsada);
    $('#bitacora-flecha').textContent = colapsada ? '▸' : '▾';
    try{ localStorage.setItem('bitacora-colapsada', colapsada ? '1' : ''); }catch(e){}
    encuadrar();
  };
  cabecera.onclick = e => {
    if(recienMovida){ recienMovida = false; return; }
    if(e.target.closest('#bitacora-cerrar, #bitacora-opacidad-caja')) return;
    aplicarColapso(!caja.classList.contains('colapsada'));
  };
  $('#bitacora-cerrar').onclick = () => abrirBitacoraFlotante(false);

  // Transparencia: se guarda por navegador y se aplica solo al fondo (el
  // texto y los botones quedan siempre nítidos), como la aura de un token.
  const aplicarOpacidad = pct => {
    const hex = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
    caja.style.background = colorConAlfa(hex, Math.max(30, Math.min(100, pct)) / 100);
  };
  let opacidad = 100;
  try{ opacidad = parseInt(localStorage.getItem('bitacora-opacidad'), 10) || 100; }catch(e){}
  $('#bitacora-opacidad-slider').value = opacidad;
  aplicarOpacidad(opacidad);
  $('#bitacora-opacidad-slider').addEventListener('input', e => {
    const pct = num(e.target.value);
    aplicarOpacidad(pct);
    try{ localStorage.setItem('bitacora-opacidad', pct); }catch(e2){}
  });
  const opacidadCaja = $('#bitacora-opacidad-caja');
  const opacidadBtn = $('#bitacora-opacidad-btn');
  const opacidadLista = $('#bitacora-opacidad-lista');
  const abrirOpacidad = abrir => {
    opacidadLista.hidden = !abrir;
    opacidadBtn.setAttribute('aria-expanded', abrir ? 'true' : 'false');
  };
  opacidadBtn.onclick = () => abrirOpacidad(opacidadLista.hidden);
  document.addEventListener('pointerdown', e => {
    if(!opacidadLista.hidden && !e.target.closest('#bitacora-opacidad-caja')) abrirOpacidad(false);
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !opacidadLista.hidden) abrirOpacidad(false); });

  window.abrirBitacoraFlotante = abrir => {
    bitacoraFlotanteAbierta = abrir;
    try{ localStorage.setItem('mapa-bitacora-abierta', abrir ? '1' : ''); }catch(e){}
    caja.hidden = !abrir;
    renderToolkit();
    if(!abrir) return;
    let colapsada = false;
    try{ colapsada = localStorage.getItem('bitacora-colapsada') === '1'; }catch(e){}
    aplicarColapso(colapsada);
    if(fbDb && fbMiembro) bitacoraEscuchar();
  };
}

function mostrarAviso(html, boton){
  const a = $('#aviso-mapa');
  a.innerHTML = html + (boton ? `<div><button type="button" class="btn primary" id="aviso-boton">${esc(boton.texto)}</button></div>` : '');
  a.hidden = false;
  if(boton) $('#aviso-boton').onclick = boton.accion;
}

function arrancarEnVivo(){
  $('#aviso-mapa').hidden = true;
  estado(barraTexto());
  soyGM = fbMiembro.gm === true;
  escucharMiembros();
  escucharVinculables();
  escucharMantenimiento();
  // Estos dos disparan cambiarMapaMostrado (y con eso, fondo/modo/
  // iniciativa/tokens del mapa que corresponda).
  escucharMapas();
  escucharMapaActivo();
  mesaEscuchar();
  mesaHistorialAlEntrar();
  actualizarBotonMapas();
  // Si ya estaba abierta de una sesión anterior, recién ahora hay conexión.
  if(bitacoraFlotanteAbierta) bitacoraEscuchar();
  renderPanel(true);
}

async function iniciar(){
  new ResizeObserver(ajustarTamano).observe(lienzo);
  ajustarTamano();
  renderPanel(true);

  // Sin sesión, sin partida elegida o sin haberse unido: al inicio del sitio.
  const entrada = await fbEntrarAPartida();
  if(entrada === 'redirigiendo') return;
  if(entrada !== 'ok'){
    estado('sin internet');
    mostrarAviso('No se pudo cargar Firebase. Revisá la conexión y recargá la página.');
    $('#mesa-cuerpo').innerHTML = '<div class="mesa-vacia">Sin conexión.</div>';
    return;
  }
  arrancarEnVivo();
}
