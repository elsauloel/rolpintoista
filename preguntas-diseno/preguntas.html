<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramientas de diseño — Rol Pintoísta</title>
<link rel="icon" type="image/svg+xml" href="../comun/icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Pensada para el celular a propósito (excepción a "solo compu" del resto del sitio, ver CLAUDE.md de esta carpeta):
   una sola columna, botones grandes, sin nada que dependa de hover. */
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45;
  min-height:100vh;padding-bottom:40px;
}
a{color:var(--brass)}
input,select,textarea,button{font-family:inherit;color:inherit;font-size:15px}
textarea,input[type=text]{
  width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:var(--r);
  color:var(--paper);padding:10px 12px;resize:vertical
}
textarea:focus,input:focus{outline:2px solid var(--copper);outline-offset:1px}
button{cursor:pointer}
.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--paper);border-radius:var(--r);
  padding:11px 16px;font-weight:700;font-size:14.5px;
}
.btn:active{background:var(--line)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08}
.btn.chico{padding:7px 12px;font-size:13px;font-weight:600}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5}

header{
  position:sticky;top:0;z-index:5;padding:14px 16px 0 60px;
  background:rgba(15,12,14,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)
} /* padding-left: lugar para el botón ☰ del menú del sitio (comun/menu-sitio.js), fijo arriba a la izquierda */
header .cab{display:flex;align-items:center;gap:10px;padding-bottom:12px}
header h1{font-size:17px;margin:0;flex:1;min-width:0}
header .quien{font-size:12px;color:var(--muted);white-space:nowrap}

.tabs{display:flex;gap:4px}
.tab{
  border:1px solid var(--line);border-bottom:none;background:var(--panel2);color:var(--muted);
  border-radius:var(--r) var(--r) 0 0;padding:9px 14px;font-weight:700;font-size:13.5px;flex:1;text-align:center
}
.tab.activo{background:var(--panel);color:var(--paper);border-color:var(--copper)}

main{max-width:640px;margin:0 auto;padding:14px 14px 0}

#login-box{max-width:380px;margin:18vh auto 0;padding:0 20px;text-align:center}
#login-box h2{font-size:19px;margin:0 0 8px}
#login-box p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
#login-error{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}

#compuesta{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
#compuesta textarea{min-height:64px}
#compuesta .fila{display:flex;gap:8px;justify-content:flex-end}

.filtros{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filtros label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.pregunta{
  border:1px solid var(--line);border-left:3px solid var(--copper);background:var(--panel);
  border-radius:var(--r);padding:12px 14px;margin-bottom:14px
}
.pregunta.resuelta{border-left-color:var(--bottle);opacity:.75}
.p-cab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.p-autor{font-weight:700;color:var(--brass)}
.p-fecha{font-size:11.5px;color:var(--muted);font-family:"Space Mono",monospace}
.p-texto{white-space:pre-wrap;word-break:break-word}
.p-acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.p-badge{
  font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;border:1px solid var(--bottle);color:var(--absenta)
}

.respuestas{margin:10px 0 0;padding-left:14px;border-left:2px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.respuesta{background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 11px}
.respuesta .p-cab{margin-bottom:3px}

.responder-caja{margin-top:10px;display:none;flex-direction:column;gap:8px}
.responder-caja.open{display:flex}
.responder-caja textarea{min-height:48px}

.vacio{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px}
.cargando{color:var(--muted);text-align:center;padding:30px 10px}

.mio{position:relative}
.mio .p-borrar,.mio .p-editar{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--muted);font-size:16px;padding:2px 6px}
.mio .p-editar{right:38px}
.mio > .p-cab{padding-right:64px}

.p-orden{display:flex;gap:6px;margin-left:auto}
.p-arrastrar{touch-action:none;cursor:grab}
.pregunta.arrastrando{opacity:.9;border-color:var(--brass);box-shadow:0 8px 24px rgba(0,0,0,.65);position:relative;z-index:3}
body.arrastrando-body{user-select:none;-webkit-user-select:none;cursor:grabbing}

.editar-caja{display:flex;flex-direction:column;gap:8px}
.editar-caja textarea{min-height:64px}
.editar-caja .fila{display:flex;gap:8px;justify-content:flex-end}

#changelog-wrap{margin-bottom:16px}
#btn-changelog{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
#changelog-lista{margin-top:10px;display:none;flex-direction:column;gap:8px}
#changelog-lista.open{display:flex}
.cambio{border:1px solid var(--line-soft);border-left:3px solid var(--absenta);background:var(--panel2);border-radius:var(--r);padding:9px 12px}
.cambio .p-fecha{display:block;margin-bottom:3px}
.cambio .p-texto{font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="cab">
    <h1>🛠 Herramientas de diseño</h1>
    <span class="quien" id="quien-soy" hidden></span>
    <button type="button" class="btn chico ghost" id="btn-salir" hidden>Salir</button>
  </div>
  <div class="tabs" id="tabs" hidden>
    <button type="button" class="tab" id="tab-preguntas" data-tab="pregunta">💬 Preguntas</button>
    <button type="button" class="tab" id="tab-pendientes" data-tab="pendiente">🎨 A desarrollar</button>
    <button type="button" class="tab" id="tab-testeos" data-tab="testeo">🧪 Falta testear</button>
  </div>
</header>

<div id="login-box">
  <h2>Herramientas de diseño</h2>
  <p>Preguntas, propuestas de desarrollo y testeo para ir definiendo las reglas del Rol Pintoísta entre todos, sin depender de coincidir en el chat. Entrá con tu cuenta de Google — después queda recordada en este teléfono o compu.</p>
  <button type="button" class="btn primary" id="btn-google" style="width:100%;padding:14px">Entrar con Google</button>
  <div id="login-error"></div>
</div>

<main id="main" hidden>
  <div id="compuesta">
    <textarea id="txt-nueva" placeholder="Escribí una pregunta nueva…"></textarea>
    <div class="fila"><button type="button" class="btn primary" id="btn-nueva">＋ Preguntar</button></div>
  </div>
  <div id="changelog-wrap" hidden>
    <button type="button" class="btn chico ghost" id="btn-changelog">
      <span>📜 Resumen de lo ya incorporado</span><span id="changelog-flecha">▾</span>
    </button>
    <div id="changelog-lista"></div>
  </div>
  <div class="filtros">
    <label><input type="checkbox" id="chk-resueltas"> <span id="chk-resueltas-txt">Mostrar las resueltas</span></label>
  </div>
  <div id="lista"><div class="cargando">Cargando…</div></div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>
<script src="../comun/sesion.js"></script>
<script src="../comun/menu-sitio.js"></script>
<script>
/* =========================================================
   PREGUNTAS DE DISEÑO
   Log compartido, fuera de cualquier partida (colección preguntas_diseno,
   fuera de campanas/*): el dueño del proyecto tira preguntas de a poco,
   cualquiera con cuenta confirmada suma preguntas o respuestas/sugerencias,
   sin depender de coincidir en el chat de WhatsApp. Pensada para el
   celular: entrar y salir tiene que ser instantáneo, la sesión de Google
   queda recordada sola en ese navegador.

   Dos pestañas, misma colección, filtradas por tipo (2026-09-22): "Preguntas"
   (tipo 'pregunta') es lo de siempre; "A desarrollar" (tipo 'pendiente')
   es el log de lo que falta construir — el dueño anota ahí lo que va
   pensando y CUALQUIERA puede sumar su propia propuesta de desarrollo,
   no solo el dueño. Las respuestas (tipo 'respuesta') sirven para las dos
   por igual, apuntando por padreId a una pregunta o a un pendiente.
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TABS = {
  pregunta: {compuestaPh: 'Escribí una pregunta nueva…', btnTxt: '＋ Preguntar', filtroTxt: 'Mostrar las resueltas', vacioAbiertas: 'No hay preguntas abiertas. Tildá "Mostrar las resueltas" para ver el historial, o escribí la primera.', badge: 'Resuelta', accionHecha: '✓ Marcar resuelta', accionReabrir: '↺ Reabrir'},
  pendiente: {compuestaPh: 'Proponé algo para desarrollar…', btnTxt: '＋ Proponer', filtroTxt: 'Mostrar las ya hechas', vacioAbiertas: 'No hay propuestas abiertas por ahora. Tildá "Mostrar las ya hechas" para ver el historial, o proponé algo vos.', badge: 'Hecho', accionHecha: '✓ Marcar hecho', accionReabrir: '↺ Reabrir'},
  testeo: {compuestaPh: 'Sumá algo para probar en mesa…', btnTxt: '＋ Sumar', filtroTxt: 'Mostrar los ya probados', vacioAbiertas: 'No hay nada pendiente de probar. Tildá "Mostrar los ya probados" para ver el historial, o sumá algo vos.', badge: 'Probado', accionHecha: '✓ Marcar probado', accionReabrir: '↺ Reabrir'},
};

// Resumen de mecánicas/reglas incorporadas en los últimos días (no cambios de aspecto), a criterio del
// asistente (pedido 2026-09-22). Es historial de solo lectura, fijo en el HTML — no vive en Firestore, así
// que no se puede sumar ni borrar desde acá; se edita a mano en este archivo cuando el dueño lo pide.
// Ver preguntas-diseno/CLAUDE.md.
const CAMBIOS_RECIENTES = [
  {fecha:'2026-09-22', texto:'Se sumó un aviso de "ataque de oportunidad": cuando alguien se aleja de un rival cuerpo a cuerpo, aparece un cartel rojo en la Mesa avisándolo (no se resuelve solo, es solo el aviso).'},
  {fecha:'2026-09-22', texto:'Se sumó el visualizador de rango en el mapa: dos botones que muestran alrededor de tu token hasta dónde llega tu ataque normal y hasta dónde tu magia, con atajos de teclado.'},
  {fecha:'2026-09-22', texto:'El Sangrado ahora se acumula: si te lo vuelven a aplicar mientras ya lo tenés, suma más daño por turno en vez de quedar igual.'},
  {fecha:'2026-09-22', texto:'Se sacó el estado "Armadura arruinada": todo lo que lo aplicaba ahora aplica "Armadura rota", para simplificar.'},
  {fecha:'2026-09-22', texto:'Se recalibraron Cansado y Exhausto: bajan los No2 máximos en una fracción en vez de un número fijo, para que escalen mejor según el personaje.'},
  {fecha:'2026-09-22', texto:'Stun quedó en 2 turnos de duración y ahora hace fallar la Evasión directamente, sin tirar el dado.'},
  {fecha:'2026-09-22', texto:'Se corrigió que el estado "Pajaritos" no afectaba a los creeps del GM, solo a los personajes de los jugadores.'},
  {fecha:'2026-09-22', texto:'Volvió a la ficha el contador de Wildcards: un valor y un máximo que se editan a mano (todavía sin una mecánica automática atrás).'},
  {fecha:'2026-09-22', texto:'La Mesa de tiradas ahora marca en rojo o verde cuándo una tirada estuvo afectada por un estado alterado, y lo explica en el texto.'},
  {fecha:'2026-09-21', texto:'Se armó el flujo de "Batalla terminada": el GM revisa y publica el botín, y recién ahí se les abre la ventana a los jugadores para repartirlo.'},
  {fecha:'2026-09-21', texto:'Se sumó el sistema de botín: cada jugador puede sumar ítems a su mochila (se lo lleva el primero que llega) o comparar antes de decidir.'},
  {fecha:'2026-09-21', texto:'El reporte de fin de combate ahora reparte experiencia y dinero: un valor para todo el grupo y un extra aparte para alguien puntual si hizo falta.'},
  {fecha:'2026-09-21', texto:'Se sumó la opción de marcar a un creep como "Jefe": queda inmune al aturdimiento y con más resistencia mágica, automáticamente.'},
  {fecha:'2026-09-21', texto:'Los grupos de creeps del GM se pueden vincular a un mapa guardado, para traer todos sus tokens de un solo botón.'},
  {fecha:'2026-09-21', texto:'La tienda tiene un interruptor de abierta/cerrada que maneja el GM; comprar y vender solo funciona mientras está abierta.'},
  {fecha:'2026-09-20', texto:'Las trampas del mapa pueden quedar ocultas y dispararse solas cuando alguien las pisa, tirando su daño y avisando en la Mesa.'},
  {fecha:'2026-09-20', texto:'Se sumó una tirada de percepción cuando alguien pasa muy cerca de una trampa sin llegar a pisarla.'},
  {fecha:'2026-09-20', texto:'Las habilidades de creep que son trampas (enredaderas, pozos, etc.) ahora colocan la trampa solas en el mapa al usarlas.'},
  {fecha:'2026-09-20', texto:'Se armó un catálogo grande de habilidades y armas naturales para creeps, listo para filtrar y usar al crear un enemigo nuevo.'},
  {fecha:'2026-09-20', texto:'Se sumaron botones para traer de una todos los tokens de un grupo de creeps o de los personajes de los jugadores al mapa.'},
  {fecha:'2026-09-19', texto:'Se terminó el sistema de sigilo: cono de detección, zona de alerta, y que un personaje escondido se revele solo si un rival lo detecta.'},
  {fecha:'2026-09-19', texto:'Se sumó la niebla de guerra: el mapa se va destapando de a poco según lo que ve el grupo, con un modo para que el GM lo mire "como jugador".'},
  {fecha:'2026-09-19', texto:'Se sumaron el Bloqueo y el Parry con el arma equipada como opciones de defensa en combate.'},
  {fecha:'2026-09-19', texto:'Ahora se puede deshacer el último movimiento o giro en el mapa con Ctrl+Z, por si uno se equivoca.'},
];

let entradas = [];   // todo lo que llega de Firestore, tal cual
let tabActiva = 'pregunta';
let mostrarResueltas = false;
let editandoId = null;        // id de la entrada/respuesta que se está editando (una a la vez)
let borradorEdicion = '';     // lo que va escribiendo, para que un cambio de Firestore no lo borre
let arrastre = null;          // {id, card, pointerId, y} mientras se arrastra una publicación

// Orden manual (2026-09-24): campo opcional `orden` (número; menor = más arriba). Sin `orden`, vale -creadoMs, o sea
// lo más nuevo primero, como era antes. Es un orden único y compartido: lo ve igual todo el grupo.
const ordenEfectivo = e => typeof e.orden === 'number' ? e.orden : -(e.creadoMs || 0);

function fechaTxt(ts){
  if(!ts || !ts.toDate) return 'ahora';
  const d = ts.toDate(), ahora = new Date();
  const dias = Math.floor((ahora - d) / 86400000);
  const hhmm = d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
  if(dias <= 0 && d.toDateString() === ahora.toDateString()) return 'hoy ' + hhmm;
  if(dias === 1) return 'ayer ' + hhmm;
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' ' + hhmm;
}

let changelogAbierto = false;
function renderChangelog(){
  $('#changelog-lista').innerHTML = CAMBIOS_RECIENTES.map(c => `
    <div class="cambio">
      <div class="p-cab"><span class="p-fecha">${esc(c.fecha)}</span></div>
      <div class="p-texto">${esc(c.texto)}</div>
    </div>`).join('');
}

// El texto de una publicación o respuesta; si se está editando, en su lugar va la cajita con Guardar/Cancelar.
function textoHtml(e){
  if(editandoId !== e.id) return `<div class="p-texto">${esc(e.texto)}</div>`;
  return `<div class="editar-caja">
    <textarea data-borrador="${esc(e.id)}">${esc(borradorEdicion)}</textarea>
    <div class="fila">
      <button type="button" class="btn chico ghost" data-cancelar-edicion="${esc(e.id)}">Cancelar</button>
      <button type="button" class="btn chico primary" data-guardar-edicion="${esc(e.id)}">Guardar</button>
    </div>
  </div>`;
}
const botonesPropios = id => `<button type="button" class="p-editar" data-editar="${esc(id)}" title="Editar">✎</button><button type="button" class="p-borrar" data-borrar="${esc(id)}" title="Borrar">✕</button>`;

function render(){
  const t = TABS[tabActiva];
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('activo', b.dataset.tab === tabActiva));
  $('#txt-nueva').placeholder = t.compuestaPh;
  $('#btn-nueva').textContent = t.btnTxt;
  $('#chk-resueltas-txt').textContent = t.filtroTxt;
  $('#changelog-wrap').hidden = tabActiva !== 'pendiente';

  const cont = $('#lista');
  const preguntas = entradas.filter(e => e.tipo === tabActiva && (mostrarResueltas || !e.resuelta))
    .sort((a, b) => ordenEfectivo(a) - ordenEfectivo(b));
  if(!preguntas.length){
    cont.innerHTML = `<div class="vacio">${mostrarResueltas ? 'Todavía no hay nada acá.' : t.vacioAbiertas}</div>`;
    return;
  }
  cont.innerHTML = preguntas.map(p => {
    const mias = fbUsuario && p.autorUid === fbUsuario.uid;
    const respuestas = entradas.filter(e => e.tipo === 'respuesta' && e.padreId === p.id)
      .sort((a, b) => (a.creadoMs || 0) - (b.creadoMs || 0));
    return `<div class="pregunta${p.resuelta ? ' resuelta' : ''}${mias ? ' mio' : ''}" data-id="${esc(p.id)}">
      ${mias ? botonesPropios(p.id) : ''}
      <div class="p-cab"><span class="p-autor">${esc(p.autorNombre)}</span><span class="p-fecha">${fechaTxt(p.creado)}</span>${p.resuelta ? `<span class="p-badge">${t.badge}</span>` : ''}</div>
      ${textoHtml(p)}
      <div class="p-acciones">
        <button type="button" class="btn chico" data-responder="${esc(p.id)}">💬 Responder</button>
        <button type="button" class="btn chico ghost" data-resolver="${esc(p.id)}">${p.resuelta ? t.accionReabrir : t.accionHecha}</button>
        <span class="p-orden">
          <button type="button" class="btn chico ghost" data-arriba="${esc(p.id)}" title="Mandar arriba de todo">⤒</button>
          <button type="button" class="btn chico ghost" data-abajo="${esc(p.id)}" title="Mandar abajo de todo">⤓</button>
          <button type="button" class="btn chico ghost p-arrastrar" title="Mantené apretado y arrastrá para cambiar el lugar">⠿</button>
        </span>
      </div>
      ${respuestas.length ? `<div class="respuestas">${respuestas.map(r => `
        <div class="respuesta${fbUsuario && r.autorUid === fbUsuario.uid ? ' mio' : ''}" data-id="${esc(r.id)}">
          ${fbUsuario && r.autorUid === fbUsuario.uid ? botonesPropios(r.id) : ''}
          <div class="p-cab"><span class="p-autor">${esc(r.autorNombre)}</span><span class="p-fecha">${fechaTxt(r.creado)}</span></div>
          ${textoHtml(r)}
        </div>`).join('')}</div>` : ''}
      <div class="responder-caja" id="responder-${esc(p.id)}">
        <textarea placeholder="Escribí una respuesta o sugerencia…"></textarea>
        <div class="fila" style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" class="btn chico ghost" data-cancelar-responder="${esc(p.id)}">Cancelar</button>
          <button type="button" class="btn chico primary" data-enviar-respuesta="${esc(p.id)}">Enviar</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escuchar(){
  fbDb.collection('preguntas_diseno').orderBy('creado', 'asc').onSnapshot(snap => {
    entradas = snap.docs.map(d => {
      const x = d.data();
      return {id: d.id, ...x, creadoMs: x.creado && x.creado.toMillis ? x.creado.toMillis() : Date.now()};
    });
    if(arrastre){ arrastre.renderPendiente = true; return; }   // no mover el piso mientras se arrastra
    render();
  }, err => {
    console.error('Error escuchando las preguntas:', err);
    $('#lista').innerHTML = '<div class="vacio">No se pudo cargar (¿están publicadas las reglas nuevas de Firestore?).</div>';
  });
}

async function crear(tipo, texto, padreId){
  const t = texto.trim();
  if(!t) return;
  try{
    await fbDb.collection('preguntas_diseno').add({
      tipo, texto: t.slice(0, 4000), padreId: padreId || '', resuelta: false,
      autorUid: fbUsuario.uid, autorNombre: (fbUsuario.displayName || fbUsuario.email || 'Alguien').slice(0, 40),
      creado: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(err){
    console.error('No se pudo guardar:', err);
    alert('No se pudo guardar. Revisá la conexión e intentá de nuevo.');
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.id === 'btn-changelog'){
    changelogAbierto = !changelogAbierto;
    $('#changelog-lista').classList.toggle('open', changelogAbierto);
    $('#changelog-flecha').textContent = changelogAbierto ? '▴' : '▾';
    return;
  }
  if(b.dataset.tab){
    tabActiva = b.dataset.tab;
    mostrarResueltas = false;
    $('#chk-resueltas').checked = false;
    render();
    return;
  }
  if(b.dataset.responder){
    const caja = $('#responder-' + b.dataset.responder);
    if(caja){ caja.classList.add('open'); caja.querySelector('textarea').focus(); }
    return;
  }
  if(b.dataset.cancelarResponder){
    const caja = $('#responder-' + b.dataset.cancelarResponder);
    if(caja){ caja.classList.remove('open'); caja.querySelector('textarea').value = ''; }
    return;
  }
  if(b.dataset.enviarRespuesta){
    const id = b.dataset.enviarRespuesta;
    const caja = $('#responder-' + id);
    const ta = caja.querySelector('textarea');
    crear('respuesta', ta.value, id);
    ta.value = '';
    caja.classList.remove('open');
    return;
  }
  if(b.dataset.resolver){
    const p = entradas.find(x => x.id === b.dataset.resolver);
    if(p) fbDb.collection('preguntas_diseno').doc(p.id).update({resuelta: !p.resuelta}).catch(err => console.error(err));
    return;
  }
  if(b.dataset.editar){
    const x = entradas.find(v => v.id === b.dataset.editar);
    if(!x) return;
    editandoId = x.id; borradorEdicion = x.texto;
    render();
    const ta = document.querySelector('textarea[data-borrador]');
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if(b.dataset.cancelarEdicion){ editandoId = null; render(); return; }
  if(b.dataset.guardarEdicion){
    const id = b.dataset.guardarEdicion, t = borradorEdicion.trim();
    if(!t) return;
    b.disabled = true;
    fbDb.collection('preguntas_diseno').doc(id).update({texto: t.slice(0, 4000)})
      .then(() => { editandoId = null; render(); })
      .catch(err => { console.error(err); alert('No se pudo guardar el cambio. Revisá la conexión e intentá de nuevo.'); b.disabled = false; });
    return;
  }
  if(b.dataset.arriba || b.dataset.abajo){
    const id = b.dataset.arriba || b.dataset.abajo, arriba = !!b.dataset.arriba;
    const yo = entradas.find(v => v.id === id);
    const otros = entradas.filter(v => v.tipo === tabActiva && v.id !== id).map(ordenEfectivo);   // toda la pestaña, se vea o no lo resuelto
    if(!yo || !otros.length) return;
    const menor = Math.min(...otros), mayor = Math.max(...otros);
    if(arriba ? ordenEfectivo(yo) < menor : ordenEfectivo(yo) > mayor) return;   // ya está ahí
    guardarOrden(id, arriba ? menor - 1000 : mayor + 1000);
    return;
  }
  if(b.dataset.borrar){
    if(!confirm('¿Borrar esto? No se puede deshacer.')) return;
    fbDb.collection('preguntas_diseno').doc(b.dataset.borrar).delete().catch(err => console.error(err));
    return;
  }
});

document.addEventListener('input', e => {
  if(e.target.matches('textarea[data-borrador]')) borradorEdicion = e.target.value;
});

function guardarOrden(id, orden){
  fbDb.collection('preguntas_diseno').doc(id).update({orden})
    .catch(err => {
      console.error('No se pudo cambiar el orden:', err);
      alert('No se pudo cambiar el orden (¿están publicadas las reglas nuevas de Firestore?).');
      render();
    });
}

// Arrastrar: se mantiene apretado el ⠿ y se mueve la tarjeta entre las demás (sirve con dedo y con mouse, por eso
// eventos "pointer" y no el drag&drop de HTML, que en el celular no anda). Al soltar se calcula un `orden` entre
// el vecino de arriba y el de abajo, así se escribe UN solo documento.
function pasoArrastre(){
  if(!arrastre) return;
  const y = arrastre.y, cont = $('#lista');
  if(y < 150) window.scrollBy(0, -14); else if(y > window.innerHeight - 70) window.scrollBy(0, 14);
  const otras = [...cont.children].filter(c => c.classList.contains('pregunta') && c !== arrastre.card);
  const destino = otras.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if(destino){ if(arrastre.card.nextElementSibling !== destino) cont.insertBefore(arrastre.card, destino); }
  else if(cont.lastElementChild !== arrastre.card) cont.appendChild(arrastre.card);
  requestAnimationFrame(pasoArrastre);
}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.p-arrastrar');
  const card = h && h.closest('.pregunta');
  if(!card || arrastre) return;
  e.preventDefault();
  try{ h.setPointerCapture(e.pointerId); }catch(_){}
  arrastre = {id: card.dataset.id, card, pointerId: e.pointerId, y: e.clientY, renderPendiente: false};
  card.classList.add('arrastrando');
  document.body.classList.add('arrastrando-body');
  requestAnimationFrame(pasoArrastre);
});
document.addEventListener('pointermove', e => {
  if(arrastre && e.pointerId === arrastre.pointerId) arrastre.y = e.clientY;
});
function soltarArrastre(e){
  if(!arrastre || e.pointerId !== arrastre.pointerId) return;
  const {id, card, renderPendiente} = arrastre;
  arrastre = null;
  card.classList.remove('arrastrando');
  document.body.classList.remove('arrastrando-body');
  const oe = el => { const x = el && entradas.find(v => v.id === el.dataset.id); return x ? ordenEfectivo(x) : null; };
  const yo = oe(card), ant = oe(card.previousElementSibling), sig = oe(card.nextElementSibling);
  if(yo !== null && (ant === null || ant < yo) && (sig === null || yo < sig)){
    if(renderPendiente) render();   // no se movió: solo repintar lo que llegó mientras tanto
    return;
  }
  let nuevo;
  if(ant !== null && sig !== null) nuevo = (ant + sig) / 2;
  else if(ant !== null) nuevo = ant + 1000;
  else if(sig !== null) nuevo = sig - 1000;
  else { render(); return; }
  guardarOrden(id, nuevo);   // el cambio vuelve por Firestore y repinta solo
}
document.addEventListener('pointerup', soltarArrastre);
document.addEventListener('pointercancel', soltarArrastre);

$('#btn-nueva').onclick = () => {
  crear(tabActiva, $('#txt-nueva').value, '');
  $('#txt-nueva').value = '';
};
$('#chk-resueltas').onchange = e => { mostrarResueltas = e.target.checked; render(); };
$('#btn-salir').onclick = () => firebase.auth().signOut();

$('#btn-google').onclick = async () => {
  $('#login-error').textContent = '';
  const proveedor = new firebase.auth.GoogleAuthProvider();
  proveedor.setCustomParameters({prompt: 'select_account'});
  try{
    await firebase.auth().signInWithPopup(proveedor);
  }catch(err){
    // En el celular la ventanita suele estar bloqueada: se va a Google y vuelve.
    if(err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment'){
      await firebase.auth().signInWithRedirect(proveedor);
      return;
    }
    if(err.code !== 'auth/cancelled-popup-request') $('#login-error').textContent = 'No se pudo entrar: ' + (err.message || err.code || '');
  }
};

// A diferencia de las otras herramientas (que entran una vez y listo), acá conviene reaccionar en vivo a cada
// cambio de sesión: volver de un signInWithRedirect (celular sin ventanita), o Salir, sin recargar la página.
let escuchaArrancada = false;
function iniciar(){
  if(!fbIniciar()){ $('#login-error').textContent = 'Sin conexión con Firebase.'; return; }
  firebase.auth().onAuthStateChanged(u => {
    fbUsuario = u || null;
    if(!fbCuentaConfirmada(u)){
      $('#login-box').hidden = false;
      $('#main').hidden = true;
      $('#quien-soy').hidden = true;
      $('#btn-salir').hidden = true;
      $('#tabs').hidden = true;
      if(u && !u.emailVerified) $('#login-error').textContent = 'Confirmá tu email desde el link que te mandamos y volvé a entrar.';
      return;
    }
    $('#login-box').hidden = true;
    $('#main').hidden = false;
    $('#quien-soy').hidden = false;
    $('#quien-soy').textContent = u.displayName || u.email || '';
    $('#btn-salir').hidden = false;
    $('#tabs').hidden = false;
    document.title = 'Herramientas de diseño — Rol Pintoísta';
    render();   // por si cambió quién es "mío" al cambiar de cuenta
    if(!escuchaArrancada){ escuchaArrancada = true; escuchar(); }
  });
}
renderChangelog();
iniciar();
</script>
