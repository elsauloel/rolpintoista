<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Generator — Tiendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    repeating-linear-gradient(0deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(201,133,69,.045) 0 1px, transparent 1px 28px),
    radial-gradient(120% 80% at 50% 0%, #1C1418 0%, var(--ink) 70%);
  color:var(--paper); font-family:"Space Grotesk", system-ui, sans-serif; font-size:14px; line-height:1.4;
  min-height:100vh;
}
input,select,textarea,button{font-family:inherit;color:inherit}
input,textarea,select{
  min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:var(--r);
  color:var(--paper);padding:5px 7px;width:100%;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
button{cursor:pointer;background:none;border:none;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1400px;margin:0 auto;padding:22px 18px 90px}

.hero{
  border:1px solid var(--line);border-top:3px solid var(--copper);
  background:linear-gradient(180deg, rgba(201,133,69,.10), rgba(0,0,0,0) 60%), var(--panel);
  padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:60;box-shadow:0 8px 16px -8px rgba(0,0,0,.5);
}
.hero h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(22px,3vw,32px);margin:0;letter-spacing:-.01em}
.hero .eyebrow{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);white-space:nowrap
}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08;font-weight:700}
.btn.primary:hover{background:var(--brass)}
.btn.ghost{color:var(--muted)}
.btn.publicar{background:#2E6B57;border-color:#2E6B57;color:#EAF3E6;font-weight:700}
.btn.publicar:hover{background:#3A8770;border-color:#3A8770}

.panel{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-top:16px}
.panel-titulo{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:12px}
.controles{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:5px;flex:0 1 260px}
.campo label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.campo select{width:100%}
.hint{color:var(--muted);font-size:12.5px}

.resumen{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.resumen-chip{
  font-family:"Space Mono",monospace;font-size:11px;border:1px solid var(--line);
  border-radius:99px;padding:4px 12px;color:var(--paper)
}
.resumen-chip b{color:var(--brass)}

.cat-grouphead{
  font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--copper);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)
}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:10px}
.cat-card{
  display:flex;flex-direction:column;gap:5px;border:1px solid var(--line-soft);
  background:var(--panel2);padding:9px 11px
}
.cat-card-titulo{display:flex;align-items:flex-start;gap:7px;justify-content:space-between}
.cat-nombre{font-weight:700;font-size:13px;min-width:0}
.cat-tier-badge{
  font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid;font-weight:700;flex:none;white-space:nowrap;margin-top:1px
}
.cat-meta{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
.cat-mods{font-family:"Space Mono",monospace;font-size:10.5px;line-height:1.5}
.cat-mods .mod-plus{color:var(--absenta)}
.cat-mods .mod-minus{color:var(--danger)}
.cat-detalle{font-size:11.5px;color:var(--muted);line-height:1.45}
.cat-card-pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.view-title{font-family:"Fraunces",serif;font-size:19px;font-weight:600;margin-bottom:10px}
.view-lines{display:flex;flex-direction:column;gap:4px}
.view-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-soft);padding-bottom:3px}
.view-label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.view-value{font-size:13px;text-align:right}
.view-detalle{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--paper)}
.view-detalle .view-label{display:block;margin-bottom:4px}
.cat-precio{color:var(--brass);font-weight:700}
.cat-garantizado{
  font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--absenta);border:1px solid var(--absenta);border-radius:99px;padding:1px 7px;align-self:flex-start
}

.cat-card{position:relative}
.cat-quitar{
  position:absolute;top:6px;right:6px;width:20px;height:20px;line-height:1;
  border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:13px;
  display:none;align-items:center;justify-content:center
}
.cat-card:hover .cat-quitar{display:flex}
.cat-quitar:hover{border-color:var(--danger);color:var(--danger);background:rgba(212,87,78,.14)}
.cat-precio-viejo{text-decoration:line-through;color:var(--muted);margin-right:6px;font-weight:400}

.barra-edicion{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line-soft)
}
.ajuste-grupo{display:flex;align-items:center;gap:6px}
.ajuste-grupo label{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ajuste-grupo input{width:74px;text-align:center;flex:none}
.ajuste-preset{
  font-family:"Space Mono",monospace;font-size:10px;border:1px solid var(--line);
  border-radius:99px;padding:4px 9px;color:var(--muted)
}
.ajuste-preset:hover{border-color:var(--copper);color:var(--paper)}
.ajuste-preset.activo{border-color:var(--copper);background:rgba(201,133,69,.18);color:var(--paper);font-weight:700}

.agregar-fila{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);
  background:var(--panel2);padding:7px 10px;margin-bottom:6px
}
.agregar-fila .cat-nombre{flex:1}
.scrim{position:fixed;inset:0;background:rgba(8,5,7,.78);display:none;z-index:50;padding:24px;overflow:auto}
.scrim.open{display:block}
.modal{max-width:820px;margin:4vh auto;border:1px solid var(--line);border-top:3px solid var(--copper);background:var(--panel)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);gap:10px}
.modal header h3{margin:0;font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.modal .body{padding:15px;max-height:62vh;overflow:auto}
.modal .filtros{display:flex;flex-wrap:wrap;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line-soft)}
.modal .filtros input{flex:2 1 220px}
.modal .filtros select{flex:1 1 150px;width:auto}
.iconbtn{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:var(--r)}
.iconbtn:hover{border-color:var(--copper);color:var(--paper)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--panel);
  border:1px solid var(--copper);padding:10px 16px;font-family:"Space Mono",monospace;font-size:11.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:95;max-width:90vw;text-align:center
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div>
      <div class="eyebrow">Rol Pintoísta</div>
      <h1>Vendor Generator</h1>
    </div>
    <div class="hero-right">
      <a class="btn ghost" href="ficha.html">Abrir ficha</a>
      <a class="btn ghost" href="gm-tools.html">Abrir GM Tools</a>
      <button class="btn ghost" id="btn-token">Cambiar token GitHub</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-titulo">Generar tienda</div>
    <div class="controles">
      <div class="campo">
        <label for="f-tamano">Tamaño del vendedor</label>
        <select id="f-tamano">
          <option value="ambulante">Vendedor ambulante</option>
          <option value="pueblito">Pueblito</option>
          <option value="aldea" selected>Aldea</option>
          <option value="ciudad">Ciudad</option>
          <option value="capital">Capital</option>
        </select>
      </div>
      <button class="btn primary" id="btn-generar">Generar Shop</button>
      <button class="btn" id="btn-regenerar" disabled>Regenerar</button>
      <button class="btn publicar" id="btn-publicar" disabled>Publicar Shop</button>
    </div>
    <div class="hint" id="hint-tamano" style="margin-top:10px"></div>
  </div>

  <div class="panel" id="panel-preview" style="display:none">
    <div class="panel-titulo">Vista previa del catálogo</div>
    <div class="resumen" id="preview-resumen"></div>
    <div class="barra-edicion">
      <div class="ajuste-grupo">
        <label for="f-ajuste">Precios</label>
        <input type="number" id="f-ajuste" step="5" value="0" title="Porcentaje sobre el precio de catálogo: negativo descuenta, positivo recarga">
        <span class="hint">%</span>
      </div>
      <button type="button" class="ajuste-preset" data-ajuste="-25">-25%</button>
      <button type="button" class="ajuste-preset" data-ajuste="-10">-10%</button>
      <button type="button" class="ajuste-preset activo" data-ajuste="0">Normal</button>
      <button type="button" class="ajuste-preset" data-ajuste="10">+10%</button>
      <button type="button" class="ajuste-preset" data-ajuste="25">+25%</button>
      <div class="ajuste-grupo" style="margin-left:auto">
        <label for="f-orden">Ordenar por</label>
        <select id="f-orden" style="width:auto"></select>
      </div>
      <button type="button" class="ajuste-preset" id="btn-orden-dir">↑ Menor a mayor</button>
      <button type="button" class="btn" id="btn-agregar-items">+ Agregar ítems</button>
    </div>
    <div id="preview-lista"></div>
  </div>

</div>

<div class="scrim" id="scrim-agregar">
  <div class="modal">
    <header>
      <h3>Agregar ítems a la tienda</h3>
      <button class="iconbtn" id="agregar-x">Cerrar</button>
    </header>
    <div class="filtros">
      <input type="text" id="agregar-buscar" placeholder="Buscar por nombre…">
      <select id="agregar-rubro">
        <option value="">Todos los rubros</option>
        <option value="ofensivo">Armas</option>
        <option value="defensivo">Defensa</option>
        <option value="consumibles">Consumibles</option>
      </select>
      <select id="agregar-tier">
        <option value="">Todos los tiers</option>
        <option value="Común">Común</option>
        <option value="Buena Calidad">Buena calidad</option>
        <option value="Raro">Raro</option>
        <option value="Excepcional">Excepcional</option>
        <option value="Legendario">Legendario</option>
      </select>
    </div>
    <div class="body" id="agregar-lista"></div>
  </div>
</div>

<div class="scrim" id="scrim-ver">
  <div class="modal" style="max-width:460px">
    <header>
      <h3 id="ver-titulo">Ítem</h3>
      <button class="iconbtn" id="ver-x">Cerrar</button>
    </header>
    <div class="body" id="ver-body"></div>
    <footer style="display:flex;justify-content:flex-end;gap:9px;padding:12px 15px;border-top:1px solid var(--line)">
      <button class="btn primary" id="ver-toggle">Agregar a la tienda</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('es-AR').format(n);

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Catálogo (espejo del de ficha.html, sin imágenes) ---------- */
/* La tienda publicada guarda solo ids: la ficha resuelve nombre, imagen y
   stats desde su propio catálogo, así este archivo no duplica esos datos. */
/* Espejo del catálogo de ficha.html, sin las imágenes: son 1022 de los
   1060 KB del bloque original y acá no aportan nada. Todo lo demás
   (peso, dado, daño fijo, mods, detalle) viene completo para poder
   mostrar la misma tarjeta que ve el jugador. */
const GRUPOS = [
  {id:'con', label:'Con', full:'Constitución', color:'#C4485A', derived:[
    {id:'resmg', label:'Res.Mg', full:'Resistencia mágica'},
    {id:'rescc', label:'Res.CC', full:'Resistencia al crowd control'},
    {id:'hpmax', label:'Hp.Max', full:'Health points máximos'}]},
  {id:'fue', label:'Fue', full:'Fuerza', color:'#D07B3A', derived:[
    {id:'dmg', label:'Dmg', full:'Damage'},
    {id:'potencia', label:'Potencia', full:'Potencia'},
    {id:'crgmax', label:'Crg.Max', full:'Carga máxima'}]},
  {id:'agl', label:'Agi', full:'Agilidad', color:'#8FB84F', derived:[
    {id:'eva', label:'Eva', full:'Evasión'},
    {id:'ini', label:'Iniciativa', full:'Iniciativa'},
    {id:'mov', label:'Mov', full:'Movimiento'}]},
  {id:'des', label:'Des', full:'Destreza', color:'#4FA88C', derived:[
    {id:'rng', label:'Rng', full:'Rango'},
    {id:'pdg', label:'PdG', full:'Probabilidad de golpe'},
    {id:'crit', label:'Crit', full:'Crítico'},
    {id:'parry', label:'Parry', full:'Parry'}]},
  {id:'int', label:'Int', full:'Inteligencia', color:'#9B7BD4', derived:[
    {id:'pdgmg', label:'PdG.Mg', full:'Probabilidad de golpe mágico'},
    {id:'resm', label:'Res.M', full:'Resistencia mágica (Int)'},
    {id:'bonos', label:'Bonos', full:'Bonos'},
    {id:'rangocasteo', label:'Rango Cast.', full:'Rango de casteo'}]},
];
const EXTRA = [
  {id:'def', label:'Defensa', full:'Defensa'},
  {id:'accionesmax', label:'Acciones máx.', full:'Acciones máximas por turno'},
  {id:'tipo1', label:'Tipo 2', full:'Resistencia a crítico — armas Tipo 2 (d2)'},
  {id:'tipo2', label:'Tipo 4', full:'Resistencia a crítico — armas Tipo 4 (d4)'},
  {id:'tipo3', label:'Tipo 6', full:'Resistencia a crítico — armas Tipo 6 (d6)'},
  {id:'tipo4', label:'Tipo 8', full:'Resistencia a crítico — armas Tipo 8 (d8)'},
  {id:'tipo5', label:'Tipo 10', full:'Resistencia a crítico — armas Tipo 10 (d10, explosivos/modernas)'},
];
const STAT_LIST = [...GRUPOS.flatMap(g=>g.derived), ...EXTRA];

const DADOS_ARMA = [2, 4, 6, 8, 10];
const MOD_TARGETS = [...GRUPOS.map(g => ({id:g.id, label:g.label, full:g.full})), ...STAT_LIST];
const STAT_LABEL = Object.fromEntries(MOD_TARGETS.map(s=>[s.id,s.label]));
const TIPOS_IDS = ['tipo1','tipo2','tipo3','tipo4','tipo5'];

const CATEGORIAS = [
  {id:'', label:'— elegir categoría —'},
  {id:'arma_1m', label:'Arma de una mano', arma:true},
  {id:'arma_2m', label:'Arma de dos manos', arma:true},
  {id:'escudo_1m', label:'Escudo de una mano', defensivo:true},
  {id:'escudo_2m', label:'Escudo de dos manos', defensivo:true},
  {id:'armadura_blanda', label:'Armadura blanda', defensivo:true},
  {id:'armadura_rigida', label:'Armadura rígida', defensivo:true},
  {id:'guantes_blandos', label:'Guantes blandos', defensivo:true},
  {id:'guantes_rigidos', label:'Guantes rígidos', defensivo:true},
  {id:'piernas_blandas', label:'Piernas blandas', defensivo:true},
  {id:'piernas_rigidas', label:'Piernas rígidas', defensivo:true},
  {id:'casco_blando', label:'Casco blando', defensivo:true},
  {id:'casco_rigido', label:'Casco rígido', defensivo:true},
  {id:'botas_blandas', label:'Botas blandas', defensivo:true},
  {id:'botas_rigidas', label:'Botas rígidas', defensivo:true},
  {id:'anillos', label:'Anillos'},
  {id:'otros', label:'Otros'},
  {id:'consumibles', label:'Consumibles'},
];
const CATEGORIA_LABEL = Object.fromEntries(CATEGORIAS.map(c=>[c.id, c.label]));
const ES_ARMA = catId => CATEGORIAS.find(c=>c.id===catId)?.arma === true;

const CATALOGO = [
  {id:'cat-pocion-hp', nombre:'Poción de HP', tier:'Común', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:20, unidades:1, consumible:true, curahp:25, mods:[], detalle:'Recupera 25 HP.'},
  {id:'cat-pocion-hp-grande', nombre:'Poción de HP grande', tier:'Buena Calidad', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:20, unidades:1, cargaMax:3, consumible:true, curahp:25, mods:[], detalle:'3 Cargas. Recupera 25 HP por carga.'},
  {id:'cat-pocion-hp-mayor', nombre:'Poción de HP mayor', tier:'Raro', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:50, unidades:1, consumible:true, curahp:100, mods:[], detalle:'Recupera 100 HP.'},
  {id:'cat-pocion-hp-mayor-grande', nombre:'Poción de HP mayor grande', tier:'Excepcional', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:200, unidades:1, cargaMax:3, consumible:true, curahp:100, mods:[], detalle:'3 Cargas. Recupera 100 HP por carga.'},
  {id:'cat-pocion-regen', nombre:'Poción de Regeneración', tier:'Común', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:15, unidades:1, consumible:true, curahp:0, mods:[], efectoNombre:'Regeneración (poción)', efectoTurnos:5, efectoHpTurno:10, detalle:'Recupera 50 HP a lo largo de 5 turnos (10 por turno). Al consumirla se activa sola el estado "Regeneración (poción)".'},
  {id:'cat-pocion-regen-grande', nombre:'Poción de Regeneración Grande', tier:'Buena Calidad', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:45, unidades:1, cargaMax:3, consumible:true, curahp:0, mods:[], efectoNombre:'Regeneración (poción)', efectoTurnos:5, efectoHpTurno:10, detalle:'3 Cargas. Cada carga recupera 50 HP a lo largo de 5 turnos (10 por turno). Al consumirla se activa sola el estado "Regeneración (poción)".'},
  {id:'cat-pocion-regen-mayor', nombre:'Poción de Regeneración mayor', tier:'Buena Calidad', imagen:'', tipoItem:'consumibles', peso:0, ranuras:1, precioCompra:35, unidades:1, consumible:true, curahp:0, mods:[], efectoNombre:'Regeneración (poción)', efectoTurnos:5, efectoHpTurno:20, detalle:'Recupera 100 HP a lo largo de 5 turnos (20 por turno). Al consumirla se activa sola el estado "Regeneración (poción)".'},

// Sobre el total sorteado, sin contar el stock garantizado.
const REPARTO = {armas:0.35, defensivos:0.35, escudos:0.20, consumibles:0.10};

// ES_ARMA sale de CATEGORIAS, arriba, junto con el catálogo.
const ES_DEFENSA = t => t.startsWith('escudo') || t.startsWith('armadura') || t.startsWith('casco')
  || t.startsWith('guantes') || t.startsWith('piernas') || t.startsWith('botas');

// Los escudos son categoría propia: tienen su porcentaje aparte del
// resto del equipo defensivo.
function rubroDe(item){
  if(item.consumible || item.tipoItem === 'consumibles') return 'consumibles';
  if(ES_ARMA(item.tipoItem)) return 'armas';
  if(item.tipoItem.startsWith('escudo')) return 'escudos';
  if(ES_DEFENSA(item.tipoItem)) return 'defensivos';
  return 'otros';
}

const RUBRO_LABEL = {armas:'Armas', defensivos:'Defensa', escudos:'Escudos', consumibles:'Consumibles', otros:'Otros'};
const RUBRO_ORDEN = ['armas', 'escudos', 'defensivos', 'consumibles', 'otros'];

function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

function armaDanoTxt(i){
  if(!ES_ARMA(i.tipoItem)) return '';
  const dados = Math.max(1, num(i.peso) || 1);
  const tipo = num(i.tipoDado) || 6;
  const fijo = num(i.danoFijo);
  return `${dados}d${tipo}${fijo ? ` + ${fmt(fijo)}` : ''}`;
}

function defValorDe(i){
  return (i.mods||[]).filter(m => m.stat === 'def').reduce((a,m) => a + num(m.val), 0);
}

function modsResumenHtml(item){
  const mods = (item.mods || []).filter(m => m.stat && m.stat !== 'def');
  if(!mods.length) return '';
  return mods.map(m => {
    const label = TIPOS_IDS.includes(m.stat) ? `Res.Crít. ${STAT_LABEL[m.stat]}` : (STAT_LABEL[m.stat] || m.stat);
    const val = num(m.val);
    const suf = m.stat === 'crit' ? '%' : '';
    const cls = val > 0 ? 'mod-plus' : val < 0 ? 'mod-minus' : '';
    return `<span class="${cls}">${esc(label)} ${val>0?'+':''}${fmt(val)}${suf}</span>`;
  }).join(' · ');
}

// Daño máximo posible del arma. Lo que no es arma da 0 y queda fuera del
// orden por daño (ver ordenarItems).
function danoDe(item){
  if(!ES_ARMA(item.tipoItem)) return 0;
  return Math.max(1, num(item.peso) || 1) * (num(item.tipoDado) || 6) + num(item.danoFijo);
}

function entero(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

/* Elige un tier al azar respetando los pesos del tamaño, pero solo entre
   los tiers que todavía tienen stock disponible en ese rubro. */
function sortearTier(pesos, disponiblesPorTier){
  const posibles = TIERS.filter(t => (disponiblesPorTier[t] || []).length);
  if(!posibles.length) return null;
  const total = posibles.reduce((a, t) => a + (pesos[t] || 0), 0);
  if(total <= 0) return posibles[entero(0, posibles.length - 1)];
  let r = Math.random() * total;
  for(const t of posibles){
    r -= (pesos[t] || 0);
    if(r <= 0) return t;
  }
  return posibles[posibles.length - 1];
}


// Reparte un entero según porcentajes sin que se pierda ni sobre nada:
// primero la parte entera, y lo que falta va a los de mayor resto.
function repartirEntero(total, pesos){
  const claves = Object.keys(pesos);
  const exacto = claves.map(k => ({k, v: total * pesos[k]}));
  const base = exacto.map(e => ({...e, n: Math.floor(e.v), resto: e.v - Math.floor(e.v)}));
  let faltan = total - base.reduce((a, e) => a + e.n, 0);
  base.sort((a, b) => b.resto - a.resto);
  for(let i = 0; faltan > 0; i++, faltan--) base[i % base.length].n++;
  const out = {};
  base.forEach(e => { out[e.k] = e.n; });
  return out;
}

// Una tirada por objeto, con la tabla del tamaño. No hay cupos por tier:
// dos tiendas del mismo tamaño pueden salir distintas.
function tirarTier(pesos){
  const total = Object.values(pesos).reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for(const [tier, peso] of Object.entries(pesos)){
    r -= peso;
    if(r <= 0) return tier;
  }
  return TIERS[0];
}

/* Elige un ítem de esa categoría y ese tier que no esté ya en la tienda.
   El catálogo tiene casilleros vacíos (no hay ninguna arma Excepcional,
   ni un solo Legendario de nada), así que cuando la combinación no existe
   se cede primero en rareza —buscando el tier más cercano dentro de la
   misma categoría— y recién si la categoría se agotó entera se sale de
   ella. Nunca se inventa un ítem ni se deja el lugar vacío. */
function elegirItem(rubro, tier, usados, porRubroTier){
  const libres = (lista) => (lista || []).filter(it => !usados.has(it.id));

  const delRubro = porRubroTier[rubro] || {};
  const exacto = libres(delRubro[tier]);
  if(exacto.length) return exacto[entero(0, exacto.length - 1)];

  // Mismo rubro, el tier más cercano (a igual distancia, gana el de abajo).
  const i = TIERS.indexOf(tier);
  const cercanos = TIERS
    .map((t, j) => ({t, d: Math.abs(j - i) * 2 + (j > i ? 1 : 0)}))
    .sort((a, b) => a.d - b.d);
  for(const {t} of cercanos){
    const c = libres(delRubro[t]);
    if(c.length) return c[entero(0, c.length - 1)];
  }

  // El rubro se quedó sin nada: cualquier otro con ese tier, y si no, lo que haya.
  for(const otro of RUBRO_ORDEN){
    if(otro === rubro) continue;
    const c = libres((porRubroTier[otro] || {})[tier]);
    if(c.length) return c[entero(0, c.length - 1)];
  }
  const cualquiera = libres(CATALOGO);
  return cualquiera.length ? cualquiera[entero(0, cualquiera.length - 1)] : null;
}

function generarTienda(claveTamano){
  const cfg = TAMANOS[claveTamano];
  const usados = new Set();

  // 1. Stock garantizado: va siempre y no entra en el reparto de abajo.
  const garantizados = GARANTIZADOS
    .map(id => CATALOGO.find(it => it.id === id))
    .filter(Boolean);
  garantizados.forEach(it => usados.add(it.id));

  // 2. Catálogo indexado por rubro y tier, para elegir rápido.
  const porRubroTier = {};
  CATALOGO.forEach(it => {
    const r = rubroDe(it);
    (porRubroTier[r] = porRubroTier[r] || {});
    (porRubroTier[r][it.tier] = porRubroTier[r][it.tier] || []).push(it);
  });

  // 3. Cuántos objetos y cómo se reparten entre las categorías.
  const total = entero(cfg.min, cfg.max);
  const reparto = repartirEntero(total, REPARTO);

  // 4. Cada lugar tira su propia rareza y busca un ítem que la cumpla.
  const elegidos = [];
  Object.entries(reparto).forEach(([rubro, cuantos]) => {
    for(let i = 0; i < cuantos; i++){
      const tier = tirarTier(cfg.pesos);
      const item = elegirItem(rubro, tier, usados, porRubroTier);
      if(!item) break;   // se acabó el catálogo entero
      usados.add(item.id);
      elegidos.push(item);
    }
  });

  return {
    tamano: claveTamano,
    tamanoLabel: cfg.label,
    generado: new Date().toISOString(),
    ajustePrecio: 0,
    garantizados: garantizados.map(it => it.id),
    items: [...garantizados, ...elegidos].map(it => it.id),
  };
}

/* ---------- Orden ---------- */

const ORDENES = {
  categoria: {label:'Categoría', cmp:(a,b) => RUBRO_ORDEN.indexOf(rubroDe(a)) - RUBRO_ORDEN.indexOf(rubroDe(b)) || TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier) || a.nombre.localeCompare(b.nombre, 'es')},
  nombre:    {label:'Nombre',    cmp:(a,b) => a.nombre.localeCompare(b.nombre, 'es')},
  precio:    {label:'Precio',    cmp:(a,b) => num(a.precioCompra) - num(b.precioCompra)},
  peso:      {label:'Peso',      cmp:(a,b) => num(a.peso) - num(b.peso)},
  rareza:    {label:'Rareza',    cmp:(a,b) => TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier)},
  dano:      {label:'Daño',     valor: danoDe},
  defensa:   {label:'Defensa',  valor: defValorDe},
};

let ordenActual = 'categoria';
let ordenDesc = false;

// Ordenar por categoría mantiene los grupos (es la vista de siempre);
// cualquier otro criterio pasa a lista plana, porque agrupado no se puede
// ver "lo más caro de la tienda" de un vistazo.
function ordenarItems(items){
  const def = ORDENES[ordenActual] || ORDENES.categoria;
  const porNombre = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
  // Criterio con valor propio (daño, defensa): lo que no aplica queda
  // al final siempre, no mezclado entre los que sí tienen.
  if(def.valor){
    const con = items.filter(i => def.valor(i) > 0);
    const sin = items.filter(i => def.valor(i) <= 0).sort(porNombre);
    con.sort((a, b) => def.valor(a) - def.valor(b) || porNombre(a, b));
    if(ordenDesc) con.reverse();
    return [...con, ...sin];
  }
  const orden = items.slice().sort((a, b) => def.cmp(a, b) || porNombre(a, b));
  return ordenDesc ? orden.reverse() : orden;
}

function renderOrdenControles(){
  const sel = $('#f-orden');
  if(sel && !sel.dataset.listo){
    sel.innerHTML = Object.entries(ORDENES).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
    sel.dataset.listo = '1';
  }
  if(sel) sel.value = ordenActual;
  const b = $('#btn-orden-dir');
  if(b){
    b.textContent = ordenDesc ? '↓ Mayor a menor' : '↑ Menor a mayor';
    b.title = ordenDesc ? 'Cambiar a menor a mayor' : 'Cambiar a mayor a menor';
  }
}

/* ---------- Vista previa ---------- */

let tiendaActual = null;

// El ajuste es de la tienda entera, no de cada ítem: se guarda como
// porcentaje y el precio final se calcula al vuelo, así el catálogo base
// nunca se toca y cambiar el porcentaje no pierde el precio original.
function ajusteActual(){
  return tiendaActual ? (Number(tiendaActual.ajustePrecio) || 0) : 0;
}

function precioAjustado(item){
  const pct = ajusteActual();
  if(!pct) return Number(item.precioCompra) || 0;
  return Math.max(1, Math.round((Number(item.precioCompra) || 0) * (1 + pct / 100)));
}

function precioHtmlDe(item){
  const pct = ajusteActual();
  const final = precioAjustado(item);
  return pct
    ? `<span class="cat-precio-viejo">${fmt(item.precioCompra)}</span><b class="cat-precio">${fmt(final)} DDE</b>`
    : `<b class="cat-precio">${fmt(final)} DDE</b>`;
}

// Misma tarjeta que ve el jugador en el catálogo del fabricante, para que
// el GM arme la tienda mirando exactamente lo mismo que va a ver la mesa.
function itemCardHtml(item, esGarantizado){
  const color = TIER_COLOR[item.tier] || TIER_COLOR['Común'];
  const dano = armaDanoTxt(item);
  const defVal = defValorDe(item);
  const statTxt = dano ? `Daño ${dano}` : (defVal ? `Defensa ${defVal>0?'+':''}${fmt(defVal)}` : '');
  const modsHtml = modsResumenHtml(item);
  return `<div class="cat-card">
    <button type="button" class="cat-quitar" data-quitar="${esc(item.id)}" title="Quitar de la tienda">×</button>
    <div class="cat-card-titulo">
      <div class="cat-nombre">${esc(item.nombre)}</div>
      <div class="cat-tier-badge" style="color:${color};border-color:${color};background:${color}22">${esc(item.tier)}</div>
    </div>
    <div class="cat-meta">${precioHtmlDe(item)} · Peso ${fmt(num(item.peso))}${statTxt ? ` · ${esc(statTxt)}` : ''}${item.consumible?` · consumible${item.curahp?` (${num(item.curahp)>0?'+':''}${fmt(num(item.curahp))} HP)`:''}`:''}</div>
    ${modsHtml ? `<div class="cat-mods">${modsHtml}</div>` : ''}
    ${item.detalle ? `<div class="cat-detalle">${esc(item.detalle)}</div>` : ''}
    <div class="cat-card-pie">
      ${esGarantizado ? '<span class="cat-garantizado">Stock fijo</span>' : '<span></span>'}
      <button type="button" class="iconbtn" data-ver="${esc(item.id)}">Ver</button>
    </div>
  </div>`;
}

/* ---------- Tarjeta completa (Ver) ---------- */

function verItem(id){
  const item = CATALOGO.find(it => it.id === id);
  if(!item) return;
  const linea = (label, val) => (val === '' || val === null || val === undefined)
    ? '' : `<div class="view-line"><span class="view-label">${esc(label)}</span><span class="view-value">${esc(val)}</span></div>`;
  const L = [];
  if(item.tipoItem) L.push(linea('Categoría', CATEGORIA_LABEL[item.tipoItem] || item.tipoItem));
  L.push(linea('Rareza', item.tier));
  if(ES_ARMA(item.tipoItem)){
    L.push(linea('Tipo de dado', `d${num(item.tipoDado) || 6}`));
    L.push(linea('Daño', armaDanoTxt(item)));
  }
  const defVal = defValorDe(item);
  if(defVal) L.push(linea('Defensa', `${defVal>0?'+':''}${fmt(defVal)}`));
  L.push(linea('Peso', fmt(num(item.peso))));
  if(item.ranuras !== undefined) L.push(linea('Ranuras', fmt(num(item.ranuras))));
  const pct = ajusteActual();
  L.push(linea('Precio de lista', `${fmt(num(item.precioCompra))} DDE`));
  if(pct) L.push(linea(pct < 0 ? `Precio con ${Math.abs(pct)}% de descuento` : `Precio con ${pct}% de recargo`, `${fmt(precioAjustado(item))} DDE`));
  if(item.consumible) L.push(linea('Consumible', `${fmt(num(item.unidades) || 1)} unidad(es)${item.curahp ? ` · ${num(item.curahp)>0?'+':''}${fmt(num(item.curahp))} HP al consumir` : ''}`));
  TIPOS_IDS.forEach(tid => {
    const m = (item.mods || []).find(x => x.stat === tid);
    if(m && num(m.val)) L.push(linea(`Res. crítico ${STAT_LABEL[tid]}`, `${num(m.val)>0?'+':''}${fmt(num(m.val))}`));
  });
  const otros = (item.mods || []).filter(m => m.stat && m.stat !== 'def' && !TIPOS_IDS.includes(m.stat));
  if(otros.length) L.push(linea('Otros modificadores', otros.map(m => `${STAT_LABEL[m.stat]||m.stat} ${num(m.val)>0?'+':''}${fmt(num(m.val))}`).join(', ')));

  const enTienda = tiendaActual && tiendaActual.items.includes(item.id);
  $('#ver-titulo').textContent = item.nombre;
  $('#ver-body').innerHTML = `
    <div class="view-title">${esc(item.nombre)}</div>
    <div class="view-lines">${L.filter(Boolean).join('')}</div>
    ${item.detalle ? `<div class="view-detalle"><span class="view-label">Detalle</span>${esc(item.detalle)}</div>` : ''}
  `;
  const btn = $('#ver-toggle');
  btn.textContent = enTienda ? 'Quitar de la tienda' : 'Agregar a la tienda';
  btn.className = enTienda ? 'btn ghost' : 'btn primary';
  btn.dataset.item = item.id;
  btn.style.display = tiendaActual ? '' : 'none';
  $('#scrim-ver').classList.add('open');
}

function renderPreview(){
  if(!tiendaActual){ $('#panel-preview').style.display = 'none'; return; }
  const garantizados = new Set(tiendaActual.garantizados);
  const items = tiendaActual.items.map(id => CATALOGO.find(it => it.id === id)).filter(Boolean);

  const porTier = {};
  items.forEach(it => porTier[it.tier] = (porTier[it.tier] || 0) + 1);
  const pct = ajusteActual();
  $('#preview-resumen').innerHTML =
    `<span class="resumen-chip">${esc(tiendaActual.tamanoLabel)}</span>` +
    `<span class="resumen-chip">Ítems <b>${fmt(items.length)}</b></span>` +
    (pct ? `<span class="resumen-chip" style="border-color:${pct < 0 ? 'var(--absenta)' : 'var(--brass)'}">${pct < 0 ? 'Descuento' : 'Recargo'} <b>${fmt(Math.abs(pct))}%</b></span>` : '') +
    TIERS.filter(t => porTier[t]).map(t =>
      `<span class="resumen-chip" style="border-color:${TIER_COLOR[t]}">${esc(t)} <b>${fmt(porTier[t])}</b></span>`
    ).join('');

  let html = '';
  if(ordenActual === 'categoria'){
    RUBRO_ORDEN.forEach(rubro => {
      const delRubro = ordenarItems(items.filter(it => rubroDe(it) === rubro));
      if(!delRubro.length) return;
      html += `<div class="cat-grouphead">${RUBRO_LABEL[rubro]} · ${fmt(delRubro.length)}</div>`;
      html += `<div class="cat-grid">${delRubro.map(it => itemCardHtml(it, garantizados.has(it.id))).join('')}</div>`;
    });
  }else{
    const orden = ordenarItems(items);
    html += `<div class="cat-grouphead">${esc(ORDENES[ordenActual].label)} · ${fmt(orden.length)}</div>`;
    html += `<div class="cat-grid">${orden.map(it => itemCardHtml(it, garantizados.has(it.id))).join('')}</div>`;
  }
  renderOrdenControles();
  $('#preview-lista').innerHTML = html;
  $('#panel-preview').style.display = '';
}

function quitarItem(id){
  if(!tiendaActual) return;
  const item = CATALOGO.find(it => it.id === id);
  tiendaActual.items = tiendaActual.items.filter(x => x !== id);
  // Si sacan un consumible del stock fijo se respeta: es la tienda del GM.
  tiendaActual.garantizados = (tiendaActual.garantizados || []).filter(x => x !== id);
  renderPreview();
  renderAgregarLista();
  toast(`${item ? item.nombre : 'Ítem'} fuera de la tienda`);
}

function agregarItem(id){
  if(!tiendaActual) return;
  if(tiendaActual.items.includes(id)){ toast('Ese ítem ya está en la tienda'); return; }
  const item = CATALOGO.find(it => it.id === id);
  tiendaActual.items.push(id);
  renderPreview();
  renderAgregarLista();
  toast(`${item ? item.nombre : 'Ítem'} agregado`);
}

function renderAgregarLista(){
  if(!tiendaActual) return;
  const enTienda = new Set(tiendaActual.items);
  const texto = ($('#agregar-buscar').value || '').trim().toLowerCase();
  const rubro = $('#agregar-rubro').value;
  const tier = $('#agregar-tier').value;

  let candidatos = CATALOGO.filter(it => !enTienda.has(it.id));
  if(rubro) candidatos = candidatos.filter(it => rubroDe(it) === rubro);
  if(tier) candidatos = candidatos.filter(it => it.tier === tier);
  if(texto) candidatos = candidatos.filter(it => it.nombre.toLowerCase().includes(texto));
  candidatos = ordenarItems(candidatos);

  if(!candidatos.length){
    $('#agregar-lista').innerHTML = `<div class="hint">No quedan ítems del catálogo que coincidan${enTienda.size ? ' y no estén ya en la tienda' : ''}.</div>`;
    return;
  }
  $('#agregar-lista').innerHTML = candidatos.map(it => {
    const color = TIER_COLOR[it.tier] || TIER_COLOR['Común'];
    const dano = armaDanoTxt(it);
    const defVal = defValorDe(it);
    const statTxt = dano ? `Daño ${dano}` : (defVal ? `Def ${defVal>0?'+':''}${fmt(defVal)}` : '');
    return `<div class="agregar-fila">
      <div class="cat-nombre">${esc(it.nombre)}</div>
      <div class="cat-tier-badge" style="color:${color};border-color:${color};background:${color}22">${esc(it.tier)}</div>
      <span class="cat-meta">${fmt(precioAjustado(it))} DDE · Peso ${fmt(num(it.peso))}${statTxt ? ` · ${esc(statTxt)}` : ''}</span>
      <button type="button" class="iconbtn" data-ver="${esc(it.id)}">Ver</button>
      <button type="button" class="iconbtn" data-agregar="${esc(it.id)}">Agregar</button>
    </div>`;
  }).join('');
}

function abrirAgregar(){
  if(!tiendaActual){ toast('Primero generá una tienda'); return; }
  $('#agregar-buscar').value = '';
  $('#agregar-rubro').value = '';
  $('#agregar-tier').value = '';
  renderAgregarLista();
  $('#scrim-agregar').classList.add('open');
}

function aplicarAjuste(pct){
  if(!tiendaActual) return;
  const n = Math.max(-90, Math.min(500, Math.round(Number(pct) || 0)));
  tiendaActual.ajustePrecio = n;
  $('#f-ajuste').value = n;
  document.querySelectorAll('.ajuste-preset').forEach(b =>
    b.classList.toggle('activo', Number(b.dataset.ajuste) === n));
  renderPreview();
  renderAgregarLista();
}

function generar(){
  const clave = $('#f-tamano').value;
  const ajustePrevio = ajusteActual();
  tiendaActual = generarTienda(clave);
  // Regenerar cambia el stock, no la política de precios del vendedor.
  tiendaActual.ajustePrecio = ajustePrevio;
  renderPreview();
  $('#btn-regenerar').disabled = false;
  $('#btn-publicar').disabled = false;
  toast(`Tienda generada · ${tiendaActual.items.length} ítems`);
}

function actualizarHint(){
  const cfg = TAMANOS[$('#f-tamano').value];
  $('#hint-tamano').textContent =
    `${cfg.label}: entre ${cfg.min} y ${cfg.max} ítems, más los consumibles de stock fijo (Poción de HP, Poción de Bonos y Revive).`;
}

/* ---------- GitHub ---------- */

const GH_REPO = 'elsauloel/rolpintoista';
const GH_BRANCH = 'main';
const ARCHIVO_TIENDA = 'tienda-publica.json';

const GH_TOKEN_URL = 'https://github.com/settings/tokens/new?description=Rolpintoista&scopes=public_repo';

/* Pide el token en un cartel dentro de esta misma pestaña.
   Antes se abría GitHub con window.open() y enseguida se llamaba a
   prompt(): como la pestaña de GitHub se lleva el foco, el navegador
   no muestra el prompt de la pestaña de atrás y no quedaba a la vista
   dónde pegar el token. Ahora el cartel se abre primero y el botón
   "Abrir GitHub" es el que abre la otra pestaña. */
function ghPedirToken(){
  return new Promise(res => {
    const btnCss = 'padding:8px 12px;border-radius:8px;border:1px solid #555;background:#2a2a30;color:#eee;cursor:pointer;font:inherit';
    const fondo = document.createElement('div');
    fondo.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999';
    const caja = document.createElement('div');
    caja.style.cssText = 'background:#1b1b1f;color:#eee;border:1px solid #444;border-radius:12px;max-width:460px;width:100%;padding:18px;font:14px/1.5 system-ui,sans-serif';
    caja.innerHTML =
      '<h3 style="margin:0 0 10px;font-size:16px">Token de GitHub</h3>' +
      '<ol style="margin:0 0 14px;padding-left:20px">' +
        '<li>Tocá <b>Abrir GitHub</b>: se abre en otra pestaña, ya con los permisos correctos elegidos.</li>' +
        '<li>Bajá hasta el final y tocá <b>Generate token</b>.</li>' +
        '<li>Copiá el token verde (ojo: solo se muestra una vez).</li>' +
        '<li>Volvé <b>a esta pestaña</b> y pegalo en el casillero de abajo.</li>' +
      '</ol>' +
      '<button type="button" data-gh="abrir" style="' + btnCss + ';width:100%;margin-bottom:10px">Abrir GitHub ↗</button>' +
      '<input type="text" data-gh="input" placeholder="Pegá el token acá (ghp_…)" ' +
        'style="width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #555;background:#111;color:#eee;font:inherit;margin-bottom:12px">' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
        '<button type="button" data-gh="cancelar" style="' + btnCss + '">Cancelar</button>' +
        '<button type="button" data-gh="guardar" style="' + btnCss + ';border-color:#6a8;background:#2c4636">Guardar</button>' +
      '</div>' +
      '<div style="margin-top:10px;opacity:.65;font-size:12px">Queda guardado en este navegador para las próximas veces.</div>';
    fondo.appendChild(caja);
    document.body.appendChild(fondo);
    const campo = caja.querySelector('[data-gh="input"]');
    campo.focus();
    const cerrar = valor => {
      document.removeEventListener('keydown', teclas);
      fondo.remove();
      res(valor);
    };
    const teclas = e => {
      if(e.key === 'Escape') cerrar(null);
      if(e.key === 'Enter' && document.activeElement === campo) cerrar(campo.value.trim() || null);
    };
    document.addEventListener('keydown', teclas);
    caja.querySelector('[data-gh="abrir"]').onclick = () => window.open(GH_TOKEN_URL, '_blank');
    caja.querySelector('[data-gh="cancelar"]').onclick = () => cerrar(null);
    caja.querySelector('[data-gh="guardar"]').onclick = () => cerrar(campo.value.trim() || null);
    fondo.onmousedown = e => { if(e.target === fondo) cerrar(null); };
  });
}

async function ghToken(pedirDeNuevo){
  let t = localStorage.getItem('gh-token');
  if(!t || pedirDeNuevo){
    t = await ghPedirToken();
    if(t) localStorage.setItem('gh-token', t.trim());
  }
  return t ? t.trim() : null;
}

function aBase64(texto){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(new Blob([texto]));
  });
}

/* Para pisar un archivo que ya está en el repo hay que mandarle a GitHub
   el sha de la versión anterior; si no, contesta 422 ("sha wasn't
   supplied"). Antes, si la consulta del sha fallaba por lo que fuera, se
   seguía igual sin sha y la subida moría con ese 422 sin decir por qué.
   Ahora, si la consulta directa no sirve, el sha se busca en el listado
   de la carpeta (otra ruta de la API, respuesta chica) y cualquier
   rareza queda anotada en la consola. */
async function ghShaPorListado(ruta, cab){
  const partes = ruta.split('/');
  const archivo = partes.pop();
  const carpeta = partes.join('/');
  const resp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${carpeta}?ref=${GH_BRANCH}`, {headers: cab, cache: 'no-store'});
  if(resp.status === 401 || resp.status === 403) throw {auth:true};
  if(!resp.ok) return undefined;
  const cuerpo = await resp.json();
  const lista = Array.isArray(cuerpo) ? cuerpo : (cuerpo.entries || []);
  const item = lista.find(x => x.name === archivo);
  return item ? item.sha : undefined;
}

async function ghSha(ruta, cab){
  const resp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${ruta}?ref=${GH_BRANCH}`, {headers: cab, cache: 'no-store'});
  if(resp.status === 401 || resp.status === 403) throw {auth:true};
  if(resp.status === 404) return undefined; // todavía no existe: se crea de cero
  if(resp.ok){
    const sha = (await resp.json()).sha;
    if(sha) return sha;
    console.warn(`GitHub contestó 200 para ${ruta} pero sin sha — lo busco en el listado de la carpeta`);
  }else{
    console.warn(`GitHub respondió ${resp.status} consultando ${ruta} — busco el sha en el listado de la carpeta`);
  }
  return await ghShaPorListado(ruta, cab);
}

async function ghSubir(ruta, contenidoB64, token, mensaje){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${ruta}`;
  const cab = {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.object+json'};
  const mandar = sha => fetch(url, {
    method: 'PUT',
    headers: cab,
    body: JSON.stringify({message: mensaje, content: contenidoB64, branch: GH_BRANCH, ...(sha ? {sha} : {})}),
  });
  const sha = await ghSha(ruta, cab);
  let resp = await mandar(sha);
  // 422 = el archivo existe y el sha que mandamos no le sirve: o no lo
  // encontramos, o alguien subió una versión nueva recién. Se vuelve a
  // pedir el sha y se reintenta una sola vez.
  if(resp.status === 422){
    const nuevo = await ghShaPorListado(ruta, cab);
    if(nuevo && nuevo !== sha) resp = await mandar(nuevo);
  }
  if(resp.status === 401 || resp.status === 403) throw {auth:true};
  if(!resp.ok) throw new Error(`GitHub respondió ${resp.status} subiendo ${ruta}: ${await resp.text()}`);
}

async function publicarShop(){
  if(!tiendaActual){ toast('Primero generá una tienda'); return; }
  const btn = $('#btn-publicar');
  const token = await ghToken(false);
  if(!token){ toast('Sin token no se puede publicar'); return; }
  btn.disabled = true;
  toast('Publicando en GitHub…');
  try{
    const b64 = await aBase64(JSON.stringify(tiendaActual, null, 2));
    await ghSubir(ARCHIVO_TIENDA, b64, token, `Publicar tienda (${tiendaActual.tamanoLabel})`);
    toast('Tienda publicada ✓ — los jugadores ya pueden cargarla');
  }catch(err){
    if(err && err.auth){
      localStorage.removeItem('gh-token');
      toast('El token no sirve o venció — tocá Publicar Shop de nuevo');
    }else{
      console.error('Error publicando la tienda:', err);
      toast('No se pudo publicar — revisá la consola');
    }
  }finally{
    btn.disabled = false;
  }
}

$('#agregar-rubro').addEventListener('change', renderAgregarLista);

$('#f-ajuste').addEventListener('change', e => aplicarAjuste(e.target.value));
$('#f-orden').addEventListener('change', e => { ordenActual = e.target.value; renderPreview(); renderAgregarLista(); });

$('#ver-x').addEventListener('click', () => $('#scrim-ver').classList.remove('open'));
$('#scrim-ver').addEventListener('mousedown', e => { if(e.target.id === 'scrim-ver') $('#scrim-ver').classList.remove('open'); });
$('#ver-toggle').addEventListener('click', e => {
  const id = e.currentTarget.dataset.item;
  if(!id || !tiendaActual) return;
  if(tiendaActual.items.includes(id)) quitarItem(id); else agregarItem(id);
  verItem(id);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    $('#scrim-agregar').classList.remove('open');
    $('#scrim-ver').classList.remove('open');
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-quitar],[data-agregar],[data-ajuste],[data-ver]');
  if(!b) return;
  if(b.dataset.ver !== undefined) return verItem(b.dataset.ver);
  if(b.dataset.quitar !== undefined) return quitarItem(b.dataset.quitar);
  if(b.dataset.agregar !== undefined) return agregarItem(b.dataset.agregar);
  if(b.dataset.ajuste !== undefined) return aplicarAjuste(b.dataset.ajuste);
});

actualizarHint();
renderOrdenControles();
