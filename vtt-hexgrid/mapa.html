<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Rol Pintoísta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0C0E; --panel:#1A1418; --panel2:#221A1E; --line:#3B2E34; --line-soft:#2A2126;
  --copper:#C98545; --brass:#E0A458; --wine:#8C2F3E; --bottle:#2E6B57; --absenta:#A8C256;
  --paper:#EDE3D2; --muted:#9A867E; --danger:#D4574E; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink);color:var(--paper);font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden
}
input,select,button{font-family:inherit;color:inherit}
input,select{
  min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:var(--r);
  color:var(--paper);padding:6px 8px;width:100%
}
select option{background:var(--panel)}
input:focus,select:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
button{cursor:pointer;background:none;border:none;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}

.btn{
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);white-space:nowrap
}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#180F08;font-weight:700}
.btn.primary:hover{background:var(--brass)}
.btn.peligro{border-color:var(--wine);color:var(--danger)}
.btn.peligro:hover{border-color:var(--danger)}
#btn-dados.activo{border-color:var(--brass);color:var(--brass)}

header{
  display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap
}
header{padding-left:60px!important} /* lugar para el menú del sitio (comun/menu-sitio.js) */
header h1{margin:0;font-size:16px;color:var(--brass);font-weight:700}
#estado{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);flex:1;min-width:120px}
.zoom{display:flex;gap:4px}
/* Switch Narrativo / Combate (lo cambia el GM; todos ven en qué modo está) */
#modo-switch{
  display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border-radius:999px;border:1px solid;
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;color:var(--paper)
}
#modo-switch .perilla{width:34px;height:18px;border-radius:999px;position:relative;transition:background .2s}
#modo-switch .perilla::after{
  content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s
}
#modo-switch[data-modo="narrativo"]{border-color:#3E9B5B;color:#8FD6A5}
#modo-switch[data-modo="narrativo"] .perilla{background:#3E9B5B}
#modo-switch[data-modo="combate"]{border-color:#D64545;color:#F0A39C}
#modo-switch[data-modo="combate"] .perilla{background:#D64545}
#modo-switch[data-modo="combate"] .perilla::after{left:18px}
#modo-switch:disabled{opacity:1;cursor:default}
.zoom .btn{padding:7px 10px}
/* Mantenimiento (GM), arriba de todo en la barra lateral: verde para que se note. */
.btn-mant{width:100%;background:rgba(46,107,87,.25);border-color:#3E9B5B;color:#CFE6D8;font-weight:700;padding:9px 12px}
.btn-mant:hover{background:#2E6B57;border-color:#3E9B5B;color:#EAF3E6}
/* Personajes: lista desplegable de las fichas de la partida. */
.btn-personajes{background:rgba(63,111,176,.2);border-color:#3F6FB0;color:#B9D2EA}
.btn-personajes:hover,.btn-personajes[aria-expanded="true"]{background:#3F6FB0;border-color:#5B8DBE;color:#F2F6FB}
.desplegable{position:relative}
.desplegable-lista{
  position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:240px;max-width:min(320px,calc(100vw - 24px));max-height:60vh;overflow-y:auto;
  background:var(--panel);border:1px solid #3F6FB0;border-radius:var(--r);box-shadow:0 12px 28px rgba(0,0,0,.6);padding:5px
}
.desplegable-lista a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r);color:var(--paper);text-decoration:none}
.desplegable-lista a:hover{background:rgba(63,111,176,.25)}
.desplegable-lista .pj-mini{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:#17121A;border:1px solid var(--line)}
.desplegable-lista .pj-nombre{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desplegable-lista .pj-dueno{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);white-space:nowrap}
.desplegable-lista .pj-fila{display:flex;align-items:center;gap:2px}
.desplegable-lista .pj-fila a{flex:1;min-width:0}
.desplegable-lista .pj-borrar{
  flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
  background:none;color:var(--muted);font-size:13px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-right:2px
}
.desplegable-lista .pj-borrar:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.desplegable-vacio{padding:8px 10px;color:var(--muted);font-size:12px}

main{flex:1;display:flex;min-height:0}
#lienzo-caja{flex:1;position:relative;min-width:0;min-height:0}
#lienzo{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:default}
#aviso-mapa{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:var(--muted)
}
#aviso-mapa .btn{margin-top:10px}
/* Confirmar un movimiento que gasta Nitros. */
#ruta-confirmar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--brass);border-radius:var(--r);padding:8px 12px;
  font-family:"Space Mono",monospace;font-size:12px;box-shadow:0 10px 24px -8px rgba(0,0,0,.7)
}
#ruta-confirmar.excede{border-color:var(--danger)}
/* Si tocás otra cosa con un movimiento sin confirmar, el cartel parpadea
   en vez de tapar los botones con un aviso. */
#ruta-confirmar.atencion{animation:ruta-atencion .45s ease-in-out 2}
@keyframes ruta-atencion{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.06);box-shadow:0 0 0 3px rgba(224,164,88,.35),0 10px 24px -8px rgba(0,0,0,.7)}
}
#ruta-confirmar.excede #ruta-texto{color:#F0A39C}

aside{
  width:330px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0
}
.seccion{padding:12px 14px;border-bottom:1px solid var(--line)}
.seccion h2{
  margin:0 0 8px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400
}
.ayuda{color:var(--muted);font-size:12.5px;margin:0}
.con-ayuda{display:flex;align-items:center;gap:8px;margin-bottom:0!important}
.barra-token{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px}
.barra-token .chico-barra{justify-self:end;padding:5px 10px;font-size:10.5px}
.ayuda-icono{
  position:relative;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--line);color:var(--muted);font-size:10.5px;cursor:help;letter-spacing:0;outline:none
}
.ayuda-icono:hover,.ayuda-icono:focus{border-color:var(--copper);color:var(--brass)}
.ayuda-globo{
  display:none;position:absolute;top:calc(100% + 8px);left:-58px;z-index:30;width:280px;max-width:calc(100vw - 40px);
  background:var(--panel2,#221A1E);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  box-shadow:0 10px 24px rgba(0,0,0,.55);font-family:"Space Grotesk",system-ui,sans-serif;font-size:12.5px;line-height:1.45;
  letter-spacing:0;text-transform:none;color:var(--paper);font-weight:400;cursor:default
}
.ayuda-icono:hover .ayuda-globo,.ayuda-icono:focus .ayuda-globo{display:block}
.ayuda-globo .leyenda{margin-top:8px}
/* Descripción del estado al pasar el mouse. Va con position:fixed y la
   ubica hudTipUbicar, porque el globo de estados tiene scroll propio y si
   no la recortaría. */
#hud .hud-estado .nom.con-tip{cursor:help;text-decoration:underline dotted var(--muted)}
#hud .hud-estado .estado-tip{
  display:none;position:fixed;left:0;top:0;z-index:40;width:250px;max-width:70vw;
  background:var(--panel);border:1px solid var(--copper);border-radius:var(--r);padding:8px 10px;
  font-size:11.5px;line-height:1.45;color:var(--paper);box-shadow:0 8px 22px rgba(0,0,0,.65);pointer-events:none;white-space:normal
}
#hud .hud-estado .estado-tip b{display:block;color:var(--brass);margin-bottom:3px}
#hud .hud-estado .estado-tip.visible{display:block}
/* Caja de herramientas: barra vertical escondida a la izquierda del mapa.
   La pestaña asoma por el borde; al tocarla, la barra se desliza. */
#toolkit{
  position:absolute;left:0;top:0;bottom:0;z-index:24;width:220px;
  transform:translateX(-100%);transition:transform .22s ease
}
#toolkit.abierto{transform:translateX(0)}
#toolkit-panel{
  height:100%;display:flex;flex-direction:column;background:rgba(26,20,24,.92);backdrop-filter:blur(6px);
  border-right:1px solid var(--line);box-shadow:6px 0 22px rgba(0,0,0,.5)
}
#toolkit:not(.abierto) #toolkit-panel{visibility:hidden;transition:visibility 0s .22s}
#toolkit-pestana{
  position:absolute;left:100%;top:50%;transform:translateY(-50%);
  width:26px;padding:12px 0;border:1px solid var(--line);border-left:none;border-radius:0 6px 6px 0;
  background:rgba(26,20,24,.88);color:var(--brass);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:4px 4px 14px rgba(0,0,0,.45)
}
#toolkit-pestana:hover{background:var(--panel2);color:var(--paper)}
#toolkit-pestana .flecha{font-size:12px;line-height:1;transition:transform .22s}
#toolkit.abierto #toolkit-pestana .flecha{transform:rotate(180deg)}
#toolkit-pestana .texto{
  writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Space Mono",monospace;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase
}
#toolkit-cab{
  padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)
}
#toolkit-lista{list-style:none;margin:0;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#toolkit .tk-herramienta{
  width:100%;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;
  padding:8px;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,12,14,.5);color:var(--paper);
  text-align:left;cursor:pointer;font:inherit
}
#toolkit .tk-herramienta:hover{border-color:var(--copper)}
#toolkit .tk-herramienta.activa{border-color:var(--brass);background:rgba(224,164,88,.12)}
#toolkit .tk-icono{
  grid-row:span 2;width:34px;height:34px;border-radius:var(--r);border:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--panel)
}
#toolkit .tk-nombre{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
#toolkit .tk-detalle{font-size:11px;color:var(--muted);line-height:1.3}
#toolkit .tk-pronto{
  font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:0 4px
}
#toolkit-pie{margin-top:auto;padding:10px 14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--muted);line-height:1.4}
/* Con la caja abierta, el orden de turnos se corre para no quedar tapado. */
#iniciativa{transition:left .22s ease}
#lienzo-caja.toolkit-abierto #iniciativa{left:232px}
/* Tablero de iniciativa (estilo Roll20): flotante, semitransparente y
   plegable. Solo se ve en modo combate. */
#iniciativa{
  position:absolute;left:12px;top:12px;z-index:22;width:230px;max-width:calc(100% - 24px);
  background:rgba(26,20,24,.82);backdrop-filter:blur(6px);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 10px 26px rgba(0,0,0,.55);font-size:12.5px;overflow:hidden
}
#iniciativa:hover{background:rgba(26,20,24,.95)}
#iniciativa-cab{
  display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;user-select:none;
  font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--brass);border-bottom:1px solid var(--line-soft)
}
#iniciativa.plegado #iniciativa-cab{border-bottom:none}
#iniciativa-ronda{margin-left:auto;color:var(--muted);font-size:10.5px}
#iniciativa .ini-plegar{color:var(--muted);font-size:13px;line-height:1;padding:0 2px;cursor:pointer}
#iniciativa.plegado #iniciativa-cuerpo{display:none}
#iniciativa-lista{max-height:46vh;overflow-y:auto}
.ini-fila{display:flex;align-items:center;gap:7px;padding:4px 10px;border-top:1px solid var(--line-soft)}
.ini-fila:first-child{border-top:none}
.ini-fila.activo{background:rgba(46,107,87,.55)}
.ini-ficha{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;overflow:hidden;background:var(--panel)}
.ini-ficha img{width:100%;height:100%;object-fit:cover}
.ini-nombre{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini-valor{font-family:"Space Mono",monospace;font-weight:700;font-size:14px;min-width:26px;text-align:right}
.ini-fila input.ini-valor{width:46px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:var(--r);padding:2px 4px;color:var(--paper)}
.ini-quitar{color:var(--muted);font-size:12px;line-height:1;padding:0 2px;cursor:pointer}
.ini-quitar:hover{color:var(--danger)}
#iniciativa-pie{display:flex;flex-wrap:wrap;gap:5px;padding:7px 10px;border-top:1px solid var(--line-soft)}
#iniciativa-pie .btn{font-size:10px;padding:5px 8px}
#iniciativa-vacio{padding:8px 10px;color:var(--muted)}
/* Controles flotantes sobre el token seleccionado (estilo Roll20) */
#hud{position:absolute;left:0;top:0;pointer-events:none;z-index:20}
/* Cartel fijo arriba a la derecha con el nombre del token seleccionado y
   su dueño: no depende del zoom, así se lee igual con la grilla chiquita. */
#token-etiqueta{
  position:absolute;top:12px;right:12px;z-index:23;max-width:60%;pointer-events:none;
  background:rgba(26,20,24,.88);backdrop-filter:blur(6px);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 8px 22px rgba(0,0,0,.5);
  padding:6px 12px;font-size:13px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#token-etiqueta b{color:var(--brass);font-weight:600}
#token-etiqueta span{color:var(--muted);font-weight:400}
/* Anillo: cada botón se ubica en ronda alrededor del token (hudUbicar). */
#hud .hud-anillo{position:absolute;left:0;top:0}
#hud .hud-anillo > *{position:absolute;transform:translate(-50%,-50%);pointer-events:auto}
#hud .hud-rotar{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;
  width:22px;height:22px;border-radius:50%;background:var(--frente,#4FA8E0);color:#fff;
  border:2px solid rgba(15,12,14,.65);box-shadow:0 2px 8px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;font-size:12px;cursor:grab
}
#hud .hud-rotar:active{cursor:grabbing}
#hud .hud-globos{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto}
#hud .hud-circulo{
  width:36px;height:36px;border-radius:50%;border:2.5px solid;background:rgba(15,12,14,.5);color:var(--paper);
  font-family:"Space Mono",monospace;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.9);
  transition:background .12s
}
/* Translúcidos para ver el mapa debajo; al pasar el mouse, más firmes. */
#hud .hud-circulo:hover{background:rgba(15,12,14,.9);filter:brightness(1.15)}
#hud .hud-circulo.icono{font-size:15px;border-color:rgba(237,227,210,.4);color:var(--paper)}
#hud .hud-circulo.icono.abierto{border-color:var(--brass);color:var(--brass)}
#hud .hud-circulo:disabled{cursor:default;opacity:.85}
#hud input.hud-in{
  width:56px;height:36px;border-radius:18px;border:2.5px solid;background:rgba(15,12,14,.96);color:var(--paper);
  font-family:"Space Mono",monospace;font-size:13px;text-align:center;padding:0 6px
}
#hud .hud-globo{
  pointer-events:auto;width:260px;max-width:70vw;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.6);text-align:left;font-size:12.5px
}
#hud .hud-globo-acciones{margin-top:8px;display:flex;justify-content:flex-end}
#hud .hud-globo h3{margin:0 0 8px;font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
#hud .hud-estado{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line-soft)}
#hud .hud-estado:first-of-type{border-top:none}
#hud .hud-estado .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud .hud-estado .turnos{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);min-width:26px;text-align:right}
#hud .hud-mini{background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--paper);font-size:11px;padding:1px 6px;cursor:pointer}
#hud .hud-mini:hover{border-color:var(--copper)}
#hud .hud-mini.peligro:hover{border-color:var(--danger);color:var(--danger)}
#hud .hud-campo{display:flex;align-items:center;gap:6px;margin-top:6px}
#hud .hud-campo label{flex:1;color:var(--muted)}
#hud .hud-campo input[type=number]{width:62px;padding:4px 6px}
#hud .hud-campo input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);background:none;border-radius:var(--r)}
/* Panel del engranaje: secciones separadas y "Editar token" al pie. */
#hud .hud-seccion{padding:10px 0;border-top:1px solid var(--line-soft)}
#hud .hud-seccion:first-child{padding-top:0;border-top:none}
#hud .hud-barras{display:flex;gap:6px}
#hud .hud-chip{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:var(--r);padding:5px 4px;cursor:pointer;font-size:11.5px;color:var(--muted);user-select:none}
#hud .hud-chip:has(input:checked){color:var(--paper);border-color:var(--chip)}
#hud .hud-chip input{position:absolute;opacity:0;pointer-events:none}
#hud .hud-chip .muestra{width:10px;height:10px;border-radius:50%;border:2px solid var(--chip);flex:none}
#hud .hud-chip:has(input:checked) .muestra{background:var(--chip)}
#hud .hud-chip:has(input:focus-visible){outline:2px solid var(--brass)}
/* Caja "actual / máximo" debajo de cada barra. */
#hud .hud-recursos{display:flex;gap:6px;margin-top:6px}
#hud .hud-recurso{
  flex:1;display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;
  border:1px solid var(--line);border-radius:var(--r);padding:4px 2px;
  font-family:"Space Mono",monospace;font-size:11.5px;color:var(--muted)
}
#hud .hud-recurso.vacio{border-style:dashed;justify-content:center}

<script>
/* =========================================================
   MAPA DE HEXÁGONOS — Paso 2 del sistema nuevo
   Mapa compartido en vivo: tokens en campanas/<campaña>/tokens, que
   cada uno mueve arrastrando (los PJ su dueño, los creeps el GM) y
   todos ven al instante. Al costado, la Mesa de tiradas.
   Ver docs/plan-sistema-nuevo.md y docs/workflow-firebase.md.
   ========================================================= */

const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmt = n => Number.isInteger(n) ? n : Math.round(n*100)/100;
const esc = s => String(s??'').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

// El sitio publicado (GitHub Pages) cachea cada archivo hasta 10 minutos:
// sin esto, un iframe podía quedar con la ficha o gm-tools de antes de la
// última actualización. Agrega un parámetro que cambia siempre, así el
// navegador pide la versión real en vez de la que tenía guardada — va
// antes del # si la URL trae uno (después del # no viaja al servidor).
function sinCache(url){
  const [base, hash] = url.split('#');
  const sep = base.includes('?') ? '&' : '?';
  return base + sep + '_v=' + Date.now() + (hash !== undefined ? '#' + hash : '');
}


/* ---------- Firebase (mismo bloque fb* que ficha y gm-tools) ---------- */



function estado(texto){ $('#estado').textContent = texto; }

/* ---------- Geometría de hexágonos ----------
   Hexágonos "de punta arriba" en filas; las filas impares corridas medio
   hexágono a la derecha. Cada token guarda su casilla como {col, fila}. */

const HEX = 40;                 // radio del hexágono, en unidades del mapa
const SQ3 = Math.sqrt(3);
const ZOOM_MIN = 0.25, ZOOM_MAX = 3;
// Hexágonos "de lado arriba" (un lado horizontal, no una punta): así el
// frente por defecto (mirando abajo, como vienen casi todas las
// ilustraciones de token) queda alineado a un lado del hexágono, no a un
// vértice. Girado 30° contra la grilla vieja de punta arriba.
const ESQUINAS = Array.from({length: 6}, (_, i) => {
  const a = Math.PI / 180 * (60 * i);
  return [HEX * Math.cos(a), HEX * Math.sin(a)];
});

function hexCentro(col, fila){
  return { x: HEX * 1.5 * col, y: HEX * SQ3 * (fila + 0.5 * (col & 1)) };
}

function mundoAHex(x, y){
  const q = (2 / 3 * x) / HEX;
  const r = (SQ3 / 3 * y - x / 3) / HEX;
  const s = -q - r;
  let rq = Math.round(q), rr = Math.round(r);
  const rs = Math.round(s);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
  if(dq > dr && dq > ds) rq = -rr - rs;
  else if(dr > ds) rr = -rq - rs;
  return { col: rq, fila: rr + (rq - (rq & 1)) / 2 };
}

// Rutas: para medir distancias y trazar líneas se pasa a coordenadas
// "cúbicas" (q, r, s), las mismas que usa mundoAHex.
function hexACubo(c){
  const q = c.col;
  const r = c.fila - (c.col - (c.col & 1)) / 2;
  return {q, r, s: -q - r};
}
function mismoHex(a, b){ return a.col === b.col && a.fila === b.fila; }
function distanciaHex(a, b){
  const A = hexACubo(a), B = hexACubo(b);
  return (Math.abs(A.q - B.q) + Math.abs(A.r - B.r) + Math.abs(A.s - B.s)) / 2;
}
// Casillas en línea recta desde a (sin incluirla) hasta b, una al lado de la
// otra. Sirve cuando el mouse salta varias casillas de golpe.
function lineaHex(a, b){
  const n = distanciaHex(a, b);
  const A = hexACubo(a), B = hexACubo(b);
  const res = [];
  for(let i = 1; i <= n; i++){
    const t = i / n;
    const q = A.q + (B.q - A.q) * t + 1e-6, r = A.r + (B.r - A.r) * t + 1e-6, s = -q - r;
    let rq = Math.round(q), rr = Math.round(r);
    const rs = Math.round(s);
    const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
    if(dq > dr && dq > ds) rq = -rr - rs;
    else if(dr > ds) rr = -rq - rs;
    res.push({col: rq, fila: rr + (rq - (rq & 1)) / 2});
  }
  return res;
}

/* ---------- Estado ---------- */

const lienzo = $('#lienzo');
const ctx = lienzo.getContext('2d');
let dpr = 1, anchoPx = 0, altoPx = 0;
let vista = { x: 0, y: 0, zoom: 1 };   // x,y: dónde cae el origen del mapa en pantalla (px)

const tokens = new Map();     // id -> datos del documento
const visibles = new Map();   // id -> {x, y} posición dibujada (se acerca a la real con animación)
let disposicion = [];         // [{id, x, y, radio}] del último dibujo, en orden de dibujo
const miembros = new Map();   // uid -> {nombre, gm}
let soyGM = false;
let seleccion = null;
let arrastre = null;          // {id, x, y, inicioX, inicioY, movio, ruta, costo, libre}
// Mover libre (🦶): id del token que se lleva a otra casilla sin reglas
// (sin Nitros, sin estela, sin Inmovilizado). El dueño en su PJ, el GM en todos.
let moverLibre = null;
// Arrastre del handle de rotación: {id, radio} (radio del token en pantalla,
// fijo durante el arrastre; el centro sale de #hud, que ya está ahí).
let rotando = null;
// Movimiento soltado que gasta Nitros, esperando Confirmar/Cancelar.
let rutaPendiente = null;     // {id, celdas: [{col, fila}], pasos, porCasillero, disponibles}
// Estelas que se ven unos segundos después de mover (las de todos).
const estelas = new Map();    // tokenId -> {celdas, hasta}
const ESTELA_MS = 4000;
const RUTA_MAX_CELDAS = 100;  // tope que aceptan las reglas (200 números)
let paneo = null;             // {inicioX, inicioY, x, y}
let creando = false;
let panelFondo = false;       // GM: panel de la imagen de fondo abierto
let editandoToken = false;    // panel del token en modo "Editar"
// GM: creep completo (parte privada, que solo lee el GM) de cada creep con
// token en el mapa: vida con números y No2 para cobrar al moverlo.
const creepsPriv = new Map();  // creepId -> {sc (null mientras carga), cortar}

// Lo público de fichas y creeps, para vincularlos a los tokens.
const fichasPub = new Map();  // fichaId -> {nombre, duenoUid, resumen, miniatura}
const creepsPub = new Map();  // creepId -> {nombre, orden, resumen, miniatura}
let fondo = null;             // {dato, x, y, ancho} en unidades del mapa
// El fondo va en dos documentos: mapa/fondo (posición y ancho, cambia al
// acomodarlo) y mapa/fondoImagen (la imagen, pesada, cambia solo al
// cargar otra). Así mover el fondo no hace descargar la imagen a todos.
let fondoPos = null;          // {x, y, ancho, dato?} (dato: fondos de antes de separar)
let fondoImagen = '';
let moverFondo = false;       // GM: arrastrar mueve el fondo en vez de la vista
let arrastreFondo = null;     // {inicioX, inicioY, x, y}
let panelMapas = false;       // GM: panel de mapas guardados abierto

/* ---------- Varios mapas guardados ----------
   campanas/<partida>/mapas/{id} = {nombre, creado}: la lista de mapas que
   el GM tiene armados. El de siempre (antes de esto) sigue viviendo donde
   ya vivía (mapa/fondo, mapa/modo, mapa/iniciativa, tokens/*) bajo el id
   especial MAPA_PRINCIPAL, así no hace falta mover ni un dato para que
   esto funcione. Los mapas nuevos van en mapas/{id}/estado/{doc} y
   mapas/{id}/tokens/{auto}.
   campanas/<partida>/mapa/activo = {mapaId}: cuál ven los jugadores. El
   GM puede estar mirando (y armando) uno distinto — mapaEligiendoGM, por
   navegador — mientras los jugadores siguen viendo el activo. */
const MAPA_PRINCIPAL = '_principal';
let mapaActivo = MAPA_PRINCIPAL;      // el que ven los jugadores
let mapaEligiendoGM = null;           // el que el GM eligió mirar (null: sigue al activo)
let mapaMostrado = MAPA_PRINCIPAL;    // el que está cargado ahora en esta pantalla
let mapaEscuchado = null;             // el que tiene los onSnapshot activos ahora
const mapasLista = new Map();         // id -> {nombre, creadoMs}
try{ mapaEligiendoGM = localStorage.getItem('mapa-viendo') || null; }catch(e){}

function nombreMapa(id){
  const m = mapasLista.get(id);
  if(m) return m.nombre;
  return id === MAPA_PRINCIPAL ? 'Mapa 1' : 'Mapa';
}
// Ruta de un documento del mapa que está mostrado ahora (fondo, fondoImagen,
// modo, iniciativa): en el principal, donde siempre vivieron; en los demás,
// adentro de su propio mapas/{id}/estado/.
function rutaMapaEstado(doc){
  return mapaMostrado === MAPA_PRINCIPAL ? `mapa/${doc}` : `mapas/${mapaMostrado}/estado/${doc}`;
}

// Los onSnapshot del mapa mostrado (fondo, modo, iniciativa, tokens), para
// poder cortarlos al cambiar de mapa y no quedarse escuchando el anterior.
let cortarFondo1 = null, cortarFondo2 = null, cortarModo = null, cortarIniciativa = null, cortarTokensListener = null;
function cortarEscuchasMapa(){
  [cortarFondo1, cortarFondo2, cortarModo, cortarIniciativa, cortarTokensListener].forEach(f => f && f());
  cortarFondo1 = cortarFondo2 = cortarModo = cortarIniciativa = cortarTokensListener = null;
}

// Cambia qué mapa está cargado: corta lo anterior, limpia lo que se venía
// mostrando (para no ver un instante datos del mapa viejo) y arranca de
// nuevo fondo/modo/iniciativa/tokens contra el nuevo.
function cambiarMapaMostrado(nuevoId){
  if(nuevoId === mapaEscuchado) return;
  cortarEscuchasMapa();
  mapaMostrado = nuevoId;
  mapaEscuchado = nuevoId;
  tokens.clear(); visibles.clear(); estelas.clear();
  if(seleccion) seleccionar(null);
  fondoPos = null; fondoImagen = ''; componerFondo();
  modoMapa = 'narrativo';
  iniciativa = {orden: [], turno: 0, ronda: 1};

  escucharIniciativa();
  escucharTokens();
  actualizarBotonMapas();
  renderModo();
  renderIniciativa();
  renderPanel(true);
  pedirDibujo();
}

// El GM puede estar mirando (y armando) un mapa distinto del que está en
// juego; los jugadores siempre siguen al que está en juego.
function recalcularMapaMostrado(){
  const propio = soyGM && mapaEligiendoGM
    && (mapaEligiendoGM === MAPA_PRINCIPAL || mapasLista.has(mapaEligiendoGM));
  cambiarMapaMostrado(propio ? mapaEligiendoGM : mapaActivo);
}

function escucharMapaActivo(){
  fbDb.doc(fbRutaCampana('mapa/activo')).onSnapshot(doc => {
    mapaActivo = (doc.exists && doc.data().mapaId) || MAPA_PRINCIPAL;
    recalcularMapaMostrado();
  }, err => console.error('Error escuchando el mapa activo:', err));
}

// La lista de mapas guardados (metadatos: nombre y fecha). El mapa
// principal también tiene su entrada acá (se crea sola la primera vez que
// hace falta), para poder renombrarlo igual que a los demás.
function escucharMapas(){
  fbDb.collection(fbRutaCampana('mapas')).onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed'){ mapasLista.delete(ch.doc.id); return; }
      const d = ch.doc.data();
      mapasLista.set(ch.doc.id, {
        nombre: String(d.nombre || 'Mapa').slice(0, 40),
        creadoMs: d.creado && d.creado.toMillis ? d.creado.toMillis() : 0,
      });
    });
    if(soyGM && !mapasLista.has(MAPA_PRINCIPAL)){
      fbDb.doc(fbRutaCampana(`mapas/${MAPA_PRINCIPAL}`))
        .set({nombre: 'Mapa 1', creado: firebase.firestore.FieldValue.serverTimestamp()}, {merge: true})
        .catch(err => console.error('No se pudo preparar el mapa principal:', err));
    }
    recalcularMapaMostrado();
    actualizarBotonMapas();
    if(panelMapas) renderPanel(true);
  }, err => console.error('Error escuchando la lista de mapas:', err));
}

function actualizarBotonMapas(){
  const boton = $('#btn-mapas');
  if(!boton) return;
  boton.hidden = !fbMiembro;
  boton.disabled = !soyGM;
  $('#mapas-nombre').textContent = nombreMapa(mapaMostrado);
  boton.classList.toggle('primary', soyGM && mapaMostrado !== mapaActivo);

}

async function crearMapa(){
  const nombre = (prompt('Nombre del mapa nuevo:', `Mapa ${mapasLista.size + 1}`) || '').trim().slice(0, 40);
  if(!nombre) return;
  try{
    const ref = await fbDb.collection(fbRutaCampana('mapas')).add({nombre, creado: firebase.firestore.FieldValue.serverTimestamp()});
    mapaEligiendoGM = ref.id;
    try{ localStorage.setItem('mapa-viendo', ref.id); }catch(e){}

async function renombrarMapa(id){

async function publicarMapa(id){

    toast(`Los jugadores ahora ven "${nombreMapa(id)}"`);

async function borrarMapa(id){
  if(id === MAPA_PRINCIPAL){ toast('El primer mapa no se puede borrar'); return; }
  const nombre = nombreMapa(id);
  if(!confirm(`¿Borrar el mapa "${nombre}" y todos sus tokens? No se puede deshacer.`)) return;
  const escrito = prompt(`Para confirmar, escribí el nombre tal cual: ${nombre}`);
  if(escrito === null) return;
  if(escrito.trim().toLowerCase() !== nombre.trim().toLowerCase()){ toast('El nombre no coincide — no se borró nada'); return; }
  try{
    const base = fbDb.doc(fbRutaCampana(`mapas/${id}`));
    const [tokensDocs, estadoDocs] = await Promise.all([base.collection('tokens').get(), base.collection('estado').get()]);
    const refs = [...tokensDocs.docs, ...estadoDocs.docs].map(d => d.ref).concat([base]);
    for(let i = 0; i < refs.length; i += 450){
      const lote = fbDb.batch();
      refs.slice(i, i + 450).forEach(r => lote.delete(r));
      await lote.commit();
    }
    if(mapaActivo === id) await publicarMapa(MAPA_PRINCIPAL);
    if(mapaEligiendoGM === id){
      mapaEligiendoGM = null;
      try{ localStorage.removeItem('mapa-viendo'); }catch(e){}
      recalcularMapaMostrado();
    }
    toast(`"${nombre}" borrado`);
  }catch(err){ console.error('No se pudo borrar el mapa:', err); toast('No se pudo borrar el mapa'); }
}

const COLORES = ['#C98545', '#8C2F3E', '#2E6B57', '#3F6FB0', '#7A4FA8', '#A8C256', '#D4574E', '#E0C35A', '#4FA3A0', '#9A867E'];
const HP_COLOR = '#D64545';
// Borde de cada token según de quién es.
const BORDE = {
  propio: '#E0A458',   // dorado: los tuyos
  jugador: '#4CB86A',  // verde: personajes de otros jugadores
  creep: '#D64545',    // rojo: vinculados a un creep de gm-tools
  npc: '#9A958F',      // gris: tokens del GM sin creep vinculado
};
function claseToken(t){
  if(t.tipo === 'creep') return t.fichaId ? 'creep' : 'npc';
  return fbUsuario && t.duenoUid === fbUsuario.uid ? 'propio' : 'jugador';
}
const SP_COLOR = '#3F86E0';
const NO2_COLOR = '#3E9B5B';
const FRENTE_COLOR = '#4FA8E0';  // marca el lado que mira el token (rotación)
const ESTADO_COLOR = {buff: '#3E9B5B', debuff: '#8E3FB0', '': '#6F625C'};
const ANCHO_CASILLA = HEX * 1.5;  // ancho de una casilla (hex de lado arriba)

// Ficha, invocación o creep al que está vinculado el token (si sigue
// existiendo). Las invocaciones van como "<fichaId>~<idInvocación>" y
// salen del resumen de la ficha de su personaje.
const SEP_INVOCACION = '~';
function vinculo(t){
  if(!t || !t.fichaId) return null;
  if(t.tipo === 'creep') return creepsPub.get(t.fichaId) || null;
  const [fichaId, invId] = t.fichaId.split(SEP_INVOCACION);
  const ficha = fichasPub.get(fichaId);
  if(!ficha) return null;
  if(!invId) return ficha;
  const inv = ((ficha.resumen && ficha.resumen.invocaciones) || []).find(i => i.id === invId);
  if(!inv) return null;
  return {
    nombre: String(inv.nombre || 'Invocación'),
    duenoUid: ficha.duenoUid,
    miniatura: inv.miniatura || '',
    deQuien: ficha.nombre,
    invocacion: true,
    resumen: {hp: inv.hp, hpMax: inv.hpMax, muerto: num(inv.hp) <= 0, dormida: inv.activa === false, estados: []},
  };
}
function nombreDe(t){
  const v = vinculo(t);
  return v && v.nombre ? v.nombre : t.nombre;
}
// Barras (0 a 1) y estados del token vinculado. De los creeps solo se
// publica el porcentaje de vida, sin números; los PJ tienen además SP.
function estadoDe(t){
  const v = vinculo(t);
  if(!v || !v.resumen) return null;
  const r = v.resumen;
  const entre01 = x => Math.max(0, Math.min(1, x));
  const hp = r.hpPct !== undefined
    ? entre01(num(r.hpPct) / 100)
    : (num(r.hpMax) > 0 ? entre01(num(r.hp) / num(r.hpMax)) : 0);
  const {sp: spActual, spMax} = spDeResumen(r);
  const sp = t.tipo === 'pj' && spMax > 0 ? entre01(spActual / spMax) : null;
  // No2: de los PJ sale del resumen; de los creeps, de su parte privada (GM).
  const n = valoresNo2(t);
  const no2 = n && n.max > 0 ? entre01(n.valor / n.max) : null;
  return {hp, sp, no2, muerto: !!r.muerto, dormida: !!r.dormida, estados: Array.isArray(r.estados) ? r.estados : []};
}
// SP de una ficha. Las fichas guardadas antes de la Iteración 2 publican
// bonos/bonosMax en vez de sp/spMax (hasta que su dueño las vuelva a abrir).
function spDeResumen(r){
  const nuevo = r.spMax !== undefined;
  return {
    sp: num(nuevo ? r.sp : r.bonos),
    spMax: num(nuevo ? r.spMax : r.bonosMax),
    campoGastado: nuevo ? 'spGastado' : 'bonosGastados',
    campoResumen: nuevo ? 'resumen.sp' : 'resumen.bonos',
  };
}

// Aura y barras que guarda cada token (las elige su dueño en el engranaje).
function auraDe(t){
  const a = t && t.aura;
  // Radio en casilleros enteros; forma 'hex' (sigue la grilla) o 'circulo'.
  const radio = a ? Math.min(30, Math.round(num(a.radio))) : 0;
  if(!(radio > 0)) return null;
  return {
    radio,
    forma: a.forma === 'circulo' ? 'circulo' : 'hex',
    color: /^#[0-9a-fA-F]{6}$/.test(a.color || '') ? a.color : '#E0A458',
  };
}
function barrasDe(t){
  const b = (t && t.barras) || {};
  return {hp: b.hp !== false, sp: b.sp !== false, no2: b.no2 === true};
}
function colorConAlfa(hex, alfa){
  const n = parseInt(String(hex).slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alfa})`;
}

// No2 del token: {valor, max} o null si no se conocen.
function valoresNo2(t){
  if(!t) return null;
  if(t.tipo === 'creep'){
    const sc = creepPrivadoDe(t.fichaId);
    if(!sc || sc.nitros === undefined || sc.nitros === null) return null;
    return {valor: num(sc.nitros), max: Math.max(num(sc.nitros), num(sc.nitrosMax) || num(sc.agl) || 0)};
  }
  if(t.fichaId && t.fichaId.includes(SEP_INVOCACION)) return null;
  const f = fichasPub.get(t.fichaId);
  const r = f && f.resumen;
  if(!r || r.nitros === undefined) return null;
  return {valor: num(r.nitros), max: num(r.nitrosMax) || num(r.nitros)};
}

const imagenesCache = new Map();  // data URL -> Image
function imagenLista(url){
  if(!url) return null;
  let img = imagenesCache.get(url);
  if(!img){
    img = new Image();
    img.onload = () => pedirDibujo();
    img.src = url;
    imagenesCache.set(url, img);
  }
  return img.complete && img.naturalWidth ? img : null;
}

/* ---------- Mantenimiento del GM ----------
   El GM toca "⟳ Mantenimiento": sube campanas/<partida>/mapa/mantenimiento.
   numero. Cada ficha y gm-tools aplican su propio mantenimiento (con la
   lógica de siempre) una sola vez por número, aunque estén cerradas: se
   ponen al día al abrirse. Además, para que se note enseguida, cada mapa
   corre en segundo plano (iframe oculto, uno por vez) las fichas de su
   dueño y, en el del GM, gm-tools. Si alguna ya lo aplicó, no pasa nada. */
let mantenimientoNumero = null;
const mantenimientoCola = [];
let mantenimientoMarco = null;

function escucharMantenimiento(){
  fbDb.doc(fbRutaCampana('mapa/mantenimiento')).onSnapshot(doc => {
    const numero = doc.exists ? Math.round(num(doc.data().numero)) : 0;
    const antes = mantenimientoNumero;
    mantenimientoNumero = numero;
    if(antes === null || numero <= antes || doc.metadata.hasPendingWrites) return;
    toast(`⟳ Mantenimiento: pasó el turno`);
    const base = '../';
    if(soyGM){
      mantenimientoEncolar(`${base}gm-toolset/gm-tools.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=mantenimiento`);
    }else{
      fichasPub.forEach((f, id) => {
        if(f.duenoUid === fbUsuario.uid) mantenimientoEncolar(`${base}ficha-personaje/ficha.html?partida=${encodeURIComponent(FB_CAMPANA)}&modo=mantenimiento#${encodeURIComponent(id)}`);
      });
    }
  }, err => console.error('Error escuchando el mantenimiento:', err));
}

function mantenimientoEncolar(url){
  if(!mantenimientoCola.includes(url)) mantenimientoCola.push(url);
  mantenimientoSiguiente();
}

function mantenimientoSiguiente(){
  if(mantenimientoMarco || !mantenimientoCola.length) return;
  const marco = document.createElement('iframe');
  marco.title = 'Mantenimiento en segundo plano';
  marco.style.cssText = 'position:absolute;width:1px;height:1px;border:0;left:-9999px;top:0;visibility:hidden';
  marco.src = sinCache(mantenimientoCola.shift());
  mantenimientoMarco = marco;
  // Por si la herramienta nunca avisa (sin conexión, etc.), se cierra sola.
  marco.cierre = setTimeout(mantenimientoCerrarMarco, 45000);
  document.body.appendChild(marco);
}

function mantenimientoCerrarMarco(){
  if(!mantenimientoMarco) return;
  clearTimeout(mantenimientoMarco.cierre);
  mantenimientoMarco.remove();
  mantenimientoMarco = null;
  mantenimientoSiguiente();
}

window.addEventListener('message', e => {
  if(e.origin !== location.origin || !e.data || !mantenimientoMarco || e.source !== mantenimientoMarco.contentWindow) return;
  if(e.data.tipo === 'mantenimiento-listo') mantenimientoCerrarMarco();
});

// Mismo criterio que "Borrar personaje" de la ficha (confirmar + escribir el
// nombre), pero acá el GM puede borrar la de cualquier jugador; de paso saca
// los tokens que la usan (el suyo y los de sus invocaciones).
async function borrarPersonajeGM(id, nombre, boton){
  const aviso = `Esto borra a ${nombre} de la partida, para todos, y no se puede deshacer.\n\n` +
                `Si el jugador lo quiere conservar, avisale antes (podés bajar un respaldo con "💾 Respaldo partida" desde gm-tools).\n\n¿Seguís?`;
  if(!confirm(aviso)) return;
  const escrito = prompt(`Para confirmar el borrado, escribí el nombre tal cual: ${nombre}`);
  if(escrito === null) return;
  if(escrito.trim().toLowerCase() !== nombre.trim().toLowerCase()){
    toast('El nombre no coincide — no se borró nada');
    return;
  }
  boton.disabled = true;
  try{
    const base = fbDb.doc(fbRutaCampana(`fichas/${id}`));
    const [partes, tokensSnap] = await Promise.all([
      base.collection('partes').get(),
      fbDb.collection(fbRutaCampana('tokens')).where('tipo', '==', 'pj').get(),
    ]);
    const lote = fbDb.batch();
    partes.docs.forEach(d => lote.delete(d.ref));
    tokensSnap.docs
      .filter(t => { const v = t.data().fichaId || ''; return v === id || v.startsWith(id + '~'); })
      .forEach(t => lote.delete(t.ref));
    lote.delete(base);
    await lote.commit();
    fichasPub.delete(id);
    toast(`${nombre} borrado de la partida`);
    renderListaPersonajes();
    renderPanel();
    pedirDibujo();
  }catch(err){
    console.error('No se pudo borrar el personaje:', err);
    toast('No se pudo borrar el personaje — revisá la consola');
    boton.disabled = false;
  }
}

$('#btn-mantenimiento').onclick = async () => {
  if(!soyGM) return;
  if(!confirm('¿Pasar el turno para toda la mesa?\n\nSe aplica el Mantenimiento a todas las fichas y a los creeps: turnos de los estados, efectos por turno y recarga de No2.')) return;
  const btn = $('#btn-mantenimiento');
  btn.disabled = true;
  try{
    const ref = fbDb.doc(fbRutaCampana('mapa/mantenimiento'));
    // El turno que se anuncia es el de gm-tools (gm/estado) más uno.
    const turno = await fbDb.runTransaction(async tx => {
      const [doc, estado] = await Promise.all([tx.get(ref), tx.get(fbDb.doc(fbRutaCampana('gm/estado')))]);
      const numero = (doc.exists ? Math.round(num(doc.data().numero)) : 0) + 1;
      tx.set(ref, {numero, cuando: firebase.firestore.FieldValue.serverTimestamp()});
      return (estado.exists ? Math.round(num(estado.data().turno)) : 0) + 1;
    });
    publicarPaseDeTurno(turno);
  }catch(err){
    console.error('No se pudo pasar el turno:', err);
    toast(err.code === 'permission-denied' ? 'Solo el GM puede pasar el turno' : 'No se pudo pasar el turno — mirá la consola');
  }finally{
    btn.disabled = false;
  }
};

/* ---------- Tablero de iniciativa (orden de turnos) ----------
   campanas/<partida>/mapa/iniciativa = {orden: [{id, valor}], turno, ronda}.
   Lo arma y lo cambia el GM (las reglas solo lo dejan escribir a él); todos
   lo ven. Se muestra solo en modo combate, flotante sobre el mapa y
   plegable, como el "Turn Order" de Roll20. */

let iniciativa = {orden: [], turno: 0, ronda: 1};
let iniciativaPlegada = false;
try{ iniciativaPlegada = localStorage.getItem('mapa-iniciativa-plegada') === '1'; }catch(e){}

function escucharIniciativa(){
  cortarIniciativa = fbDb.doc(fbRutaCampana(rutaMapaEstado('iniciativa'))).onSnapshot(doc => {
    const d = doc.exists ? doc.data() : {};
    iniciativa = {
      orden: (Array.isArray(d.orden) ? d.orden : []).map(o => ({id: String(o.id || ''), valor: num(o.valor)})).filter(o => o.id),
      turno: Math.max(0, Math.round(num(d.turno))),
      ronda: Math.max(1, Math.round(num(d.ronda)) || 1),
    };
    renderIniciativa();
  }, err => console.error('Error escuchando la iniciativa:', err));
}

// Además del GM (cualquier fila), cada jugador puede tocar el valor de la
// fila de su propio personaje (algo lo cambió a mitad de combate): las
// reglas dejan escribir mapa/iniciativa a cualquier miembro siempre que
// no toque turno/ronda ni agregue o saque filas — eso sigue siendo del GM.
function puedeEditarIniciativa(t){
  return soyGM || !!(t && t.tipo === 'pj' && fbUsuario && t.duenoUid === fbUsuario.uid);
}

async function guardarIniciativa(cambios){
  const datos = {
    orden: iniciativa.orden.map(o => ({id: o.id, valor: num(o.valor)})),
    turno: iniciativa.turno,
    ronda: iniciativa.ronda,
    ...cambios,
    actualizado: firebase.firestore.FieldValue.serverTimestamp(),
  };
  try{
    await fbDb.doc(fbRutaCampana(rutaMapaEstado('iniciativa'))).set(datos);
  }catch(err){
    console.error('No se pudo guardar la iniciativa:', err);
    toast(err.code === 'permission-denied' ? 'No podés cambiar eso del orden de turnos' : 'No se pudo guardar el orden de turnos');
  }
}

// De mayor a menor; con el mismo valor queda el orden en que estaban.
function ordenarIniciativa(lista){
  return lista.map((o, i) => ({o, i})).sort((a, b) => (num(b.o.valor) - num(a.o.valor)) || (a.i - b.i)).map(x => x.o);
}

function iniciativaPonerTodos(){
  const previos = new Map(iniciativa.orden.map(o => [o.id, o.valor]));
  const lista = [...tokens.keys()].map(id => ({id, valor: num(previos.get(id))}));
  guardarIniciativa({orden: ordenarIniciativa(lista).map(o => ({id: o.id, valor: o.valor})), turno: 0});
}

function iniciativaSiguiente(){
  if(!iniciativa.orden.length) return;
  const siguiente = iniciativa.turno + 1;
  if(siguiente >= iniciativa.orden.length) guardarIniciativa({turno: 0, ronda: iniciativa.ronda + 1});
  else guardarIniciativa({turno: siguiente});
}

function renderIniciativa(){
  const caja = $('#iniciativa');
  if(!caja) return;
  // Solo en combate: en narrativo no hay orden de turnos.
  if(modoMapa !== 'combate' || !fbMiembro){ caja.hidden = true; return; }
  caja.hidden = false;
  caja.classList.toggle('plegado', iniciativaPlegada);
  $('#iniciativa-plegar').textContent = iniciativaPlegada ? '+' : '—';
  $('#iniciativa-ronda').textContent = iniciativa.orden.length ? `Ronda ${fmt(iniciativa.ronda)}` : '';
  const lista = $('#iniciativa-lista');
  // Un token oculto ni siquiera aparece en la lista para los jugadores (el
  // turno pasa igual cuando le toca, pero no se nota que estuvo ahí).
  const visibles = iniciativa.orden.map((o, i) => ({o, i})).filter(({o}) => {
    const t = tokens.get(o.id);
    return soyGM || !(t && t.oculto);
  });
  if(!visibles.length){
    lista.innerHTML = `<div id="iniciativa-vacio">${soyGM ? 'Sin orden todavía: tocá "Traer tokens" y cargá las tiradas.' : 'El GM todavía no armó el orden.'}</div>`;
  }else{
    lista.innerHTML = visibles.map(({o, i}) => {
      const t = tokens.get(o.id);
      const nombre = t ? nombreDe(t) : '(token borrado)';
      const v = t ? vinculo(t) : null;
      const mini = (v && v.miniatura) || (t && t.imagen) || '';
      const color = (t && t.color) || '#9A867E';
      // Al GM se le marca con 🙈 para acordarse de que ese no lo ven los
      // jugadores, aunque él sí lo vea en su propia lista.
      const oculto = !!(t && t.oculto);
      // El valor lo edita el GM (cualquier fila) o el dueño (la propia): algo
      // pudo habérselo cambiado a mitad de combate. Sacar de la lista sigue
      // siendo solo del GM.
      const puede = puedeEditarIniciativa(t);
      return `<div class="ini-fila${i === iniciativa.turno ? ' activo' : ''}" data-ini-fila="${esc(o.id)}" title="${esc(nombre)}">
        <span class="ini-ficha" style="border-color:${esc(color)}">${mini ? `<img src="${esc(mini)}" alt="">` : esc(inicial(nombre))}</span>
        <span class="ini-nombre">${oculto ? '🙈 ' : ''}${esc(nombre)}</span>` +
        (puede
          ? `<input class="ini-valor" type="number" step="1" value="${fmt(num(o.valor))}" data-ini-valor="${esc(o.id)}" title="Iniciativa">`
          : `<span class="ini-valor">${fmt(num(o.valor))}</span>`) +
        (soyGM ? `<button type="button" class="ini-quitar" data-ini-quitar="${esc(o.id)}" title="Sacar de la lista">✕</button>` : '') +
      '</div>';
    }).join('');
  }
  $('#iniciativa-pie').innerHTML = soyGM
    ? '<button type="button" class="btn" id="ini-traer" title="Poner en la lista todos los tokens del mapa">Traer tokens</button>' +
      '<button type="button" class="btn" id="ini-ordenar" title="Ordenar de mayor a menor">Ordenar</button>' +
      '<button type="button" class="btn primary" id="ini-siguiente" title="Pasar al siguiente en el orden">▶ Siguiente</button>' +
      '<button type="button" class="btn peligro" id="ini-limpiar" title="Vaciar el orden de turnos">Limpiar</button>'
    : '';
  conectarIniciativa();
}

function conectarIniciativa(){
  const caja = $('#iniciativa');
  caja.querySelectorAll('[data-ini-fila]').forEach(f => f.onclick = e => {
    if(e.target.closest('input,button')) return;
    seleccionar(f.dataset.iniFila);
    const t = tokens.get(f.dataset.iniFila);
    if(t) centrarEn(hexCentro(t.col, t.fila).x, hexCentro(t.col, t.fila).y);
  });
  caja.querySelectorAll('[data-ini-valor]').forEach(inp => {
    inp.onchange = () => {
      const id = inp.dataset.iniValor;
      const anterior = iniciativa.orden.find(o => o.id === id);
      const nuevo = num(inp.value);
      if(!anterior || anterior.valor === nuevo) return;
      const orden = iniciativa.orden.map(o => o.id === id ? {id, valor: nuevo} : o);
      guardarIniciativa({orden});
      publicarCambioIniciativa(id, anterior.valor, nuevo);
    };
    inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } };
  });
  caja.querySelectorAll('[data-ini-quitar]').forEach(b => b.onclick = () => {
    const orden = iniciativa.orden.filter(o => o.id !== b.dataset.iniQuitar);
    guardarIniciativa({orden, turno: Math.min(iniciativa.turno, Math.max(0, orden.length - 1))});
  });
  const traer = $('#ini-traer');
  if(traer) traer.onclick = iniciativaPonerTodos;
  const ordenar = $('#ini-ordenar');
  if(ordenar) ordenar.onclick = () => guardarIniciativa({orden: ordenarIniciativa(iniciativa.orden), turno: 0});
  const siguiente = $('#ini-siguiente');
  if(siguiente) siguiente.onclick = iniciativaSiguiente;
  const limpiar = $('#ini-limpiar');
  if(limpiar) limpiar.onclick = () => { if(confirm('¿Vaciar el orden de turnos?')) guardarIniciativa({orden: [], turno: 0, ronda: 1}); };
}

$('#iniciativa-cab').onclick = e => {
  if(e.target.closest('input')) return;
  iniciativaPlegada = !iniciativaPlegada;
  try{ localStorage.setItem('mapa-iniciativa-plegada', iniciativaPlegada ? '1' : ''); }catch(e2){}
  renderIniciativa();
};

function escucharModo(){
  escucharModo.listo = false;
  cortarModo = fbDb.doc(fbRutaCampana(rutaMapaEstado('modo'))).onSnapshot(doc => {
    const nuevo = doc.exists && doc.data().modo === 'combate' ? 'combate' : 'narrativo';
    if(nuevo !== modoMapa && escucharModo.listo) toast(nuevo === 'combate' ? '⚔ Modo combate: moverse gasta No2' : '🌿 Modo narrativo: moverse no gasta No2');
    escucharModo.listo = true;

}

$('#modo-switch').onclick = async () => {

  try{

  }catch(err){
